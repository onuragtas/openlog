# Real databases for the .NET agent integration tests (compose project openlog-m4-dotnet-test).
#
#   docker compose -p openlog-m4-dotnet-test -f test/docker-compose.yml up -d --wait postgres mysql redis rabbitmq kafka
#   (+ SQL Server: --profile sqlserver ... sqlserver; on arm64 SQLSERVER_IMAGE=mcr.microsoft.com/azure-sql-edge:latest)
#   docker compose -p openlog-m4-dotnet-test -f test/docker-compose.yml run --rm runner      # DOTNET_VERSION=8.0 or 9.0
#   docker compose -p openlog-m4-dotnet-test -f test/docker-compose.yml down -v
#
# From the host (CI) instead of `runner`:
#   PG_CONNECTION="Host=127.0.0.1;Port=45433;Username=openlog;Password=openlog;Database=openlog" \
#   MYSQL_CONNECTION="Server=127.0.0.1;Port=43307;User ID=openlog;Password=openlog;Database=openlog" \
#   REDIS_CONNECTION="127.0.0.1:46380" RABBITMQ_CONNECTION="amqp://openlog:openlog@127.0.0.1:45672/" KAFKA_BOOTSTRAP=127.0.0.1:49092 \
#   SQLSERVER_CONNECTION="Server=127.0.0.1,41433;User ID=sa;Password=Openlog-Test-1;TrustServerCertificate=true" \
#   dotnet test test/OpenLog.Agent.IntegrationTests
name: openlog-m4-dotnet-test

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: openlog, POSTGRES_USER: openlog, POSTGRES_PASSWORD: openlog}
    ports: ["127.0.0.1:45433:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U openlog -d openlog"], interval: 2s, timeout: 3s, retries: 30}
    tmpfs: [/var/lib/postgresql/data]

  mysql:
    image: mysql:8.4
    environment: {MYSQL_DATABASE: openlog, MYSQL_USER: openlog, MYSQL_PASSWORD: openlog, MYSQL_ROOT_PASSWORD: openlog}
    ports: ["127.0.0.1:43307:3306"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uopenlog", "-popenlog"], interval: 2s, timeout: 3s, retries: 60}
    tmpfs: [/var/lib/mysql]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:46380:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 3s, retries: 30}

  # MassTransit (RabbitMQ transport)
  rabbitmq:
    image: rabbitmq:4.1-alpine
    environment: {RABBITMQ_DEFAULT_USER: openlog, RABBITMQ_DEFAULT_PASS: openlog}
    ports: ["127.0.0.1:45672:5672"]
    # owned by the image's rabbitmq user (the default anonymous volume can fail with .erlang.cookie: eacces)
    tmpfs: ["/var/lib/rabbitmq:uid=100,gid=101,mode=0750"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"], interval: 3s, timeout: 10s, retries: 60}

  # Confluent.Kafka (single-node KRaft; EXTERNAL listener for tests on the host)
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:49092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:49092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    ports: ["127.0.0.1:49092:49092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      retries: 60

  # SQL Server for the SqlClient tests. mssql/server has no arm64 image: on arm64 use
  # SQLSERVER_IMAGE=mcr.microsoft.com/azure-sql-edge:latest (retired by Microsoft, but still pullable and SQL Server
  # compatible for SqlClient). Not started by default (profile sqlserver); CI runs it on amd64.
  sqlserver:
    profiles: [sqlserver]
    image: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment: {ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Openlog-Test-1", MSSQL_PID: Developer}
    ports: ["127.0.0.1:41433:1433"]
    healthcheck:
      # no sqlcmd in azure-sql-edge: wait for the server to accept connections
      test: ["CMD-SHELL", "grep -q 'SQL Server is now ready for client connections' /var/opt/mssql/log/errorlog 2>/dev/null"]
      interval: 3s
      retries: 60

  runner:
    profiles: [runner]
    image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION:-9.0}
    working_dir: /src
    volumes:
      - ..:/src
      - ../../node/test/interop:/node/test/interop:ro
      - nuget:/root/.nuget/packages
      - artifacts:/artifacts
    environment:
      OPENLOG_DOTNET_ARTIFACTS: /artifacts
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PG_CONNECTION: Host=postgres;Username=openlog;Password=openlog;Database=openlog
      MYSQL_CONNECTION: Server=mysql;User ID=openlog;Password=openlog;Database=openlog
      REDIS_CONNECTION: redis:6379
      RABBITMQ_CONNECTION: amqp://openlog:openlog@rabbitmq:5672/
      KAFKA_BOOTSTRAP: kafka:9092
      # empty unless the sqlserver profile runs (SQLSERVER_CONNECTION=Server=sqlserver,1433;User ID=sa;Password=Openlog-Test-1;TrustServerCertificate=true)
      SQLSERVER_CONNECTION: ${SQLSERVER_CONNECTION:-}
      DOTNET_VERSION: ${DOTNET_VERSION:-9.0}
    # the 8.0 SDK cannot evaluate the net9.0 targets: build only net8.0 there (CI installs both SDKs instead)
    command:
      - sh
      - -c
      - |
        props=""
        if [ "$$DOTNET_VERSION" = 8.0 ]; then props="-p:TargetFrameworks=net8.0"; fi
        dotnet test test/OpenLog.Agent.IntegrationTests/OpenLog.Agent.IntegrationTests.csproj -f "net$$DOTNET_VERSION" $$props
    depends_on:
      postgres: {condition: service_healthy}
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      kafka: {condition: service_healthy}

volumes:
  # shared with `make` (docker run); compose warns that it did not create them, which is harmless
  nuget:
    name: ${DOTNET_TEST_VOLUME_PREFIX:-openlog-m4-dotnet}-nuget
  artifacts:
    name: ${DOTNET_TEST_VOLUME_PREFIX:-openlog-m4-dotnet}-artifacts
