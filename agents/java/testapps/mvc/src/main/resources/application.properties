server.port=${APP_PORT:18080}
spring.main.banner-mode=off
spring.datasource.url=jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:55442}/openlog
spring.datasource.username=openlog
spring.datasource.password=openlog
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:56389}
# trace_id / span_id are put into the MDC by the agent (Logback MDC instrumentation)
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [trace_id=%X{trace_id} span_id=%X{span_id}] %logger{20} - %msg%n
