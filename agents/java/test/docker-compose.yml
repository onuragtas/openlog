# Throwaway databases and brokers for the Java agent's integration tests, plus a Gradle runner container.
# Use test/run.sh (compose project openlog-m4-java-test); never the shared openlog stack.
#
#   agents/java/test/run.sh                       # ./gradlew check integrationTest (JDK 21)
#   agents/java/test/run.sh :extension:test       # any Gradle arguments
#   JAVA_TEST_JDK=17 agents/java/test/run.sh check
#   agents/java/test/run.sh down                  # remove containers and volumes
#
# Host ports (CI runs Gradle on the host against them): PostgreSQL 55442, MySQL 53316, Redis 56389, Kafka 59092
# (JAVA_TEST_KAFKA_PORT when 59092 is taken; the runner container uses kafka:9092 either way).

name: ${JAVA_TEST_PROJECT:-openlog-m4-java-test}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openlog
      POSTGRES_PASSWORD: openlog
      POSTGRES_DB: openlog
    ports: ["127.0.0.1:55442:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlog -d openlog"]
      interval: 2s
      retries: 60

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: openlog
      MYSQL_USER: openlog
      MYSQL_PASSWORD: openlog
    ports: ["127.0.0.1:53316:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uopenlog", "-popenlog"]
      interval: 2s
      retries: 90

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:59092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:${JAVA_TEST_KAFKA_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    ports: ["127.0.0.1:${JAVA_TEST_KAFKA_PORT:-59092}:59092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      retries: 60

  # Gradle in a container. The sources are copied into a volume first, so builds never write into the checkout
  # (which may live on a synced drive).
  runner:
    profiles: [runner]
    image: eclipse-temurin:${JAVA_TEST_JDK:-21}-jdk
    environment:
      GRADLE_USER_HOME: /gradle
      PG_HOST: postgres
      PG_PORT: "5432"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: kafka:9092
      BENCH_SECONDS: ${BENCH_SECONDS:-}
    volumes:
      - ..:/src/java:ro
      - ../../node/test/interop/go-sampler-fixtures.json:/src/node/test/interop/go-sampler-fixtures.json:ro
      - work:/work
      - gradle:/gradle
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        rm -rf /work/java /work/node && mkdir -p /work/java /work/node/test/interop
        cp /src/node/test/interop/go-sampler-fixtures.json /work/node/test/interop/
        tar -C /src/java --exclude=build --exclude=.gradle --exclude=.kotlin -cf - . | tar -C /work/java -xf -
        cd /work/java
        exec ./gradlew --no-daemon --console=plain "$$@"
      - runner

volumes:
  work:
    name: ${JAVA_TEST_PROJECT:-openlog-m4-java}-work
  gradle:
    name: ${JAVA_TEST_PROJECT:-openlog-m4-java}-gradle
