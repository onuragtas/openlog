name: Windows Server with IIS, SQL Server, nginx and Redis (D-104)
platform: windows
processes:
  # Windows collectors report the process name without ".exe" as comm (inventory.WindowsBaseName).
  - { pid: 2100, exe: 'C:\Windows\System32\svchost.exe', comm: svchost, cmdline: 'C:\Windows\system32\svchost.exe -k iissvcs' }
  - { pid: 2200, exe: 'C:\Windows\System32\inetsrv\w3wp.exe', comm: w3wp, cmdline: 'c:\windows\system32\inetsrv\w3wp.exe -ap "DefaultAppPool"' }
  - { pid: 3100, exe: 'C:\Program Files\Microsoft SQL Server\MSSQL16.MSSQLSERVER\MSSQL\Binn\sqlservr.exe', comm: sqlservr, cmdline: '"C:\Program Files\Microsoft SQL Server\MSSQL16.MSSQLSERVER\MSSQL\Binn\sqlservr.exe" -sMSSQLSERVER' }
  - { pid: 4100, exe: 'C:\nginx\nginx.exe', comm: nginx, cmdline: 'nginx.exe' }
  - { pid: 4200, exe: 'C:\Program Files\Redis\redis-server.exe', comm: redis-server, cmdline: '"C:\Program Files\Redis\redis-server.exe" --service-run redis.windows-service.conf' }
services:
  - { manager: windows, name: W3SVC, pid: 2100 }
  - { manager: windows, name: MSSQLSERVER, pid: 3100 }
  - { manager: windows, name: Redis, pid: 4200 }
  - { manager: windows, name: Spooler, pid: 1500 }
ports:
  - { address: 0.0.0.0, port: 1433, pid: 3100 }
  - { address: 0.0.0.0, port: 8081, pid: 4100 }
  - { address: 127.0.0.1, port: 6379, pid: 4200 }
packages:
  - { manager: windows, name: Microsoft SQL Server 2022 (64-bit), version: 16.0.1000.6 }
expect:
  - rule_id: iis
    services: [W3SVC]
    log_paths: ["C:/inetpub/logs/LogFiles/W3SVC*/*.log"]
    status: not_available
  - rule_id: mssql
    pids: [3100]
    ports: [1433]
    services: [MSSQLSERVER]
    matched_by: [process, service, listening_port]
    log_paths: ["C:/Program Files/Microsoft SQL Server/MSSQL*/MSSQL/Log/ERRORLOG"]
  - { rule_id: nginx, pids: [4100], ports: [8081], log_paths: [], status: enabled }
  - { rule_id: redis, pids: [4200], services: [Redis], ports: [6379], log_paths: [] }
forbid: [mysql, postgresql, apache-httpd]
