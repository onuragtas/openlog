id: rabbitmq
name: RabbitMQ
category: queue
match:
  - process: { exe_basename: ["beam.smp"], cmdline_regex: "(-s rabbit|rabbit_prelaunch|rabbitmq)" }
  - systemd_unit: { name_regex: "^rabbitmq-server\\.service$" }
  - listening_port: { port: 5672, process_exe_basename: ["beam.smp"] }
  - container: { image_regex: "(^|/)rabbitmq(:|@|$)" }
  - package: { name: ["rabbitmq-server"] }
version:
  - package: ["rabbitmq-server"]
  - cmdline_regex: "rabbitmq_server-([0-9][0-9.]*)"
endpoints:
  - from: listening_port
integration:
  id: rabbitmq
  auto_enable: true         # read the management API on 15672; HTTP 401 → needs_configuration with the hint
  requires: []              # the broker answers whether credentials are needed; the agent does not guess
