id: postgresql
name: PostgreSQL
category: database
match:
  - process: { exe_basename: ["postgres", "postmaster"] }
  - systemd_unit: { name_regex: "^postgresql(-[0-9.]+)?(@.*)?\\.service$" }
  - listening_port: { port: 5432, process_exe_basename: ["postgres", "postmaster"] }
  - container: { image_regex: "(^|/)(postgres|postgis/postgis|timescale/timescaledb[a-z-]*)(:|@|$)" }
  - package: { name_regex: "^(postgresql-[0-9]+|postgresql[0-9]*-server|postgresql[0-9]+)$" }
version:
  - cmdline_regex: "/postgresql/([0-9.]+)/bin/postgres"
  - package_regex: "^(postgresql-[0-9]+|postgresql[0-9]*-server|postgresql[0-9]+)$"
endpoints:
  - from: listening_port
integration:
  id: postgresql
  requires: ["credentials"]   # integrations.postgresql.username/password (member of pg_monitor)
logs:
  - path: "/var/log/postgresql/*.log"            # Debian/Ubuntu
  - path: "/var/lib/pgsql/data/log/*.log"          # RHEL family
  - path: "/var/lib/pgsql/*/data/log/*.log"        # PGDG packages
