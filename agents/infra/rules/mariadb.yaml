id: mariadb
name: MariaDB
category: database
match:
  - process: { exe_basename: ["mariadbd"] }
  - systemd_unit: { name_regex: "^mariadb(@.*)?\\.service$" }
  - listening_port: { port: 3306, process_exe_basename: ["mariadbd"] }
  - container: { image_regex: "(^|/)mariadb(:|@|$)" }
  - package: { name_regex: "^(mariadb-server(-core)?(-[0-9.]+)?|MariaDB-server)$" }
version:
  - package_regex: "^(mariadb-server-core|mariadb-server(-[0-9.]+)?|MariaDB-server)$"
endpoints:
  - from: listening_port
integration:
  id: mysql
  requires: ["credentials"]   # integrations.mysql.username/password (PROCESS, REPLICATION CLIENT, SELECT on performance_schema)
logs:
  - path: "/var/log/mysql/*.log"
  - path: "/var/log/mariadb/*.log"
