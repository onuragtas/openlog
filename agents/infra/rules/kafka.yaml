id: kafka
name: Apache Kafka
category: queue
match:
  - process: { exe_basename: ["java"], cmdline_regex: "(^|\\s)kafka\\.Kafka(\\s|$)" }
  - systemd_unit: { name_regex: "^(confluent-)?kafka(-server)?\\.service$" }
  - container: { image_regex: "(^|/)(kafka|cp-kafka|cp-server)(:|@|$)" }
  - package: { name_regex: "^(confluent-(kafka|server)|kafka)$" }
version:
  - cmdline_regex: "kafka_[0-9.]+-([0-9]+\\.[0-9]+\\.[0-9]+)"
  - package_regex: "^(confluent-(kafka|server)|kafka)$"
endpoints:
  - from: listening_port
integration:
  id: kafka
  auto_enable: true         # probe the usual Jolokia paths on 8778; no endpoint → needs_configuration
  requires: []              # the broker's Jolokia bridge answers whether it is there (D-144)
