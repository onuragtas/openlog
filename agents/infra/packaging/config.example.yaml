# /etc/openlog-infra-agent/config.yaml
# Every value shown is the default unless marked "required".

license_key: ""                  # required; or env OPENLOG_LICENSE_KEY
endpoint: ""                     # required, e.g. https://ingest.openlog.example:4318; or env OPENLOG_ENDPOINT
interval: 10s                    # metrics collection interval (raised automatically, up to 60s, if the agent exceeds 1% CPU)
inventory_interval: 1h           # full inventory snapshot; also sent at start and on detected changes
state_dir: /var/lib/openlog-infra-agent   # generated host id is persisted here
log_level: info                  # debug, info, warn, error

host:
  root_path: /                   # /host when running in a container with the host root mounted
  extra_attributes: {}           # e.g. { env: prod, team: payments } — added to every resource

collectors:
  cpu: true
  memory: true
  load: true
  filesystem: true
  disk: true
  network: true
  uptime: true
  processes: true
  sensors: true                  # /sys/class/hwmon: temperatures, fans, voltages, power (Linux only)
  # max_sensors: 200             # readings stored per collection; a big chassis exposes hundreds

inventory:
  enabled: true

discovery:
  enabled: true
  rules_dir: /etc/openlog-infra-agent/discovery.d   # extra *.yaml rules; same id overrides an embedded rule

buffer:
  dir: /var/lib/openlog-infra-agent/buffer
  max_bytes: 268435456           # 256 MiB; 0 disables the disk buffer

export:
  timeout: 15s
  max_request_bytes: 4194304     # inventory snapshots are split into requests of at most this size

process_metrics:
  enabled: true                  # per-process metrics for the top processes (series churn with PIDs)
  top_n_cpu: 20                  # top N by CPU utilization ...
  top_n_memory: 20               # ... united with the top N by RSS

containers:
  enabled: true                  # container inventory (Docker Engine API) + cgroup v2 container metrics
  docker_socket: /var/run/docker.sock   # host path, resolved under host.root_path; the agent user needs access (docker group = root-equivalent)
  # CRI sockets (containerd, k3s, CRI-O): their containers are added to Docker's; [] disables. Usually root-only.
  cri_sockets: [/run/containerd/containerd.sock, /run/k3s/containerd/containerd.sock, /var/run/crio/crio.sock]

logs:
  enabled: true                  # nothing is read unless files, journald or auto_from_discovery is configured
  auto_from_discovery: false     # tail the log_paths of discovered services (e.g. /var/log/nginx/*.log)
  mask_secrets: false            # log bodies are user data: masking (password=***, url userinfo, …) is opt-in
  parse_severity: true           # guess severity from level words ([error], level=warn, "level":"info", …)
  join_continuations: false      # group stack traces with no multiline_start: an indented or "at …" line
                                 # joins the record before it. Off by default: holding a record until the
                                 # next line adds up to ~1s latency and can reorder stdout against stderr.
  start_at: end                  # files present at startup without a saved offset: end | beginning
  max_line_bytes: 65536          # longer lines/records are truncated
  rate_limit_lines: 2000         # per file per second; 0 = unlimited; excess stays in the file (no drops)
  poll_interval: 1s
  files: []
  # files:
  #   - path: /var/log/myapp/*.log          # absolute glob (no **)
  #     exclude: ["*.gz", "*.1"]            # matched against the full path and the basename
  #     multiline_start: '^\d{4}-\d{2}-\d{2}'   # a record starts at a matching line (stack traces)
  #     attributes: { app: billing }
  journald:
    enabled: false               # runs "journalctl -o export -f" (journalctl must be available to the agent)
    journalctl_path: journalctl
    units: []                    # e.g. [nginx.service]; empty = all
    priority: ""                 # e.g. warning (emerg..debug or 0..7); empty = all
  unified_log:                   # macOS only (logs.unified_log, D-104): "log stream --style ndjson"; live, no backfill
    enabled: false
    log_path: /usr/bin/log
    level: default               # default | info | debug
    predicate: ""                # log(1) predicate, e.g. 'subsystem == "com.example.app"'; empty = everything (a lot)
  windows_event_log:             # Windows only (D-104); resumes after the last delivered event (bookmark per channel)
    enabled: false
    channels: []                 # Windows default: System and Application with levels [critical, error, warning]
    # channels:
    #   - { name: System, levels: [critical, error, warning] }    # critical, error, warning, information, verbose
    #   - { name: Security, event_ids: [4624, 4625] }
    #   - { name: Microsoft-Windows-PowerShell/Operational, query: "*[System[Level<=3]]" }   # raw XPath
  containers:                    # stdout/stderr of Docker containers (needs containers.enabled)
    enabled: true
    source: auto                 # auto: json-file log when readable (CAP_DAC_READ_SEARCH, set by the systemd unit),
                                 # else the Docker Engine API (docker group) | file | api
    max_containers: 100          # running containers first
    rate_limit_lines: 1000       # per container per second; 0 = unlimited; excess waits (no drops)
    docker_containers_dir: /var/lib/docker/containers   # json-file logs when the Docker API is not accessible
    include: []                  # empty = every container; an item matches when all its fields match (globs)
    # include:
    #   - name: "billing*"
    #     multiline_start: '^\d{4}-\d{2}-\d{2}'   # group stack traces (per stream); label openlog.logs.multiline wins
    #   - name: "*"                  # keep collecting every other container
    exclude: []
    # exclude:
    #   - compose_service: loadgen
    #   - image: "busybox*"          # reference, name without tag or last path segment
    #   - label: "com.example.debug=true"
    # A container label openlog.logs=false always disables its logs.

integrations:                    # metric integrations bound to discovered services (semantic-conventions §6)
  enabled: true                  # master switch (needs discovery.enabled)
  interval: 30s                  # default collection interval per instance (min 5s)
  timeout: 10s                   # per collection (connect + queries), <= interval
  max_concurrent: 4              # collections running at the same time
  max_instances: 32              # further instances report not_available
  remote_config: true            # apply settings entered in openlog (host → Integrations); remote values win per field.
                                 # false: only this file configures integrations
  # Credentials: password: env:NAME | file:/absolute/path | literal (warned). They are never logged or sent;
  # env/file references are re-read on every connection. Per-instance "instances" override the defaults for
  # discovered services matching all given match fields: port, endpoint, unit, container (name or id prefix), instance.
  nginx:
    enabled: true                # stub_status is probed on discovered ports (/nginx_status, /stub_status, /status, …)
    # instances:
    #   - match: { port: 8080 }
    #     endpoint: http://127.0.0.1:8080/nginx_status
  php-fpm:
    enabled: true                # every pool of the PHP-FPM configuration is read over FastCGI on its own socket,
                                 # one resource per pool: listen and pm.status_path of /etc/php/*/fpm/pool.d/*.conf,
                                 # /etc/php-fpm.d/*.conf and the Remi/cPanel/Plesk layouts. Pools that answer are kept
                                 # when others fail; when none answers the reason (no pm.status_path, or a 0660 socket
                                 # the agent may not connect to) is reported as needs_configuration with the fix.
    # endpoint is only the fallback for a host whose pool files cannot be read, e.g. a container that mounts
    # a single socket:
    # instances:
    #   - match: { unit: php8.3-fpm.service }
    #     endpoint: unix:/run/php/php8.3-fpm.sock    # or 127.0.0.1:9000
  redis:
    enabled: true                # INFO without AUTH unless a password is set
    # username: openlog          # ACL user (Redis 6+)
    # password: env:OPENLOG_REDIS_PASSWORD
    # tls: { enabled: false, insecure_skip_verify: false, ca_file: "", server_name: "" }
  mysql:
    enabled: true                # needs credentials: GRANT PROCESS, REPLICATION CLIENT ON *.*; GRANT SELECT ON performance_schema.*
    # username: openlog
    # password: file:/etc/openlog-infra-agent/mysql.password
    # top_n_tables: 50           # tables/indexes with io-wait series
    # instances:
    #   - match: { port: 3307 }
    #     endpoint: unix:/run/mysqld/mysqld2.sock
    #     password: env:OPENLOG_MYSQL2_PASSWORD
  postgresql:
    enabled: true                # needs credentials: GRANT pg_monitor TO openlog
    # query_stats: query performance monitoring (Databases screen, docs/contracts/db-monitoring.md); opt-in.
    #   enabled: true            # statements (pg_stat_statements), session samples and execution plans
    #   top_n: 20                # statements sent per collection, by time spent in the interval (max 100)
    #   min_calls: 1             # skip statements executed fewer times in total
    #   sessions: true           # sample non-idle sessions (waits, blocking) every sample_interval
    #   sample_interval: 10s
    #   explain: true            # EXPLAIN the top statements (never executes them; read statements only)
    #   explain_interval: 1h
    # username: openlog
    # password: env:OPENLOG_POSTGRESQL_PASSWORD
    # database: postgres         # initial database
    # databases: []              # empty = every database that accepts connections (max 32)
    # exclude_databases: []
    # top_n_tables: 20           # largest tables and indexes per database
  docker:
    enabled: true                # reports Docker Engine API access; container.* metrics come from containers
  apache:
    enabled: true                # mod_status is probed on discovered ports (/server-status?auto, /status?auto, …)
    # instances:
    #   - match: { port: 8080 }
    #     endpoint: http://127.0.0.1:8080/server-status?auto
  memcached:
    enabled: true                # stats over the text protocol; a SASL server reports needs_configuration
    # instances:
    #   - match: { container: cache }
    #     endpoint: 127.0.0.1:11211
  haproxy:
    enabled: true                # the stats page is probed (/;csv, /stats;csv, …) and the runtime sockets are tried
    # endpoint: unix:/run/haproxy/admin.sock   # or http://127.0.0.1:8404/;csv
    #                            # the socket needs: stats socket … group openlog-agent level operator
  rabbitmq:
    enabled: true                # management API on 15672; HTTP 401 → needs_configuration
    # username: openlog          # rabbitmqctl set_user_tags openlog monitoring
    # password: env:OPENLOG_RABBITMQ_PASSWORD
    # endpoint: http://127.0.0.1:15672
  elasticsearch:
    enabled: true                # REST API on 9200 (also OpenSearch); a secured cluster answers 401
    # username: openlog          # built-in read-only role monitoring_user
    # password: env:OPENLOG_ELASTICSEARCH_PASSWORD
    # endpoint: https://127.0.0.1:9200
    # tls: { enabled: true, ca_file: /etc/elasticsearch/certs/http_ca.crt }
  jvm:
    enabled: true                # any JVM that exposes Jolokia: -javaagent:jolokia-agent-jvm.jar=port=8778,host=127.0.0.1
    # endpoint: http://127.0.0.1:8778/jolokia
  kafka:
    enabled: true                # the broker's own MBeans over the same Jolokia bridge
    # endpoint: http://127.0.0.1:8778/jolokia
  mongodb:
    enabled: true                # needs credentials: db.createUser with the clusterMonitor role
    # username: openlog
    # password: env:OPENLOG_MONGODB_PASSWORD
    # database: admin            # the authentication source, not a database to monitor
    # databases: []              # empty = every database, at most 32
    # exclude_databases: [local]
  # mysql and mssql take the same query_stats block as postgresql (performance_schema digests /
  # sys.dm_exec_query_stats, sessions with their waits and blocking, EXPLAIN / cached showplan).

prometheus:                      # scrape Prometheus/OpenMetrics endpoints (semantic-conventions §6.9)
  enabled: true
  interval: 30s                  # default scrape interval (min 1s)
  timeout: 10s                   # per scrape, <= interval
  sample_limit: 20000            # a target exposing more samples is rejected as a whole (up = 0)
  body_limit_bytes: 33554432     # uncompressed response size limit (32 MiB)
  max_targets: 64                # static targets first, then discovered ones
  max_concurrent: 4
  containers: true               # scrape containers labelled prometheus.io/scrape=true (+ prometheus.io/port, /path, /scheme, /job)
  kubernetes_pods: true          # node mode: scrape Running pods of this node annotated prometheus.io/scrape=true
  metrics: {}                    # e.g. { exclude: ["go_*", "process_*"] } for every target
  targets: []
  # targets:
  #   - url: http://127.0.0.1:9100/metrics      # node_exporter
  #     job: node                                # service.name of the metrics (default: the URL host)
  #   - url: https://app.internal:8443/metrics
  #     job: app
  #     interval: 15s
  #     labels: { env: prod }                    # added as resource attributes
  #     bearer_token: env:APP_METRICS_TOKEN      # or username + password (env:/file:/literal)
  #     tls: { ca_file: /etc/ssl/app-ca.pem, server_name: app.internal, insecure_skip_verify: false }
  #     sample_limit: 5000
  #     metrics: { include: ["app_*", "http_*"] }

php_forwarder:                   # receives spans from the openlog PHP extension (docs/contracts/php-agent.md §6)
  # enabled: unset = on while discovery finds PHP (php-fpm, Apache mod_php, a php CLI binary); true/false wins
  socket: /run/openlog-infra-agent/php.sock   # unix datagram socket (systemd RuntimeDirectory); "" = UDP only
  socket_group: auto             # auto = openlog-php (created with the agent user as member on every service start);
                                 # only if it does not exist: first existing of www-data, nginx, apache, php-fpm
  grant_pool_users: true         # on service start/install, add PHP-FPM pool users (/etc/php/*/fpm/pool.d, cPanel,
                                 # Plesk, RHEL) and the Apache/nginx user to openlog-php and reload those PHP-FPM
                                 # services; false = only manual grants (also: touch /etc/openlog-infra-agent/no-php-access)
  socket_mode: "0660"            # "0666" lets any local user send spans
  udp_listen: ""                 # e.g. 127.0.0.1:18127 for containers that cannot share the socket file
  max_pending_traces: 10000      # split messages waiting for their remaining parts
  reassembly_timeout: 5s         # incomplete traces are exported with openlog.php.incomplete=true

php_agent:                       # PHP agent installation through this agent (docs/contracts/php-agent.md §7.3)
  mode: manual                   # manual = only report PHP runtimes; auto = install/upgrade where PHP runs; off = remove
  version: agent                 # agent = this agent's version, or e.g. 0.9.1
  reload: none                   # none = PHP-FPM/Apache load it at their next reload; graceful = reload them
  exclude_bins: []               # globs of PHP binaries never enabled, e.g. [/usr/bin/php7.4]
  remote_config: true            # the Fleet page's settings replace mode/version/reload/exclude_bins
  health_check_after: 5m         # after an installation: roll back unless PHP loads it and services still send data
  install_root: /opt/openlog/php-agent   # packages and manual installs there are never changed

java_agent:                      # keeps openlog-javaagent.jar current (docs/contracts/java-agent.md §2)
  mode: manual                   # manual = only report JVMs; auto = install/upgrade the jar; off = remove the managed jar
  version: agent                 # agent = this agent's version, or e.g. 0.9.1
  remote_config: true            # the Fleet page's mode/version replace these
  health_check_after: 2m         # after a switch: verify the jar, roll back when it is broken
  install_root: /opt/openlog/java-agent  # versions/<v>/openlog-javaagent.jar + current
  link_path: /opt/openlog/openlog-javaagent.jar  # use -javaagent:<link_path>; a file you put there yourself is never changed

ebpf_profiler:                   # keeps the whole-host CPU profiler current (docs/contracts/ebpf-profiler.md, D-149)
  mode: auto                     # auto = install/upgrade where no package owns it; manual = report only; off = remove the managed install
  version: agent                 # agent = this agent's version, or e.g. 0.9.1
  remote_config: true            # the Fleet page's mode/version replace these
  health_check_after: 2m         # after a switch: check the service is running, roll back when it is not
  install_root: /opt/openlog/ebpf-profiler  # versions/<v>/ + current; the .deb/.rpm use the same path

update:
  enabled: true                 # apply signed updates ordered by the backend (sync/version reporting runs regardless)
  install_root: /opt/openlog/infra-agent   # versions/<v>/ + current symlink; must be writable by the agent user

release:
  trusted_keys_file: ""          # extra base64 Ed25519 release public keys, one per line (added to the compiled-in keys)

# Kubernetes (docs/operations/kubernetes.md, semantic-conventions §7). Set by the openlog-agent Helm chart; on a plain
# host nothing changes (auto = on only inside a pod).
kubernetes:
  enabled: auto                  # auto (KUBERNETES_SERVICE_HOST set), true, false
  mode: node                     # node (DaemonSet) or cluster (leader-elected cluster collector); env OPENLOG_K8S_MODE
  cluster_name: ""               # k8s.cluster.name; env OPENLOG_K8S_CLUSTER_NAME
  node_name: ""                  # env OPENLOG_K8S_NODE_NAME (downward API spec.nodeName); default: host name
  pod_resync: 5m                 # full relist of the node's pods
  label_allowlist: [app, app.kubernetes.io/name, app.kubernetes.io/instance, app.kubernetes.io/version, app.kubernetes.io/component]
  kubelet:
    enabled: true                # /stats/summary (RBAC nodes/stats get)
    endpoint: ""                 # default https://$OPENLOG_K8S_HOST_IP:10250, else https://127.0.0.1:10250
    insecure_skip_verify: false  # true for self-signed kubelet serving certificates (kubeadm, kind)
  cluster:
    interval: 30s                # cluster mode: kube-state listing interval
    events: true                 # Kubernetes events as logs
    max_pods: 10000
    lease_name: openlog-agent-cluster
    lease_namespace: ""          # default: the agent pod's namespace
