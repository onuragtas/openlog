# Extension overhead benchmark (compose project openlog-php-bench; ALWAYS `-p openlog-php-bench`, see run.sh).
# Three Laravel 12 / PHP 8.3 variants from the same demo image (openlog-php/laravel-83:dev):
#   base  extension not loaded
#   off   openlog.so loaded, openlog.transaction_tracer.enabled=0
#   on    openlog.so loaded, tracer defaults
# Each PHP container: 4 CPUs, PHP-FPM pm=static 8 workers, own nginx; MariaDB, Redis and one forwarder are shared.
# Build the image first: `make -C agents/php/demo images OPENLOG_EXT=1` (with OPENLOG_EXT=0 off/on run without the
# extension, which only proves the plumbing).
name: openlog-php-bench

x-php: &php
  image: openlog-php/laravel-83:dev
  cpus: 4
  sysctls:
    net.ipv4.ip_local_port_range: "15000 64999"
    net.ipv4.tcp_tw_reuse: "1"
  volumes: ["php-sock:/run/openlog-infra-agent"]
  depends_on:
    mariadb: {condition: service_healthy}
    redis: {condition: service_started}
    forwarder: {condition: service_started}

x-php-env: &php-env
  FPM_WORKERS: 8
  REDIS_HOST: redis
  OPENLOG_ENVIRONMENT: bench

x-nginx: &nginx
  image: nginx:1.29-alpine
  volumes: ["../../demo/nginx/app.conf.template:/etc/nginx/templates/default.conf.template:ro"]

services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: demo
      MARIADB_USER: demo
      MARIADB_PASSWORD: demo
    volumes: ["../../demo/datastores/mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 60

  redis:
    image: redis:7-alpine

  forwarder:
    image: openlog-php/forwarder:dev
    networks: [default, openlog]
    environment:
      OPENLOG_PHP_SOCKET: /run/openlog-infra-agent/php.sock
      OPENLOG_ENDPOINT: ${OPENLOG_ENDPOINT:-http://openlog:4318}
      OPENLOG_LICENSE_KEY: ${OPENLOG_LICENSE_KEY:-dev-license-key}
      OPENLOG_HOST_NAME: openlog-php-bench
    volumes: ["php-sock:/run/openlog-infra-agent"]

  php-base:
    <<: *php
    environment:
      <<: *php-env
      OPENLOG_AGENT: none
      OPENLOG_SERVICE_NAME: php-bench-base
  nginx-base:
    <<: *nginx
    environment: {PHP_HOST: php-base}
    ports: ["127.0.0.1:28906:80"]
    depends_on: [php-base]

  php-off:
    <<: *php
    environment:
      <<: *php-env
      OPENLOG_AGENT: "off"
      OPENLOG_SERVICE_NAME: php-bench-off
  nginx-off:
    <<: *nginx
    environment: {PHP_HOST: php-off}
    ports: ["127.0.0.1:28907:80"]
    depends_on: [php-off]

  php-on:
    <<: *php
    environment:
      <<: *php-env
      OPENLOG_AGENT: "on"
      OPENLOG_SERVICE_NAME: php-bench-on
  nginx-on:
    <<: *nginx
    environment: {PHP_HOST: php-on}
    ports: ["127.0.0.1:28908:80"]
    depends_on: [php-on]

  k6:
    image: grafana/k6:latest
    profiles: ["bench"]
    user: "0:0"
    volumes:
      - ..:/bench:ro
      - ${RESULTS:-./results}:/results

networks:
  default: {}
  openlog:
    name: ${OPENLOG_NETWORK:-openlog_default}
    external: true

volumes:
  php-sock:
