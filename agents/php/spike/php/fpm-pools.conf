; PHP-FPM pools for the spike: one per app so each gets its own service name.
[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[laravel]
user = www-data
group = www-data
listen = 9000
pm = static
pm.max_children = 8
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
env[OPENLOG_SERVICE_NAME] = ${SPIKE_LARAVEL_SERVICE}

[symfony]
user = www-data
group = www-data
listen = 9001
pm = static
pm.max_children = 4
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
env[OPENLOG_SERVICE_NAME] = ${SPIKE_SYMFONY_SERVICE}
