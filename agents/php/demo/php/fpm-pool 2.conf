; PHP-FPM pool of the demo images (Laravel, Symfony). Values come from the container environment.
[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
user = www-data
group = www-data
listen = 9000
pm = static
pm.max_children = ${FPM_WORKERS}
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
env[OPENLOG_SERVICE_NAME] = ${OPENLOG_SERVICE_NAME}
