# Lints for the mobile SDK. No `include:` and no lint package: this is the one dependency an application
# cannot choose to drop, so it has none of its own — not even for analysis.
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    todo: ignore

linter:
  rules:
    # An unawaited future in a telemetry library is data that silently never arrives.
    - unawaited_futures
    - avoid_empty_else
    - prefer_final_locals
    - omit_local_variable_types
