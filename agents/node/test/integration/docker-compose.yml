# Real databases for the instrumentation tests (compose project openlog-nodeagent-test).
#
#   docker compose -p openlog-nodeagent-test -f test/integration/docker-compose.yml up -d --wait
#   PG_URL=postgres://openlog:openlog@127.0.0.1:21432/openlog MYSQL_URL=mysql://openlog:openlog@127.0.0.1:21306/openlog \
#     REDIS_URL=redis://127.0.0.1:21379 npm run test:integration
#   docker compose -p openlog-nodeagent-test -f test/integration/docker-compose.yml down -v
#
# `runner` runs the suite inside the compose network (used by `make -C agents/node test-integration` and CI):
#   docker compose -p openlog-nodeagent-test -f test/integration/docker-compose.yml run --rm runner
name: openlog-nodeagent-test

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: openlog, POSTGRES_USER: openlog, POSTGRES_PASSWORD: openlog}
    ports: ["127.0.0.1:21432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U openlog -d openlog"], interval: 2s, timeout: 3s, retries: 30}
    tmpfs: [/var/lib/postgresql/data]

  mysql:
    image: mysql:8.4
    environment: {MYSQL_DATABASE: openlog, MYSQL_USER: openlog, MYSQL_PASSWORD: openlog, MYSQL_ROOT_PASSWORD: openlog}
    ports: ["127.0.0.1:21306:3306"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uopenlog", "-popenlog"], interval: 2s, timeout: 3s, retries: 60}
    tmpfs: [/var/lib/mysql]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:21379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 3s, retries: 30}

  runner:
    profiles: [runner]
    image: node:${NODE_VERSION:-22}-alpine
    working_dir: /src
    volumes:
      - ../..:/src
      - ${NODE_MODULES_VOLUME:-openlog-node-agent-nm}:/src/node_modules
    environment:
      PG_URL: postgres://openlog:openlog@postgres:5432/openlog
      MYSQL_URL: mysql://openlog:openlog@mysql:3306/openlog
      REDIS_URL: redis://redis:6379
    command: ["sh", "-c", "node scripts/build.mjs && node node_modules/typescript/bin/tsc -p tsconfig.test.json && node scripts/run-tests.mjs integration"]
    depends_on:
      postgres: {condition: service_healthy}
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  openlog-node-agent-nm:
    external: true
    name: ${NODE_MODULES_VOLUME:-openlog-node-agent-nm}
