name: long-tests

# Long Docker-based suites that ci.yml does not run. They never gate a release (ci.yml release-tag does not depend on
# this workflow). Failures of scheduled runs open or update one issue "long-tests failing" (docs/operations/ci.md).
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the running push run; scheduled and manual runs are never cancelled by pushes.
concurrency:
  group: long-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  go-integration:
    name: go integration (-tags integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: shared PostgreSQL + ClickHouse packages
        run: test/integration/run.sh shared
      - name: packages with their own compose projects (PostgreSQL, sharded ClickHouse)
        if: ${{ !cancelled() }}
        run: test/integration/run.sh self
      - name: renderer image
        if: ${{ !cancelled() }}
        run: test/integration/run.sh renderer
      - name: container logs
        if: failure()
        run: |
          for p in openlog-inttest openlog-pgtest openlog-alerttest openlog-fleettest openlog-shardtest openlog-apmshard; do
            echo "::group::$p"; docker compose -p "$p" logs --no-color --tail 200 || true; echo "::endgroup::"
          done
      - name: tear down
        if: always()
        run: |
          for p in openlog-inttest openlog-pgtest openlog-alerttest openlog-fleettest openlog-shardtest openlog-apmshard; do
            docker compose -p "$p" down -v --remove-orphans || true
          done

  web-playwright:
    name: web Playwright (MSW mock mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The browser build matches @playwright/test from package-lock.json (1.63.0).
      - run: npx playwright install --with-deps chromium
      - name: playwright test (Vite dev server with MSW mocks, playwright.config.ts)
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --reporter=github,html
      - name: report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  updater-acceptance:
    name: compose updater acceptance (make updater-acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Builds 0.9.0/0.9.1/0.9.2 images from this commit, a local registry and a throwaway signing key itself.
      - run: make updater-acceptance
      - name: container logs
        if: failure()
        run: docker compose -p openlog-updtest logs --no-color --tail 300 || true
      - name: tear down
        if: always()
        run: docker compose -p openlog-updtest down -v --remove-orphans || true

  install-server-test:
    name: install-server.sh (docker:dind, published release)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fresh install of 0.1.6, idempotent re-run, upgrade to the latest stable release, downgrade refused.
      - run: sh packaging/test/install-server.sh

  tls-e2e:
    name: TLS/SASL end to end (make tlstest)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Certificates are generated by the test (internal/testutil/testcerts, under /tmp); image openlog:tlstest is built.
      - run: make tlstest
      - name: tear down
        if: always()
        run: docker compose -p openlog-tlstest down -v --remove-orphans || true

  tiered-e2e:
    name: tiered storage (make tieredtest)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make tieredtest
      - name: container logs
        if: failure()
        run: docker compose -p openlog-tiered logs --no-color --tail 200 || true
      - name: tear down
        if: always()
        run: docker compose -p openlog-tiered down -v --remove-orphans || true

  sso-e2e:
    name: SSO end to end (Keycloak, make ssotest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SSOTEST_KEYCLOAK_PORT: "27480"
      SSOTEST_KEEP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ssotest
      - name: container logs
        if: failure()
        run: docker compose -p openlog-ssotest logs --no-color --tail 200 || true
      - name: tear down
        if: always()
        run: docker compose -p openlog-ssotest down -v --remove-orphans || true

  report:
    name: report
    needs: [go-integration, web-playwright, updater-acceptance, install-server-test, tls-e2e, tiered-e2e, sso-e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: summary; issue for failing scheduled runs
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "### long-tests ($EVENT, ${GITHUB_SHA:0:12})"
            echo
            echo "| job | result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<<"$NEEDS")"
          [ "$EVENT" = schedule ] || exit 0

          title="long-tests failing"
          number="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // \"\"")"
          if [ -n "$failed" ]; then
            body="Scheduled run $run_url failed at $GITHUB_SHA: $failed"
            if [ -n "$number" ]; then
              gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" -R "$GITHUB_REPOSITORY" --comment "Scheduled run $run_url passed at $GITHUB_SHA."
          fi
