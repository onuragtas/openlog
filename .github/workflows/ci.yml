name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go (root, libs/release, agents/infra)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agents/infra/go.sum
      - name: gofmt
        run: make fmt-check
      - name: root vet
        run: go vet ./...
      - name: root test
        run: go test ./...
      - name: libs/release
        working-directory: libs/release
        run: |
          go vet ./...
          go test ./...
      - name: agents/infra
        working-directory: agents/infra
        run: |
          go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...
          go test ./...

  go-agent:
    name: go (agents/go + instrumentation modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agents/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agents/go/go.mod
          cache-dependency-path: agents/go/**/go.sum
      - name: gofmt + vet + test (every module)
        run: make fmt-check vet test
      - name: race
        run: go test -race ./...

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: helm lint + kubeconform
        run: make helm-lint

  lint-scripts:
    name: shellcheck + actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make shellcheck
      - run: make actionlint

  release-dryrun:
    name: release dry run (test keys, packages, install.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DRYRUN_VERSION: 0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agents/infra/go.sum
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: signed local release
        run: |
          make release-testkeys
          make release-local VERSION="$DRYRUN_VERSION" RELEASE_TESTKEYS=1 RELEASE_REQUIRE_HELM=1 \
            RELEASE_BASE_URL=http://host.docker.internal:18080
      - name: verify
        run: |
          bin/openlog-release verify --keys dist/testkeys/public.key --check-artifacts "dist/v$DRYRUN_VERSION/manifest.json"
          bin/openlog-release verify --keys dist/testkeys/public.key dist/index.json
      - name: deb/rpm install
        run: packaging/test/packages.sh "dist/v$DRYRUN_VERSION" "$DRYRUN_VERSION"
      - name: install.sh
        run: packaging/test/install.sh dist "$DRYRUN_VERSION"

  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [go]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Optional: needs the full compose stack; a failure does not fail the workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make e2e
