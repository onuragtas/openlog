name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the running workflow. Skipped path-filtered jobs
# compare against the last successful master run, so a cancelled run's changes are still tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      php: ${{ steps.diff.outputs.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          else
            base="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci --branch master --event push --status success \
              --limit 1 --json headSha --jq '.[0].headSha // ""' || true)"
          fi
          php=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$base" HEAD)"
            printf 'changed since %s:\n%s\n' "$base" "$files"
            grep -qE '^(agents/php/|\.github/workflows/ci\.yml$)' <<<"$files" || php=false
          fi
          echo "php=$php" >> "$GITHUB_OUTPUT"


  go:
    name: go (root, libs/release, agents/infra, agents/ebpf, terraform)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agents/infra/go.sum
            agents/ebpf/go.sum
            terraform/go.sum
      - name: gofmt
        run: make fmt-check
      - name: root vet
        run: go vet ./...
      - name: root test
        run: go test ./...
      - name: libs/release
        working-directory: libs/release
        run: |
          go vet ./...
          go test ./...
      - name: agents/infra
        working-directory: agents/infra
        run: |
          go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
          go test ./...
      # The eBPF profiler is its own module (D-148) and Linux-only in function, so it is not covered by the
      # root gofmt/vet/test above. It must still vet clean on darwin and windows: the sampler is behind a
      # build tag and every other package has to keep compiling where it will never run.
      - name: agents/ebpf
        working-directory: agents/ebpf
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
          go test ./...

      # The Terraform provider is its own module (D-131), so it is not covered by the root gofmt/vet/test above.
      - name: terraform provider
        working-directory: terraform
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          go test ./...

  infra-agent-macos:
    name: infra-agent (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agents/infra
    env:
      # The version the tar.gz/pkg steps package (test-pkg.sh checks that -version reports it).
      PKG_VERSION: 0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agents/infra/go.mod
          cache-dependency-path: |
            go.sum
            agents/infra/go.sum
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: throwaway release test keys (openlog-release keygen; test only)
        working-directory: .
        run: |
          set -euo pipefail
          go run ./cmd/openlog-release keygen > "$RUNNER_TEMP/testkeys.env"
          {
            echo "TEST_PUBLIC_KEYS=$(sed -n 's/^OPENLOG_RELEASE_PUBLIC_KEYS=//p' "$RUNNER_TEMP/testkeys.env")"
            echo "TEST_SIGNING_KEY=$(sed -n 's/^OPENLOG_RELEASE_SIGNING_KEY=//p' "$RUNNER_TEMP/testkeys.env")"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/testkeys.env"
      - name: build and smoke test (-version, -once, -validate-rules)
        run: |
          set -euo pipefail
          arch=$(uname -m | sed 's/x86_64/amd64/')
          name="openlog-infra-agent_${PKG_VERSION}_darwin_$arch"
          stage="$RUNNER_TEMP/stage/$name"
          mkdir -p "$stage"
          mod=github.com/onuragtas/openlog/agents/infra/internal
          CGO_ENABLED=0 go build -trimpath -ldflags "-X $mod/version.Version=$PKG_VERSION -X $mod/release.trustedKeys=$TEST_PUBLIC_KEYS" \
            -o "$stage/openlog-infra-agent" ./cmd/openlog-infra-agent
          cp LICENSE README.md "$stage/"
          cp -R packaging "$stage/packaging"
          "$stage/openlog-infra-agent" -version
          "$stage/openlog-infra-agent" -once > "$RUNNER_TEMP/once.json"
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); assert "metrics" in d, "no metrics key"' "$RUNNER_TEMP/once.json"
          "$stage/openlog-infra-agent" -validate-rules
          echo "PKG_ARCH=$arch" >> "$GITHUB_ENV"
      - name: tar.gz, embedded manifest (test keys), pkg
        working-directory: .
        env:
          OPENLOG_RELEASE_SIGNING_KEY: ${{ env.TEST_SIGNING_KEY }}
          OPENLOG_RELEASE_PUBLIC_KEYS: ${{ env.TEST_PUBLIC_KEYS }}
          RELEASE_BASE_URL: https://example.invalid/releases
        run: |
          set -euo pipefail
          name="openlog-infra-agent_${PKG_VERSION}_darwin_$PKG_ARCH"
          go run ./cmd/openlog-release archive --out "$RUNNER_TEMP/$name.tar.gz" --prefix "$name" "$RUNNER_TEMP/stage/$name"
          agents/infra/packaging/embedded-manifest.sh "$PKG_VERSION" "$RUNNER_TEMP/embedded-manifest" "$RUNNER_TEMP/$name.tar.gz"
          agents/infra/packaging/macos/build-pkg.sh "$PKG_VERSION" "$PKG_ARCH" "$RUNNER_TEMP/stage/$name" "$RUNNER_TEMP/$name.pkg" "$RUNNER_TEMP/embedded-manifest"
      - name: pkg install test
        working-directory: .
        env:
          EXPECT_MANIFEST: "1"
        run: agents/infra/packaging/macos/test-pkg.sh "$RUNNER_TEMP/openlog-infra-agent_${PKG_VERSION}_darwin_${PKG_ARCH}.pkg" "$PKG_VERSION"
      - name: self-update end-to-end (install.sh, LaunchDaemon, upgrade and rollback)
        timeout-minutes: 12
        env:
          WORK: ${{ runner.temp }}/update-e2e
        run: test/update/native.sh

  infra-agent-windows:
    name: infra-agent (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agents/infra
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agents/infra/go.mod
          cache-dependency-path: |
            go.sum
            agents/infra/go.sum
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: throwaway release test keys (openlog-release keygen; test only)
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = go run ./cmd/openlog-release keygen
          if ($LASTEXITCODE -ne 0) { throw "keygen failed" }
          foreach ($l in $lines) {
            if ($l -match '^OPENLOG_RELEASE_PUBLIC_KEYS=(.+)$') { "TEST_PUBLIC_KEYS=$($Matches[1])" >> $env:GITHUB_ENV }
            if ($l -match '^OPENLOG_RELEASE_SIGNING_KEY=(.+)$') { "TEST_SIGNING_KEY=$($Matches[1])" >> $env:GITHUB_ENV }
          }
      - name: build and smoke test (-version, -once, -validate-rules)
        env:
          CGO_ENABLED: "0"
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'openlog-infra-agent.exe'
          # The version the zip/MSI steps below package; test-install.ps1 checks that -version reports it. The test keys let
          # the installed agent verify the MSI's embedded manifest (-verify-release).
          $mod = 'github.com/onuragtas/openlog/agents/infra/internal'
          $ldflags = "-X $mod/version.Version=0.0.${{ github.run_number }} -X $mod/release.trustedKeys=$env:TEST_PUBLIC_KEYS"
          go build -trimpath -ldflags $ldflags -o $exe ./cmd/openlog-infra-agent
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
          $env:GOARCH = 'arm64'
          go build -trimpath -ldflags $ldflags -o (Join-Path $env:RUNNER_TEMP 'arm64\openlog-infra-agent.exe') ./cmd/openlog-infra-agent
          if ($LASTEXITCODE -ne 0) { throw "go build (arm64) failed" }
          Remove-Item Env:GOARCH
          & $exe -version
          if ($LASTEXITCODE -ne 0) { throw "-version failed" }
          $once = & $exe -once
          if ($LASTEXITCODE -ne 0) { throw "-once failed" }
          $snapshot = ($once -join "`n") | ConvertFrom-Json
          if ($null -eq $snapshot.metrics) { throw "-once output has no metrics key" }
          & $exe -validate-rules
          if ($LASTEXITCODE -ne 0) { throw "-validate-rules failed" }
      - name: zip archives (openlog-release archive; amd64, arm64)
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '0.0.${{ github.run_number }}'
          foreach ($arch in @('amd64', 'arm64')) {
            $name = "openlog-infra-agent_${v}_windows_$arch"
            $stage = Join-Path $env:RUNNER_TEMP "stage/$name"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            $exe = if ($arch -eq 'amd64') { Join-Path $env:RUNNER_TEMP 'openlog-infra-agent.exe' } else { Join-Path $env:RUNNER_TEMP 'arm64\openlog-infra-agent.exe' }
            Copy-Item $exe $stage
            Copy-Item agents/infra/LICENSE, agents/infra/README.md $stage
            Copy-Item -Recurse agents/infra/packaging (Join-Path $stage 'packaging')
            go run ./cmd/openlog-release archive --out (Join-Path $env:RUNNER_TEMP "$name.zip") --prefix $name $stage
            if ($LASTEXITCODE -ne 0) { throw "archive ($arch) failed" }
          }
      - name: embedded manifest (test keys)
        working-directory: .
        shell: bash
        env:
          # Git Bash rewrites values that look like absolute POSIX paths into Windows paths. The keys are
          # random base64, so about one in 64 starts with "/" and reached openlog-release as
          # "C:/Program Files/Git/…": "illegal base64 data at input byte 1", on that run only. Name the
          # variables rather than excluding everything: "*" also stops the argument conversion the script
          # needs, and `go build -o /d/a/_temp/...` then wrote the tool where bash could not run it (exit
          # 127). This belongs here and not in the script, which is handed the value already converted.
          MSYS2_ENV_CONV_EXCL: OPENLOG_RELEASE_SIGNING_KEY;OPENLOG_RELEASE_SIGNING_KEY_2;OPENLOG_RELEASE_PUBLIC_KEYS;TEST_SIGNING_KEY;TEST_PUBLIC_KEYS
          OPENLOG_RELEASE_SIGNING_KEY: ${{ env.TEST_SIGNING_KEY }}
          OPENLOG_RELEASE_PUBLIC_KEYS: ${{ env.TEST_PUBLIC_KEYS }}
          RELEASE_BASE_URL: https://example.invalid/releases
        run: |
          v=0.0.${{ github.run_number }}
          agents/infra/packaging/embedded-manifest.sh "$v" "$RUNNER_TEMP/embedded-manifest" \
            "$RUNNER_TEMP/openlog-infra-agent_${v}_windows_amd64.zip" "$RUNNER_TEMP/openlog-infra-agent_${v}_windows_arm64.zip"
      - name: MSI build and install test (amd64, embedded manifest)
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '0.0.${{ github.run_number }}'
          $name = "openlog-infra-agent_${v}_windows_amd64"
          $msi = Join-Path $env:RUNNER_TEMP "$name.msi"
          ./agents/infra/packaging/windows/build-msi.ps1 -Version $v -Arch amd64 -ManifestDir (Join-Path $env:RUNNER_TEMP 'embedded-manifest') `
            -Exe (Join-Path $env:RUNNER_TEMP 'openlog-infra-agent.exe') -SourceDir (Join-Path $env:RUNNER_TEMP "stage/$name") -Out $msi
          ./agents/infra/packaging/windows/test-install.ps1 -Msi $msi -Zip (Join-Path $env:RUNNER_TEMP "$name.zip") -Version $v -ExpectManifest
      - name: MSI build (arm64; build only, windows-latest cannot install it)
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '0.0.${{ github.run_number }}'
          $name = "openlog-infra-agent_${v}_windows_arm64"
          ./agents/infra/packaging/windows/build-msi.ps1 -Version $v -Arch arm64 -ManifestDir (Join-Path $env:RUNNER_TEMP 'embedded-manifest') `
            -Exe (Join-Path $env:RUNNER_TEMP 'arm64\openlog-infra-agent.exe') -SourceDir (Join-Path $env:RUNNER_TEMP "stage/$name") `
            -Out (Join-Path $env:RUNNER_TEMP "$name.msi")
      - name: self-update end-to-end (install.ps1, Windows service, upgrade and rollback)
        timeout-minutes: 12
        working-directory: .
        run: ./agents/infra/test/update/native.ps1 -Work (Join-Path $env:RUNNER_TEMP 'update-e2e')

  go-agent:
    name: go (agents/go + instrumentation modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agents/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agents/go/go.mod
          cache-dependency-path: agents/go/**/go.sum
      - name: gofmt + vet + test (every module)
        run: make fmt-check vet test
      - name: race
        run: go test -race ./...
      - name: module requires without replace (local file proxy, no network for in-repo modules)
        working-directory: .
        run: scripts/go-agent-release.sh verify

  php-ext:
    name: php-ext (${{ matrix.php }}, ${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        php: ["7.1", "7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4",
              "7.4-zts", "8.3-zts", "7.4-cli-alpine", "8.3-cli-alpine"]
        include:
          # AddressSanitizer + UBSan debug PHP built from source (~3 min image build); sanitizer reports fail the job
          - runner: ubuntu-24.04
            php: "8.3-asan"
          # official FrankenPHP image (ZTS PHP 8.4): full suite + a real FrankenPHP server in worker and classic mode
          - runner: ubuntu-24.04
            php: "8.4-frankenphp"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build openlog.so + phpt (NTS/ZTS, glibc/musl; amd64 and arm64 native runners)
        env:
          VERSIONS: ${{ matrix.php }}
          EXTRA: ""
          PARALLEL: "1"
          WORK: ${{ runner.temp }}/openlog-ext-matrix
        run: agents/php/ext/build/run-matrix.sh
      - name: test logs
        if: always()
        run: cat "$RUNNER_TEMP"/openlog-ext-matrix/results/*.log

  php-ext-fuzz:
    name: php-ext fuzz (ol_text.c, libFuzzer + ASan/UBSan)
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fuzz 120 s
        env:
          FUZZ_SECONDS: "120"
          OUT: ${{ runner.temp }}/openlog-php-fuzz
        run: agents/php/ext/fuzz/run.sh
      - name: crash artifacts
        if: failure()
        run: ls -la "$RUNNER_TEMP"/openlog-php-fuzz && head -c 2000 "$RUNNER_TEMP"/openlog-php-fuzz/crash-* 2>/dev/null | od -c | head -40

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-agent:
    name: browser-agent (openlog-browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agents/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agents/browser/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The bundle ships in a page: a size regression is a product regression, and the budget is what makes
      # that visible before it is published rather than after.
      - run: npm run size

  dart-agent:
    name: dart-agent (package:openlog)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The official image rather than a setup action: it needs no new third-party action to pin, and it is
    # the same toolchain agents/dart/Makefile runs locally.
    container: dart:stable
    defaults:
      run:
        working-directory: agents/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: dart pub get
      # `dart analyze` is this package's typecheck and lint at once; --fatal-infos so a hint fails the build
      # rather than accumulating.
      - run: dart analyze --fatal-infos
      - run: dart test

  swift-agent:
    name: swift-agent (OpenLog, Apple platforms)
    # macOS because that is where this package is used and where it is verified. It has no Apple-only
    # APIs and would most likely build on Linux too, but "most likely" is not a platform to claim.
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agents/swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build
      - run: swift test

  kotlin-agent:
    name: kotlin-agent (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    defaults:
      run:
        working-directory: agents/kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      # The library targets Java 11 bytecode on whatever JDK runs the build, so the matrix is about the
      # build being reproducible on both, not about producing two artifacts.
      - run: ./gradlew --no-daemon --console=plain test

  node-agent:
    name: node-agent (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: agents/node
    env:
      COMPOSE: docker compose -p openlog-nodeagent-test -f test/integration/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agents/node/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: lint
        if: matrix.node == '22'
        run: npm run lint
      - run: npm run typecheck
      - name: install the NestJS 12 (ESM) e2e app
        run: npm ci --prefix test/apps/nest12 --no-audit --no-fund
      - name: unit + end-to-end tests (Go sampler fixtures, OTLP capture, express/fastify/koa/nest/NestJS 12/http, ESM)
        run: npm test
      - name: instrumentation tests against PostgreSQL, MySQL and Redis
        if: matrix.node == '22'
        env:
          PG_URL: postgres://openlog:openlog@127.0.0.1:21432/openlog
          MYSQL_URL: mysql://openlog:openlog@127.0.0.1:21306/openlog
          REDIS_URL: redis://127.0.0.1:21379
        run: |
          $COMPOSE up -d --wait postgres mysql redis
          npm run test:integration
      - name: stop databases
        if: always() && matrix.node == '22'
        run: $COMPOSE down -v
      - name: package contents
        if: matrix.node == '22'
        run: npm pack --dry-run

  python-agent:
    name: python-agent (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.9 installs the last OpenTelemetry line that supports it (SDK 1.41 / contrib 0.62), 3.12 and 3.13 the current one
        python: ["3.9", "3.12", "3.13"]
    defaults:
      run:
        working-directory: agents/python
    env:
      COMPOSE: docker compose -p openlog-m4-python-test -f tests/integration/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            agents/python/pyproject.toml
            agents/python/tests/requirements-*.txt
      - run: python -m pip install -e . -r tests/requirements-test.txt
      - name: lint
        if: matrix.python == '3.12'
        run: python -m ruff check src tests && python -m ruff format --check src tests
      - name: unit + end-to-end tests (Go sampler fixtures, shared sanitizer cases, Flask/Django/FastAPI/Tornado/Falcon/Pyramid, gunicorn and uWSGI workers, gevent/eventlet)
        run: python -m pytest -q -p no:cacheprovider tests/unit tests/e2e
      - name: instrumentation tests against PostgreSQL, MySQL, Redis, RabbitMQ and Kafka (psycopg2/3, asyncpg, PyMySQL, mysqlclient, SQLAlchemy, redis, Celery prefork, gRPC, aio-pika, confluent-kafka, kafka-python, aiokafka)
        if: matrix.python == '3.12'
        env:
          PG_URL: postgresql://openlog:openlog@127.0.0.1:22432/openlog
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "22306"
          REDIS_URL: redis://127.0.0.1:22379/0
          RABBITMQ_URL: amqp://openlog:openlog@127.0.0.1:22672/
          KAFKA_BOOTSTRAP: 127.0.0.1:22092
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libmysqlclient-dev pkg-config
          python -m pip install -r tests/requirements-integration.txt
          $COMPOSE up -d --wait postgres mysql redis rabbitmq kafka
          python -m pytest -q -p no:cacheprovider tests/integration
      - name: stop databases and brokers
        if: always() && matrix.python == '3.12'
        run: $COMPOSE down -v
      - name: wheel + sdist
        if: matrix.python == '3.12'
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --outdir dist .
          python -m twine check --strict dist/*
          python -m zipfile -l dist/*.whl

  java-agent:
    name: java-agent (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    defaults:
      run:
        working-directory: agents/java
    env:
      COMPOSE: docker compose -p openlog-m4-java-test -f test/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: unit tests (Go sampler fixtures, sanitizer, config, resource, SDK autoconfiguration) + agent jar
        run: ./gradlew --no-daemon --console=plain :extension:test :agentJar :agentJarChecksum
      - name: integration tests (Spring Boot MVC/WebFlux, JAX-RS/Jersey, Quarkus, Micronaut, Vert.x, PostgreSQL, MySQL, Hibernate, Redis, Kafka, gRPC, Logback/Log4j2)
        run: |
          $COMPOSE up -d --wait postgres mysql redis kafka
          ./gradlew --no-daemon --console=plain :integration-tests:integrationTest
      - name: stop services
        if: always()
        run: $COMPOSE down -v

  dotnet-agent:
    name: dotnet-agent (.NET ${{ matrix.dotnet }})
    # ubuntu-24.04 is amd64: SQL Server runs from mcr.microsoft.com/mssql/server (no arm64 image; test/docker-compose.yml)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0", "9.0"]
    defaults:
      run:
        working-directory: agents/dotnet
    env:
      COMPOSE: docker compose -p openlog-m4-dotnet-test -f test/docker-compose.yml
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PG_CONNECTION: Host=127.0.0.1;Port=24432;Username=openlog;Password=openlog;Database=openlog
      MYSQL_CONNECTION: Server=127.0.0.1;Port=24306;User ID=openlog;Password=openlog;Database=openlog
      REDIS_CONNECTION: 127.0.0.1:24379
      RABBITMQ_CONNECTION: amqp://openlog:openlog@127.0.0.1:24672/
      KAFKA_BOOTSTRAP: 127.0.0.1:24092
      SQLSERVER_CONNECTION: Server=127.0.0.1,24433;User ID=sa;Password=Openlog-Test-1;TrustServerCertificate=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: build (net8.0 + netstandard2.0, warnings as errors)
        run: dotnet build src/OpenLog.Agent/OpenLog.Agent.csproj -c Release
      - name: .NET Framework 4.8 / ASP.NET 4.x HttpModule sample (compile only, netstandard2.0 agent)
        if: matrix.dotnet == '9.0'
        run: dotnet build samples/OpenLog.AspNetFramework.Sample/OpenLog.AspNetFramework.Sample.csproj -c Release
      - name: unit tests (Go sampler fixtures, sanitizer, config, resource, processors, propagator)
        run: dotnet test test/OpenLog.Agent.Tests/OpenLog.Agent.Tests.csproj -c Release -f "net${{ matrix.dotnet }}"
      - name: integration tests (ASP.NET Core minimal API/MVC, HttpClient, gRPC, ILogger, metrics, PostgreSQL/EF Core, MySQL, Redis, SQL Server, MassTransit/RabbitMQ, Kafka)
        run: |
          $COMPOSE --profile sqlserver up -d --wait postgres mysql redis rabbitmq kafka sqlserver
          dotnet test test/OpenLog.Agent.IntegrationTests/OpenLog.Agent.IntegrationTests.csproj -c Release -f "net${{ matrix.dotnet }}"
      - name: stop databases and brokers
        if: always()
        run: $COMPOSE --profile sqlserver down -v
      - name: OpenTelemetry .NET automatic instrumentation + openlog plugin (pinned release, sha256-verified)
        env:
          DOTNET: local
          DOTNET_VERSION: ${{ matrix.dotnet }}
        run: test/autoinstrumentation.sh
      - name: package
        if: matrix.dotnet == '9.0'
        run: dotnet pack src/OpenLog.Agent/OpenLog.Agent.csproj -c Release -p:PackageOutputPath="$RUNNER_TEMP/nupkg"

  dotnet-agent-netfx:
    name: dotnet-agent-netfx (.NET Framework 4.8, ASP.NET 4.x under IIS Express / IIS)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agents/dotnet
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: run the net48 sample with TelemetryHttpModule + OpenLog.Agent and assert exported spans (OTLP capture)
        run: ./test/netfx/run-iis.ps1

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: helm lint + kubeconform
        run: make helm-lint

  lint-scripts:
    name: shellcheck + actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make shellcheck
      - run: make actionlint
      - name: install-server.sh HOST:PORT parsing (no Docker)
        run: sh packaging/test/install-server-ports.sh

  release-dryrun:
    name: release dry run (test keys, packages, install.sh)
    runs-on: ubuntu-24.04
    # The PHP agent subset below adds about 8 minutes (release.yml builds all 36 modules per architecture).
    timeout-minutes: 55
    env:
      DRYRUN_VERSION: 0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agents/infra/go.sum
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: PHP agent artifacts (reduced subset; php-agent.md §7.1)
        run: |
          # Debian 12 PHP 8.2 (glibc) and Alpine PHP 8.3 (musl) modules: enough for the deb and apk install tests.
          TARGETS="8.2-nts-glibc 8.3-nts-musl" PACKAGES="deb apk" \
            agents/php/packaging/build-artifacts.sh "$DRYRUN_VERSION" "dist/v$DRYRUN_VERSION"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Java agent jar (component java-agent, like release.yml)
        run: JAVA_BUILD=local agents/java/scripts/release-jar.sh "$DRYRUN_VERSION" "dist/v$DRYRUN_VERSION"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: language agent packages (components node-agent, python-agent, dotnet-agent, like release.yml)
        env:
          # the node-agent, python-agent and dotnet-agent jobs run the tests
          RUN_TESTS: "0"
        run: |
          NODE_BUILD=local agents/node/scripts/release-pack.sh "$DRYRUN_VERSION" "dist/v$DRYRUN_VERSION"
          PY_BUILD=local agents/python/scripts/release-dist.sh "$DRYRUN_VERSION" "dist/v$DRYRUN_VERSION"
          DOTNET_BUILD=local agents/dotnet/scripts/release-nupkg.sh "$DRYRUN_VERSION" "dist/v$DRYRUN_VERSION"
      - name: signed local release
        run: |
          make release-testkeys
          make release-local VERSION="$DRYRUN_VERSION" RELEASE_TESTKEYS=1 RELEASE_REQUIRE_HELM=1 \
            RELEASE_BASE_URL=http://host.docker.internal:18080
      - name: verify
        run: |
          bin/openlog-release verify --keys dist/testkeys/public.key --check-artifacts "dist/v$DRYRUN_VERSION/manifest.json"
          bin/openlog-release verify --keys dist/testkeys/public.key dist/index.json
          grep -q '"component": "php-agent"' "dist/v$DRYRUN_VERSION/manifest.json" || { echo "php-agent artifacts missing from the manifest"; exit 1; }
          grep -q '"name": "openlog-javaagent-'"$DRYRUN_VERSION"'.jar"' "dist/v$DRYRUN_VERSION/manifest.json" || { echo "java-agent jar missing from the manifest"; exit 1; }
          for c in node-agent python-agent dotnet-agent; do
            grep -q '"component": "'"$c"'"' "dist/v$DRYRUN_VERSION/manifest.json" || { echo "$c package missing from the manifest"; exit 1; }
          done
          for a in darwin_amd64.tar.gz darwin_arm64.tar.gz windows_amd64.zip windows_arm64.zip; do
            grep -q '"name": "openlog-infra-agent_'"${DRYRUN_VERSION}_$a"'"' "dist/v$DRYRUN_VERSION/manifest.json" || { echo "infra agent $a missing from the manifest"; exit 1; }
          done
      - name: PHP agent deb/apk install
        run: agents/php/packaging/test.sh "dist/v$DRYRUN_VERSION" "$DRYRUN_VERSION" deb apk
      - name: deb/rpm install
        run: packaging/test/packages.sh "dist/v$DRYRUN_VERSION" "$DRYRUN_VERSION"
      - name: install.sh
        run: packaging/test/install.sh dist "$DRYRUN_VERSION"

  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [go]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Optional: needs the full compose stack; a failure does not fail the workflow.
    # The other long suites (integration tags, Playwright, updater acceptance, installer, TLS, tiered storage, SSO) run in
    # .github/workflows/long-tests.yml, which never gates a release (docs/operations/ci.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make e2e

  # Continuous release: a green push to master gets the next version tag and starts release.yml
  # (docs/operations/releasing.md "Cutting a release"). Patch bump by default; "[release minor]" or
  # "[release major]" in the commit message bumps more, "[skip release]" releases nothing.
  release-tag:
    name: tag and start the release
    needs: [changes, go, infra-agent-macos, infra-agent-windows, go-agent, php-ext, php-ext-fuzz, web, node-agent,
      python-agent, java-agent, dotnet-agent, dotnet-agent-netfx, helm, lint-scripts, release-dryrun, e2e]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the Go module preparation commit and the version tag
      actions: write # workflow_dispatch of release.yml (a tag pushed with GITHUB_TOKEN starts no workflow)
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agents/go/go.mod
          cache-dependency-path: agents/go/**/go.sum
      - name: next version, Go module preparation, tag, release.yml
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if tag="$(git tag --points-at HEAD -l 'v[0-9]*' | head -1)" && [ -n "$tag" ]; then
            echo "HEAD is already tagged $tag; nothing to release"; exit 0
          fi
          remote="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "::notice::master moved on to $remote; the newer push's run releases it"; exit 0
          fi

          last="$(git tag -l 'v[0-9]*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)"
          IFS=. read -r major minor patch <<<"${last#v}"
          major="${major:-0}" minor="${minor:-0}" patch="${patch:-0}"
          case "$MESSAGE" in
            *"[release major]"*) version="$((major + 1)).0.0" ;;
            *"[release minor]"*) version="$major.$((minor + 1)).0" ;;
            *) version="$major.$minor.$((patch + 1))" ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists"; exit 1
          fi
          echo "last stable ${last:-none}, next v$version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! scripts/go-agent-release.sh check "$version" >/dev/null 2>&1; then
            scripts/go-agent-release.sh prepare "$version"
            git commit -qam "release: prepare $version (Go agent modules)"
            # Pushed with GITHUB_TOKEN: starts no ci run. Rejected when master moved meanwhile.
            if ! git push origin "HEAD:refs/heads/master"; then
              echo "::notice::master moved on while preparing v$version; the newer push's run releases it"; exit 0
            fi
          fi

          # The Go module tags go with the product tag in one atomic push while master still is this commit: a later push
          # (release.yml go-agent-tags) is refused once master has newer workflow changes ("refusing to allow a GitHub
          # App to create or update workflow … without workflows permission").
          git tag -a "v$version" -m "openlog $version"
          refs=("refs/tags/v$version")
          if scripts/go-agent-release.sh check "$version" >/dev/null 2>&1; then
            while read -r tag; do
              git tag "$tag"
              refs+=("refs/tags/$tag")
            done < <(scripts/go-agent-release.sh tags "$version")
          fi
          git push --atomic origin "${refs[@]}"
          # ci_tested: release.yml skips the tests this run already passed (agent tests, package and MSI install tests).
          gh workflow run release.yml --ref "v$version" -f ci_tested=true
          echo "### v$version tagged, release started" >> "$GITHUB_STEP_SUMMARY"
