name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the running workflow. Skipped path-filtered jobs
# compare against the last successful master run, so a cancelled run's changes are still tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      php: ${{ steps.diff.outputs.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          else
            base="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci --branch master --event push --status success \
              --limit 1 --json headSha --jq '.[0].headSha // ""' || true)"
          fi
          php=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$base" HEAD)"
            printf 'changed since %s:\n%s\n' "$base" "$files"
            grep -qE '^(agents/php/|\.github/workflows/ci\.yml$)' <<<"$files" || php=false
          fi
          echo "php=$php" >> "$GITHUB_OUTPUT"


  go:
    name: go (root, libs/release, agents/infra)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agents/infra/go.sum
      - name: gofmt
        run: make fmt-check
      - name: root vet
        run: go vet ./...
      - name: root test
        run: go test ./...
      - name: libs/release
        working-directory: libs/release
        run: |
          go vet ./...
          go test ./...
      - name: agents/infra
        working-directory: agents/infra
        run: |
          go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...
          go test ./...

  go-agent:
    name: go (agents/go + instrumentation modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agents/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agents/go/go.mod
          cache-dependency-path: agents/go/**/go.sum
      - name: gofmt + vet + test (every module)
        run: make fmt-check vet test
      - name: race
        run: go test -race ./...
      - name: module requires without replace (local file proxy, no network for in-repo modules)
        working-directory: .
        run: scripts/go-agent-release.sh verify

  php-ext:
    name: php-ext (${{ matrix.php }}, ${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        php: ["7.1", "7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4",
              "7.4-zts", "8.3-zts", "7.4-cli-alpine", "8.3-cli-alpine"]
        include:
          # AddressSanitizer + UBSan debug PHP built from source (~3 min image build); sanitizer reports fail the job
          - runner: ubuntu-24.04
            php: "8.3-asan"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build openlog.so + phpt (NTS/ZTS, glibc/musl; amd64 and arm64 native runners)
        env:
          VERSIONS: ${{ matrix.php }}
          EXTRA: ""
          PARALLEL: "1"
          WORK: ${{ runner.temp }}/openlog-ext-matrix
        run: agents/php/ext/build/run-matrix.sh
      - name: test logs
        if: always()
        run: cat "$RUNNER_TEMP"/openlog-ext-matrix/results/*.log

  php-ext-fuzz:
    name: php-ext fuzz (ol_text.c, libFuzzer + ASan/UBSan)
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fuzz 120 s
        env:
          FUZZ_SECONDS: "120"
          OUT: ${{ runner.temp }}/openlog-php-fuzz
        run: agents/php/ext/fuzz/run.sh
      - name: crash artifacts
        if: failure()
        run: ls -la "$RUNNER_TEMP"/openlog-php-fuzz && head -c 2000 "$RUNNER_TEMP"/openlog-php-fuzz/crash-* 2>/dev/null | od -c | head -40

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  node-agent:
    name: node-agent (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: agents/node
    env:
      COMPOSE: docker compose -p openlog-nodeagent-test -f test/integration/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agents/node/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: lint
        if: matrix.node == '22'
        run: npm run lint
      - run: npm run typecheck
      - name: unit + end-to-end tests (Go sampler fixtures, OTLP capture, express/fastify/koa/nest/http, ESM)
        run: npm test
      - name: instrumentation tests against PostgreSQL, MySQL and Redis
        if: matrix.node == '22'
        env:
          PG_URL: postgres://openlog:openlog@127.0.0.1:55432/openlog
          MYSQL_URL: mysql://openlog:openlog@127.0.0.1:53306/openlog
          REDIS_URL: redis://127.0.0.1:56379
        run: |
          $COMPOSE up -d --wait postgres mysql redis
          npm run test:integration
      - name: stop databases
        if: always() && matrix.node == '22'
        run: $COMPOSE down -v
      - name: package contents
        if: matrix.node == '22'
        run: npm pack --dry-run

  python-agent:
    name: python-agent (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.9 installs the last OpenTelemetry line that supports it (SDK 1.41 / contrib 0.62), 3.12 and 3.13 the current one
        python: ["3.9", "3.12", "3.13"]
    defaults:
      run:
        working-directory: agents/python
    env:
      COMPOSE: docker compose -p openlog-m4-python-test -f tests/integration/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            agents/python/pyproject.toml
            agents/python/tests/requirements-*.txt
      - run: python -m pip install -e . -r tests/requirements-test.txt
      - name: lint
        if: matrix.python == '3.12'
        run: python -m ruff check src tests && python -m ruff format --check src tests
      - name: unit + end-to-end tests (Go sampler fixtures, shared sanitizer cases, Flask/Django/FastAPI/Tornado/Falcon/Pyramid, gunicorn and uWSGI workers, gevent/eventlet)
        run: python -m pytest -q -p no:cacheprovider tests/unit tests/e2e
      - name: instrumentation tests against PostgreSQL, MySQL, Redis, RabbitMQ and Kafka (psycopg2/3, asyncpg, PyMySQL, mysqlclient, SQLAlchemy, redis, Celery prefork, gRPC, aio-pika, confluent-kafka, kafka-python, aiokafka)
        if: matrix.python == '3.12'
        env:
          PG_URL: postgresql://openlog:openlog@127.0.0.1:55433/openlog
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "53307"
          REDIS_URL: redis://127.0.0.1:56380/0
          RABBITMQ_URL: amqp://openlog:openlog@127.0.0.1:55673/
          KAFKA_BOOTSTRAP: 127.0.0.1:59092
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libmysqlclient-dev pkg-config
          python -m pip install -r tests/requirements-integration.txt
          $COMPOSE up -d --wait postgres mysql redis rabbitmq kafka
          python -m pytest -q -p no:cacheprovider tests/integration
      - name: stop databases and brokers
        if: always() && matrix.python == '3.12'
        run: $COMPOSE down -v
      - name: wheel + sdist
        if: matrix.python == '3.12'
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --outdir dist .
          python -m twine check --strict dist/*
          python -m zipfile -l dist/*.whl

  java-agent:
    name: java-agent (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    defaults:
      run:
        working-directory: agents/java
    env:
      COMPOSE: docker compose -p openlog-m4-java-test -f test/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: unit tests (Go sampler fixtures, sanitizer, config, resource, SDK autoconfiguration) + agent jar
        run: ./gradlew --no-daemon --console=plain :extension:test :agentJar :agentJarChecksum
      - name: integration tests (Spring Boot MVC/WebFlux, JAX-RS/Jersey, Quarkus, Micronaut, Vert.x, PostgreSQL, MySQL, Hibernate, Redis, Kafka, gRPC, Logback/Log4j2)
        run: |
          $COMPOSE up -d --wait postgres mysql redis kafka
          ./gradlew --no-daemon --console=plain :integration-tests:integrationTest
      - name: stop services
        if: always()
        run: $COMPOSE down -v

  dotnet-agent:
    name: dotnet-agent (.NET ${{ matrix.dotnet }})
    # ubuntu-24.04 is amd64: SQL Server runs from mcr.microsoft.com/mssql/server (no arm64 image; test/docker-compose.yml)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0", "9.0"]
    defaults:
      run:
        working-directory: agents/dotnet
    env:
      COMPOSE: docker compose -p openlog-m4-dotnet-test -f test/docker-compose.yml
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PG_CONNECTION: Host=127.0.0.1;Port=45433;Username=openlog;Password=openlog;Database=openlog
      MYSQL_CONNECTION: Server=127.0.0.1;Port=43307;User ID=openlog;Password=openlog;Database=openlog
      REDIS_CONNECTION: 127.0.0.1:46380
      RABBITMQ_CONNECTION: amqp://openlog:openlog@127.0.0.1:45672/
      KAFKA_BOOTSTRAP: 127.0.0.1:49092
      SQLSERVER_CONNECTION: Server=127.0.0.1,41433;User ID=sa;Password=Openlog-Test-1;TrustServerCertificate=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: build (net8.0 + netstandard2.0, warnings as errors)
        run: dotnet build src/OpenLog.Agent/OpenLog.Agent.csproj -c Release
      - name: .NET Framework 4.8 / ASP.NET 4.x HttpModule sample (compile only, netstandard2.0 agent)
        if: matrix.dotnet == '9.0'
        run: dotnet build samples/OpenLog.AspNetFramework.Sample/OpenLog.AspNetFramework.Sample.csproj -c Release
      - name: unit tests (Go sampler fixtures, sanitizer, config, resource, processors, propagator)
        run: dotnet test test/OpenLog.Agent.Tests/OpenLog.Agent.Tests.csproj -c Release -f "net${{ matrix.dotnet }}"
      - name: integration tests (ASP.NET Core minimal API/MVC, HttpClient, gRPC, ILogger, metrics, PostgreSQL/EF Core, MySQL, Redis, SQL Server, MassTransit/RabbitMQ, Kafka)
        run: |
          $COMPOSE --profile sqlserver up -d --wait postgres mysql redis rabbitmq kafka sqlserver
          dotnet test test/OpenLog.Agent.IntegrationTests/OpenLog.Agent.IntegrationTests.csproj -c Release -f "net${{ matrix.dotnet }}"
      - name: stop databases and brokers
        if: always()
        run: $COMPOSE --profile sqlserver down -v
      - name: OpenTelemetry .NET automatic instrumentation + openlog plugin (pinned release, sha256-verified)
        env:
          DOTNET: local
          DOTNET_VERSION: ${{ matrix.dotnet }}
        run: test/autoinstrumentation.sh
      - name: package
        if: matrix.dotnet == '9.0'
        run: dotnet pack src/OpenLog.Agent/OpenLog.Agent.csproj -c Release -o "$RUNNER_TEMP/nupkg"

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: helm lint + kubeconform
        run: make helm-lint

  lint-scripts:
    name: shellcheck + actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make shellcheck
      - run: make actionlint

  release-dryrun:
    name: release dry run (test keys, packages, install.sh)
    runs-on: ubuntu-24.04
    # The PHP agent subset below adds about 8 minutes (release.yml builds all 36 modules per architecture).
    timeout-minutes: 55
    env:
      DRYRUN_VERSION: 0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agents/infra/go.sum
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: PHP agent artifacts (reduced subset; php-agent.md §7.1)
        run: |
          # Debian 12 PHP 8.2 (glibc) and Alpine PHP 8.3 (musl) modules: enough for the deb and apk install tests.
          TARGETS="8.2-nts-glibc 8.3-nts-musl" PACKAGES="deb apk" \
            agents/php/packaging/build-artifacts.sh "$DRYRUN_VERSION" "dist/v$DRYRUN_VERSION"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Java agent jar (component java-agent, like release.yml)
        run: JAVA_BUILD=local agents/java/scripts/release-jar.sh "$DRYRUN_VERSION" "dist/v$DRYRUN_VERSION"
      - name: signed local release
        run: |
          make release-testkeys
          make release-local VERSION="$DRYRUN_VERSION" RELEASE_TESTKEYS=1 RELEASE_REQUIRE_HELM=1 \
            RELEASE_BASE_URL=http://host.docker.internal:18080
      - name: verify
        run: |
          bin/openlog-release verify --keys dist/testkeys/public.key --check-artifacts "dist/v$DRYRUN_VERSION/manifest.json"
          bin/openlog-release verify --keys dist/testkeys/public.key dist/index.json
          grep -q '"component": "php-agent"' "dist/v$DRYRUN_VERSION/manifest.json" || { echo "php-agent artifacts missing from the manifest"; exit 1; }
          grep -q '"name": "openlog-javaagent-'"$DRYRUN_VERSION"'.jar"' "dist/v$DRYRUN_VERSION/manifest.json" || { echo "java-agent jar missing from the manifest"; exit 1; }
      - name: PHP agent deb/apk install
        run: agents/php/packaging/test.sh "dist/v$DRYRUN_VERSION" "$DRYRUN_VERSION" deb apk
      - name: deb/rpm install
        run: packaging/test/packages.sh "dist/v$DRYRUN_VERSION" "$DRYRUN_VERSION"
      - name: install.sh
        run: packaging/test/install.sh dist "$DRYRUN_VERSION"

  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [go]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Optional: needs the full compose stack; a failure does not fail the workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make e2e
