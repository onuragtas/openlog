# Release on tag v<SemVer> (docs/operations/releasing.md, docs/contracts/releases-updates.md).
#
# Requires: repository variable OPENLOG_RELEASE_PUBLIC_KEYS (comma-separated base64 public keys,
# compiled into every binary) and secret OPENLOG_RELEASE_SIGNING_KEY (base64 Ed25519 seed).
# Optional during key rotation: secret OPENLOG_RELEASE_SIGNING_KEY_2 (adds a second signature).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/onuragtas/openlog

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      commit: ${{ steps.meta.outputs.commit }}
      date: ${{ steps.meta.outputs.date }}
    steps:
      - id: meta
        name: version and channel from the tag
        env:
          TAG: ${{ github.ref_name }}
          PUBLIC_KEYS: ${{ vars.OPENLOG_RELEASE_PUBLIC_KEYS }}
          SIGNING_KEY: ${{ secrets.OPENLOG_RELEASE_SIGNING_KEY }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not v<SemVer>"; exit 1
          fi
          [ -n "$PUBLIC_KEYS" ] || { echo "::error::repository variable OPENLOG_RELEASE_PUBLIC_KEYS is not set"; exit 1; }
          [ -n "$SIGNING_KEY" ] || { echo "::error::secret OPENLOG_RELEASE_SIGNING_KEY is not set"; exit 1; }
          channel=stable
          [[ "$version" != *-* ]] || channel=beta
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "commit=${GITHUB_SHA::12}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "release $version on channel $channel"

  image:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.channel == 'stable' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            DATE=${{ needs.prepare.outputs.date }}
            OPENLOG_RELEASE_PUBLIC_KEYS=${{ vars.OPENLOG_RELEASE_PUBLIC_KEYS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [prepare, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agents/infra/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: web UI (embedded into the backend binaries)
        run: make web

      - name: previous releases for index.json
        run: |
          args=""
          while read -r tag; do
            v="${tag#v}"
            [ "$tag" != "$TAG" ] || continue
            [[ "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || continue
            args="$args --entry $v=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/manifest.json"
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft | not) | select(any(.assets[]; .name == "manifest.json")) | .tag_name')
          echo "index entries:$args"
          echo "RELEASE_INDEX_ARGS=$args" >> "$GITHUB_ENV"

      - name: build, sign and verify
        env:
          OPENLOG_RELEASE_SIGNING_KEY: ${{ secrets.OPENLOG_RELEASE_SIGNING_KEY }}
          OPENLOG_RELEASE_SIGNING_KEY_2: ${{ secrets.OPENLOG_RELEASE_SIGNING_KEY_2 }}
          OPENLOG_RELEASE_PUBLIC_KEYS: ${{ vars.OPENLOG_RELEASE_PUBLIC_KEYS }}
          RELEASE_IMAGE: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          make release-local VERSION="$VERSION" RELEASE_CHANNEL="$CHANNEL" RELEASE_REQUIRE_HELM=1 \
            RELEASE_BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download"
          head -c 1500 "dist/v$VERSION/manifest.json"

      - name: deb/rpm install test (amd64)
        run: packaging/test/packages.sh "dist/v$VERSION" "$VERSION"

      - name: publish GitHub release
        run: |
          flags=(--latest)
          if [ "$CHANNEL" = beta ]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" --verify-tag --draft --title "openlog $VERSION" --generate-notes \
            "dist/v$VERSION"/*
          gh release edit "$TAG" --draft=false "${flags[@]}"

      - name: refresh index.json on the latest stable release
        if: needs.prepare.outputs.channel == 'beta'
        run: |
          # releases/latest/download/index.json serves the latest *stable* release; keep its index current.
          latest="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$latest" ] && [ "$latest" != "$TAG" ]; then
            gh release upload "$latest" dist/index.json dist/index.json.sig --clobber
          fi
