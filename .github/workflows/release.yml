# Release on tag v<SemVer> (docs/operations/releasing.md, docs/contracts/releases-updates.md).
#
# Requires: repository variable OPENLOG_RELEASE_PUBLIC_KEYS (comma-separated base64 public keys,
# compiled into every binary) and secret OPENLOG_RELEASE_SIGNING_KEY (base64 Ed25519 seed).
# Optional during key rotation: secret OPENLOG_RELEASE_SIGNING_KEY_2 (adds a second signature).
# Optional: variable HELM_OCI_PUSH=true pushes the Helm charts to oci://ghcr.io/onuragtas/charts (job helm-oci).
name: release

on:
  push:
    tags: ["v*"]
  # ci.yml job release-tag starts the release of the tag it pushed (tags pushed with GITHUB_TOKEN start no
  # workflow); also "Run workflow" with a v* tag selected.
  workflow_dispatch:
    inputs:
      ci_tested:
        description: "the tagged commit passed ci.yml (set by ci.yml release-tag): skip the tests ci.yml already ran"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # 0 when ci.yml release-tag started the release of a commit whose ci.yml run (incl. "release dry run": agent tests,
  # deb/rpm/apk and PHP deb/apk install tests, the Windows MSI install test) passed; 1 for a tag pushed by hand.
  RUN_TESTS: ${{ inputs.ci_tested && '0' || '1' }}
  IMAGE: ghcr.io/onuragtas/openlog
  # Report chart renderer (headless Chromium, D-097): Dockerfile target `renderer`.
  RENDERER_IMAGE: ghcr.io/onuragtas/openlog-renderer

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      commit: ${{ steps.meta.outputs.commit }}
      date: ${{ steps.meta.outputs.date }}
    steps:
      - id: meta
        name: version and channel from the tag
        env:
          TAG: ${{ github.ref_name }}
          PUBLIC_KEYS: ${{ vars.OPENLOG_RELEASE_PUBLIC_KEYS }}
          SIGNING_KEY: ${{ secrets.OPENLOG_RELEASE_SIGNING_KEY }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::run release.yml on a v<SemVer> tag, not on $GITHUB_REF"; exit 1
          fi
          version="${TAG#v}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not v<SemVer>"; exit 1
          fi
          [ -n "$PUBLIC_KEYS" ] || { echo "::error::repository variable OPENLOG_RELEASE_PUBLIC_KEYS is not set"; exit 1; }
          [ -n "$SIGNING_KEY" ] || { echo "::error::secret OPENLOG_RELEASE_SIGNING_KEY is not set"; exit 1; }
          channel=stable
          [[ "$version" != *-* ]] || channel=beta
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "commit=${GITHUB_SHA::12}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "release $version on channel $channel"

  # Go agent module tags need `make release-prepare VERSION=X.Y.Z` before tagging. A tag without it
  # still releases the backend and the infra agent; only the Go module tags are skipped (warning).
  go-agent-modules:
    name: Go agent modules prepared for the tag
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      prepared: ${{ steps.check.outputs.prepared }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agents/go/go.mod
          cache-dependency-path: agents/go/**/go.sum
      - id: check
        name: version.go and in-repo requires equal the tag (make release-prepare before tagging)
        run: |
          if scripts/go-agent-release.sh check "$VERSION"; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Go agent modules are not prepared for v$VERSION; Go module tags are skipped (make release-prepare VERSION=$VERSION before the next tag)"
          fi
      - name: modules build without replace against the tagged requires
        if: steps.check.outputs.prepared == 'true'
        run: scripts/go-agent-release.sh verify "$VERSION"

  image:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      renderer-digest: ${{ steps.build-renderer.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.channel == 'stable' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            DATE=${{ needs.prepare.outputs.date }}
            OPENLOG_RELEASE_PUBLIC_KEYS=${{ vars.OPENLOG_RELEASE_PUBLIC_KEYS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # openlog-renderer: Go cross-compiled on the runner, Chromium from Alpine packages of each platform.
      - id: build-renderer
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: renderer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.RENDERER_IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.channel == 'stable' && format('{0}:latest', env.RENDERER_IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.title=openlog-renderer
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            DATE=${{ needs.prepare.outputs.date }}
          cache-from: type=gha,scope=renderer
          cache-to: type=gha,mode=max,scope=renderer

  # Infra agent container image (agents/infra/Dockerfile), the image the Add data "Docker" card runs
  # (web/src/lib/install-commands.ts). Containers never update themselves; users move the tag.
  infra-agent-image:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      INFRA_IMAGE: ghcr.io/onuragtas/openlog-infra-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: agents/infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.INFRA_IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.channel == 'stable' && format('{0}:latest', env.INFRA_IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            DATE=${{ needs.prepare.outputs.date }}
            OPENLOG_RELEASE_PUBLIC_KEYS=${{ vars.OPENLOG_RELEASE_PUBLIC_KEYS }}
          cache-from: type=gha,scope=infra-agent
          cache-to: type=gha,mode=max,scope=infra-agent

  # PHP agent (docs/contracts/php-agent.md §7.1): openlog.so for PHP 7.1–8.4 × NTS/ZTS × glibc/musl (36 modules), the
  # tarball and deb/rpm/apk per architecture on native runners, install-tested, handed to the release job, which puts
  # them into the signed manifest (component php-agent).
  php-agent-artifacts:
    name: PHP agent artifacts (${{ matrix.arch }})
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build 36 modules, tarball, deb/rpm/apk
        env:
          PARALLEL: "4"
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" agents/php/packaging/build-artifacts.sh "$VERSION" dist/php
          ls -l dist/php
      - name: deb/rpm/apk install test
        run: |
          formats=()
          if [ "$RUN_TESTS" = 0 ]; then formats=(rpm); fi # ci.yml release dry run tested deb and apk
          agents/php/packaging/test.sh dist/php "$VERSION" "${formats[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-agent-${{ matrix.arch }}
          path: dist/php/openlog-php-agent_*
          if-no-files-found: error
          retention-days: 7

  # openlog-javaagent-<version>.jar + .sha256 (agents/java, D-072), handed to the release job, which lists the jar in
  # the signed manifest (component java-agent, format jar) and publishes both files with the GitHub release
  # (docs/operations/releasing.md#java-agent-jar). The jar is reproducible.
  java-agent-jar:
    name: Java agent jar
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: build (unit tests unless RUN_TESTS=0) at the tag version
        run: |
          JAVA_BUILD=local agents/java/scripts/release-jar.sh "$VERSION" dist/java
          {
            echo "### Java agent"
            echo "\`java -javaagent:openlog-javaagent-$VERSION.jar -jar app.jar\` ($(cut -d' ' -f1 "dist/java/openlog-javaagent-$VERSION.jar.sha256"))"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-agent
          path: dist/java/openlog-javaagent-*
          if-no-files-found: error
          retention-days: 7

  # Language agent packages, attached to every GitHub release whether or not the registry publish jobs below have
  # credentials (docs/operations/releasing.md#language-agent-packages-github-release): openlog-node-<v>.tgz, the
  # openlog-agent wheel and sdist, OpenLog.Agent.<v>.nupkg, each with .sha256. The release job lists the tgz, whl and
  # nupkg in the signed manifest (components node-agent, python-agent, dotnet-agent); the Add data page installs them
  # from the release when the registry does not serve the version. The publish jobs push exactly these files.
  node-agent-package:
    name: Node.js agent package (npm pack)
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agents/node/package-lock.json
      - name: version from the tag, install, test (unless RUN_TESTS=0), pack
        run: NODE_BUILD=local agents/node/scripts/release-pack.sh "$VERSION" dist/node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-agent
          path: dist/node/openlog-node-*
          if-no-files-found: error
          retention-days: 7

  python-agent-package:
    name: Python agent wheel and sdist
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: version from the tag (PEP 440), test (unless RUN_TESTS=0), build, twine check
        run: PY_BUILD=local agents/python/scripts/release-dist.sh "$VERSION" dist/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-agent
          path: dist/python/openlog_agent-*
          if-no-files-found: error
          retention-days: 7

  dotnet-agent-package:
    name: .NET agent NuGet package
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: unit tests (unless RUN_TESTS=0) and pack at the tag version
        run: DOTNET_BUILD=local agents/dotnet/scripts/release-nupkg.sh "$VERSION" dist/dotnet
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-agent
          path: |
            dist/dotnet/OpenLog.Agent.*.nupkg
            dist/dotnet/OpenLog.Agent.*.nupkg.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-agent-symbols
          path: dist/dotnet/OpenLog.Agent.*.snupkg
          if-no-files-found: error
          retention-days: 7

  # Windows infra agent (amd64): openlog-infra-agent_<v>_windows_amd64.zip and .msi, built and install-tested on a
  # native runner. Authenticode signing only with the WINDOWS_SIGNING_CERT_* secrets. windows/arm64 (zip only) is
  # cross-compiled by the release job.
  infra-agent-windows:
    name: infra agent Windows (zip, MSI)
    needs: [prepare]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      DATE: ${{ needs.prepare.outputs.date }}
      PUBLIC_KEYS: ${{ vars.OPENLOG_RELEASE_PUBLIC_KEYS }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agents/infra/go.sum
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - id: build
        name: build openlog-infra-agent.exe (ldflags as AGENT_LDFLAGS in the Makefile)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          $ErrorActionPreference = 'Stop'
          $mod = 'github.com/onuragtas/openlog/agents/infra'
          $ldflags = "-s -w -X $mod/internal/version.Version=$env:VERSION -X $mod/internal/version.Commit=$env:COMMIT " +
            "-X $mod/internal/version.Date=$env:DATE -X $mod/internal/release.trustedKeys=$env:PUBLIC_KEYS"
          $name = "openlog-infra-agent_$($env:VERSION)_windows_amd64"
          $stage = Join-Path $env:RUNNER_TEMP "stage/$name"
          New-Item -ItemType Directory -Force -Path $stage, dist/windows | Out-Null
          Push-Location agents/infra
          go build -trimpath -ldflags $ldflags -o (Join-Path $stage 'openlog-infra-agent.exe') ./cmd/openlog-infra-agent
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
          Pop-Location
          Copy-Item agents/infra/LICENSE, agents/infra/README.md $stage
          Copy-Item -Recurse agents/infra/packaging (Join-Path $stage 'packaging')
          "name=$name" >> $env:GITHUB_OUTPUT
          "stage=$stage" >> $env:GITHUB_OUTPUT
      - id: signing
        name: Authenticode certificate configured
        env:
          CERT: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ($env:CERT -and $env:CERT_PASSWORD) {
            "present=true" >> $env:GITHUB_OUTPUT
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found" }
            "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Output "::warning::secrets WINDOWS_SIGNING_CERT_PFX_BASE64 / WINDOWS_SIGNING_CERT_PASSWORD are not set; the Windows agent $env:VERSION (exe, MSI) is unsigned"
          }
      - name: sign openlog-infra-agent.exe
        if: steps.signing.outputs.present == 'true'
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          SIGNTOOL: ${{ steps.signing.outputs.signtool }}
          STAGE: ${{ steps.build.outputs.stage }}
        run: |
          & $env:SIGNTOOL sign /f (Join-Path $env:RUNNER_TEMP 'signing.pfx') /p $env:CERT_PASSWORD /fd sha256 `
            /tr http://timestamp.digicert.com /td sha256 (Join-Path $env:STAGE 'openlog-infra-agent.exe')
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
      - name: smoke test (-version, -once)
        env:
          STAGE: ${{ steps.build.outputs.stage }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:STAGE 'openlog-infra-agent.exe'
          $v = & $exe -version
          if ($LASTEXITCODE -ne 0 -or -not ("$v" -match [regex]::Escape($env:VERSION))) { throw "-version: $v" }
          $once = & $exe -once
          if ($LASTEXITCODE -ne 0) { throw "-once failed" }
          if ($null -eq (($once -join "`n") | ConvertFrom-Json).metrics) { throw "-once output has no metrics key" }
      - name: zip archive
        env:
          NAME: ${{ steps.build.outputs.name }}
          STAGE: ${{ steps.build.outputs.stage }}
        run: |
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          go run ./cmd/openlog-release archive --out "dist/windows/$env:NAME.zip" --prefix $env:NAME $env:STAGE
          if ($LASTEXITCODE -ne 0) { throw "archive failed" }
      - name: MSI
        env:
          NAME: ${{ steps.build.outputs.name }}
          STAGE: ${{ steps.build.outputs.stage }}
        run: |
          ./agents/infra/packaging/windows/build-msi.ps1 -Version $env:VERSION -Arch amd64 `
            -Exe (Join-Path $env:STAGE 'openlog-infra-agent.exe') -SourceDir $env:STAGE -Out "dist/windows/$env:NAME.msi"
      - name: sign MSI
        if: steps.signing.outputs.present == 'true'
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          SIGNTOOL: ${{ steps.signing.outputs.signtool }}
          NAME: ${{ steps.build.outputs.name }}
        run: |
          & $env:SIGNTOOL sign /f (Join-Path $env:RUNNER_TEMP 'signing.pfx') /p $env:CERT_PASSWORD /fd sha256 `
            /tr http://timestamp.digicert.com /td sha256 "dist/windows/$env:NAME.msi"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
      - name: MSI and zip install test
        if: env.RUN_TESTS == '1'
        env:
          NAME: ${{ steps.build.outputs.name }}
        run: |
          ./agents/infra/packaging/windows/test-install.ps1 -Msi "dist/windows/$env:NAME.msi" -Zip "dist/windows/$env:NAME.zip" -Version $env:VERSION
          Get-ChildItem dist/windows
      - name: remove the signing certificate
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'signing.pfx')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-agent-windows
          path: |
            dist/windows/openlog-infra-agent_*.zip
            dist/windows/openlog-infra-agent_*.msi
          if-no-files-found: error
          retention-days: 7

  # macOS infra agent: openlog-infra-agent_<v>_darwin_{arm64,amd64}.tar.gz (arm64 native, amd64 cross-compiled).
  # Developer ID signing only with the APPLE_DEVELOPER_ID_CERT_* secrets; notarization additionally needs the
  # APPLE_NOTARY_* secrets (a bare Mach-O cannot be stapled: Gatekeeper checks the notarization online).
  infra-agent-macos:
    name: infra agent macOS (tar.gz)
    needs: [prepare]
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      DATE: ${{ needs.prepare.outputs.date }}
      PUBLIC_KEYS: ${{ vars.OPENLOG_RELEASE_PUBLIC_KEYS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agents/infra/go.sum
      - name: build darwin arm64 and amd64 (ldflags as AGENT_LDFLAGS in the Makefile)
        run: |
          set -euo pipefail
          mod=github.com/onuragtas/openlog/agents/infra
          ldflags="-s -w -X $mod/internal/version.Version=$VERSION -X $mod/internal/version.Commit=$COMMIT -X $mod/internal/version.Date=$DATE -X $mod/internal/release.trustedKeys=$PUBLIC_KEYS"
          for arch in arm64 amd64; do
            name="openlog-infra-agent_${VERSION}_darwin_$arch"
            stage="$RUNNER_TEMP/stage/$name"
            mkdir -p "$stage"
            (cd agents/infra && CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath -ldflags "$ldflags" \
              -o "$stage/openlog-infra-agent" ./cmd/openlog-infra-agent)
            cp agents/infra/LICENSE agents/infra/README.md "$stage/"
            cp -R agents/infra/packaging "$stage/packaging"
          done
      - id: signing
        name: Developer ID certificate and notary key configured
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          sign=false notarize=false
          if [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ]; then
            sign=true
            if [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ] && [ -n "$NOTARY_KEY" ]; then
              notarize=true
            else
              echo "::warning::APPLE_NOTARY_KEY_ID / APPLE_NOTARY_ISSUER / APPLE_NOTARY_KEY_P8_BASE64 are not set; the macOS agent $VERSION is signed but not notarized"
            fi
          else
            echo "::warning::APPLE_DEVELOPER_ID_CERT_P12_BASE64 / APPLE_DEVELOPER_ID_CERT_PASSWORD are not set; the macOS agent $VERSION is unsigned"
          fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
      - name: codesign (Developer ID, hardened runtime)
        if: steps.signing.outputs.sign == 'true'
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kcpass="$(uuidgen)"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kcpass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$keychain" >/dev/null
          keychains=("$keychain")
          while read -r k; do keychains+=("$k"); done < <(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "${keychains[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')"
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in the certificate"; exit 1; }
          for arch in arm64 amd64; do
            bin="$RUNNER_TEMP/stage/openlog-infra-agent_${VERSION}_darwin_$arch/openlog-infra-agent"
            codesign --force --options runtime --timestamp --identifier org.openlog.infra-agent --sign "$identity" --keychain "$keychain" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
      - name: notarize (notarytool, zip of each binary)
        if: steps.signing.outputs.notarize == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$key"
          trap 'rm -f "$key"' EXIT
          for arch in arm64 amd64; do
            bin="$RUNNER_TEMP/stage/openlog-infra-agent_${VERSION}_darwin_$arch/openlog-infra-agent"
            ditto -c -k --keepParent "$bin" "$RUNNER_TEMP/notarize-$arch.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize-$arch.zip" --key "$key" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER" --wait
          done
      - name: smoke test (-version, -once; native arm64)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/stage/openlog-infra-agent_${VERSION}_darwin_$(uname -m | sed 's/x86_64/amd64/')/openlog-infra-agent"
          "$bin" -version | grep -F "$VERSION"
          "$bin" -once > "$RUNNER_TEMP/once.json"
          python3 -c 'import json, sys; assert "metrics" in json.load(open(sys.argv[1])), "no metrics key"' "$RUNNER_TEMP/once.json"
      - name: tar.gz archives
        run: |
          set -euo pipefail
          mkdir -p dist/macos
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          for arch in arm64 amd64; do
            name="openlog-infra-agent_${VERSION}_darwin_$arch"
            go run ./cmd/openlog-release archive --out "dist/macos/$name.tar.gz" --prefix "$name" "$RUNNER_TEMP/stage/$name"
          done
      - name: remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-agent-macos
          path: dist/macos/openlog-infra-agent_*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, image, infra-agent-image, infra-agent-windows, infra-agent-macos, php-agent-artifacts, java-agent-jar, node-agent-package, python-agent-package, dotnet-agent-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agents/infra/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: web UI (embedded into the backend binaries)
        run: make web

      - name: previous releases for index.json
        run: |
          args=""
          while read -r tag; do
            v="${tag#v}"
            [ "$tag" != "$TAG" ] || continue
            [[ "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || continue
            args="$args --entry $v=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/manifest.json"
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft | not) | select(any(.assets[]; .name == "manifest.json")) | .tag_name')
          echo "index entries:$args"
          echo "RELEASE_INDEX_ARGS=$args" >> "$GITHUB_ENV"

      - name: PHP agent artifacts into the release directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: php-agent-*
          merge-multiple: true
          path: dist/v${{ needs.prepare.outputs.version }}

      - name: Java agent jar into the release directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-agent
          path: dist/v${{ needs.prepare.outputs.version }}

      - name: Node.js agent package into the release directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-agent
          path: dist/v${{ needs.prepare.outputs.version }}

      - name: Python agent wheel and sdist into the release directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-agent
          path: dist/v${{ needs.prepare.outputs.version }}

      - name: .NET agent package into the release directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-agent
          path: dist/v${{ needs.prepare.outputs.version }}

      - name: Windows infra agent (zip, MSI) into the release directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: infra-agent-windows
          path: dist/v${{ needs.prepare.outputs.version }}

      - name: macOS infra agent archives into the release directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: infra-agent-macos
          path: dist/v${{ needs.prepare.outputs.version }}

      - name: build, sign and verify
        env:
          OPENLOG_RELEASE_SIGNING_KEY: ${{ secrets.OPENLOG_RELEASE_SIGNING_KEY }}
          OPENLOG_RELEASE_SIGNING_KEY_2: ${{ secrets.OPENLOG_RELEASE_SIGNING_KEY_2 }}
          OPENLOG_RELEASE_PUBLIC_KEYS: ${{ vars.OPENLOG_RELEASE_PUBLIC_KEYS }}
          RELEASE_IMAGE: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          # darwin and windows/amd64 come prebuilt (signed where configured) from the jobs above; release-agent keeps them.
          make release-local VERSION="$VERSION" RELEASE_CHANNEL="$CHANNEL" RELEASE_REQUIRE_HELM=1 \
            RELEASE_AGENT_PLATFORMS="linux/amd64 linux/arm64 windows/arm64" \
            RELEASE_BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download"
          for a in darwin_amd64.tar.gz darwin_arm64.tar.gz windows_amd64.zip windows_amd64.msi windows_arm64.zip; do
            grep -q "\"name\": \"openlog-infra-agent_${VERSION}_$a\"" "dist/v$VERSION/manifest.json" || { echo "::error::infra agent $a missing from the manifest"; exit 1; }
          done
          head -c 1500 "dist/v$VERSION/manifest.json"

      - name: deb/rpm install test (amd64)
        if: env.RUN_TESTS == '1'
        run: packaging/test/packages.sh "dist/v$VERSION" "$VERSION"

      - name: publish GitHub release
        run: |
          flags=(--latest)
          if [ "$CHANNEL" = beta ]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" --verify-tag --draft --title "openlog $VERSION" --generate-notes \
            "dist/v$VERSION"/*
          gh release edit "$TAG" --draft=false "${flags[@]}"

      - name: refresh index.json on the latest stable release
        if: needs.prepare.outputs.channel == 'beta'
        run: |
          # releases/latest/download/index.json serves the latest *stable* release; keep its index current.
          latest="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$latest" ] && [ "$latest" != "$TAG" ]; then
            gh release upload "$latest" dist/index.json dist/index.json.sig --clobber
          fi

  # Helm charts openlog and openlog-agent as OCI artifacts in oci://ghcr.io/onuragtas/charts
  # (docs/operations/releasing.md#helm-charts), after the GitHub release is published. Skipped with a warning unless
  # the repository variable HELM_OCI_PUSH is "true". The charts come from the release assets and are checked against
  # the sha256 in its manifest, so the registry serves the same bytes.
  helm-oci:
    name: Helm charts to GHCR (OCI)
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HELM_OCI_PUSH: ${{ vars.HELM_OCI_PUSH }}
      CHARTS_REPO: oci://ghcr.io/onuragtas/charts
    steps:
      - id: enabled
        name: HELM_OCI_PUSH configured
        run: |
          if [ "$HELM_OCI_PUSH" = true ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::variable HELM_OCI_PUSH is not true; Helm charts $VERSION are not pushed to $CHARTS_REPO (docs/operations/releasing.md#helm-charts)"
          fi
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.enabled.outputs.present == 'true'
        with:
          version: v4.3.0
      - name: charts from the GitHub release, checked against manifest.json
        if: steps.enabled.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charts" && cd "$RUNNER_TEMP/charts"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            -p manifest.json -p "openlog-$VERSION.tgz" -p "openlog-agent-$VERSION.tgz"
          for chart in openlog openlog-agent; do
            want="$(jq -r --arg c "$chart" '.helm_charts[$c].sha256 // empty' manifest.json)"
            [ -n "$want" ] || { echo "::error::helm_charts.$chart is missing from manifest.json"; exit 1; }
            echo "$want  $chart-$VERSION.tgz" | sha256sum -c -
          done
      - name: push
        if: steps.enabled.outputs.present == 'true'
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for chart in openlog openlog-agent; do
            helm push "$RUNNER_TEMP/charts/$chart-$VERSION.tgz" "$CHARTS_REPO"
          done
          {
            echo "### Helm charts"
            echo '```sh'
            echo "helm install openlog $CHARTS_REPO/openlog --version $VERSION"
            echo "helm install openlog-agent $CHARTS_REPO/openlog-agent --version $VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Go module tags on the product tag's commit (agents/go/vX.Y.Z, agents/go/instrumentation/<name>/vX.Y.Z).
  # ci.yml release-tag already pushes them with the product tag (this job then only reports them and asks the
  # proxy); for a tag pushed by hand they are pushed here, after the release is published: the Go module proxy
  # caches a version forever, so a module tag must never be moved. Pre-releases (vX.Y.Z-beta.N) are tagged too; Go treats them as
  # pre-release versions that `go get …@latest` skips. Tags pushed with GITHUB_TOKEN trigger no workflow.
  go-agent-tags:
    needs: [prepare, go-agent-modules, release]
    if: needs.go-agent-modules.outputs.prepared == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: push Go module tags
        run: |
          set -euo pipefail
          refs=()
          while read -r tag; do
            remote="$(git ls-remote origin "refs/tags/$tag" |
              awk '$2 ~ /\^\{\}$/ {peeled=$1} $2 !~ /\^\{\}$/ {plain=$1} END {print (peeled != "" ? peeled : plain)}')"
            if [ "$remote" = "$GITHUB_SHA" ]; then
              echo "$tag already points to $GITHUB_SHA"
            elif [ -n "$remote" ]; then
              echo "::error::$tag exists on $remote, not on $GITHUB_SHA; Go module tags must never move"
              exit 1
            else
              git tag "$tag" "$GITHUB_SHA"
              refs+=("refs/tags/$tag")
            fi
          done < <(scripts/go-agent-release.sh tags "$VERSION")
          if [ "${#refs[@]}" -gt 0 ]; then
            git push --atomic origin "${refs[@]}"
          fi
          {
            echo "### Go agent modules"
            echo '```sh'
            while read -r dir; do
              echo "go get github.com/onuragtas/openlog/$dir@v$VERSION"
            done < <(scripts/go-agent-release.sh modules)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agents/go/go.mod
          cache: false
      - name: ask the Go module proxy for the new versions (best effort)
        continue-on-error: true
        run: |
          tmp="$(mktemp -d)"
          while read -r dir; do
            for attempt in 1 2 3 4 5; do
              if GOMODCACHE="$tmp" GOFLAGS=-modcacherw go mod download -json "github.com/onuragtas/openlog/$dir@v$VERSION" >/dev/null; then
                echo "proxy.golang.org serves $dir@v$VERSION"; break
              fi
              echo "attempt $attempt: $dir@v$VERSION not yet available"; sleep $((attempt * 15))
            done
          done < <(scripts/go-agent-release.sh modules)

  # npm package openlog-node (agents/node) at the product version, after the GitHub release is published
  # (docs/operations/releasing.md#nodejs-agent-package): the tarball of node-agent-package, the same file as the
  # release asset. Needs the repository secret NPM_TOKEN; without it the job only warns (the release asset still
  # installs). npm versions are immutable: an already published version is skipped.
  node-agent-npm:
    name: npm publish openlog-node
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - id: token
        name: NPM_TOKEN configured
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::secret NPM_TOKEN is not set; openlog-node $VERSION is not published (docs/operations/releasing.md#nodejs-agent-package)"
          fi
      - name: tarball built by node-agent-package (the GitHub release asset)
        if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-agent
          path: ${{ runner.temp }}/node-agent
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: publish
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/node-agent"
          sha256sum -c ./*.sha256
          if npm view "openlog-node@$VERSION" version >/dev/null 2>&1; then
            echo "openlog-node@$VERSION is already published"
            exit 0
          fi
          tag=latest
          if [ "$CHANNEL" = beta ]; then tag=beta; fi
          npm publish "./openlog-node-$VERSION.tgz" --access public --provenance --tag "$tag"
          echo "### npm" >> "$GITHUB_STEP_SUMMARY"
          echo "\`npm install openlog-node@$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # PyPI package openlog-agent (agents/python, D-073) at the tag version, after the GitHub release is published
  # (docs/operations/releasing.md#python-agent-package). Trusted publishing (OIDC, environment `pypi`), no token
  # secret; skipped with a warning unless the repository variable PYPI_PUBLISH is "true". PyPI versions are
  # immutable: an already published version is skipped.
  python-agent-pypi:
    name: PyPI publish openlog-agent
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/project/openlog-agent/
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PYPI_PUBLISH: ${{ vars.PYPI_PUBLISH }}
    steps:
      - id: enabled
        name: PYPI_PUBLISH configured
        run: |
          if [ "$PYPI_PUBLISH" = true ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::variable PYPI_PUBLISH is not true; openlog-agent $VERSION is not published (docs/operations/releasing.md#python-agent-package)"
          fi
      - name: wheel and sdist built by python-agent-package (the GitHub release assets)
        if: steps.enabled.outputs.present == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-agent
          path: ${{ runner.temp }}/python-agent
      - id: build
        name: checksums, PyPI upload directory
        if: steps.enabled.outputs.present == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/python-agent"
          sha256sum -c ./*.sha256
          whl="$(ls openlog_agent-*-py3-none-any.whl)"
          pyv="${whl#openlog_agent-}"
          pyv="${pyv%-py3-none-any.whl}"
          # only distributions: the .sha256 files are not uploadable
          mkdir -p "$RUNNER_TEMP/pypi"
          cp "$whl" "openlog_agent-$pyv.tar.gz" "$RUNNER_TEMP/pypi/"
          echo "version=$pyv" >> "$GITHUB_OUTPUT"
          if curl -fsS -o /dev/null "https://pypi.org/pypi/openlog-agent/$pyv/json"; then
            echo "openlog-agent $pyv is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        if: steps.enabled.outputs.present == 'true' && steps.build.outputs.publish == 'true'
        with:
          packages-dir: ${{ runner.temp }}/pypi
      - name: summary
        if: steps.enabled.outputs.present == 'true' && steps.build.outputs.publish == 'true'
        env:
          PYV: ${{ steps.build.outputs.version }}
        run: |
          echo "### PyPI" >> "$GITHUB_STEP_SUMMARY"
          echo "\`pip install openlog-agent==$PYV\`" >> "$GITHUB_STEP_SUMMARY"


  # OpenLog.Agent NuGet package (agents/dotnet, D-074) at the tag version, after the GitHub release is published
  # (docs/operations/releasing.md#net-agent-package). Skipped with a warning without the NUGET_API_KEY secret.
  # NuGet versions are immutable: --skip-duplicate makes a re-run safe.
  dotnet-agent-nuget:
    name: NuGet publish OpenLog.Agent
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - id: key
        name: NUGET_API_KEY configured
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::secret NUGET_API_KEY is not set; OpenLog.Agent $VERSION is not published (docs/operations/releasing.md#net-agent-package)"
          fi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.key.outputs.present == 'true'
        with:
          dotnet-version: 8.0.x
      - name: package built by dotnet-agent-package (the GitHub release asset)
        if: steps.key.outputs.present == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-agent
          path: ${{ runner.temp }}/nupkg
      - name: symbols package
        if: steps.key.outputs.present == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-agent-symbols
          path: ${{ runner.temp }}/nupkg
      - name: publish
        if: steps.key.outputs.present == 'true'
        run: |
          (cd "$RUNNER_TEMP/nupkg" && sha256sum -c "OpenLog.Agent.$VERSION.nupkg.sha256")
          # the .snupkg next to the .nupkg is pushed with it
          dotnet nuget push "$RUNNER_TEMP/nupkg/OpenLog.Agent.$VERSION.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          {
            echo "### NuGet"
            echo "\`dotnet add package OpenLog.Agent --version $VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
