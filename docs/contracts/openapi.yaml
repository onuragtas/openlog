          application/json:
            schema: { $ref: "#/components/schemas/OrgQueryLimitsInput" }
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgQueryLimits" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [usage]
      operationId: deleteQueryLimits
      summary: Remove the organization layer (same permission as PUT; audit query_limits.delete)
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgQueryLimits" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

