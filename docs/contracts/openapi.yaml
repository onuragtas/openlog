      tags: [operator]
      operationId: getOperatorOrg
      summary: Organization detail for operators (never secrets)
      responses:
        "200":
          description: Organization detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorOrgDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/operator/orgs/{org}/suspend:
    parameters:
      - { name: org, in: path, required: true, schema: { type: string } }
    post:
      tags: [operator]
      operationId: suspendOrg
      summary: Suspend the organization (audit org.suspend)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorReason" }
      responses:
        "200":
          description: Lifecycle state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgLifecycle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/operator/orgs/{org}/unsuspend:
    parameters:
      - { name: org, in: path, required: true, schema: { type: string } }
    post:
      tags: [operator]
      operationId: unsuspendOrg
      summary: Lift a suspension (audit org.unsuspend; 409 when not suspended)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorReason" }
      responses:
        "200":
          description: Lifecycle state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgLifecycle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/operator/orgs/{org}/trial:
    parameters:
      - { name: org, in: path, required: true, schema: { type: string } }
