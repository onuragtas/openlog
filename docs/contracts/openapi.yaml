openapi: 3.1.0
info:
  title: openlog Query and Management API (M1)
  version: 0.2.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  description: |
    Machine-readable form of [api.md](api.md). The handlers in `internal/api` are the source of truth.
    Times are accepted as RFC3339 or unix milliseconds and returned as RFC3339 with nanoseconds (UTC).
    The tenant is taken from the authenticated session or API key; no endpoint accepts a tenant parameter.
    Users in several organizations select one with the `X-Openlog-Org-Id` header.
    Cookie-authenticated requests with methods other than GET/HEAD/OPTIONS must send `X-CSRF-Token`
    (the `csrf_token` of the Me object).
servers:
  - url: /
security:
  - session: []
  - apiKey: []
tags:
  - name: auth
  - name: sso
    description: Single sign-on (OIDC, SAML 2.0), claimed e-mail domains, role mappings and SCIM tokens (api.md "Single sign-on")
  - name: organization
  - name: keys
  - name: hosts
  - name: metrics
  - name: inventory
  - name: logs
  - name: explorer
    description: Query builder field discovery and saved explorer views (api.md "Fields", "Saved views", D-118, D-119)
  - name: traces
  - name: apm
    description: Application performance monitoring derived from traces (apm.md)
  - name: containers
    description: Containers reported by the infra agent (semantic-conventions.md §2) and their APM services
  - name: costs
    description: >-
      Infrastructure cost estimates by host, service and container, with the idle share (cost.md, D-134).
      Estimates from a static price table, never billing data.
  - name: kubernetes
    description: Kubernetes clusters, nodes, workloads, pods and events (semantic-conventions.md §7)
  - name: fleet
  - name: integrations
  - name: alerts
  - name: slos
    description: Service level objectives, error budgets and burn rates (slo.md, D-125)
  - name: synthetics
    description: Scheduled outside-in checks — HTTP, TCP, DNS and TLS certificates (api.md "Synthetic monitoring", D-132, D-140)
  - name: jobs
    description: Cron and heartbeat monitoring — the job reports, openlog notices the silence (api.md "Job monitoring", D-141)
  - name: vulnerabilities
    description: Vulnerable packages per host, matched from the inventory against an OSV feed (api.md "Vulnerabilities", D-142)
  - name: db
    description: Database query performance monitoring — statements, waits, blocking sessions, plans (db-monitoring.md, D-138)
  - name: rum
    description: >-
      Real user monitoring: page views, Core Web Vitals, sessions and their trace links, collected by the
      browser SDK (rum.md, D-136). Browser errors are not here — they are APM error groups of the browser
      application, read through the APM error inbox.
  - name: cloud
    description: >-
      Managed cloud service metrics: connections to AWS, Azure and GCP accounts, polled by the api leader
      (api.md "Cloud connections", D-135). The collected data points are ordinary rows of `metrics`, read
      through the Metrics Explorer like any other source.
  - name: query
    description: OQL query language (oql.md)
  - name: dashboards
    description: Custom dashboards of OQL widgets
  - name: usage
    description: Usage metering, plans, quotas and billing (usage.md)
  - name: operator
    description: SaaS operator console, organization lifecycle and support access (api.md "SaaS operations")
  - name: privacy
    description: Data exports, account and organization deletion (api.md "Data export and deletion", D-107)
  - name: status
    description: Public status page and its incidents (api.md "Status page", D-108)

paths:
  /api/v1/hosts:
    get:
      tags: [hosts]
      operationId: listHosts
      summary: Hosts seen in the last 24h, ordered by host_name
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [hosts]
                properties:
                  hosts:
                    type: array
                    items: { $ref: "#/components/schemas/Host" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/hosts/{host_id}:
    get:
      tags: [hosts]
      operationId: getHost
      parameters:
        - $ref: "#/components/parameters/HostID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/containers:
    get:
      tags: [containers]
      operationId: listContainers
      description: |
        Containers with data in [from, to] (default last hour), ordered by compose project, compose service and name.
        Filters are exact matches; `compose_project`/`compose_service` present but empty select containers without one.
        `q` matches every term (case-insensitive) against id, name, image, tags, host, compose and Kubernetes names.
        `cpu_utilization`, `memory_usage` and `memory_limit` are the latest bucket of the range; sparklines have ≈ 30 buckets (`step`).
      parameters:
        - name: host_id
          in: query
          schema: { type: string, maxLength: 256 }
        - name: compose_project
          in: query
          schema: { type: string }
        - name: compose_service
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/ContainerStateFilter" }
        - name: q
          in: query
          schema: { type: string, maxLength: 256 }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [containers, total, step]
                properties:
                  containers:
                    type: array
                    items: { $ref: "#/components/schemas/Container" }
                  total: { type: integer, description: "Matching containers before limit" }
                  step: { type: string, example: 120s }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/containers/groups:
    get:
      tags: [containers]
      operationId: listContainerGroups
      description: The containers of `GET /containers` (same filters) grouped by compose project and service.
      parameters:
        - name: host_id
          in: query
          schema: { type: string, maxLength: 256 }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/ContainerStateFilter" }
        - name: q
          in: query
          schema: { type: string, maxLength: 256 }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/ComposeProject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/containers/{container_id}:
    get:
      tags: [containers]
      operationId: getContainer
      description: Latest record of the container (the host it was seen on last, within the 30-day retention); stats over [from, to].
      parameters:
        - $ref: "#/components/parameters/ContainerID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/containers/{container_id}/timeseries:
    get:
      tags: [containers]
      operationId: getContainerTimeseries
      description: |
        Chart series of one container from raw data points (30-day retention). Gauges are averaged per bucket;
        `network_*` and `blockio_*` are per-second rates of the cumulative counters (resets clamp to 0).
      parameters:
        - $ref: "#/components/parameters/ContainerID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: step
          in: query
          description: Go duration >= 10s; default ≈ 300 points
          schema: { type: string, example: 1m }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerTimeseries" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/containers/{container_id}/services:
    get:
      tags: [containers]
      operationId: listContainerServices
      description: APM services whose span resources carried this `container.id` (any time within retention), with RED metrics over [from, to].
      parameters:
        - $ref: "#/components/parameters/ContainerID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/ContainerService" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/costs/summary:
    get:
      tags: [costs]
      operationId: getCostSummary
      summary: Fleet cost over the range, with the idle share
      description: Estimates from a static price table, not billing data. Absent when OPENLOG_COST_ENABLED=false.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [summary, pricing, from, to]
                properties:
                  summary: { $ref: "#/components/schemas/CostSummary" }
                  pricing: { $ref: "#/components/schemas/CostPricing" }
                  from: { type: integer, format: int64, description: Unix milliseconds }
                  to: { type: integer, format: int64, description: Unix milliseconds }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/costs/hosts:
    get:
      tags: [costs]
      operationId: listCostHosts
      summary: Hosts ordered by cost, most expensive first
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [hosts, total, summary, pricing]
                properties:
                  hosts:
                    type: array
                    items: { $ref: "#/components/schemas/CostHost" }
                  total: { type: integer, description: Hosts before limit }
                  summary: { $ref: "#/components/schemas/CostSummary" }
                  pricing: { $ref: "#/components/schemas/CostPricing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/costs/services:
    get:
      tags: [costs]
      operationId: listCostServices
      summary: APM services ordered by cost
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [services, total, summary, pricing]
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/CostService" }
                  total: { type: integer, description: Services before limit }
                  summary: { $ref: "#/components/schemas/CostSummary" }
                  pricing: { $ref: "#/components/schemas/CostPricing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/costs/containers:
    get:
      tags: [costs]
      operationId: listCostContainers
      summary: Containers ordered by cost
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - name: host_id
          in: query
          description: Only containers on this host
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [containers, total, summary, pricing]
                properties:
                  containers:
                    type: array
                    items: { $ref: "#/components/schemas/CostContainer" }
                  total: { type: integer, description: Containers before limit }
                  summary: { $ref: "#/components/schemas/CostSummary" }
                  pricing: { $ref: "#/components/schemas/CostPricing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/costs/hosts/{host_id}:
    get:
      tags: [costs]
      operationId: getCostHost
      summary: One host's cost and what runs on it
      parameters:
        - $ref: "#/components/parameters/HostID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [host, services, containers, pricing, from, to]
                properties:
                  host: { $ref: "#/components/schemas/CostHost" }
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/CostService" }
                  containers:
                    type: array
                    items: { $ref: "#/components/schemas/CostContainer" }
                  pricing: { $ref: "#/components/schemas/CostPricing" }
                  from: { type: integer, format: int64 }
                  to: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/costs/trend:
    get:
      tags: [costs]
      operationId: getCostTrend
      summary: Cost and idle cost per bucket over the range
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: step
          in: query
          description: Go duration, at least 1m. Default ≈ 400 buckets; the range is always capped at 400 buckets.
          schema: { type: string, example: 1h }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [step, points, pricing, from, to]
                properties:
                  step: { type: string, example: 3600s }
                  points:
                    type: array
                    items: { $ref: "#/components/schemas/CostTrendPoint" }
                  pricing: { $ref: "#/components/schemas/CostPricing" }
                  from: { type: integer, format: int64 }
                  to: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/costs/prices:
    get:
      tags: [costs]
      operationId: getCostPrices
      summary: The effective price table (built-in, with the operator's override merged in)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostPriceTable" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/kubernetes/clusters:
    get:
      tags: [kubernetes]
      operationId: listKubernetesClusters
      description: Clusters with data in [from, to] (default last hour), ordered by name. Counts include current objects only (api.md "Kubernetes").
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clusters]
                properties:
                  clusters:
                    type: array
                    items: { $ref: "#/components/schemas/KubernetesCluster" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/kubernetes/clusters/{cluster_uid}:
    get:
      tags: [kubernetes]
      operationId: getKubernetesCluster
      description: A cluster (any time within retention) with workload health by kind, recent Warning events and resource totals over [from, to].
      parameters:
        - $ref: "#/components/parameters/K8sClusterUID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesClusterDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/kubernetes/nodes:
    get:
      tags: [kubernetes]
      operationId: listKubernetesNodes
      description: Nodes seen in [from, to], ordered by cluster name and node name. `q` matches every term against name, uid, cluster, roles, IP, kubelet version and OS image.
      parameters:
        - { name: cluster_uid, in: query, schema: { type: string, maxLength: 256 } }
        - { name: q, in: query, schema: { type: string, maxLength: 256 } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [nodes, total]
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/KubernetesNode" }
                  total: { type: integer, description: "Matching nodes before limit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/kubernetes/workloads:
    get:
      tags: [kubernetes]
      operationId: listKubernetesWorkloads
      description: Workloads seen in [from, to], ordered by cluster name, namespace, kind and name; sparklines have ≈ 30 buckets (`step`).
      parameters:
        - { name: cluster_uid, in: query, schema: { type: string, maxLength: 256 } }
        - { name: namespace, in: query, schema: { type: string, maxLength: 256 } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/KubernetesWorkloadKind" } }
        - { name: health, in: query, schema: { $ref: "#/components/schemas/KubernetesWorkloadHealth" } }
        - { name: q, in: query, schema: { type: string, maxLength: 256 } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [workloads, total, step]
                properties:
                  workloads:
                    type: array
                    items: { $ref: "#/components/schemas/KubernetesWorkload" }
                  total: { type: integer, description: "Matching workloads before limit" }
                  step: { type: string, example: 120s }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/kubernetes/workloads/{cluster_uid}/{namespace}/{kind}/{name}:
    get:
      tags: [kubernetes]
      operationId: getKubernetesWorkload
      description: A workload (any time within retention) with its pods seen in [from, to], its HPA and latest status attributes.
      parameters:
        - $ref: "#/components/parameters/K8sClusterUID"
        - $ref: "#/components/parameters/K8sNamespace"
        - $ref: "#/components/parameters/K8sWorkloadKind"
        - $ref: "#/components/parameters/K8sWorkloadName"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesWorkloadDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/kubernetes/workloads/{cluster_uid}/{namespace}/{kind}/{name}/timeseries:
    get:
      tags: [kubernetes]
      operationId: getKubernetesWorkloadTimeseries
      parameters:
        - $ref: "#/components/parameters/K8sClusterUID"
        - $ref: "#/components/parameters/K8sNamespace"
        - $ref: "#/components/parameters/K8sWorkloadKind"
        - $ref: "#/components/parameters/K8sWorkloadName"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: step, in: query, description: "Go duration >= 10s; default ≈ 300 points", schema: { type: string, example: 1m } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesWorkloadTimeseries" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/kubernetes/pods:
    get:
      tags: [kubernetes]
      operationId: listKubernetesPods
      description: Pods seen in [from, to], ordered by cluster name, namespace and pod name.
      parameters:
        - { name: cluster_uid, in: query, schema: { type: string, maxLength: 256 } }
        - { name: namespace, in: query, schema: { type: string, maxLength: 256 } }
        - { name: node, in: query, schema: { type: string, maxLength: 256 } }
        - { name: workload_kind, in: query, schema: { $ref: "#/components/schemas/KubernetesWorkloadKind" } }
        - { name: workload_name, in: query, schema: { type: string, maxLength: 256 } }
        - { name: phase, in: query, schema: { $ref: "#/components/schemas/KubernetesPodPhase" } }
        - { name: q, in: query, schema: { type: string, maxLength: 256 } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pods, total]
                properties:
                  pods:
                    type: array
                    items: { $ref: "#/components/schemas/KubernetesPod" }
                  total: { type: integer, description: "Matching pods before limit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/kubernetes/pods/{pod_uid}:
    get:
      tags: [kubernetes]
      operationId: getKubernetesPod
      description: A pod (any time within retention) with its containers, labels, APM services and node host.
      parameters:
        - $ref: "#/components/parameters/K8sPodUID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesPodDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/kubernetes/pods/{pod_uid}/timeseries:
    get:
      tags: [kubernetes]
      operationId: getKubernetesPodTimeseries
      parameters:
        - $ref: "#/components/parameters/K8sPodUID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: step, in: query, description: "Go duration >= 10s; default ≈ 300 points", schema: { type: string, example: 1m } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesPodTimeseries" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/kubernetes/pods/{pod_uid}/events:
    get:
      tags: [kubernetes]
      operationId: listKubernetesPodEvents
      description: Events whose involved object is the pod, newest first.
      parameters:
        - $ref: "#/components/parameters/K8sPodUID"
        - { name: type, in: query, schema: { $ref: "#/components/schemas/KubernetesEventType" } }
        - { name: reason, in: query, schema: { type: string, maxLength: 256 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesEventList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/kubernetes/events:
    get:
      tags: [kubernetes]
      operationId: listKubernetesEvents
      description: |
        Kubernetes events (log records with event_name `k8s.event`) in [from, to], newest first. Updates of one event
        (same `k8s.event.uid`) are returned once, as the latest record. Limit above 1000 is capped.
      parameters:
        - { name: cluster_uid, in: query, schema: { type: string, maxLength: 256 } }
        - { name: namespace, in: query, schema: { type: string, maxLength: 256 } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/KubernetesEventType" } }
        - { name: object_kind, in: query, schema: { type: string, maxLength: 256 } }
        - { name: object_name, in: query, schema: { type: string, maxLength: 256 } }
        - { name: object_uid, in: query, schema: { type: string, maxLength: 256 } }
        - { name: reason, in: query, schema: { type: string, maxLength: 256 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesEventList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/apm/services/{service_name}/kubernetes:
    get:
      tags: [apm, kubernetes]
      operationId: listApmServiceKubernetesPods
      description: |
        Pods of the service seen in [from, to]: pods whose containers carried the service's container ids
        (apm_service_containers, since `from`) or whose uid the service's spans carried as resource `k8s.pod.uid`.
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pods]
                properties:
                  pods:
                    type: array
                    items: { $ref: "#/components/schemas/KubernetesServicePod" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/metrics/names:
    get:
      tags: [metrics]
      operationId: listMetricNames
      parameters:
        - name: host_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [names]
                properties:
                  names:
                    type: array
                    items: { $ref: "#/components/schemas/MetricMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/hosts/{host_id}/metrics:
    get:
      tags: [metrics]
      operationId: getHostMetrics
      description: |
        Time series of one metric on one host. `rate` = per-second increase per series per step (counter resets
        clamp to 0), then summed across merged series. Ranges longer than 6h read from the 1-minute rollup.
        A host id without a host record in the caller's organization (unknown, or another organization's host)
        returns 404. An unknown metric on a known host returns 200 with empty `series` and empty
        `metric.type`/`metric.unit`.
      parameters:
        - $ref: "#/components/parameters/HostID"
        - name: name
          in: query
          required: true
          schema: { type: string }
          example: system.cpu.utilization
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: step
          in: query
          description: Go duration, minimum 10s. Default ≈ 300 points, rounded up to 10s (1m on rollup ranges).
          schema: { type: string, example: 60s }
        - name: agg
          in: query
          description: Default `avg` for gauges, `rate` for monotonic sums, `last` for non-monotonic sums.
          schema: { $ref: "#/components/schemas/Aggregation" }
        - name: group_by
          in: query
          description: |
            Comma-separated attribute keys; series are merged by these keys. Default all attributes.
            `resource.<key>` (allowlisted keys as for `resource` filters) groups by a resource attribute; the series
            attributes then contain `resource.<key>`.
          schema: { type: string, example: cpu.mode }
        - name: resource
          in: query
          style: form
          explode: true
          description: |
            `resource.<key>=<value>`: exact-match resource attribute filters (AND-ed, one value per key, at most 4).
            Allowed keys: `openlog.discovery.id`, `openlog.discovery.instance`, `openlog.integration.id`,
            `service.instance.id`, `server.address`, `server.port`, `postgresql.database.name`,
            `postgresql.table.name`, `postgresql.index.name`. Other keys, empty/repeated values or values over
            1024 bytes → 400. Requests with resource filters or resource groupings read raw data points (no rollup).
          schema:
            type: object
            additionalProperties: { type: string }
          example: { "resource.openlog.discovery.id": redis, "resource.openlog.discovery.instance": /usr/bin/redis-server }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricSeriesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/hosts/{host_id}/inventory:
    get:
      tags: [inventory]
      operationId: getHostInventory
      description: |
        Items of the host's latest complete snapshot. A known host without a complete snapshot returns 200 with
        `snapshot_id: ""`, `snapshot_time: null` and empty `items`. A host id without a host record in the
        caller's organization returns 404.
      parameters:
        - $ref: "#/components/parameters/HostID"
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/InventoryCategory" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/hosts/{host_id}/services:
    get:
      tags: [inventory]
      operationId: getHostServices
      description: Shortcut for `category=discovered_service`; `data` is the discovered service body. Unknown host → 404.
      parameters:
        - $ref: "#/components/parameters/HostID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/inventory/search:
    get:
      tags: [inventory]
      operationId: searchInventory
      description: Items in `category` whose key contains `q` (case-insensitive) across all hosts' latest snapshots, ordered by key then host.
      parameters:
        - name: category
          in: query
          required: true
          schema: { $ref: "#/components/schemas/InventoryCategory" }
        - name: q
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InventorySearchItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/logs:
    get:
      tags: [logs]
      operationId: listLogs
      description: |
        Excludes inventory events. `q` is a case-insensitive substring match on body. Newest first.
        `attr.<key>=<value>` parameters are exact-match filters on log record attributes; only the keys listed
        below are accepted (any other `attr.*` key, an empty or repeated value, or a value over 1024 bytes → 400).
        Infra agent log records have an empty `service_name`; filter them with `host_id` and these attributes.
      parameters:
        - name: host_id
          in: query
          schema: { type: string }
        - name: service
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: severity_min
          in: query
          description: Severity number 1-24 or a name (TRACE, DEBUG, INFO, WARN, WARNING, ERROR, FATAL).
          schema: { type: string, example: WARN }
        - name: trace_id
          in: query
          schema: { type: string }
        - name: attr.openlog.log.source
          in: query
          description: "`file`, `journald` or `container`"
          schema: { type: string, example: file }
        - name: container_id
          in: query
          description: Container logs (resource attribute `container.id`)
          schema: { type: string }
        - name: k8s_pod_uid
          in: query
          description: Kubernetes pod logs (resource attribute `k8s.pod.uid`)
          schema: { type: string }
        - name: compose_service
          in: query
          description: Resource attribute `docker.compose.service`
          schema: { type: string }
        - name: compose_project
          in: query
          description: Resource attribute `docker.compose.project`
          schema: { type: string }
        - name: attr.log.iostream
          in: query
          description: "Container logs: `stdout` or `stderr`"
          schema: { type: string, example: stderr }
        - name: attr.log.file.path
          in: query
          schema: { type: string, example: /var/log/nginx/access.log }
        - name: attr.log.file.name
          in: query
          schema: { type: string, example: access.log }
        - name: attr.openlog.discovery.id
          in: query
          description: Discovery rule id of the service whose log glob matched the file.
          schema: { type: string, example: nginx }
        - name: attr.openlog.systemd.unit
          in: query
          schema: { type: string, example: nginx.service }
        - name: attr.openlog.syslog.identifier
          in: query
          schema: { type: string, example: sshd }
        - name: span_id
          in: query
          description: Log records of one span (16 hex characters, case-insensitive)
          schema: { type: string }
        - name: transaction
          in: query
          description: With transaction_service, log records of the traces of that transaction (its entry spans in the range, at most 10000 traces)
          schema: { type: string }
        - name: transaction_service
          in: query
          description: service.name of `transaction`
          schema: { type: string }
        - name: cursor
          in: query
          description: next_cursor of the previous page (opaque). Send the same filters, from and to; a cursor overrides nothing else.
          schema: { type: string }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [logs, next_cursor]
                properties:
                  logs:
                    type: array
                    items: { $ref: "#/components/schemas/LogRecord" }
                  next_cursor:
                    description: Cursor of the next (older) page; null when this page is the last one
                    oneOf:
                      - { type: string }
                      - { type: "null" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/fields/keys:
    get:
      tags: [explorer]
      operationId: listFieldKeys
      description: |
        Attribute keys of one signal for query builders (api.md "Fields"). Top-level fields are always listed first
        (`source: field`); attribute and resource keys come from the hourly key index (ClickHouse `attribute_keys`,
        D-118) over the range, or — when the index has no rows for the range, e.g. right after an upgrade — from a
        sample of at most 20000 recent records (`sampled: true`). `logs` also lists top-level keys of JSON bodies
        (`source: body`, sampled). Ordered by frequency; `q` is a case-insensitive substring of the key.
      parameters:
        - $ref: "#/components/parameters/FieldSignal"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: q
          in: query
          schema: { type: string, maxLength: 256 }
        - name: metric
          in: query
          description: "`signal=metrics`: keys of this metric only"
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldKeysResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: resource_exhausted (query exceeded an organization limit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/fields/values:
    get:
      tags: [explorer]
      operationId: listFieldValues
      description: |
        Most frequent values of one key with counts, read from a sample of at most 100000 matching records of the
        range (`sampled: true` when the sample was full). `filters`, `groups`, `q` and the explorer conditions
        (`body_q`, `transaction`/`transaction_service` for logs, `root_only` for traces) restrict the records; a
        condition on `key` itself is ignored so the other values stay visible. `total` = records counted.
      parameters:
        - $ref: "#/components/parameters/FieldSignal"
        - name: key
          in: query
          required: true
          schema: { type: string, maxLength: 256 }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: q
          in: query
          description: Case-insensitive substring of the value
          schema: { type: string, maxLength: 256 }
        - name: metric
          in: query
          description: "`signal=metrics`: values of this metric only"
          schema: { type: string, maxLength: 512 }
        - name: filters
          in: query
          description: JSON array of QueryFilter
          schema: { type: string, maxLength: 16384 }
        - name: groups
          in: query
          description: JSON array of QueryFilter arrays (OR of AND-groups)
          schema: { type: string, maxLength: 16384 }
        - name: body_q
          in: query
          description: "`signal=logs`: case-insensitive substring of the body"
          schema: { type: string, maxLength: 1024 }
        - name: transaction
          in: query
          description: "`signal=logs`: APM transaction name (with `transaction_service`)"
          schema: { type: string, maxLength: 4096 }
        - name: transaction_service
          in: query
          description: "`signal=logs`: service of `transaction`"
          schema: { type: string, maxLength: 512 }
        - name: root_only
          in: query
          description: "`signal=traces`: root spans only"
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldValuesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: resource_exhausted (query exceeded an organization limit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/logs/query:
    post:
      tags: [logs]
      operationId: queryLogs
      description: |
        Structured log search (Logs Explorer, api.md "Logs"): `filters` are AND-ed, `groups` are OR-ed AND-groups,
        `q` is a case-insensitive body substring. Rows carry the core fields, the requested `columns` in `fields`
        and — with `include_record` — the attribute maps. Paging as GET /api/v1/logs (`cursor`), in `order`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogsQueryRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogsQueryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: resource_exhausted (query exceeded an organization limit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/logs/aggregate:
    post:
      tags: [logs]
      operationId: aggregateLogs
      description: |
        Log volume over time for the same filter model as POST /api/v1/logs/query: record counts per `step`
        bucket, optionally split by `group_by` into the `limit` most frequent values plus an `other` series.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogsAggregateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogsAggregateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: resource_exhausted (query exceeded an organization limit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/logs/patterns:
    post:
      tags: [logs]
      operationId: logPatterns
      description: |
        The distinct messages behind the matching records (Logs Explorer "Patterns", api.md "Logs", D-128). The
        processor masks the variable parts of every log body into a template, so this groups the same filter model as
        POST /api/v1/logs/query by pattern, ordered by record count. `pattern_id` is a 64-bit id as a string and is
        itself a filter key, so the records of one pattern are listed with a `pattern_id` condition. A request
        restricted only by its time range and covering at least 6 hours is answered from the hourly rollup
        (`rollup: true`, whole hours); everything else reads the raw table exactly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogsPatternsRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogsPatternsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: resource_exhausted (query exceeded an organization limit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/metrics:
    get:
      tags: [metrics]
      operationId: listMetrics
      description: |
        Every metric name with data points in the range, from any resource (Metrics Explorer). Ranges up to 6h read
        raw data points; longer ranges read the 1-minute rollup for gauges and sums (no description/temporality) plus
        the raw points of the last 6h for other types. `q`: case-insensitive substring of the name.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: q
          in: query
          schema: { type: string, maxLength: 256 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricListResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: resource_exhausted (query exceeded an organization limit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/metrics/query:
    post:
      tags: [metrics]
      operationId: queryMetric
      description: |
        Time series of any metric with the query builder filter model. Aggregations by type: gauges and
        non-monotonic sums `avg` `min` `max` `sum` `last` `count`; monotonic sums `rate` `increase` `sum` `last`;
        histograms and exponential histograms `p50` `p75` `p90` `p95` `p99` (linear interpolation inside
        buckets) `avg` `count` `sum` `rate`; summaries `p50`…`p99` (stored quantiles, averaged) `avg` `count` `sum`.
        At most `limit` series (`truncated`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetricQueryRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricQueryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: resource_exhausted (query exceeded an organization limit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/metrics/exemplars:
    post:
      tags: [metrics]
      operationId: metricExemplars
      description: |
        The traces behind a metric's data points (exemplars, D-130), so a spike in a chart can be opened as a trace.
        `filters` and `groups` are the conditions of `POST /api/v1/metrics/query` with the same keys, so the
        exemplars belong to the series the chart drew. Results are spread over the range: it is divided into `limit`
        buckets (at least 10s) and the largest-valued exemplar of each is returned, in time order. Exemplars follow
        the trace retention (7 days by default), not the metric retention; summary data points carry none.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetricExemplarsRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricExemplarsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: resource_exhausted (query exceeded an organization limit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/metrics/{name}:
    get:
      tags: [metrics]
      operationId: getMetric
      description: |
        Metadata of one metric in the range with its attribute and resource keys. The name may contain `/`
        (URL-encode other reserved characters). `404` when the metric has no data points in the range.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, maxLength: 512 }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/saved-views:
    get:
      tags: [explorer]
      operationId: listSavedViews
      description: |
        Saved explorer views of the organization the caller may read (org-wide views and own private views).
        PostgreSQL auth mode only (404 otherwise).
      parameters:
        - name: signal
          in: query
          schema: { $ref: "#/components/schemas/SavedViewSignal" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [views]
                properties:
                  views:
                    type: array
                    items: { $ref: "#/components/schemas/SavedView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [explorer]
      operationId: createSavedView
      description: Signed-in members and higher. At most 500 views per organization.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedViewInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/saved-views/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [explorer]
      operationId: getSavedView
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [explorer]
      operationId: updateSavedView
      description: The creator, or an admin/owner for org-wide views.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedViewInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [explorer]
      operationId: deleteSavedView
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/traces/query:
    post:
      tags: [traces]
      operationId: queryTraces
      description: |
        Structured span search (Traces Explorer, api.md "Traces", D-122): `filters`/`groups` of QueryFilter on signal
        `traces`, `root_only`, paging by `cursor` in `order`, or `sort=duration` for the slowest spans in one page.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TracesQueryRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TracesQueryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: resource_exhausted (query exceeded an organization limit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/traces/aggregate:
    post:
      tags: [traces]
      operationId: aggregateTraces
      description: |
        Span counts per bucket (as POST /api/v1/logs/aggregate) plus p50/p95/p99 span duration in milliseconds per
        bucket for the same conditions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TracesAggregateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TracesAggregateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: resource_exhausted (query exceeded an organization limit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/traces/{trace_id}:
    get:
      tags: [traces]
      operationId: getTrace
      parameters:
        - name: trace_id
          in: path
          required: true
          description: 32 hex characters (case-insensitive).
          schema: { type: string, pattern: "^[0-9a-fA-F]{32}$" }
      responses:
        "200":
          description: All spans of the trace ordered by start time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "504": { $ref: "#/components/responses/Timeout" }

  # ---------------------------------------------------------------- apm (apm.md)
  /api/v1/apm/services:
    get:
      tags: [apm]
      operationId: listApmServices
      summary: Services with spans since `from`, with RED metrics, Apdex and a throughput sparkline
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/ApmStep"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - { name: q, in: query, description: Case-insensitive substring of the service name, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [services, step]
                properties:
                  step: { type: string, example: 60s }
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/ApmService" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/apm/services/{service_name}:
    get:
      tags: [apm]
      operationId: getApmService
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
      responses:
        "200":
          description: Service identity, instances (namespace/environment), hosts and Apdex T
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApmServiceDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apm/services/{service_name}/overview:
    get:
      tags: [apm]
      operationId: getApmServiceOverview
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/ApmStep"
        - { name: transaction, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/ApmTransactionType" } }
      responses:
        "200":
          description: Totals and timeseries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApmOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/services/{service_name}/transactions:
    get:
      tags: [apm]
      operationId: listApmTransactions
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: sort, in: query, schema: { type: string, enum: [time, throughput, slowest, errors], default: time } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/ApmTransactionType" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: object
                required: [transactions, apdex_t_ms]
                properties:
                  apdex_t_ms: { type: number }
                  transactions:
                    type: array
                    items: { $ref: "#/components/schemas/ApmTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/services/{service_name}/transaction:
    get:
      tags: [apm]
      operationId: getApmTransaction
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/ApmTransactionType" } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/ApmStep"
      responses:
        "200":
          description: Totals, timeseries, latency histogram and the slowest traces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApmTransactionDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/services/{service_name}/errors:
    get:
      tags: [apm]
      operationId: listApmErrorGroups
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/ApmStep"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - $ref: "#/components/parameters/ApmErrorStatus"
        - $ref: "#/components/parameters/ApmErrorAssignee"
        - $ref: "#/components/parameters/ApmErrorQuery"
        - $ref: "#/components/parameters/ApmErrorSort"
      responses:
        "200":
          description: Error inbox of the service (groups with occurrences in the range, plus groups whose workflow state matches the filter)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApmErrorInbox" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/services/{service_name}/errors/{group_id}:
    get:
      tags: [apm]
      operationId: getApmErrorGroup
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - { name: group_id, in: path, required: true, schema: { type: string, pattern: "^[0-9a-fA-F]{16}$" } }
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/ApmStep"
      responses:
        "200":
          description: Group detail with stack trace, series and sample error spans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApmErrorGroupDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apm/errors:
    get:
      tags: [apm]
      operationId: listApmErrorInbox
      description: Error inbox across services (apm.md §3.4); `service`, `namespace` and `environment` narrow it.
      parameters:
        - { name: service, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/ApmStep"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - $ref: "#/components/parameters/ApmErrorStatus"
        - $ref: "#/components/parameters/ApmErrorAssignee"
        - $ref: "#/components/parameters/ApmErrorQuery"
        - $ref: "#/components/parameters/ApmErrorSort"
      responses:
        "200":
          description: Error groups with workflow state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApmErrorInbox" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/errors/groups:
    patch:
      tags: [apm]
      operationId: updateApmErrorGroups
      description: |
        Bulk status and assignee change (signed-in member, admin or owner; API keys 403). Writes the audit event
        apm.error_group.update per changed group. 404 when a group id is unknown; not available in static auth mode.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApmErrorGroupPatch" }
      responses:
        "200":
          description: The states after the change
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/ApmErrorGroupState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apm/errors/groups/{group_id}/comments:
    get:
      tags: [apm]
      operationId: listApmErrorComments
      parameters:
        - $ref: "#/components/parameters/ApmGroupID"
      responses:
        "200":
          description: Comments, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/ApmErrorComment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [apm]
      operationId: addApmErrorComment
      description: Signed-in member or above; audit event apm.error_group.comment.
      parameters:
        - $ref: "#/components/parameters/ApmGroupID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApmErrorCommentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApmErrorComment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apm/errors/groups/{group_id}/comments/{comment_id}:
    delete:
      tags: [apm]
      operationId: deleteApmErrorComment
      description: The author, or an admin/owner, deletes a comment (audit event apm.error_group.comment_delete).
      parameters:
        - $ref: "#/components/parameters/ApmGroupID"
        - { name: comment_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apm/services/{service_name}/deployments:
    get:
      tags: [apm]
      operationId: listApmDeployments
      description: service.version changes in the range (apm.md §12), oldest first.
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: gap, in: query, description: "Absence after which a version counts as deployed again (5m-24h)", schema: { type: string, default: 30m } }
      responses:
        "200":
          description: Deployments
          content:
            application/json:
              schema:
                type: object
                required: [deployments, gap_seconds]
                properties:
                  gap_seconds: { type: integer }
                  deployments:
                    type: array
                    items: { $ref: "#/components/schemas/ApmDeployment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/services/{service_name}/deployments/compare:
    get:
      tags: [apm]
      operationId: compareApmDeployment
      description: RED and Apdex of [at − window, at) against [at, at + window) (capped at now), and error groups first seen after at.
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - { name: at, in: query, required: true, description: RFC3339 or unix milliseconds (truncated to the minute), schema: { type: string } }
        - { name: window, in: query, description: "5m-24h", schema: { type: string, default: 30m } }
      responses:
        "200":
          description: Before/after comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApmDeploymentCompare" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/services/{service_name}/databases:
    get:
      tags: [apm]
      operationId: listApmDatabaseQueries
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: sort, in: query, schema: { type: string, enum: [time, calls, slowest, errors], default: time } }
        - { name: db_system, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Normalized database statements
          content:
            application/json:
              schema:
                type: object
                required: [queries]
                properties:
                  queries:
                    type: array
                    items: { $ref: "#/components/schemas/ApmDbQuery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/services/{service_name}/hosts:
    get:
      tags: [apm]
      operationId: listApmServiceHosts
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
      responses:
        "200":
          description: Hosts whose resources carried host.id for this service
          content:
            application/json:
              schema:
                type: object
                required: [hosts]
                properties:
                  hosts:
                    type: array
                    items: { $ref: "#/components/schemas/ApmServiceHost" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/services/{service_name}/containers:
    get:
      tags: [apm, containers]
      operationId: listApmServiceContainers
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Containers whose span resources carried container.id for this service since `from`, newest first
          content:
            application/json:
              schema:
                type: object
                required: [containers]
                properties:
                  containers:
                    type: array
                    items: { $ref: "#/components/schemas/ApmServiceContainer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/services/{service_name}/settings:
    get:
      tags: [apm]
      operationId: getApmServiceSettings
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
      responses:
        "200":
          description: Effective settings (default when no row applies)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApmSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      tags: [apm]
      operationId: putApmServiceSettings
      description: Signed-in admin or owner; audit event apm.service_settings.update. Not available in static auth mode (404).
      parameters:
        - $ref: "#/components/parameters/ApmServiceName"
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApmSettingsInput" }
      responses:
        "200":
          description: Stored settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApmSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apm/sampling:
    get:
      tags: [apm]
      operationId: getTailSamplingPolicy
      description: >-
        The organization's tail sampling policy (D-075, apm.md §4.2). `is_default` when none is stored (the sampler then
        uses OPENLOG_TAILSAMPLING_DEFAULT_POLICY). `enabled` reports OPENLOG_TAILSAMPLING_ENABLED of this api.
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TailSamplingPolicyState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      tags: [apm]
      operationId: putTailSamplingPolicy
      description: >-
        Signed-in admin or owner; audit event apm.tail_sampling.update. `version` is the version that was edited
        (0 when none is stored); a different stored version answers 409. Not available in static auth mode (404).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TailSamplingPolicyInput" }
      responses:
        "200":
          description: Stored policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TailSamplingPolicyState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/apm/sampling/preview:
    post:
      tags: [apm]
      operationId: previewTailSamplingPolicy
      description: >-
        Estimates what a (not yet saved) policy keeps, from the traces stored in the last `window_minutes` (default 60,
        at most 1440). Every stored trace counts with its adjusted count (sample_weight), so the ratios refer to the
        original traffic; at most 20000 traces are examined (hash sample of trace ids). Rate limits are not simulated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy]
              properties:
                policy: { $ref: "#/components/schemas/TailSamplingPolicy" }
                window_minutes: { type: integer, minimum: 1, maximum: 1440 }
      responses:
        "200":
          description: Estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TailSamplingPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/hosts/{host_id}/services:
    get:
      tags: [apm]
      operationId: listApmHostServices
      parameters:
        - $ref: "#/components/parameters/HostID"
        - { name: from, in: query, description: Default 24h ago, schema: { type: string } }
      responses:
        "200":
          description: Services running on the host
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/ApmHostService" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/map:
    get:
      tags: [apm]
      operationId: getApmServiceMap
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: service, in: query, description: Only edges touching this service, schema: { type: string } }
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
      responses:
        "200":
          description: Service map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApmMap" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/map/path:
    get:
      tags: [apm]
      operationId: getApmMapPath
      description: Service map node and edge ids (as in GET /apm/map) used by up to 50 traces of a transaction.
      parameters:
        - { name: service, in: query, required: true, schema: { type: string } }
        - { name: transaction, in: query, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Path of the transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApmMapPath" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/traces:
    get:
      tags: [apm]
      operationId: searchApmTraces
      description: |
        Entry spans in the range. `attr.<key>=<value>` (not listed as a parameter) filters on span attributes
        (at most 10, exact match).
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: service, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - { name: transaction, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/ApmTransactionType" } }
        - { name: min_duration_ms, in: query, schema: { type: number, minimum: 0 } }
        - { name: max_duration_ms, in: query, schema: { type: number, minimum: 0 } }
        - { name: error, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [timestamp, duration], default: timestamp } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200":
          description: Matching entry spans
          content:
            application/json:
              schema:
                type: object
                required: [traces]
                properties:
                  traces:
                    type: array
                    items: { $ref: "#/components/schemas/ApmTraceResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/apm/agents:
    get:
      tags: [apm]
      operationId: listApmAgents
      summary: Language agents and versions per service, compared with the newest release (D-124)
      description: |
        Language agents reporting each service since `from` (hourly aggregate of the span resource: telemetry.distro.*,
        telemetry.sdk.*), versions with distinct instances, and the comparison with the newest verified release of the
        organization's fleet channel. Agents are application dependencies and never update themselves; `upgrade`
        carries the command. Without a release catalog (`release.catalog` disabled or unavailable) every status of an
        openlog agent is `unknown`.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: service, in: query, description: Exact service name, schema: { type: string } }
        - $ref: "#/components/parameters/ApmNamespace"
        - $ref: "#/components/parameters/ApmEnvironment"
        - { name: upgrade, in: query, description: "false omits upgrade instructions (no registry checks)", schema: { type: boolean, default: true } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [release, services]
                properties:
                  release: { $ref: "#/components/schemas/ApmAgentRelease" }
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/ApmServiceAgents" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  # ---------------------------------------------------------------- service level objectives
  /api/v1/slos:
    get:
      tags: [slos]
      operationId: listSlos
      description: >-
        SLOs of the organization ordered by name (slo.md §1). Each carries the budget over its rolling window
        unless `status=false`; the status of at most 50 SLOs is computed (`status_truncated` for the rest).
      parameters:
        - { name: status, in: query, schema: { type: boolean, default: true }, description: Compute the current budget }
      responses:
        "200":
          description: SLOs with their current error budget
          content:
            application/json:
              schema:
                type: object
                required: [slos, status_truncated]
                properties:
                  slos:
                    type: array
                    items: { $ref: "#/components/schemas/SloListItem" }
                  status_truncated: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "504": { $ref: "#/components/responses/Timeout" }
    post:
      tags: [slos]
      operationId: createSlo
      description: Signed-in member or higher; audit event slo.create. Not available in static auth mode (404).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SloInput" }
      responses:
        "201":
          description: Created SLO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Slo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/slos/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [slos]
      operationId: getSlo
      responses:
        "200":
          description: SLO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Slo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [slos]
      operationId: updateSlo
      description: Full replacement; signed-in member or higher; audit event slo.update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SloInput" }
      responses:
        "200":
          description: Updated SLO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Slo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [slos]
      operationId: deleteSlo
      description: Signed-in member or higher; audit event slo.delete. slo_burn rules keep their (now dangling) slo_id.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/slos/{id}/results:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [slos]
      operationId: getSloResults
      description: >-
        Budget over the SLO's rolling window ending at the last complete minute, the burn-rate windows of the
        slo_burn defaults (14.4× over 1 h/5 m, 6× over 6 h/30 m) and the burndown series (slo.md §2).
      parameters:
        - name: step
          in: query
          schema: { type: string }
          description: Bucket width of the series as a Go duration (≥ 60s, rounded up to whole minutes)
      responses:
        "200":
          description: Status, burn rates and series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SloResults" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/Timeout" }

  # ---------------------------------------------------------------- synthetics
  /api/v1/vulnerabilities:
    get:
      tags: [vulnerabilities]
      operationId: listVulnerabilities
      description: >-
        The open findings of the organization grouped by advisory, most serious first and, within a
        severity, the advisory affecting the most hosts first (api.md "Vulnerabilities").
      parameters:
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/VulnSeverity" } }
        - { name: host_id, in: query, schema: { type: string }, description: Only the findings of this host }
      responses:
        "200":
          description: Advisories with the number of hosts each affects
          content:
            application/json:
              schema:
                type: object
                required: [vulnerabilities, severity_counts]
                properties:
                  vulnerabilities:
                    type: array
                    items: { $ref: "#/components/schemas/VulnGroup" }
                  severity_counts:
                    type: object
                    additionalProperties: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/vulnerabilities/catalog/status:
    get:
      tags: [vulnerabilities]
      operationId: getVulnerabilityCatalogStatus
      description: >-
        What the catalog holds and when each ecosystem was last synced, so "no findings" can be told from
        "the feed never synced".
      responses:
        "200":
          description: Catalog status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnCatalogStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/vulnerabilities/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "The advisory id (CVE-…, DSA-…, GHSA-…)" }
    get:
      tags: [vulnerabilities]
      operationId: getVulnerability
      description: The hosts one advisory was found on, with the installed and the fixed version of each.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 } }
      responses:
        "200":
          description: Findings of the advisory
          content:
            application/json:
              schema:
                type: object
                required: [vuln_id, findings]
                properties:
                  vuln_id: { type: string }
                  findings:
                    type: array
                    items: { $ref: "#/components/schemas/VulnFinding" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/hosts/{host_id}/vulnerabilities:
    parameters:
      - { name: host_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [vulnerabilities]
      operationId: getHostVulnerabilities
      description: The open findings of one host, most serious first.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 } }
      responses:
        "200":
          description: Findings of the host
          content:
            application/json:
              schema:
                type: object
                required: [host_id, findings]
                properties:
                  host_id: { type: string }
                  findings:
                    type: array
                    items: { $ref: "#/components/schemas/VulnFinding" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/monitors:
    get:
      tags: [jobs]
      operationId: listJobMonitors
      description: >-
        Cron and heartbeat monitors of the organization ordered by name, each with its current state and,
        unless `summary=false`, the outcome of its runs over the last 7 days (api.md "Job monitoring").
      parameters:
        - { name: summary, in: query, schema: { type: boolean, default: true }, description: Summarize the last 7 days of runs }
      responses:
        "200":
          description: Monitors with their state
          content:
            application/json:
              schema:
                type: object
                required: [monitors]
                properties:
                  monitors:
                    type: array
                    items: { $ref: "#/components/schemas/JobMonitor" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "504": { $ref: "#/components/responses/Timeout" }
    post:
      tags: [jobs]
      operationId: createJobMonitor
      description: >-
        Signed-in member or higher; audit event job_monitor.create. Not available in static auth mode (404).
        At most 200 monitors per organization (409). The response carries the ping URL the job calls.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobMonitorInput" }
      responses:
        "201":
          description: Created monitor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobMonitor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/jobs/monitors/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [jobs]
      operationId: getJobMonitor
      responses:
        "200":
          description: Monitor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobMonitor" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [jobs]
      operationId: updateJobMonitor
      description: >-
        Full replacement; signed-in member or higher; audit event job_monitor.update. The ping token is
        unchanged, so the crontab that uses it keeps working.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobMonitorInput" }
      responses:
        "200":
          description: Updated monitor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobMonitor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [jobs]
      operationId: deleteJobMonitor
      description: >-
        Signed-in member or higher; audit event job_monitor.delete. The state row goes with the monitor; the
        stored runs stay in ClickHouse until their TTL expires.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/monitors/{id}/rotate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [jobs]
      operationId: rotateJobMonitorToken
      description: >-
        Issue a new ping token for a monitor whose URL leaked; audit event job_monitor.rotate_token. The old
        URL stops working at once, so the crontab has to be updated with the new one.
      responses:
        "200":
          description: Monitor with its new ping URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobMonitor" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/monitors/{id}/runs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [jobs]
      operationId: getJobMonitorRuns
      description: Concluded runs over the range, newest first, with the outcome summary.
      parameters:
        - { name: from, in: query, schema: { type: string }, description: "Start of the range (RFC3339 or unix milliseconds; default now − 7 days)" }
        - { name: to, in: query, schema: { type: string }, description: "End of the range (default now)" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 50 } }
      responses:
        "200":
          description: Runs of the monitor
          content:
            application/json:
              schema:
                type: object
                required: [monitor, runs, summary]
                properties:
                  monitor: { $ref: "#/components/schemas/JobMonitor" }
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/JobRun" }
                  summary: { $ref: "#/components/schemas/JobSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/jobs/ping/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string }, description: "The monitor's ping token (olj_…)" }
    get:
      tags: [jobs]
      operationId: pingJobMonitor
      security: []
      description: >-
        Report that the job ran. **Not authenticated**: the caller is a line in a crontab and the token in
        the URL identifies the monitor. `POST` may carry the job's output as the body (at most 4 KiB), and
        `?exit=<code>` reports the exit status — a non-zero code is a failure however the event was spelled.
        `/start` and `/fail` are the other two events (api.md "Job monitoring"). The answer is plain text.
      parameters:
        - { name: exit, in: query, schema: { type: integer, minimum: 0, maximum: 255 } }
        - { name: msg, in: query, schema: { type: string }, description: Output, when sending a body is inconvenient }
      responses:
        "200": { description: Recorded, content: { text/plain: { schema: { type: string } } } }
        "400": { description: Invalid exit code, content: { text/plain: { schema: { type: string } } } }
        "404": { description: Unknown token, content: { text/plain: { schema: { type: string } } } }
    post:
      tags: [jobs]
      operationId: pingJobMonitorWithOutput
      security: []
      description: As the GET, with the job's output as the body.
      requestBody:
        required: false
        content:
          text/plain:
            schema: { type: string, maxLength: 4096 }
      responses:
        "200": { description: Recorded, content: { text/plain: { schema: { type: string } } } }
        "404": { description: Unknown token, content: { text/plain: { schema: { type: string } } } }

  /api/v1/jobs/ping/{token}/{event}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
      - { name: event, in: path, required: true, schema: { type: string, enum: [start, success, fail] } }
    get:
      tags: [jobs]
      operationId: pingJobMonitorEvent
      security: []
      description: >-
        `start` marks the run as running (so an overrun is visible), `fail` marks it failed, `success` is the
        same as no suffix. Not authenticated; see the ping endpoint above.
      responses:
        "200": { description: Recorded, content: { text/plain: { schema: { type: string } } } }
        "404": { description: Unknown token or event, content: { text/plain: { schema: { type: string } } } }
    post:
      tags: [jobs]
      operationId: pingJobMonitorEventWithOutput
      security: []
      description: As the GET, with the job's output as the body.
      responses:
        "200": { description: Recorded, content: { text/plain: { schema: { type: string } } } }
        "404": { description: Unknown token or event, content: { text/plain: { schema: { type: string } } } }

  /api/v1/synthetics/checks:
    get:
      tags: [synthetics]
      operationId: listSyntheticChecks
      description: >-
        Synthetic checks of the organization ordered by name, each with the last outcome per location
        (`status`) and, unless `summary=false`, the uptime and latency over the range (api.md
        "Synthetic monitoring"). `locations` lists the locations this installation offers.
      parameters:
        - { name: summary, in: query, schema: { type: boolean, default: true }, description: Compute uptime and latency }
        - { name: from, in: query, schema: { type: string }, description: "Start of the summary range (RFC3339 or unix milliseconds; default now − 24 h)" }
        - { name: to, in: query, schema: { type: string }, description: "End of the summary range (default now)" }
      responses:
        "200":
          description: Checks with their current status and summary
          content:
            application/json:
              schema:
                type: object
                required: [checks, locations]
                properties:
                  checks:
                    type: array
                    items: { $ref: "#/components/schemas/SyntheticCheckListItem" }
                  locations:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "504": { $ref: "#/components/responses/Timeout" }
    post:
      tags: [synthetics]
      operationId: createSyntheticCheck
      description: >-
        Signed-in member or higher; audit event synthetic_check.create. Not available in static auth mode
        (404). At most 100 checks per organization (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyntheticCheckInput" }
      responses:
        "201":
          description: Created check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyntheticCheck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/synthetics/checks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [synthetics]
      operationId: getSyntheticCheck
      responses:
        "200":
          description: Check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyntheticCheck" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [synthetics]
      operationId: updateSyntheticCheck
      description: Full replacement; signed-in member or higher; audit event synthetic_check.update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyntheticCheckInput" }
      responses:
        "200":
          description: Updated check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyntheticCheck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [synthetics]
      operationId: deleteSyntheticCheck
      description: >-
        Signed-in member or higher; audit event synthetic_check.delete. The schedule rows go with the check;
        the stored runs stay in ClickHouse until their TTL expires.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/synthetics/checks/{id}/results:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [synthetics]
      operationId: getSyntheticCheckResults
      description: >-
        Uptime and latency percentiles over the range, the series behind them and the most recent failed
        runs (api.md "Synthetic monitoring").
      parameters:
        - { name: from, in: query, schema: { type: string }, description: "Start of the range (default now − 24 h)" }
        - { name: to, in: query, schema: { type: string }, description: "End of the range (default now)" }
        - { name: step, in: query, schema: { type: string }, description: Bucket width of the series as a Go duration (≥ 60s, rounded up to whole minutes) }
        - { name: failures, in: query, schema: { type: integer, default: 20, maximum: 200 }, description: "Recent failed runs to include; 0 omits them" }
      responses:
        "200":
          description: Summary, series and recent failures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyntheticResults" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/Timeout" }

  # ----------------------------------------------------------------------- rum
  /api/v1/rum/apps:
    get:
      tags: [rum]
      operationId: listRumApps
      description: >-
        Browser applications that reported in the range, with page views, sessions, errors and when they
        were last seen (rum.md §7).
      parameters:
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: Browser applications
          content:
            application/json:
              schema:
                type: object
                required: [apps]
                properties:
                  apps:
                    type: array
                    items: { $ref: "#/components/schemas/RumApp" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/rum/overview:
    get:
      tags: [rum]
      operationId: getRumOverview
      description: The application's Core Web Vitals, its page view series and the totals of the range.
      parameters:
        - { name: app, in: query, required: true, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: step, in: query, schema: { type: string } }
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RumOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/rum/pages:
    get:
      tags: [rum]
      operationId: listRumPages
      description: >-
        Routes of the application with their page views and load time percentiles. `sort=slowest` orders by
        total time consumed, the same reasoning as APM's "most time consuming".
      parameters:
        - { name: app, in: query, required: true, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [views, slowest, avg], default: views } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: Pages
          content:
            application/json:
              schema:
                type: object
                required: [pages]
                properties:
                  pages:
                    type: array
                    items: { $ref: "#/components/schemas/RumPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/rum/vitals:
    get:
      tags: [rum]
      operationId: getRumVitals
      description: >-
        The five vitals of the application, optionally for one route. Percentiles are null without
        measurements; `rating` scores the p75, the percentile the Core Web Vitals assessment is defined on.
      parameters:
        - { name: app, in: query, required: true, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - { name: route, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: Vitals
          content:
            application/json:
              schema:
                type: object
                required: [from, to, vitals]
                properties:
                  from: { $ref: "#/components/schemas/Timestamp" }
                  to: { $ref: "#/components/schemas/Timestamp" }
                  vitals:
                    type: array
                    items: { $ref: "#/components/schemas/RumVital" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/rum/sessions:
    get:
      tags: [rum]
      operationId: listRumSessions
      description: Sessions of the application, newest first.
      parameters:
        - { name: app, in: query, required: true, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/RumSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/rum/sessions/{session_id}:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string }, description: 32 hex characters }
    get:
      tags: [rum]
      operationId: getRumSession
      description: >-
        One session with the events it produced. The timeline comes from the stored spans, so it is bounded
        by the trace retention: an older session still has its summary and trace links, but no timeline.
      parameters:
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: Session and its events
          content:
            application/json:
              schema:
                type: object
                required: [session, events]
                properties:
                  session: { $ref: "#/components/schemas/RumSession" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/RumEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/Timeout" }

  # -------------------------------------------------------------- database monitoring (D-138)
  /api/v1/db/instances:
    get:
      tags: [db]
      operationId: listDbInstances
      description: Database instances that sent statement statistics or session samples in the range (db-monitoring.md §5).
      parameters:
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: Instances, heaviest first
          content:
            application/json:
              schema:
                type: object
                required: [instances]
                properties:
                  instances: { type: array, items: { $ref: "#/components/schemas/DbInstance" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/db/queries:
    get:
      tags: [db]
      operationId: listDbQueries
      description: Statements of one instance in the range.
      parameters:
        - { name: instance, in: query, required: true, schema: { type: string, maxLength: 512 }, description: "service.instance.id of the database instance" }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [time, calls, avg, rows, errors, reads], default: time } }
        - { name: db, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: case-insensitive substring of the statement }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Statements
          content:
            application/json:
              schema:
                type: object
                required: [queries, total_time_ms]
                properties:
                  queries: { type: array, items: { $ref: "#/components/schemas/DbQuery" } }
                  total_time_ms: { type: number, description: statement time of the whole instance in the range }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/db/queries/{fingerprint}:
    get:
      tags: [db]
      operationId: getDbQuery
      description: One statement of an instance with its series, plans, wait events and the APM services that run it.
      parameters:
        - { name: fingerprint, in: path, required: true, schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: instance, in: query, required: true, schema: { type: string, maxLength: 512 }, description: "service.instance.id of the database instance" }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: step, in: query, schema: { type: string } }
      responses:
        "200":
          description: Statement detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DbQueryDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/db/activity:
    get:
      tags: [db]
      operationId: getDbActivity
      description: Average active sessions per wait type, top wait events and the statements with the most samples.
      parameters:
        - { name: instance, in: query, required: true, schema: { type: string, maxLength: 512 }, description: "service.instance.id of the database instance" }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: step, in: query, schema: { type: string } }
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DbActivity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/db/sessions:
    get:
      tags: [db]
      operationId: getDbSessions
      description: >-
        The latest session sample at or before `at` (default now, looking back 5 minutes): what every non-idle
        session runs, waits for and blocks.
      parameters:
        - { name: instance, in: query, required: true, schema: { type: string, maxLength: 512 } }
        - { name: at, in: query, schema: { type: integer, format: int64 }, description: unix milliseconds }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [sampled_at, sessions]
                properties:
                  sampled_at: { $ref: "#/components/schemas/NullableTimestamp" }
                  sessions: { type: array, items: { $ref: "#/components/schemas/DbSession" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/db/lookup:
    get:
      tags: [db]
      operationId: lookupDbStatement
      description: Instances whose statistics hold a normalized statement (from APM's db_statement) — the link from a client call to the server view.
      parameters:
        - { name: db_system, in: query, required: true, schema: { type: string } }
        - { name: statement, in: query, required: true, schema: { type: string, maxLength: 8192 } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      required: [instance, fingerprint, host_name, calls, avg_ms]
                      properties:
                        instance: { type: string }
                        fingerprint: { type: string }
                        host_name: { type: string }
                        calls: { type: integer }
                        avg_ms: { type: number, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  # ---------------------------------------------------------------- profiling
  /api/v1/profiles/services:
    get:
      tags: [profiles]
      operationId: listProfileServices
      description: >-
        What has been profiled in the window, one entry per service, environment and profile type. This is
        what tells a caller which types the other endpoints accept — nanoseconds and bytes do not add up, so
        a type is never guessed (profiles.md §5).
      parameters:
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: Profiled services
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/ProfileService" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/profiles/flame:
    get:
      tags: [profiles]
      operationId: getProfileFlame
      description: >-
        The flame graph of one service and profile type over the window. Identical stacks are folded in
        ClickHouse, which is the whole reason the stack is a column; the tree is capped at 20000 distinct
        stacks ordered by value, so what falls off the end is the narrowest slivers.
      parameters:
        - { name: service, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - { name: host, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20000, maximum: 20000 } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: Flame graph
          content:
            application/json:
              schema:
                type: object
                required: [unit, type, flame]
                properties:
                  unit: { type: string, description: The unit the profile's own ValueType declared }
                  type: { type: string }
                  flame: { $ref: "#/components/schemas/FlameNode" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/profiles/functions:
    get:
      tags: [profiles]
      operationId: listProfileFunctions
      description: >-
        Functions ranked by self time, the value attributed to the innermost frame. `total` is the sum of the
        rows returned, not of the window, so a percentage is of something the caller can see.
      parameters:
        - { name: service, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - { name: host, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: Functions by self time
          content:
            application/json:
              schema:
                type: object
                required: [unit, type, total, functions]
                properties:
                  unit: { type: string }
                  type: { type: string }
                  total: { type: integer, format: int64 }
                  functions:
                    type: array
                    items: { $ref: "#/components/schemas/ProfileFunction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "504": { $ref: "#/components/responses/Timeout" }

  # -------------------------------------------------------------- browser keys
  /api/v1/source-maps:
    get:
      tags: [rum]
      operationId: listSourceMaps
      description: >-
        The organization's source maps (member and higher; API keys allowed), newest first. The documents
        themselves are never served back — they are read only to un-minify a stack (rum.md §8).
      responses:
        "200":
          description: Source maps
          content:
            application/json:
              schema:
                type: object
                required: [source_maps]
                properties:
                  source_maps:
                    type: array
                    items: { $ref: "#/components/schemas/SourceMap" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [rum]
      operationId: uploadSourceMap
      description: >-
        Uploads a source map (signed-in admin or owner), replacing the one held for the same script and
        keeping its id. The body is the raw document, not JSON: base64 would cost a third more bytes for a
        file a build produced. It is parsed before it is stored, so a document that is not Source Map v3,
        uses `sections`, or decodes to no mappings is refused while the uploader can still fix it.
      parameters:
        - name: app
          in: query
          required: true
          description: The browser application, i.e. the browser key's service_name.
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: script
          in: query
          required: true
          description: >-
            The generated file name as a stack frame carries it ("main.3f2a1b9c.js"). A path, query string
            or fragment is refused rather than trimmed.
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, description: "The source map document, at most 32 MiB" }
      responses:
        "201":
          description: Stored map
          content:
            application/json:
              schema:
                type: object
                required: [source_map]
                properties:
                  source_map: { $ref: "#/components/schemas/SourceMap" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/source-maps/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [rum]
      operationId: deleteSourceMap
      description: Removes the map and its stored document (signed-in admin or owner).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/browser-keys:
    get:
      tags: [keys]
      operationId: listBrowserKeys
      description: >-
        The organization's browser keys (member and higher; API keys allowed). A browser key is public by
        construction — it ships inside a web page — so what bounds it is capability, not secrecy (rum.md §3).
      responses:
        "200":
          description: Browser keys
          content:
            application/json:
              schema:
                type: object
                required: [browser_keys]
                properties:
                  browser_keys:
                    type: array
                    items: { $ref: "#/components/schemas/BrowserKey" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [keys]
      operationId: createBrowserKey
      description: >-
        Creates a browser key (signed-in admin or owner). `origins` must not be empty: a key without an
        allowlist accepts data from any website. The value is returned once, in `key`.
        Audit event browser_key.create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserKeyInput" }
      responses:
        "201":
          description: Created key, with its value
          content:
            application/json:
              schema:
                type: object
                required: [browser_key, key]
                properties:
                  browser_key: { $ref: "#/components/schemas/BrowserKey" }
                  key: { type: string, description: "The value, e.g. olb_… — shown only here" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/browser-keys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [keys]
      operationId: updateBrowserKey
      description: >-
        Full replacement of the editable fields (signed-in admin or owner); audit event browser_key.update.
        A revoked key is never edited back into service. Changing the origins or the rate limit is how an
        operator responds to abuse without redeploying the site.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserKeyInput" }
      responses:
        "200":
          description: Updated key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [keys]
      operationId: revokeBrowserKey
      description: >-
        Revokes the key (signed-in admin or owner); audit event browser_key.revoke. Ingest pods stop
        accepting it within OPENLOG_AUTH_CACHE_TTL, and pages already loaded keep sending it until they are
        reloaded. The value stays permanently unusable.
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------- cloud connections
  /api/v1/cloud/providers:
    get:
      tags: [cloud]
      operationId: listCloudProviders
      description: >-
        The catalog the connection form is built from: the providers, what one scope is called
        (region, subscription, project), the credential fields to ask for and the services that can be
        collected. Any role; not available in static auth mode (404).
      responses:
        "200":
          description: Provider catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudProviderCatalog" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/cloud/connections:
    get:
      tags: [cloud]
      operationId: listCloudConnections
      description: >-
        The organization's cloud connections ordered by name, each with the last poll per scope. A credential
        is never part of a response; `credentials_set` says whether any are stored.
      responses:
        "200":
          description: Connections with the schedule state of every scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudConnectionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [cloud]
      operationId: createCloudConnection
      description: >-
        Admin or owner (an API key with the admin role included); audit event cloud_connection.create. At
        most 50 connections per organization (409). Storing credentials needs OPENLOG_SECRETS_KEY (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudConnectionInput" }
      responses:
        "201":
          description: Created connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/cloud/connections/test:
    post:
      tags: [cloud]
      operationId: testCloudConnection
      description: >-
        Makes one cheap provider call with the submitted credentials, or with the stored credentials of
        `connection_id` when none are submitted, and stores nothing. A credential the provider rejects is a
        normal outcome: the answer is 200 with `ok: false` and the provider's message, so the form can show
        it inline. Only a malformed request, an unknown connection or a missing secrets key is an error
        status. Admin or owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudTestRequest" }
      responses:
        "200":
          description: Whether the credentials can read metrics of the scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/cloud/connections/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cloud]
      operationId: getCloudConnection
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudConnection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [cloud]
      operationId: updateCloudConnection
      description: >-
        Full replacement; admin or owner; audit event cloud_connection.update. Omitting `credentials` keeps
        the stored ones, so an edit of the name or the services never has to re-send a secret; changing the
        provider requires new credentials (400).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudConnectionInput" }
      responses:
        "200":
          description: Updated connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [cloud]
      operationId: deleteCloudConnection
      description: >-
        Admin or owner; audit event cloud_connection.delete. The schedule rows and the poll history go with
        the connection; the metrics already collected stay in ClickHouse until their TTL expires.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/cloud/connections/{id}/runs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [cloud]
      operationId: listCloudConnectionRuns
      description: >-
        The recent polls of a connection, newest first: what each scope collected, how many provider
        requests it cost, how often the provider throttled it and what failed. At most 200 polls per
        connection are kept.
      parameters:
        - { name: scope, in: query, schema: { type: string }, description: Limit to one region, subscription or project }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 200 } }
      responses:
        "200":
          description: The connection and its recent polls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudRunList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- auth
  /api/v1/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: Backend version, newest available release and updater status
      description: |
        Any authenticated principal (both auth modes). Every API, ingest and admin response also carries
        `X-Openlog-Version`. The release check runs on one api pod at most every 24 h and verifies the signed
        index (docs/contracts/releases-updates.md §5).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/version/check:
    post:
      tags: [system]
      operationId: requestUpdateCheck
      summary: Check for a new release now
      description: |
        Signed-in admins and owners; with `OPENLOG_SIGNUP_ENABLED=true` only superadmins (`OPENLOG_SUPERADMIN_EMAILS`,
        verified e-mail) whatever their organization role (403 for API keys, lower roles, and everyone else there).
        The audit entry of a superadmin request has `details.superadmin: true`.
        Runs the api release check immediately and queues a `check` request for openlog-updater (picked up
        within `OPENLOG_UPDATER_REQUEST_POLL`, default 10 s). At most once per 30 s per installation (429 with
        `Retry-After`). Audit action `update.check_requested`. Returns the fresh version information.
      responses:
        "200":
          description: Version information after the check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/version/update:
    post:
      tags: [system]
      operationId: requestUpdateApply
      summary: Ask openlog-updater to install a release now
      description: |
        Same callers as `/version/check` (admins and owners; superadmins only with sign-up enabled). Queues an `apply` request; the updater
        installs `target_version` also in `notify` mode, only if it is still the release it would select, and
        outside `OPENLOG_UPDATER_MAINTENANCE_WINDOW` only with `ignore_maintenance_window: true`. Follow the
        progress in `GET /api/v1/version` (`update_requests.latest`, `updater.state`, `updater.steps`).
        409 when the target is not newer than the running version, no updater reports, the updater mode is
        `off`, an update is running, or an apply request is already open; 429 within 30 s of the previous apply
        request. Audit action `update.apply_requested`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_version]
              properties:
                target_version: { type: string, example: "0.9.1" }
                ignore_maintenance_window: { type: boolean, default: false }
      responses:
        "202":
          description: Queued request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/onboarding:
    get:
      tags: [system]
      operationId: getOnboarding
      summary: Inputs of the "Add data" install commands
      description: |
        Any authenticated principal with an organization (viewer and up, API keys too; 403 without an organization).
        Public OTLP endpoints (configured with OPENLOG_INGEST_PUBLIC_URL / OPENLOG_INGEST_PUBLIC_GRPC_URL, else derived
        from OPENLOG_PUBLIC_URL or the request host with ports 4318/4317), the release version and channel the commands
        pin, whether browser CORS is configured, the caller's organization and role, and feature flags. Never returns
        secrets; `Cache-Control: no-store`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      description: Sets the `openlog_session` cookie (HttpOnly, SameSite=Strict, Path=/api).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      security: []
      description: >-
        Only when OPENLOG_SIGNUP_ENABLED=true. Creates a user and a new organization they own. An address in a domain
        verified by an organization with an enabled SSO connection answers 409 failed_precondition (claimed-domain
        redirection, D-089; `POST /api/v1/auth/sso/discover` names the organization).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Signed up and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [auth]
      operationId: updateMe
      description: Signed-in users change their own preferences (D-095). Audit user.language_change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language: { $ref: "#/components/schemas/UserLanguage" }
      responses:
        "200":
          description: The caller with the new preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204": { description: Session revoked, cookie cleared }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      description: Revokes the user's other sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      security: []
      description: Confirms the e-mail address with the token of the verification link (/verify-email#token=olv_…).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/auth/verify-email/resend:
    post:
      tags: [auth]
      operationId: resendVerificationEmail
      description: E-mails a new verification link to the signed-in, unverified user (5 per hour).
      responses:
        "204": { description: Sent }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ---------------------------------------------------------------- organization
  # ---- Single sign-on, domains and SCIM tokens (api.md "Single sign-on", D-077, D-078) ----

  /api/v1/auth/sso/discover:
    post:
      tags: [sso]
      operationId: discoverSSO
      security: []
      description: Whether the e-mail address belongs to a verified domain with an enabled connection. Rate limited per client IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSODiscovery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/sso/start:
    post:
      tags: [sso]
      operationId: startSSOLogin
      security: []
      description: >-
        Starts an SP-initiated sign-in and sets the browser binding cookie `openlog_sso_<id>` (HttpOnly, SameSite=Lax,
        Path=/api/v1/sso, 10 minutes). The browser then navigates to `redirect_url` (the identity provider).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                redirect: { type: string, description: "Relative UI path after sign-in (default /)" }
      responses:
        "200":
          description: Identity provider URL
          content:
            application/json:
              schema:
                type: object
                required: [redirect_url]
                properties:
                  redirect_url: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/auth/sso/session:
    get:
      tags: [sso]
      operationId: getSSOSession
      description: Signed-in user. Whether the current session was created by single sign-on and whether "Sign out everywhere" also ends the IdP session.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOSessionInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/sso/logout:
    post:
      tags: [sso]
      operationId: ssoLogout
      description: >-
        Signed-in user ("Sign out everywhere", D-088). Ends the current session and, for an SSO session, the user's
        other sessions of the same connection, clears the session cookie, and returns where the browser ends the IdP
        session: `redirect_url` (SAML HTTP-Redirect binding with a signed LogoutRequest, or the OIDC
        end_session_endpoint with id_token_hint and post_logout_redirect_uri) or `post` (SAML HTTP-POST binding: submit
        a form with `fields` to `url`). Both null = only openlog sessions ended. The IdP returns the browser to
        `redirect` (`/login` or a path of the connection's `logout_redirect_allowlist`) with `?sso_logout=ok|partial`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect: { type: string, description: "Relative UI path after the IdP logout (default /login)" }
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOLogoutResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/sso/oidc/logout/callback:
    get:
      tags: [sso]
      operationId: oidcLogoutCallback
      security: []
      description: OIDC post_logout_redirect_uri. Always answers 303 to the UI path of the logout with `sso_logout=ok` (unknown state → `/login`).
      parameters:
        - { name: state, in: query, schema: { type: string } }
      responses:
        "303": { description: Redirect to the UI }

  /api/v1/sso/saml/{connection_id}/slo:
    get:
      tags: [sso]
      operationId: samlSLORedirect
      security: []
      description: >-
        SAML single logout service, HTTP-Redirect binding (`SAMLRequest` or `SAMLResponse`, `RelayState`, `SigAlg`,
        `Signature`; the query signature is required, RSA/ECDSA SHA-256/384/512). An IdP LogoutRequest (issuer,
        destination, IssueInstant, replay checked; NameID or EncryptedID) ends the connection's active sessions with
        that NameID (and SessionIndex) and is answered with a signed LogoutResponse through the IdP's
        SingleLogoutService (303, or an auto-submitting form for HTTP-POST). A LogoutResponse completes an SP-initiated
        logout: 303 to the UI path with `sso_logout=ok|partial`. Invalid messages → 303 `/login?sso_error=<code>`.
      parameters:
        - { name: connection_id, in: path, required: true, schema: { type: string } }
        - { name: SAMLRequest, in: query, schema: { type: string } }
        - { name: SAMLResponse, in: query, schema: { type: string } }
        - { name: RelayState, in: query, schema: { type: string } }
        - { name: SigAlg, in: query, schema: { type: string } }
        - { name: Signature, in: query, schema: { type: string } }
      responses:
        "200":
          description: Auto-submitting HTML form (LogoutResponse to an IdP with the HTTP-POST binding only)
          content:
            text/html:
              schema: { type: string }
        "303": { description: Redirect to the IdP or the UI }
    post:
      tags: [sso]
      operationId: samlSLOPost
      security: []
      description: SAML single logout service, HTTP-POST binding (enveloped signature required). Same semantics as GET.
      parameters:
        - { name: connection_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLRequest: { type: string }
                SAMLResponse: { type: string }
                RelayState: { type: string }
      responses:
        "200":
          description: Auto-submitting HTML form
          content:
            text/html:
              schema: { type: string }
        "303": { description: Redirect to the IdP or the UI }

  /api/v1/sso/saml/{connection_id}/slo/soap:
    post:
      tags: [sso]
      operationId: samlSLOSoap
      security: []
      description: >-
        SAML single logout service, SOAP 1.1 binding (back-channel, D-098). The body is a SOAP envelope with exactly one
        `samlp:LogoutRequest` (no DTD, no `mustUnderstand` header) carrying one enveloped signature by an IdP metadata
        certificate (RSA/ECDSA SHA-256/384/512); issuer, `Destination` (optional: this URL or the SLO URL),
        IssueInstant, NotOnOrAfter and the replay cache are checked like the front-channel LogoutRequest. The matching
        sessions end and the answer is a LogoutResponse signed with the SP key (`Success`, `Responder` when a
        revocation failed) in the SOAP body. Refused requests → 500 SOAP fault without details (audit
        `sso.logout_failed`); 60 refused requests per client address per 10 min.
      parameters:
        - { name: connection_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          text/xml:
            schema: { type: string }
      responses:
        "200":
          description: SOAP envelope with the signed LogoutResponse
          content:
            text/xml:
              schema: { type: string }
        "500":
          description: SOAP fault
          content:
            text/xml:
              schema: { type: string }

  /api/v1/sso/oidc/{connection_id}/backchannel-logout:
    post:
      tags: [sso]
      operationId: oidcBackchannelLogout
      security: []
      description: >-
        OpenID Connect Back-Channel Logout 1.0 (D-098). `logout_token` is a JWT signed with a key of the provider's
        JWKS (asymmetric algorithms only) with `iss` = the connection's issuer, `aud` containing its client ID, `iat`
        within 5 min plus clock skew (and `exp`, when present, not passed), `events` with the member
        `http://schemas.openid.net/event/backchannel-logout`, no `nonce`, a `jti` (kept in the replay cache) and `sub`
        and/or `sid`. With `sid` the active sessions of that IdP session end (also matching `sub` when both are given);
        with `sub` only all sessions of the subject on the connection. 60 refused tokens per client address per 10 min.
      parameters:
        - { name: connection_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token: { type: string }
      responses:
        "200": { description: Accepted; the matching sessions ended (also when none matched) }
        "400":
          description: Refused token or request
          content:
            application/json:
              schema:
                type: object
                required: [error, error_description]
                properties:
                  error: { type: string, enum: [invalid_request] }
                  error_description: { type: string }
        "503":
          description: The sessions could not be ended
          content:
            application/json:
              schema:
                type: object
                required: [error, error_description]
                properties:
                  error: { type: string, enum: [temporarily_unavailable] }
                  error_description: { type: string }

  /api/v1/sso/oidc/{connection_id}/frontchannel-logout:
    get:
      tags: [sso]
      operationId: oidcFrontchannelLogout
      security: []
      description: >-
        OpenID Connect Front-Channel Logout 1.0 (D-098), loaded by the provider in an iframe. `iss` must equal the
        connection's issuer and `sid` is required (register the URI with "session required"): the active sessions of
        that IdP session end. The answer is an empty HTML page with `Cache-Control: no-cache, no-store` and
        `Content-Security-Policy: default-src 'none'; …; frame-ancestors <issuer origin>` (no X-Frame-Options).
      parameters:
        - { name: connection_id, in: path, required: true, schema: { type: string } }
        - { name: iss, in: query, required: true, schema: { type: string } }
        - { name: sid, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Done (also when the sessions had already ended)
          content:
            text/html:
              schema: { type: string }
        "400": { description: "iss or sid missing, or iss is not the connection's issuer" }
        "404": { description: No such OIDC connection }
        "429": { description: Too many refused requests from this address }

  /api/v1/sso/oidc/callback:
    get:
      tags: [sso]
      operationId: oidcCallback
      security: []
      description: OIDC redirect URI. Always answers 303 — to the UI path of the sign-in with the session cookie, or to `/login?sso_error=<code>`.
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "303": { description: Redirect to the UI }

  /api/v1/sso/saml/{connection_id}/metadata:
    get:
      tags: [sso]
      operationId: samlMetadata
      security: []
      parameters:
        - { name: connection_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: SAML SP metadata (entity ID = this URL)
          content:
            application/samlmetadata+xml:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sso/saml/{connection_id}/acs:
    post:
      tags: [sso]
      operationId: samlACS
      security: []
      description: Assertion consumer service (HTTP-POST binding). Answers 303 to `/api/v1/sso/saml/complete` or `/login?sso_error=<code>`.
      parameters:
        - { name: connection_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse: { type: string }
                RelayState: { type: string }
      responses:
        "303": { description: Redirect }

  /api/v1/sso/saml/complete:
    get:
      tags: [sso]
      operationId: samlComplete
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "303": { description: Redirect to the UI (session cookie set on success) }

  /api/v1/sso/connection:
    get:
      tags: [sso]
      operationId: getSSOConnection
      description: admin, owner. Single-connection API — the organization's default (oldest) connection; see /api/v1/sso/connections.
      responses:
        "200":
          description: Connection (null when none) and the service provider values to register at the identity provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [sso]
      operationId: saveSSOConnection
      description: admin, owner. Updates the default connection or creates it when there is none; every save increases config_version (enforcement needs a new test).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSOConnectionInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [sso]
      operationId: deleteSSOConnection
      description: admin, owner. Refused (409) while enforced; ends the connection's SSO sessions.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/sso/connection/test:
    post:
      tags: [sso]
      operationId: testSSOConnection
      description: admin, owner. Server-side checks (OIDC discovery, JWKS, PKCE; SAML metadata, certificates, SP key).
      responses:
        "200":
          description: Check results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOTestResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sso/connection/test/start:
    post:
      tags: [sso]
      operationId: startSSOTest
      description: admin, owner. Starts a test sign-in (also for a disabled connection); the result is stored as last_test and the browser returns to /settings/sso?sso_test=ok|failed. No user, membership or session is created.
      responses:
        "200":
          description: Identity provider URL
          content:
            application/json:
              schema:
                type: object
                required: [redirect_url]
                properties:
                  redirect_url: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/sso/enforcement:
    put:
      tags: [sso]
      operationId: updateSSOEnforcement
      description: owner. Turning enforcement on requires an enabled, successfully tested connection, a verified domain, at least one break-glass owner and that the caller keeps access (409 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enforce, break_glass_user_ids]
              properties:
                enforce: { type: boolean }
                break_glass_user_ids: { type: array, items: { type: string }, maxItems: 10 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/sso/role-mappings:
    get:
      tags: [sso]
      operationId: listSSORoleMappings
      description: admin, owner
      responses:
        "200":
          description: Mappings
          content:
            application/json:
              schema:
                type: object
                required: [mappings]
                properties:
                  mappings: { type: array, items: { $ref: "#/components/schemas/SSORoleMapping" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [sso]
      operationId: replaceSSORoleMappings
      description: admin, owner. Replaces the organization-wide mappings (at most 200; used by SCIM and by connections without own mappings); roles of SCIM-provisioned members are recomputed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mappings]
              properties:
                mappings: { type: array, items: { $ref: "#/components/schemas/SSORoleMapping" } }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [mappings]
                properties:
                  mappings: { type: array, items: { $ref: "#/components/schemas/SSORoleMapping" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/sso/connections:
    get:
      tags: [sso]
      operationId: listSSOConnections
      description: admin, owner. All connections of the organization (`connections`, the default connection first); `connection` is null.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [sso]
      operationId: createSSOConnection
      description: admin, owner. Adds a connection (at most 10 per organization). The first connection is the default connection (domains without `connection_id` route to it).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSOConnectionInput" }
      responses:
        "201":
          description: Created; `connection` is the new connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/sso/connections/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [sso]
      operationId: getSSOConnectionByID
      description: admin, owner. `connection` is the addressed connection; `service_provider` carries its SAML values.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [sso]
      operationId: updateSSOConnection
      description: admin, owner. Replaces the settings (increments config_version). Disabling an enforcing connection → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSOConnectionInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [sso]
      operationId: deleteSSOConnectionByID
      description: admin, owner. Refused (409) while enforced; ends the connection's sessions; its domains route to the default connection.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/sso/connections/{id}/test:
    post:
      tags: [sso]
      operationId: testSSOConnectionByID
      description: admin, owner. Server-side checks of the connection.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Check results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOTestResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sso/connections/{id}/test/start:
    post:
      tags: [sso]
      operationId: startSSOTestByID
      description: admin, owner. Test sign-in of the connection (see /api/v1/sso/connection/test/start).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Identity provider URL
          content:
            application/json:
              schema:
                type: object
                required: [redirect_url]
                properties:
                  redirect_url: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/sso/connections/{id}/refresh:
    post:
      tags: [sso]
      operationId: refreshSSOConnection
      description: admin, owner. Fetches the OIDC discovery document and JWKS or the SAML metadata now (like the background refresh) and returns the updated `health`. 30 per connection per 10 min.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Refreshed (see connection.health)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/sso/connections/{id}/metadata/accept:
    post:
      tags: [sso]
      operationId: acceptSSOConnectionMetadata
      description: >-
        admin, owner (D-098). Confirms the pending IdP metadata change of a SAML connection with a metadata URL
        (`saml.pending_metadata`): the metadata is fetched again and must still carry the change named by `digest`;
        it replaces the stored copy without a new `config_version`, a new metadata signing certificate is pinned, and
        the refresh health is reset. `409` when there is no such pending change (anymore) or the connection was saved
        meanwhile. Shares the refresh limit (30 per connection per 10 min).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digest]
              properties:
                digest: { type: string, description: "saml.pending_metadata.digest" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/sso/connections/{id}/enforcement:
    put:
      tags: [sso]
      operationId: updateSSOConnectionEnforcement
      description: owner. Enforcement of the connection for members whose e-mail domain routes to it; the safeguards of /api/v1/sso/enforcement apply to its routed domains.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enforce, break_glass_user_ids]
              properties:
                enforce: { type: boolean }
                break_glass_user_ids: { type: array, items: { type: string }, maxItems: 10 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/sso/connections/{id}/role-mappings:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [sso]
      operationId: listSSOConnectionRoleMappings
      description: admin, owner. Mappings of the connection; a connection without own mappings uses the organization-wide mappings (/api/v1/sso/role-mappings).
      responses:
        "200":
          description: Mappings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSORoleMappings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [sso]
      operationId: replaceSSOConnectionRoleMappings
      description: admin, owner. Replaces the connection's mappings (at most 200; an empty list falls back to the organization-wide mappings).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mappings]
              properties:
                mappings: { type: array, items: { $ref: "#/components/schemas/SSORoleMapping" } }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSORoleMappings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sso/domains:
    get:
      tags: [sso]
      operationId: listSSODomains
      description: admin, owner
      responses:
        "200":
          description: Claimed domains
          content:
            application/json:
              schema:
                type: object
                required: [domains]
                properties:
                  domains: { type: array, items: { $ref: "#/components/schemas/SSODomain" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [sso]
      operationId: addSSODomain
      description: admin, owner (confirmed e-mail address). At most 20 domains.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
      responses:
        "201":
          description: Claimed (not verified yet)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSODomain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/sso/domains/{id}/verify:
    post:
      tags: [sso]
      operationId: verifySSODomain
      description: admin, owner. `dns_txt` looks up the TXT record now; `email` sends a link to <email_local_part>@<domain> (SMTP and OPENLOG_PUBLIC_URL required).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [dns_txt, email] }
                email_local_part: { type: string, enum: [admin, administrator, hostmaster, postmaster, webmaster] }
      responses:
        "200":
          description: Verified (dns_txt) or e-mail sent (email)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSODomain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/sso/domains/{id}:
    put:
      tags: [sso]
      operationId: assignSSODomain
      description: admin, owner. Routes sign-ins of the domain to a connection of the organization (`null` = the default connection). Moving the last verified domain away from an enforcing connection → 409.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection_id]
              properties:
                connection_id: { type: [string, "null"] }
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSODomain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [sso]
      operationId: deleteSSODomain
      description: admin, owner. The last verified domain of an enforcing connection cannot be removed (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/sso/domains/verify-email:
    post:
      tags: [sso]
      operationId: verifySSODomainEmail
      security: []
      description: Confirms a domain with the token of the e-mailed link (/sso/verify-domain#token=oldv_…).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                required: [domain]
                properties:
                  domain: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/scim/tokens:
    get:
      tags: [sso]
      operationId: listSCIMTokens
      description: admin, owner
      responses:
        "200":
          description: Tokens, including revoked ones
          content:
            application/json:
              schema:
                type: object
                required: [tokens, base_url, enabled]
                properties:
                  tokens: { type: array, items: { $ref: "#/components/schemas/SCIMToken" } }
                  base_url: { type: string }
                  enabled: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [sso]
      operationId: createSCIMToken
      description: admin, owner (confirmed e-mail address). At most 20 active tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                expires_at: { type: [string, "null"], description: "RFC3339 or unix milliseconds, in the future" }
      responses:
        "201":
          description: Created; the secret (ols_…) is shown only in this response
          content:
            application/json:
              schema:
                type: object
                required: [token, secret]
                properties:
                  token: { $ref: "#/components/schemas/SCIMToken" }
                  secret: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/scim/tokens/{id}:
    delete:
      tags: [sso]
      operationId: revokeSCIMToken
      description: admin, owner
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/scim/v2/Users:
    get:
      tags: [sso]
      operationId: scimListUsers
      security: [{ scimToken: [] }]
      description: SCIM 2.0 (RFC 7644) list; filter `userName eq "…"` or `externalId eq "…"`, startIndex, count (≤ 500). Also POST; /Users/{id} supports GET, PUT, PATCH, DELETE; /Groups the same; /ServiceProviderConfig, /ResourceTypes, /Schemas. See api.md "SCIM".
      responses:
        "200":
          description: ListResponse
          content:
            application/scim+json:
              schema: { type: object }
        "401": { description: SCIM error }

  /api/v1/orgs/current:
    get:
      tags: [organization]
      operationId: getCurrentOrg
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [organization]
      operationId: renameCurrentOrg
      description: Admins and owners change the name and/or the default e-mail language (at least one field).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                language: { $ref: "#/components/schemas/OrgLanguage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/members:
    get:
      tags: [organization]
      operationId: listMembers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/members/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [organization]
      operationId: updateMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "204": { description: Role changed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [organization]
      operationId: removeMember
      description: Removes a member; any member may remove themselves (leave).
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/invitations:
    get:
      tags: [organization]
      operationId: listInvitations
      parameters:
        - name: include_expired
          in: query
          description: Also list expired invitations that were neither accepted nor revoked.
          schema: { type: boolean }
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [organization]
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created; the token is shown only in this response
          content:
            application/json:
              schema:
                type: object
                required: [invitation, token, email_sent]
                properties:
                  invitation: { $ref: "#/components/schemas/Invitation" }
                  token: { type: string, description: "oli_… (shown once)" }
                  email_sent: { type: boolean, description: "The invitation was e-mailed (e-mail configured and within limits)" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/invitations/{id}:
    delete:
      tags: [organization]
      operationId: revokeInvitation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/invitations/{id}/resend:
    post:
      tags: [organization]
      operationId: resendInvitation
      description: New token and expiry for an invitation that is neither accepted nor revoked (also expired); e-mails it when configured. The previous link stops working.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Renewed; the token is shown only in this response
          content:
            application/json:
              schema:
                type: object
                required: [invitation, token, email_sent]
                properties:
                  invitation: { $ref: "#/components/schemas/Invitation" }
                  token: { type: string }
                  email_sent: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/invitations/lookup:
    post:
      tags: [organization]
      operationId: lookupInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationLookup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/invitations/accept:
    post:
      tags: [organization]
      operationId: acceptInvitation
      security: []
      description: New users choose a password; existing users must send their current password. Signs in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
                name: { type: string }
      responses:
        "200":
          description: Joined and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------- keys & sessions
  /api/v1/license-keys:
    get:
      tags: [keys]
      operationId: listLicenseKeys
      responses:
        "200":
          description: Ingest license keys, including revoked ones
          content:
            application/json:
              schema:
                type: object
                required: [license_keys]
                properties:
                  license_keys:
                    type: array
                    items: { $ref: "#/components/schemas/LicenseKey" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [keys]
      operationId: createLicenseKey
      description: >-
        Without `key` a key is generated and returned once. With `key` an existing value is imported (e.g. a key
        senders already use with another backend): surrounding whitespace is trimmed; 16–256 printable ASCII
        characters without spaces, quotes or backslashes. Only its SHA-256 hash is stored; the response `key` is
        null. A value already used by any organization, active or revoked, fails with 409 already_exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                key: { type: string, minLength: 16, maxLength: 256, description: "Optional key value to import instead of generating one" }
      responses:
        "201":
          description: Created; a generated key is shown only in this response
          content:
            application/json:
              schema:
                type: object
                required: [license_key, key]
                properties:
                  license_key: { $ref: "#/components/schemas/LicenseKey" }
                  key: { type: [string, "null"], description: "olk_… (shown once); null for an imported value" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/license-keys/{id}:
    delete:
      tags: [keys]
      operationId: revokeLicenseKey
      description: Idempotent. Ingest keeps accepting the key for up to OPENLOG_AUTH_CACHE_TTL.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/api-keys:
    get:
      tags: [keys]
      operationId: listAPIKeys
      responses:
        "200":
          description: API keys, including revoked ones
          content:
            application/json:
              schema:
                type: object
                required: [api_keys]
                properties:
                  api_keys:
                    type: array
                    items: { $ref: "#/components/schemas/APIKey" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [keys]
      operationId: createAPIKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                role:
                  type: string
                  enum: [viewer, member, admin]
                  default: viewer
                  description: >-
                    What the key may do (D-133). Absent means viewer, so older clients keep creating read-only keys.
                    A role above viewer needs an admin or owner caller and never exceeds the caller's own role (403).
                expires_at:
                  type: [string, "null"]
                  description: RFC3339 or unix milliseconds, in the future
      responses:
        "201":
          description: Created; the key is shown only in this response
          content:
            application/json:
              schema:
                type: object
                required: [api_key, key]
                properties:
                  api_key: { $ref: "#/components/schemas/APIKey" }
                  key: { type: string, description: "ola_… (shown once)" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/api-keys/{id}:
    delete:
      tags: [keys]
      operationId: revokeAPIKey
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked (effective immediately) }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      responses:
        "200":
          description: The caller's active sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/sessions/{id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/audit-log:
    get:
      tags: [organization]
      operationId: listAuditEvents
      parameters:
        - name: limit
          in: query
          description: Default 100, max 500.
          schema: { type: integer, minimum: 1 }
        - { name: actor, in: query, description: "Case-insensitive substring of the actor e-mail or of the API key name", schema: { type: string } }
        - { name: action, in: query, description: "Action prefix, e.g. member. or member.remove", schema: { type: string } }
        - { name: from, in: query, description: "Inclusive start (RFC3339 or unix ms)", schema: { type: string } }
        - { name: to, in: query, description: "Exclusive end (RFC3339 or unix ms)", schema: { type: string } }
        - { name: cursor, in: query, description: "next_cursor of the previous page (same filters)", schema: { type: string } }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [events, next_cursor]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  next_cursor: { type: [string, "null"], description: "Cursor of the next page; null when this page was not full" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/fleet/policy:
    get:
      tags: [fleet]
      operationId: getFleetPolicy
      responses:
        "200":
          description: The organization's agent update policy (the default policy when none is stored)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetPolicy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [fleet]
      operationId: putFleetPolicy
      description: Admin or owner. Ingest applies the change within OPENLOG_FLEET_POLICY_CACHE_TTL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FleetPolicyInput" }
      responses:
        "200":
          description: Stored policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/fleet/summary:
    get:
      tags: [fleet]
      operationId: getFleetSummary
      responses:
        "200":
          description: Fleet overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/fleet/hosts:
    get:
      tags: [fleet]
      operationId: listFleetHosts
      parameters:
        - { name: version, in: query, description: Exact reported agent version, schema: { type: string } }
        - { name: state, in: query, description: Reported update state, schema: { $ref: "#/components/schemas/FleetUpdateState" } }
        - { name: q, in: query, description: Substring of host name or id, schema: { type: string } }
        - { name: limit, in: query, description: "Default 100, max 1000.", schema: { type: integer, minimum: 1 } }
        - { name: cursor, in: query, description: next_cursor of the previous page, schema: { type: string } }
      responses:
        "200":
          description: Agents ordered by host name
          content:
            application/json:
              schema:
                type: object
                required: [hosts, next_cursor]
                properties:
                  hosts:
                    type: array
                    items: { $ref: "#/components/schemas/FleetHost" }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/fleet/hosts/{host_id}/override:
    parameters:
      - { name: host_id, in: path, required: true, schema: { type: string } }
    put:
      tags: [fleet]
      operationId: putFleetHostOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [hold, pin] }
                version: { type: string, description: Required for pin }
      responses:
        "200":
          description: Override stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetOverride" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [fleet]
      operationId: deleteFleetHostOverride
      description: Idempotent.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/fleet/hosts/{host_id}/php-agent:
    parameters:
      - { name: host_id, in: path, required: true, schema: { type: string } }
    put:
      tags: [fleet]
      operationId: putFleetHostPHPAgentOverride
      description: >-
        Admin or owner. Sets the host's PHP agent mode instead of the policy's (php-agent.md §7.3); an auto override
        skips PHP agent waves. Audit action fleet.php_agent_override.set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/FleetPHPAgentMode" }
      responses:
        "200":
          description: Override stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetPHPOverride" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [fleet]
      operationId: deleteFleetHostPHPAgentOverride
      description: Idempotent; the host follows the policy again. Audit action fleet.php_agent_override.delete.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/fleet/hosts/{host_id}/java-agent:
    parameters:
      - { name: host_id, in: path, required: true, schema: { type: string } }
    put:
      tags: [fleet]
      operationId: putFleetHostJavaAgentOverride
      description: >-
        Admin or owner. Sets the host's Java agent mode instead of the policy's (java-agent.md §2); an auto override
        skips Java agent waves. Audit action fleet.java_agent_override.set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/FleetJavaAgentMode" }
      responses:
        "200":
          description: Override stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetJavaOverride" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [fleet]
      operationId: deleteFleetHostJavaAgentOverride
      description: Idempotent; the host follows the policy again. Audit action fleet.java_agent_override.delete.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/fleet/rollouts:
    get:
      tags: [fleet]
      operationId: listFleetRollouts
      parameters:
        - { name: limit, in: query, description: "Default 20, max 100.", schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Rollouts, newest first
          content:
            application/json:
              schema:
                type: object
                required: [rollouts]
                properties:
                  rollouts:
                    type: array
                    items: { $ref: "#/components/schemas/FleetRollout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/fleet/rollouts/{id}/pause:
    post:
      tags: [fleet]
      operationId: pauseFleetRollout
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Paused rollout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetRollout" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/fleet/rollouts/{id}/resume:
    post:
      tags: [fleet]
      operationId: resumeFleetRollout
      description: Paused or halted rollouts. Restarts the soak time; failures of a halted rollout are acknowledged.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Active rollout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetRollout" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/fleet/rollouts/{id}/deploy-now:
    post:
      tags: [fleet]
      operationId: deployFleetRolloutNow
      description: |
        Active rollouts that are not in their last wave: skips the remaining soak times and moves to the last
        wave (100 %). Agents get the update at their next sync (agents waiting for a wave sync every
        `OPENLOG_FLEET_ROLLOUT_SYNC_INTERVAL`, default 60 s); the halt threshold and maintenance windows still
        apply. Audit action `fleet.rollout.deploy_now`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Rollout in its last wave
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetRollout" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/fleet/rollback:
    post:
      tags: [fleet]
      operationId: createFleetRollback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_version]
              properties:
                to_version: { type: string }
      responses:
        "201":
          description: Rollback rollout created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetRollout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/integrations/settings:
    get:
      tags: [integrations]
      operationId: listIntegrationSettings
      description: >-
        Any role (API keys too). Without host_id every setting of the organization; with host_id the settings that apply
        to that host in application order, plus the host's current and applied revisions.
      parameters:
        - { name: host_id, in: query, description: "Agent host id (host.id); at most 256 bytes", schema: { type: string } }
      responses:
        "200":
          description: Integration settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationSettingsList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [integrations]
      operationId: createIntegrationSetting
      description: Signed-in admin or owner. 409 already_exists for a duplicate scope, integration and match; 409 failed_precondition for a password without OPENLOG_SECRETS_KEY.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationSettingInput" }
      responses:
        "201":
          description: Created setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/integrations/settings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [integrations]
      operationId: updateIntegrationSetting
      description: Signed-in admin or owner. Replaces every non-secret field; password omitted or null = keep, "" = clear.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationSettingInput" }
      responses:
        "200":
          description: Stored setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [integrations]
      operationId: deleteIntegrationSetting
      description: Signed-in admin or owner.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Alerting (docs/contracts/alerting.md) ----
  /api/v1/alerts/rule-types:
    get:
      tags: [alerts]
      operationId: listAlertRuleTypes
      responses:
        "200":
          description: Rule types and whether they can be used
          content:
            application/json:
              schema:
                type: object
                required: [types]
                properties:
                  types:
                    type: array
                    items: { $ref: "#/components/schemas/AlertRuleTypeInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/alerts/rules:
    get:
      tags: [alerts]
      operationId: listAlertRules
      parameters:
        - { name: type, in: query, schema: { $ref: "#/components/schemas/AlertRuleType" } }
        - { name: enabled, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Rules of the organization ordered by name
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [alerts]
      operationId: createAlertRule
      description: Member or higher (signed-in user).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/alerts/rules/preview:
    post:
      tags: [alerts]
      operationId: previewAlertRule
      description: |
        Evaluates a rule definition (not stored) over the last `hours` hours and returns every series with the
        states it would have had. Read access to telemetry is enough (viewer). Windows longer than the step are
        combined from step buckets; percentiles are then approximate (`approximate: true`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRulePreviewRequest" }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRulePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/alerts/rules/{id}/evaluations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [alerts]
      operationId: listAlertRuleEvaluations
      description: |
        Evaluation history of a rule from ClickHouse `alert_evaluations` (alerting.md §3.6), bucketed to at most 500
        points (`step_seconds` ≥ 10). Viewer and API keys. Default range: the last 24 hours; at most 30 days.
      parameters:
        - { name: from, in: query, description: "RFC3339 or unix ms (default now − 24h)", schema: { type: string } }
        - { name: to, in: query, description: "RFC3339 or unix ms (default now)", schema: { type: string } }
      responses:
        "200":
          description: Evaluation history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRuleEvaluations" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "504": { $ref: "#/components/responses/Timeout" }

  /api/v1/alerts/rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [alerts]
      operationId: getAlertRule
      responses:
        "200":
          description: Rule with the state of its non-ok series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRuleDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [alerts]
      operationId: updateAlertRule
      description: |
        Full replacement. Members may change only rules they created. Changing `type` or `condition` resolves open
        incidents (reason rule_changed). With `version` set, a stale version returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "200":
          description: Stored rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [alerts]
      operationId: deleteAlertRule
      description: Resolves open incidents (reason rule_deleted); incidents are kept.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alerts/rules/{id}/enable:
    post:
      tags: [alerts]
      operationId: enableAlertRule
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alerts/rules/{id}/disable:
    post:
      tags: [alerts]
      operationId: disableAlertRule
      description: Resolves open incidents (reason rule_disabled).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alerts/incidents:
    get:
      tags: [alerts]
      operationId: listAlertIncidents
      parameters:
        - name: state
          in: query
          description: Comma-separated states (default all)
          schema: { type: string, example: "open,acknowledged" }
        - { name: rule_id, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/AlertSeverity" } }
        - { name: limit, in: query, description: "Default 50, max 500.", schema: { type: integer, minimum: 1 } }
        - { name: cursor, in: query, description: next_cursor of the previous page, schema: { type: string } }
      responses:
        "200":
          description: Incidents, newest opened first
          content:
            application/json:
              schema:
                type: object
                required: [incidents, next_cursor, counts]
                properties:
                  incidents:
                    type: array
                    items: { $ref: "#/components/schemas/AlertIncident" }
                  next_cursor: { type: [string, "null"] }
                  counts:
                    type: object
                    description: All incidents of the organization by state (resolved = last 7 days)
                    required: [open, acknowledged, resolved]
                    properties:
                      open: { type: integer }
                      acknowledged: { type: integer }
                      resolved: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/alerts/incidents/{id}:
    get:
      tags: [alerts]
      operationId: getAlertIncident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Incident with timeline and notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertIncidentDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alerts/incidents/{id}/acknowledge:
    post:
      tags: [alerts]
      operationId: acknowledgeAlertIncident
      description: Member or higher. Idempotent; 409 when resolved. Stops re-notifications.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertIncident" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/alerts/incidents/{id}/resolve:
    post:
      tags: [alerts]
      operationId: resolveAlertIncident
      description: Member or higher. Sends resolve notifications; a still-breaching series may open a new incident.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertIncident" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/alerts/incidents/{id}/notes:
    post:
      tags: [alerts]
      operationId: addAlertIncidentNote
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201":
          description: Timeline event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertIncidentEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alerts/channels:
    get:
      tags: [alerts]
      operationId: listAlertChannels
      responses:
        "200":
          description: Channels ordered by name (secrets masked)
          content:
            application/json:
              schema:
                type: object
                required: [channels, secrets_configured]
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/AlertChannel" }
                  secrets_configured: { type: boolean, description: "false: OPENLOG_SECRETS_KEY is not set, channels cannot be saved" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [alerts]
      operationId: createAlertChannel
      description: Admin or owner. 409 when OPENLOG_SECRETS_KEY is not configured.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertChannelInput" }
      responses:
        "201":
          description: Created channel; generated_secrets is shown only here
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/alerts/channels/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [alerts]
      operationId: getAlertChannel
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertChannel" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [alerts]
      operationId: updateAlertChannel
      description: Admin or owner. Secret fields left out keep their stored values. The type cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertChannelInput" }
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [alerts]
      operationId: deleteAlertChannel
      description: Admin or owner. Removes the channel from rules; pending notifications fail.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alerts/channels/{id}/test:
    post:
      tags: [alerts]
      operationId: testAlertChannel
      description: Admin or owner. Sends a test notification synchronously (no retries) and records it in the delivery log.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Result (success false when the receiver failed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertChannelTestResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/alerts/routing-rules:
    get:
      tags: [alerts]
      operationId: listAlertRoutingRules
      description: Routing rules of the organization in evaluation order (alerting.md §5.6).
      responses:
        "200":
          description: Routing rules
          content:
            application/json:
              schema:
                type: object
                required: [routing_rules]
                properties:
                  routing_rules:
                    type: array
                    items: { $ref: "#/components/schemas/AlertRoutingRule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [alerts]
      operationId: createAlertRoutingRule
      description: Admin or owner. 409 when the organization already has a default route or reached 100 routing rules.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRoutingRuleInput" }
      responses:
        "201":
          description: Created routing rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRoutingRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/alerts/routing-rules/reorder:
    post:
      tags: [alerts]
      operationId: reorderAlertRoutingRules
      description: Admin or owner. Sets the evaluation order; ids must list every routing rule of the organization exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Routing rules in the new order
          content:
            application/json:
              schema:
                type: object
                required: [routing_rules]
                properties:
                  routing_rules:
                    type: array
                    items: { $ref: "#/components/schemas/AlertRoutingRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

