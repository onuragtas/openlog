      operationId: getOrgPlan
      summary: Plan assignment of any organization (superadmin, OPENLOG_SUPERADMIN_EMAILS)
      responses:
        "200":
          description: Assignment and effective plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgPlan" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [usage]
      operationId: putOrgPlan
      summary: Assign a plan, overrides and billing ids (superadmin; audit plan.update)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgPlanInput" }
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/billing/webhooks/{provider}:
    post:
