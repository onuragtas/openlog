  # ---- SaaS operations (api.md "SaaS operations", D-105, D-106) ----

  /api/v1/operator/me:
    get:
      tags: [operator]
      operationId: getOperatorMe
      summary: Whether the caller is an openlog operator (superadmin)
      responses:
        "200":
          description: Operator flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorMe" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/operator/orgs:
    get:
      tags: [operator]
