      summary: Read-only dashboard of a share link (no authentication)
      security: []
      responses:
        "200":
          description: Shared dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedDashboard" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/public/dashboards/{token}/widgets/{widget_id}/result:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
      - { name: widget_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [dashboards]
      operationId: getSharedWidgetResult
      summary: Result of a shared widget's stored query for the link's range and variables (no authentication)
      security: []
      responses:
        "200":
          description: OQL result (execution statistics blanked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OqlResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The widget's stored query cannot be run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "504":
          description: Query timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/render/dashboard:
    get:
      tags: [dashboards]
      operationId: getRenderDashboard
      summary: Report print view dashboard for openlog-renderer (render token only; exists with OPENLOG_RENDERER_URL, D-097)
      description: |
        Authorization: Bearer olrt_… render token signed by the api leader (≤ 10 minutes, bound to one enabled scheduled
        report and its period). Sessions, API keys and share tokens are refused. Same document as a share link, with the
        report period as from/to.
      security: []
      parameters:
        - { name: Authorization, in: header, required: true, schema: { type: string }, description: "Bearer olrt_…" }
      responses:
        "200":
          description: Dashboard of the report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedDashboard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/render/dashboard/widgets/{widget_id}/result:
    parameters:
      - { name: widget_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [dashboards]
      operationId: getRenderWidgetResult
      summary: Result of a report widget's stored query for the report period (render token only, D-097)
      security: []
      parameters:
        - { name: Authorization, in: header, required: true, schema: { type: string }, description: "Bearer olrt_…" }
      responses:
        "200":
          description: OQL result (execution statistics blanked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OqlResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The widget's stored query cannot be run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: Query timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/usage:
    get:
      tags: [usage]
      operationId: getUsage
      summary: Usage of a billing period against the plan limits (any role, API keys)
      parameters:
        - { name: period, in: query, description: "current (default), previous or YYYY-MM (UTC calendar month)", schema: { type: string } }
      responses:
        "200":
          description: Usage overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/usage/daily:
    get:
      tags: [usage]
      operationId: getUsageDaily
      parameters:
        - { name: period, in: query, description: "current (default), previous or YYYY-MM", schema: { type: string } }
      responses:
        "200":
          description: One entry per day with usage, ordered by day
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageDaily" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/usage/top:
    get:
      tags: [usage]
      operationId: getUsageTop
      parameters:
        - { name: period, in: query, description: "current (default), previous or YYYY-MM", schema: { type: string } }
        - { name: by, in: query, schema: { type: string, enum: [service, host], default: service } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        "200":
          description: Services or hosts with the most stored bytes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageTop" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/usage/export:
    get:
      tags: [usage]
      operationId: exportUsage
      summary: Invoice-period export (admin, owner)
      parameters:
        - { name: period, in: query, description: "current (default), previous or YYYY-MM", schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
      responses:
        "200":
          description: "Attachment openlog-usage-<tenant>-<period>.<format>; CSV columns tenant_id,period,day,metric,value (usage.md \"Export\")"
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/UsageExport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/usage/status:
    get:
      tags: [usage]
      operationId: getUsageStatus
      summary: Latest quota evaluation of the organization (banner)
      responses:
        "200":
          description: Level ok with no metrics when the organization was not evaluated yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

