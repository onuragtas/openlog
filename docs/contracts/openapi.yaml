          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanCatalog" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/usage/query-limits:
    get:
      tags: [usage]
      operationId: getQueryLimits
