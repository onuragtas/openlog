      responses:
        "200":
          description: Layers, effective limits and sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgQueryLimits" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [usage]
      operationId: putQueryLimits
