      parameters:
        - { name: q, in: query, description: Name, tenant id, organization id or member e-mail substring, schema: { type: string } }
        - { name: plan, in: query, description: Effective plan id, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [active, suspended, trial, flagged] } }
        - { name: sort, in: query, schema: { type: string, enum: [created, name, ingest, members, last_ingest] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
