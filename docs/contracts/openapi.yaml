      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, note]
              properties:
                status: { type: string, enum: [dismissed, actioned] }
                note: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "200":
          description: Resolved flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AbuseFlag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/current/saas:
    get:
      tags: [operator]
      operationId: getOrgSaaSState
      summary: Suspension, trial and support access of the current organization
      responses:
        "200":
          description: SaaS state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSaaSState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/orgs/current/support-access:
    put:
      tags: [operator]
      operationId: grantSupportAccess
      summary: Allow openlog support to open read-only support views (owners; audit support_access.grant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration]
              properties:
                duration: { type: string, enum: ["24h", "7d"] }
      responses:
        "200":
          description: SaaS state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSaaSState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [operator]
      operationId: revokeSupportAccess
      summary: Revoke support access and end open support sessions (owners; audit support_access.revoke)
      responses:
        "200":
          description: SaaS state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSaaSState" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/account/privacy:
    get:
      tags: [privacy]
      operationId: getAccountPrivacy
      summary: Re-authentication info, export flag and scheduled deletions of organizations the caller owns
      responses:
        "200":
          description: Privacy settings of the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountPrivacy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/account/data-exports:
    get:
      tags: [privacy]
      operationId: listPersonalExports
      responses:
        "200":
          description: The caller's personal exports, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExportList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [privacy]
      operationId: requestPersonalExport
      summary: Queue an export of the caller's personal data
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExportEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/account/delete:
    post:
      tags: [privacy]
      operationId: deleteAccount
      summary: Delete the caller's account (re-authentication required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_email]
              properties:
                confirm_email: { type: string }
                password: { type: string, description: Required for users with a password }
      responses:
        "204": { description: Deleted; the session cookie is cleared }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/data-exports:
    get:
      tags: [privacy]
      operationId: listOrgExports
      summary: Exports of the current organization (owner)
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExportList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [privacy]
      operationId: requestOrgExport
      summary: Queue an export of the current organization (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgExportRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExportEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/data-exports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [privacy]
      operationId: getExport
      responses:
        "200":
          description: The export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExportEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/data-exports/{id}/download:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [privacy]
      operationId: downloadExport
      responses:
        "200":
          description: ZIP archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/data-exports/download:
    get:
      tags: [privacy]
      operationId: downloadExportByToken
      summary: Download an archive through the e-mailed, expiring link
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: ZIP archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orgs/current/deletion:
    post:
      tags: [privacy]
      operationId: scheduleOrgDeletion
      summary: Schedule the current organization's deletion (owner, re-authentication required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_name]
              properties:
                confirm_name: { type: string, description: The organization name }
                password: { type: string, description: Required for users with a password }
      responses:
        "202":
          description: Scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDeletionEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/org-deletions/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [privacy]
      operationId: cancelOrgDeletion
      summary: Cancel a scheduled deletion of an organization the caller owns
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDeletionEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/orgs/{org}/deletion:
    parameters:
      - { name: org, in: path, required: true, description: Organization id or tenant id, schema: { type: string } }
    post:
      tags: [privacy]
      operationId: adminScheduleOrgDeletion
      summary: Schedule an organization's deletion with a reason (superadmin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
                immediate: { type: boolean, default: false, description: Skip the grace period }
      responses:
        "202":
          description: Scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDeletionEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/org-deletions:
    get:
      tags: [privacy]
      operationId: adminListOrgDeletions
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Deletions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [deletions]
                properties:
                  deletions: { type: array, items: { $ref: "#/components/schemas/OrgDeletion" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/org-deletions/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [privacy]
      operationId: adminCancelOrgDeletion
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDeletionEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/deletion-certificates:
    get:
      tags: [privacy]
      operationId: adminListDeletionCertificates
      parameters:
        - { name: subject_hash, in: query, description: Hex sha256 of a tenant id or user id, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Certificates, newest first
          content:
            application/json:
              schema:
                type: object
                required: [certificates]
                properties:
                  certificates: { type: array, items: { $ref: "#/components/schemas/DeletionCertificate" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/status:
    get:
      tags: [status]
      operationId: getStatusPage
      summary: Public status page (OPENLOG_STATUS_PAGE_ENABLED; cacheable for 30 s)
      security: []
      responses:
        "200":
          description: Component health, uptime history, incidents and maintenance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/status/incidents:
    get:
      tags: [status]
      operationId: listStatusIncidents
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Incidents and maintenance windows, newest first (superadmin)
          content:
            application/json:
              schema:
                type: object
                required: [incidents, components]
                properties:
                  incidents: { type: array, items: { $ref: "#/components/schemas/StatusIncident" } }
                  components: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [status]
      operationId: createStatusIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusIncidentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusIncidentEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/status/incidents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [status]
      operationId: updateStatusIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusIncidentInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusIncidentEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [status]
      operationId: deleteStatusIncident
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/status/incidents/{id}/updates:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [status]
      operationId: addStatusIncidentUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, message]
              properties:
                status: { type: string }
                message: { type: string, maxLength: 5000 }
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusIncidentEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    scimToken:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer ols_…` — SCIM token of one organization (only /api/scim/v2)."
    session:
      type: apiKey
      in: cookie
      name: openlog_session
      description: Session cookie from POST /api/v1/auth/login. Mutating requests also need the X-CSRF-Token header.
    apiKey:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer ola_…` — API key acting with its own role: viewer (the default), member or admin (api.md \"Roles\", D-133). Identity, credentials, fleet, backend updates and own-account operations stay signed-in-user-only."
    licenseKey:
      type: apiKey
      in: header
      name: openlog-license-key
      description: OPENLOG_AUTH_MODE=static only (development/tests); also accepted as a bearer token in that mode.

  parameters:
    HostID:
      name: host_id
      in: path
      required: true
      schema: { type: string }
    K8sClusterUID:
      name: cluster_uid
      in: path
      required: true
      schema: { type: string, maxLength: 256 }
    K8sNamespace:
      name: namespace
      in: path
      required: true
      schema: { type: string, maxLength: 256 }
    K8sWorkloadKind:
      name: kind
      in: path
      required: true
      schema: { $ref: "#/components/schemas/KubernetesWorkloadKind" }
    K8sWorkloadName:
      name: name
      in: path
      required: true
      schema: { type: string, maxLength: 256 }
    K8sPodUID:
      name: pod_uid
      in: path
      required: true
      schema: { type: string, maxLength: 256 }
    ContainerID:
      name: container_id
      in: path
      required: true
      description: 64 hex characters (case-insensitive)
      schema: { type: string, pattern: "^[0-9a-fA-F]{64}$" }
    From:
      name: from
      in: query
      description: RFC3339 or unix milliseconds. Default now − 1h.
      schema: { type: string }
    FieldSignal:
      name: signal
      in: query
      required: true
      schema: { $ref: "#/components/schemas/FieldSignal" }
    To:
      name: to
      in: query
      description: RFC3339 or unix milliseconds. Default now.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Default 100, capped by OPENLOG_API_MAX_ROWS.
      schema: { type: integer, minimum: 1 }

    ApmServiceName:
      name: service_name
      in: path
      required: true
      description: service.name (URL-encoded)
      schema: { type: string, minLength: 1, maxLength: 512 }
    ApmNamespace:
      name: namespace
      in: query
      description: service.namespace; omitted = all namespaces, present (also empty) = exact match
      schema: { type: string }
    ApmEnvironment:
      name: environment
      in: query
      description: deployment.environment(.name); omitted = all environments, present (also empty) = exact match
      schema: { type: string }
    ApmStep:
      name: step
      in: query
      description: Go duration >= 60s (default ~60 points), rounded up to whole minutes
      schema: { type: string, example: 5m }
    ApmErrorStatus:
      name: status
      in: query
      description: all (default) or a comma-separated list of unresolved, resolved, ignored
      schema: { type: string, example: unresolved }
    ApmErrorAssignee:
      name: assignee
      in: query
      description: any (default), none (unassigned), me (signed-in user) or a user id
      schema: { type: string }
    ApmErrorQuery:
      name: q
      in: query
      description: Case-insensitive substring of the error type, message, service name or span name
      schema: { type: string, maxLength: 256 }
    ApmErrorSort:
      name: sort
      in: query
      schema: { type: string, enum: [count, last_seen, first_seen], default: count }
    ApmGroupID:
      name: group_id
      in: path
      required: true
      description: 16 hex digits
      schema: { type: string, pattern: "^[0-9a-fA-F]{16}$" }
  responses:
    BadRequest:
      description: invalid_argument
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: unauthenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: not_found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: internal
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Timeout:
      description: timeout
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: permission_denied (role, API key read-only, CSRF token, organization)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: already_exists or failed_precondition (last owner)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: resource_exhausted (sign-in rate limit, update request rate limit), with Retry-After
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: unavailable (authentication backend) or storage_unavailable (telemetry queries whose data on cold/S3 storage cannot be read; retryable true), with Retry-After
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ---- usage, plans and quotas (usage.md) ----
    UsagePeriod:
      type: object
      required: [id, start, end, data_until]
      properties:
        id: { type: string, description: YYYY-MM }
        start: { $ref: "#/components/schemas/Timestamp" }
        end: { $ref: "#/components/schemas/Timestamp" }
        data_until: { $ref: "#/components/schemas/Timestamp" }

    PlanQueryLimits:
      type: object
      properties:
        max_memory_usage: { type: integer }
        max_rows_to_read: { type: integer }
        max_bytes_to_read: { type: integer }

    QueryLimitValues:
      type: object
      description: 0 = not set by openlog (the ClickHouse read user's profile applies)
      required: [max_memory_usage, max_rows_to_read, max_bytes_to_read]
      properties:
        max_memory_usage: { type: integer, format: int64 }
        max_rows_to_read: { type: integer, format: int64 }
        max_bytes_to_read: { type: integer, format: int64 }

    OrgQueryLimitsInput:
      type: object
      description: null or absent = inherit the plan / defaults
      properties:
        max_memory_usage: { type: [integer, "null"], format: int64, minimum: 0 }
        max_rows_to_read: { type: [integer, "null"], format: int64, minimum: 0 }
        max_bytes_to_read: { type: [integer, "null"], format: int64, minimum: 0 }

    QueryLimitSource:
      type: string
      enum: [default, plan, organization, environment]

    OrgQueryLimits:
      type: object
      required: [defaults, plan, organization, environment, effective, sources, can_manage, refresh_seconds]
      properties:
        defaults: { $ref: "#/components/schemas/QueryLimitValues" }
        plan: { $ref: "#/components/schemas/QueryLimitValues" }
        organization:
          description: The organization setting; null when none is stored
          oneOf:
            - type: "null"
            - type: object
              required: [max_memory_usage, max_rows_to_read, max_bytes_to_read, updated_at, updated_by]
              properties:
                max_memory_usage: { type: [integer, "null"], format: int64 }
                max_rows_to_read: { type: [integer, "null"], format: int64 }
                max_bytes_to_read: { type: [integer, "null"], format: int64 }
                updated_at: { $ref: "#/components/schemas/Timestamp" }
                updated_by: { type: string, description: E-mail of the last editor (empty when the user was deleted) }
        environment:
          description: The tenant's OPENLOG_QUERY_TENANT_LIMITS entry (replaces every layer); null when none
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/QueryLimitValues"
        effective: { $ref: "#/components/schemas/QueryLimitValues" }
        sources:
          type: object
          required: [max_memory_usage, max_rows_to_read, max_bytes_to_read]
          properties:
            max_memory_usage: { $ref: "#/components/schemas/QueryLimitSource" }
            max_rows_to_read: { $ref: "#/components/schemas/QueryLimitSource" }
            max_bytes_to_read: { $ref: "#/components/schemas/QueryLimitSource" }
        can_manage: { type: boolean }
        refresh_seconds: { type: integer, description: Other api/alert pods apply a change within this many seconds }

    PlanLimits:
      type: object
      description: 0 or absent = unlimited (retention_days absent = table default)
      required: [retention_days, query]
      properties:
        ingest_gb_month: { type: number, description: GiB per billing period }
        hosts: { type: integer }
        users: { type: integer }
        retention_days: { type: object, additionalProperties: { type: integer }, description: "keys logs, traces, metrics" }
        query: { $ref: "#/components/schemas/PlanQueryLimits" }
        ingest_bytes_per_second: { type: integer }
        ingest_burst_bytes: { type: integer }

    PlanEnforcement:
      type: object
      properties:
        hard_ingest_limit: { type: boolean }
        grace_percent: { type: number }

    Plan:
      type: object
      required: [id, name, description, limits, enforcement, trial_days, trial_fallback_plan]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        limits: { $ref: "#/components/schemas/PlanLimits" }
        enforcement: { $ref: "#/components/schemas/PlanEnforcement" }
        trial_days: { type: integer, minimum: 0, maximum: 365, description: "Trial length in days; > 0 = the plan can be trialled (D-106)" }
        trial_fallback_plan: { type: string, description: "Plan assigned when a trial of this plan ends (the catalog default unless set); empty for plans without trials" }

    PlanCatalog:
      type: object
      required: [plans, default]
      properties:
        plans: { type: array, items: { $ref: "#/components/schemas/Plan" } }
        default: { type: string }

    PlanOverrides:
      type: object
      description: Organization-specific limits replacing the plan's; absent fields keep the plan's value
      properties:
        ingest_gb_month: { type: number }
        hosts: { type: integer }
        users: { type: integer }
        retention_days: { type: object, additionalProperties: { type: integer } }
        query: { $ref: "#/components/schemas/PlanQueryLimits" }
        ingest_bytes_per_second: { type: integer }
        ingest_burst_bytes: { type: integer }
        hard_ingest_limit: { type: boolean }
        grace_percent: { type: number }

    QuotaMetric:
      type: object
      required: [metric, used, limit, percent, level]
      properties:
        metric: { type: string, enum: [ingest_bytes, hosts, users] }
        used: { type: number }
        limit: { type: number, description: 0 = unlimited }
        percent: { type: number }
        level: { $ref: "#/components/schemas/QuotaLevel" }

    QuotaLevel:
      type: string
      enum: [ok, warning, exceeded]

    UsageSignal:
      type: object
      required: [signal, items, bytes, ingest_bytes, ingest_requests]
      properties:
        signal: { type: string, enum: [traces, logs, metrics] }
        items: { type: number, description: Stored spans, log records or metric data points }
        bytes: { type: number, description: Estimated uncompressed bytes of the stored rows }
        ingest_bytes: { type: number, description: Uncompressed OTLP protobuf bytes }
        ingest_requests: { type: number }

    UsageQuery:
      type: object
      required: [queries, failed, read_rows, read_bytes, cpu_seconds, memory_bytes]
      properties:
        queries: { type: number }
        failed: { type: number }
        read_rows: { type: number }
        read_bytes: { type: number }
        cpu_seconds: { type: number }
        memory_bytes: { type: number, description: Sum of per-query peak memory }

    UsageTotals:
      type: object
      required: [signals, ingest_bytes, hosts, containers, services, active_hosts, query]
      properties:
        signals: { type: array, items: { $ref: "#/components/schemas/UsageSignal" } }
        ingest_bytes: { type: number }
        hosts: { type: number, description: Distinct hosts in the range }
        containers: { type: number }
        services: { type: number }
        active_hosts: { type: number, description: Larger distinct host count of the last day and the day before }
        query: { $ref: "#/components/schemas/UsageQuery" }

    UsageStored:
      type: object
      required: [signal, retention_days, bytes, compressed_bytes]
      properties:
        signal: { type: string, enum: [traces, logs, metrics] }
        retention_days: { type: integer }
        bytes: { type: number }
        compressed_bytes: { type: number, description: bytes x the table's current compression ratio }

    UsageOverview:
      type: object
      required: [organization, period, saas_mode, plan, plan_assigned, usage, stored, limits, level, ingest_blocked, projection, can_manage_plan, billing_enabled]
      properties:
        organization:
          type: object
          required: [id, name, tenant_id]
          properties:
            id: { type: string }
            name: { type: string }
            tenant_id: { type: string }
        period: { $ref: "#/components/schemas/UsagePeriod" }
        saas_mode: { type: boolean }
        plan: { $ref: "#/components/schemas/Plan" }
        plan_assigned: { type: boolean, description: false = the default plan applies }
        usage: { $ref: "#/components/schemas/UsageTotals" }
        stored: { type: array, items: { $ref: "#/components/schemas/UsageStored" } }
        limits: { type: array, items: { $ref: "#/components/schemas/QuotaMetric" } }
        level: { $ref: "#/components/schemas/QuotaLevel" }
        ingest_blocked: { type: boolean }
        projection:
          type: object
          required: [ingest_bytes]
          properties:
            ingest_bytes: { type: number, description: Projected ingest at period end }
            ingest_percent: { type: number }
        can_manage_plan: { type: boolean, description: The caller is a superadmin }
        billing_enabled: { type: boolean }

    UsageDay:
      type: object
      required: [day, signals, ingest_bytes, hosts, containers, services, query]
      properties:
        day: { type: string, format: date }
        signals: { type: array, items: { $ref: "#/components/schemas/UsageSignal" } }
        ingest_bytes: { type: number }
        hosts: { type: number }
        containers: { type: number }
        services: { type: number }
        query: { $ref: "#/components/schemas/UsageQuery" }

    UsageDaily:
      type: object
      required: [period, days]
      properties:
        period: { $ref: "#/components/schemas/UsagePeriod" }
        days: { type: array, items: { $ref: "#/components/schemas/UsageDay" } }

    UsageTopEntry:
      type: object
      required: [key, items, bytes, bytes_by_signal]
      properties:
        key: { type: string }
        items: { type: number }
        bytes: { type: number }
        bytes_by_signal: { type: object, additionalProperties: { type: number } }

    UsageTop:
      type: object
      required: [period, by, entries]
      properties:
        period: { $ref: "#/components/schemas/UsagePeriod" }
        by: { type: string, enum: [service, host] }
        entries: { type: array, items: { $ref: "#/components/schemas/UsageTopEntry" } }

    UsageExport:
      type: object
      required: [organization, plan_id, period, totals, days]
      properties:
        organization: { type: object, additionalProperties: { type: string } }
        plan_id: { type: string }
        period: { $ref: "#/components/schemas/UsagePeriod" }
        totals: { $ref: "#/components/schemas/UsageTotals" }
        days: { type: array, items: { $ref: "#/components/schemas/UsageDay" } }

    UsageStatus:
      type: object
      required: [level, ingest_blocked, metrics, saas_mode]
      properties:
        level: { $ref: "#/components/schemas/QuotaLevel" }
        ingest_blocked: { type: boolean }
        metrics: { type: array, items: { $ref: "#/components/schemas/QuotaMetric" } }
        saas_mode: { type: boolean }
        plan_id: { type: string }
        evaluated_at: { $ref: "#/components/schemas/Timestamp" }
        period_start: { type: string, format: date }

    OrgPlan:
      type: object
      required: [organization, plan_id, assigned, overrides, billing, note, updated_at, updated_by, effective]
      properties:
        organization:
          type: object
          required: [id, name, tenant_id]
          properties:
            id: { type: string }
            name: { type: string }
            tenant_id: { type: string }
        plan_id: { type: string }
        assigned: { type: boolean }
        overrides: { $ref: "#/components/schemas/PlanOverrides" }
        billing:
          type: object
          required: [provider, customer_id, subscription_id]
          properties:
            provider: { type: string }
            customer_id: { type: string }
            subscription_id: { type: string }
        note: { type: string }
        updated_at: { $ref: "#/components/schemas/NullableTimestamp" }
        updated_by: { type: string }
        effective: { $ref: "#/components/schemas/Plan" }

    OrgPlanInput:
      type: object
      required: [plan_id]
      properties:
        plan_id: { type: string }
        overrides: { $ref: "#/components/schemas/PlanOverrides" }
        billing:
          type: object
          properties:
            provider: { type: string }
            customer_id: { type: string }
            subscription_id: { type: string }
        note: { type: string, maxLength: 1000 }

    # ---- SaaS operations ----

    OperatorMe:
      type: object
      required: [operator, saas_mode]
      properties:
        operator: { type: boolean }
        saas_mode: { type: boolean }

    OperatorReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000, description: Written to the organization's audit log }

    TrialInput:
      type: object
      required: [reason]
      properties:
        plan_id: { type: string, description: Required to start a trial; must match the running trial's plan to extend it }
        days: { type: integer, minimum: 1, maximum: 365, description: "Start: trial length (default the plan's trial_days). Extend: days added to the current end" }
        ends_at: { type: string, description: Explicit end (RFC3339 or unix ms); exclusive with days }
        reason: { type: string, minLength: 3, maxLength: 1000 }

    OperatorOrg:
      type: object
      required: [id, tenant_id, name, created_at, plan_id, plan_assigned, state, suspended_at, suspend_reason, trial_plan_id, trial_ends_at,
        support_access_until, members, active_hosts, ingest_bytes, quota_level, last_ingest_at, open_flags]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        plan_id: { type: string, description: Effective plan id (the default plan when not assigned) }
        plan_assigned: { type: boolean }
        state: { type: string, enum: [active, suspended, trial] }
        suspended_at: { type: string, format: date-time, nullable: true }
        suspend_reason: { type: string }
        trial_plan_id: { type: string }
        trial_ends_at: { type: string, format: date-time, nullable: true }
        support_access_until: { type: string, format: date-time, nullable: true }
        members: { type: integer }
        active_hosts: { type: integer }
        ingest_bytes: { type: integer, description: Ingest of the current period at the last quota evaluation }
        quota_level: { type: string, enum: [ok, warning, exceeded] }
        last_ingest_at: { type: string, format: date-time, nullable: true, description: Latest license key use }
        open_flags: { type: integer }

    OperatorOrgList:
      type: object
      required: [organizations, total, saas_mode]
      properties:
        organizations: { type: array, items: { $ref: "#/components/schemas/OperatorOrg" } }
        total: { type: integer }
        saas_mode: { type: boolean }

    OperatorMember:
      type: object
      required: [user_id, email, name, role, joined_at, last_login_at, email_verified, disabled]
      properties:
        user_id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        joined_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
        email_verified: { type: boolean }
        disabled: { type: boolean }

    OperatorSSOConnection:
      type: object
      required: [id, protocol, name, enabled, enforce, jit_enabled, last_test_ok]
      properties:
        id: { type: string }
        protocol: { type: string, enum: [oidc, saml] }
        name: { type: string }
        enabled: { type: boolean }
        enforce: { type: boolean }
        jit_enabled: { type: boolean }
        last_test_ok: { type: boolean }

    OperatorAuditEntry:
      type: object
      required: [id, actor_email, action, target_type, target_id, details, created_at]
      properties:
        id: { type: integer }
        actor_email: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        details: { type: object, additionalProperties: true, nullable: true }
        created_at: { type: string, format: date-time }

    OrgLifecycle:
      type: object
      required: [org_id, tenant_id, suspended, suspended_at, suspend_reason, trial_plan_id, trial_started_at, trial_ends_at, trial_ended_at,
        support_access_until, support_access_granted_at]
      properties:
        org_id: { type: string }
        tenant_id: { type: string }
        suspended: { type: boolean }
        suspended_at: { type: string, format: date-time, nullable: true }
        suspend_reason: { type: string }
        trial_plan_id: { type: string }
        trial_started_at: { type: string, format: date-time, nullable: true }
        trial_ends_at: { type: string, format: date-time, nullable: true }
        trial_ended_at: { type: string, format: date-time, nullable: true }
        support_access_until: { type: string, format: date-time, nullable: true }
        support_access_granted_at: { type: string, format: date-time, nullable: true }

    SupportSession:
      type: object
      required: [id, org_id, org_name, tenant_id, operator_email, reason, started_at, expires_at, ended_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        org_name: { type: string }
        tenant_id: { type: string }
        operator_email: { type: string }
        reason: { type: string }
        started_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }

    AbuseFlag:
      type: object
      required: [id, org_id, org_name, tenant_id, kind, status, details, occurrences, first_seen_at, last_seen_at, auto_suspended,
        resolved_by_email, resolved_at, resolution_note, org_suspended]
      properties:
        id: { type: integer }
        org_id: { type: string }
        org_name: { type: string }
        tenant_id: { type: string }
        kind: { type: string, enum: [ingest_spike, new_org_hosts, ingest_source_ips] }
        status: { type: string, enum: [open, dismissed, actioned] }
        details: { type: object, additionalProperties: true, nullable: true }
        occurrences: { type: integer }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        auto_suspended: { type: boolean }
        resolved_by_email: { type: string }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolution_note: { type: string }
        org_suspended: { type: boolean }

    OperatorOrgDetail:
      type: object
      required: [organization, lifecycle, audit, usage, saas_mode]
      properties:
        organization:
          allOf:
            - { $ref: "#/components/schemas/OperatorOrg" }
            - type: object
              required: [member_list, pending_invitations, keys, sso_connections, verified_domains, flags, support_sessions, support_access_granted_by]
              properties:
                member_list: { type: array, items: { $ref: "#/components/schemas/OperatorMember" }, description: "Members (at most 500); `members` is the count" }
                pending_invitations: { type: integer }
                keys:
                  type: object
                  required: [license_keys_active, license_keys_revoked, api_keys_active, scim_tokens_active, last_ingest_at]
                  properties:
                    license_keys_active: { type: integer }
                    license_keys_revoked: { type: integer }
                    api_keys_active: { type: integer }
                    scim_tokens_active: { type: integer }
                    last_ingest_at: { type: string, format: date-time, nullable: true }
                sso_connections: { type: array, items: { $ref: "#/components/schemas/OperatorSSOConnection" } }
                verified_domains: { type: integer }
                flags: { type: array, items: { $ref: "#/components/schemas/AbuseFlag" } }
                support_sessions: { type: array, items: { $ref: "#/components/schemas/SupportSession" } }
                support_access_granted_by: { type: string }
        plan: { $ref: "#/components/schemas/OrgPlan" }
        quota:
          type: object
          nullable: true
          required: [level, ingest_blocked, metrics, evaluated_at, period_start]
          properties:
            level: { type: string, enum: [ok, warning, exceeded] }
            ingest_blocked: { type: boolean }
            metrics: { type: array, items: { $ref: "#/components/schemas/QuotaMetric" } }
            evaluated_at: { $ref: "#/components/schemas/Timestamp" }
            period_start: { type: string, format: date }
        lifecycle: { $ref: "#/components/schemas/OrgLifecycle" }
        audit: { type: array, items: { $ref: "#/components/schemas/OperatorAuditEntry" } }
        usage:
          type: object
          required: [period, days, available]
          properties:
            period: { $ref: "#/components/schemas/UsagePeriod" }
            days: { type: array, items: { $ref: "#/components/schemas/UsageDay" } }
            available: { type: boolean, description: false when ClickHouse could not be read }
        saas_mode: { type: boolean }

    OrgSaaSState:
      type: object
      required: [saas_mode, suspended, trial, support_access, support_session, can_manage_support_access]
      properties:
        saas_mode: { type: boolean }
        suspended: { type: boolean }
        trial:
          type: object
          nullable: true
          required: [plan_id, plan_name, ends_at, fallback_plan_id]
          properties:
            plan_id: { type: string }
            plan_name: { type: string }
            ends_at: { $ref: "#/components/schemas/Timestamp" }
            fallback_plan_id: { type: string }
        support_access:
          type: object
          nullable: true
          required: [until, granted_at]
          properties:
            until: { $ref: "#/components/schemas/Timestamp" }
            granted_at: { $ref: "#/components/schemas/NullableTimestamp" }
        support_session:
          type: object
          nullable: true
          required: [id, operator_email, expires_at, org_name]
          properties:
            id: { type: string }
            operator_email: { type: string }
            expires_at: { $ref: "#/components/schemas/Timestamp" }
            org_name: { type: string }
        can_manage_support_access: { type: boolean }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_argument, unauthenticated, permission_denied, not_found, already_exists, failed_precondition, resource_exhausted, internal, unavailable, storage_unavailable, timeout]
            message: { type: string }
            retryable:
              type: boolean
              description: Present (true) on storage_unavailable; the same request is expected to succeed later.

    Timestamp:
      type: string
      format: date-time
      description: RFC3339 with nanoseconds, UTC (e.g. 2026-09-13T10:00:00.000000000Z)

    StringMap:
      type: object
      additionalProperties: { type: string }

    Host:
      type: object
      required: [host_id, host_name, os_description, arch, agent_version, last_seen, resource_attributes]
      properties:
        host_id: { type: string }
        host_name: { type: string }
        os_description: { type: string }
        arch: { type: string }
        agent_version: { type: string }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
        resource_attributes: { $ref: "#/components/schemas/StringMap" }
        usage: { $ref: "#/components/schemas/HostUsage" }

    HostUsage:
      type: object
      description: >-
        How busy the host is over the last 5 minutes, from the same metrics its own charts draw. Every field
        is null when the host sent no such metric in the window — an agent that stopped reporting must not
        read as 0 %.
      required: [cpu, memory, disk, load1, load_per_cpu]
      properties:
        cpu: { type: number, nullable: true, description: "Busy share 0–1 (1 − idle)" }
        memory: { type: number, nullable: true, description: "Used share 0–1 of total memory" }
        disk: { type: number, nullable: true, description: "Used share 0–1 of the *fullest* filesystem, not the average one" }
        load1: { type: number, nullable: true, description: 1-minute load average }
        load_per_cpu: { type: number, nullable: true, description: The load average divided by the logical CPU count }

    CostPricing:
      type: object
      description: Provenance of every cost number; rendered next to the figures so an estimate is never mistaken for a bill.
      required: [version, updated, currency, note, estimated]
      properties:
        version: { type: integer, description: Price table version }
        updated: { type: string, example: "2026-09-17", description: Date the prices were last collected }
        currency: { type: string, example: USD }
        note: { type: string, description: What the estimate ignores (discounts, taxes, storage, egress, …) }
        estimated: { type: boolean, description: Always true — never billing data }
        override_file: { type: string, description: Operator override merged into the table, when configured }

    CostSource:
      type: string
      description: >-
        Where the host's price came from: an exact instance type in the table or the operator's override,
        a per-vCPU/per-GB estimate, or none at all (the host is unpriced, not free).
      enum: [table, override, fallback, none]

    CostPrice:
      type: object
      required: [usd_per_hour, source, region_multiplier]
      properties:
        usd_per_hour: { type: number, format: double }
        source: { $ref: "#/components/schemas/CostSource" }
        note: { type: string, description: Caveat for this lookup, e.g. an unknown spot price }
        region_multiplier: { type: number, format: double, description: Factor applied for the host's region (1.0 when unknown) }

    CostSummary:
      type: object
      description: >-
        Fleet cost over the range. total = services + unallocated + unattributed + idle, always.
      required: [currency, total, services, unallocated, unattributed, idle, idle_share, per_hour,
        hosts, priced_hosts, unpriced_hosts, host_hours]
      properties:
        currency: { type: string, example: USD }
        total: { type: number, format: double }
        services: { type: number, format: double, description: Containers linked to an APM service }
        unallocated: { type: number, format: double, description: Containers with no linked service }
        unattributed: { type: number, format: double, description: Host usage no container explains (work outside containers) }
        idle: { type: number, format: double, description: Capacity nobody used; never spread over the services }
        idle_share: { type: number, format: double, description: idle / total (0 when total is 0) }
        per_hour: { type: number, format: double, description: Run rate, total / host_hours }
        hosts: { type: integer }
        priced_hosts: { type: integer }
        unpriced_hosts: { type: integer, description: Hosts with neither instance facts nor capacity }
        host_hours: { type: number, format: double }

    CostHost:
      type: object
      required: [host_id, host_name, provider, instance_type, region, zone, lifecycle, vcpus, memory_bytes,
        hours, price, total, services, unallocated, unattributed, idle, used_share, idle_share, oversubscribed, priced]
      properties:
        host_id: { type: string }
        host_name: { type: string }
        provider: { type: string, example: aws, description: "cloud.provider; empty when the host is not in a known cloud" }
        instance_type: { type: string, example: m5.large }
        region: { type: string, example: eu-central-1 }
        zone: { type: string, example: eu-central-1a }
        lifecycle: { type: string, example: on-demand, description: "on-demand, spot or preemptible" }
        vcpus: { type: number, format: double }
        memory_bytes: { type: number, format: double }
        hours: { type: number, format: double, description: Hours the host reported within the range }
        price: { $ref: "#/components/schemas/CostPrice" }
        total: { type: number, format: double }
        services: { type: number, format: double }
        unallocated: { type: number, format: double }
        unattributed: { type: number, format: double }
        idle: { type: number, format: double }
        used_share: { type: number, format: double, description: Fraction of the machine in use (0..1) }
        idle_share: { type: number, format: double, description: 1 − used_share }
        oversubscribed:
          type: boolean
          description: Container shares summed above the host's usage and were scaled to fit; the host total stays exact.
        priced: { type: boolean, description: False when no price could be determined; contributes to no total }

    CostService:
      type: object
      required: [service_name, service_namespace, environment, total, hosts, containers]
      properties:
        service_name: { type: string }
        service_namespace: { type: string }
        environment: { type: string, description: The same service in two environments is two rows }
        total: { type: number, format: double }
        hosts:
          type: array
          items: { type: string }
        containers: { type: integer }

    CostContainer:
      type: object
      required: [container_id, container_name, host_id, host_name, service_name, total, cpu_share, memory_share, share]
      properties:
        container_id: { type: string }
        container_name: { type: string }
        host_id: { type: string }
        host_name: { type: string }
        service_name: { type: string, description: Empty when no APM service is linked to this container }
        total: { type: number, format: double }
        cpu_share: { type: number, format: double }
        memory_share: { type: number, format: double }
        share: { type: number, format: double, description: Fraction of its host this container holds }

    CostTrendPoint:
      type: object
      required: [t, total, idle]
      properties:
        t: { type: integer, format: int64, description: Bucket start, unix milliseconds }
        total: { type: number, format: double }
        idle: { type: number, format: double }

    CostInstancePrice:
      type: object
      required: [on_demand]
      properties:
        on_demand: { type: number, format: double }
        spot: { type: number, format: double, description: Absent when unknown; the on-demand rate is then used }

    CostFallbackRate:
      type: object
      description: Prices a machine with no table entry from its capacity alone.
      required: [vcpu_hour, gb_hour]
      properties:
        vcpu_hour: { type: number, format: double }
        gb_hour: { type: number, format: double }

    CostPriceTable:
      type: object
      description: The effective price table (cost.md §2). Approximate list prices, not billing data.
      required: [version, updated, currency, instances, fallback]
      properties:
        version: { type: integer }
        updated: { type: string, example: "2026-09-17" }
        currency: { type: string, example: USD }
        note: { type: string }
        reference_regions:
          type: object
          description: Region each provider's prices are quoted for
          additionalProperties: { type: string }
        sources:
          type: array
          items: { type: string }
        instances:
          type: object
          description: provider → instance type → price
          additionalProperties:
            type: object
            additionalProperties: { $ref: "#/components/schemas/CostInstancePrice" }
        region_multipliers:
          type: object
          description: provider → region → factor applied to that provider's prices (1.0 when unlisted)
          additionalProperties:
            type: object
            additionalProperties: { type: number, format: double }
        fallback:
          type: object
          description: provider → per-vCPU/per-GB rate; the key "default" covers unknown providers
          additionalProperties: { $ref: "#/components/schemas/CostFallbackRate" }
        override_file: { type: string }
        overridden_keys:
          type: array
          description: What the operator's override replaced, e.g. "aws/m5.large", "fallback/aws"
          items: { type: string }

    KubernetesWorkloadKind:
      type: string
      description: "`Pod` is accepted but the cluster agent reports no Pod workloads"
      enum: [Deployment, StatefulSet, DaemonSet, Job, CronJob, ReplicaSet, Pod]

    KubernetesWorkloadHealth:
      type: string
      enum: [healthy, degraded, unavailable, unknown]

    KubernetesPodPhase:
      type: string
      enum: [Pending, Running, Succeeded, Failed, Unknown]

    KubernetesEventType:
      type: string
      enum: [Normal, Warning]

    KubernetesCluster:
      type: object
      required: [cluster_uid, cluster_name, version, first_seen, last_seen, reporting, nodes, nodes_ready, pods, pods_not_ready,
        workloads, workloads_unhealthy, namespaces]
      properties:
        cluster_uid: { type: string, description: "Resource k8s.cluster.uid (uid of the kube-system namespace)" }
        cluster_name: { type: string }
        version: { type: string, example: v1.31.2 }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
        reporting: { type: boolean, description: "Data within the last 5 minutes" }
        nodes: { type: integer, description: Current nodes }
        nodes_ready: { type: integer }
        pods:
          type: object
          description: Current pods by phase
          required: [Pending, Running, Succeeded, Failed, Unknown]
          properties:
            Pending: { type: integer }
            Running: { type: integer }
            Succeeded: { type: integer }
            Failed: { type: integer }
            Unknown: { type: integer }
        pods_not_ready: { type: integer, description: "Current Running pods that are not ready" }
        workloads: { type: integer, description: Current workloads }
        workloads_unhealthy: { type: integer, description: "degraded + unavailable" }
        namespaces: { type: array, items: { type: string }, description: "Namespaces with pods or workloads in the range" }

    KubernetesWorkloadKindCount:
      type: object
      required: [kind, total, healthy, degraded, unavailable, unknown]
      properties:
        kind: { type: string }
        total: { type: integer }
        healthy: { type: integer }
        degraded: { type: integer }
        unavailable: { type: integer }
        unknown: { type: integer }

    KubernetesClusterDetail:
      allOf:
        - $ref: "#/components/schemas/KubernetesCluster"
        - type: object
          required: [workloads_by_kind, warning_events, cpu_usage, memory_working_set, allocatable_cpu, allocatable_memory]
          properties:
            workloads_by_kind:
              type: array
              items: { $ref: "#/components/schemas/KubernetesWorkloadKindCount" }
            warning_events:
              type: array
              description: Latest 20 Warning events in the range, newest first
              items: { $ref: "#/components/schemas/KubernetesEvent" }
            cpu_usage: { type: [number, "null"], description: "cores, sum over nodes (node agents)" }
            memory_working_set: { type: [number, "null"], description: bytes }
            allocatable_cpu: { type: [number, "null"], description: cores }
            allocatable_memory: { type: [number, "null"], description: bytes }

    KubernetesNodeCondition:
      type: object
      required: [condition, status]
      properties:
        condition: { type: string, example: Ready }
        status: { type: string, enum: ["true", "false", unknown] }

    KubernetesNode:
      type: object
      required: [cluster_uid, cluster_name, node_name, node_uid, ready, unschedulable, roles, kubelet_version, os_image, container_runtime,
        internal_ip, created_at, allocatable_cpu, allocatable_memory, allocatable_pods, cpu_usage, memory_working_set, pods, host_id,
        host_name, first_seen, last_seen, reporting, conditions]
      properties:
        cluster_uid: { type: string }
        cluster_name: { type: string }
        node_name: { type: string }
        node_uid: { type: string }
        ready: { type: string, enum: ["true", "false", unknown] }
        unschedulable: { type: boolean }
        roles: { type: array, items: { type: string } }
        kubelet_version: { type: string }
        os_image: { type: string }
        container_runtime: { type: string }
        internal_ip: { type: string }
        created_at: { type: [string, "null"], description: RFC3339 }
        allocatable_cpu: { type: [number, "null"], description: cores }
        allocatable_memory: { type: [number, "null"], description: bytes }
        allocatable_pods: { type: [number, "null"] }
        cpu_usage: { type: [number, "null"], description: "cores (k8s.node.cpu.usage)" }
        memory_working_set: { type: [number, "null"], description: bytes }
        pods: { type: integer, description: "Current Running and Pending pods on the node" }
        host_id: { type: [string, "null"], description: "Host of the node agent (resource k8s.cluster.name + k8s.node.name)" }
        host_name: { type: [string, "null"] }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
        reporting: { type: boolean }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/KubernetesNodeCondition" }

    KubernetesWorkload:
      type: object
      required: [cluster_uid, cluster_name, namespace, kind, name, uid, desired, ready, available, updated, health, pods, restarts,
        cpu_usage, memory_working_set, cpu_sparkline, memory_sparkline, created_at, first_seen, last_seen, reporting]
      properties:
        cluster_uid: { type: string }
        cluster_name: { type: string }
        namespace: { type: string }
        kind: { type: string }
        name: { type: string }
        uid: { type: string }
        desired: { type: integer }
        ready: { type: integer }
        available: { type: integer, description: "Jobs: succeeded pods" }
        updated: { type: integer, description: "Jobs: failed pods" }
        health: { $ref: "#/components/schemas/KubernetesWorkloadHealth" }
        pods: { type: integer, description: Current pods of the workload }
        restarts: { type: integer, description: Sum of the restarts of its current pods }
        cpu_usage: { type: [number, "null"], description: "cores, sum over pods" }
        memory_working_set: { type: [number, "null"], description: "bytes, sum over pods" }
        cpu_sparkline: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
        memory_sparkline: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
        created_at: { type: [string, "null"], description: RFC3339 }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
        reporting: { type: boolean }

    KubernetesHPA:
      type: object
      required: [name, min_replicas, max_replicas, current_replicas, desired_replicas]
      properties:
        name: { type: string }
        min_replicas: { type: [number, "null"] }
        max_replicas: { type: [number, "null"] }
        current_replicas: { type: [number, "null"] }
        desired_replicas: { type: [number, "null"] }

    KubernetesWorkloadDetail:
      allOf:
        - $ref: "#/components/schemas/KubernetesWorkload"
        - type: object
          required: [pod_list, hpa, attributes]
          properties:
            pod_list:
              type: array
              items: { $ref: "#/components/schemas/KubernetesPod" }
            hpa:
              oneOf:
                - $ref: "#/components/schemas/KubernetesHPA"
                - type: "null"
            attributes: { $ref: "#/components/schemas/StringMap" }

    KubernetesWorkloadTimeseries:
      type: object
      required: [step, from, to, series]
      properties:
        step: { type: string, example: 20s }
        from: { type: integer, description: unix ms }
        to: { type: integer, description: unix ms }
        series:
          type: object
          required: [cpu_usage, memory_working_set, ready, desired, restarts]
          properties:
            cpu_usage: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
            memory_working_set: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
            ready: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
            desired: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
            restarts: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }

    KubernetesPod:
      type: object
      required: [cluster_uid, cluster_name, namespace, pod_name, pod_uid, node_name, workload_kind, workload_name, phase, ready, reason,
        status, restarts, pod_ip, qos_class, created_at, started_at, cpu_usage, memory_working_set, first_seen, last_seen, reporting]
      properties:
        cluster_uid: { type: string }
        cluster_name: { type: string }
        namespace: { type: string }
        pod_name: { type: string }
        pod_uid: { type: string }
        node_name: { type: string }
        workload_kind: { type: string, description: "Top-level owner kind, Pod for bare pods" }
        workload_name: { type: string }
        phase: { type: string, example: Running }
        ready: { type: boolean }
        reason: { type: string, example: CrashLoopBackOff }
        status: { type: string, description: "reason when set, else phase" }
        restarts: { type: integer }
        pod_ip: { type: string }
        qos_class: { type: string }
        created_at: { type: [string, "null"], description: RFC3339 }
        started_at: { type: [string, "null"], description: RFC3339 }
        cpu_usage: { type: [number, "null"], description: "cores (k8s.pod.cpu.usage)" }
        memory_working_set: { type: [number, "null"], description: bytes }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
        reporting: { type: boolean }

    KubernetesPodContainer:
      type: object
      required: [name, container_id, image, ready, restarts, state, reason, known, host_id, cpu_usage, memory_working_set, cpu_request,
        cpu_limit, memory_request, memory_limit]
      properties:
        name: { type: string }
        container_id: { type: string, description: "Empty before the container started" }
        image: { type: string }
        ready: { type: boolean }
        restarts: { type: integer }
        state: { type: string }
        reason: { type: string }
        known: { type: boolean, description: "The container is in the containers table (GET /containers/{container_id})" }
        host_id: { type: [string, "null"] }
        cpu_usage: { type: [number, "null"], description: cores }
        memory_working_set: { type: [number, "null"], description: bytes }
        cpu_request: { type: [number, "null"], description: cores }
        cpu_limit: { type: [number, "null"], description: cores }
        memory_request: { type: [number, "null"], description: bytes }
        memory_limit: { type: [number, "null"], description: bytes }

    KubernetesPodDetail:
      allOf:
        - $ref: "#/components/schemas/KubernetesPod"
        - type: object
          required: [containers, labels, services, host_id, host_name]
          properties:
            containers:
              type: array
              items: { $ref: "#/components/schemas/KubernetesPodContainer" }
            labels: { $ref: "#/components/schemas/StringMap" }
            services:
              type: array
              items:
                type: object
                required: [service_name, service_namespace, deployment_environment]
                properties:
                  service_name: { type: string }
                  service_namespace: { type: string }
                  deployment_environment: { type: string }
            host_id: { type: [string, "null"] }
            host_name: { type: [string, "null"] }

    KubernetesPodTimeseries:
      type: object
      required: [step, from, to, series]
      properties:
        step: { type: string, example: 20s }
        from: { type: integer, description: unix ms }
        to: { type: integer, description: unix ms }
        series:
          type: object
          required: [cpu_usage, memory_working_set, network_receive, network_transmit, restarts]
          properties:
            cpu_usage: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
            memory_working_set: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
            network_receive: { type: array, items: { $ref: "#/components/schemas/MetricPoint" }, description: bytes/s }
            network_transmit: { type: array, items: { $ref: "#/components/schemas/MetricPoint" }, description: bytes/s }
            restarts: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }

    KubernetesEvent:
      type: object
      required: [timestamp, type, reason, message, count, namespace, object_kind, object_name, object_uid, source, cluster_uid, cluster_name]
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        type: { type: string, example: Warning }
        reason: { type: string, example: BackOff }
        message: { type: string }
        count: { type: integer }
        namespace: { type: string }
        object_kind: { type: string }
        object_name: { type: string }
        object_uid: { type: string }
        source: { type: string }
        cluster_uid: { type: string }
        cluster_name: { type: string }

    KubernetesEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/KubernetesEvent" }

    KubernetesServicePod:
      type: object
      required: [cluster_uid, cluster_name, namespace, pod_name, pod_uid, workload_kind, workload_name, node_name, phase, ready, reporting]
      properties:
        cluster_uid: { type: string }
        cluster_name: { type: string }
        namespace: { type: string }
        pod_name: { type: string }
        pod_uid: { type: string }
        workload_kind: { type: string }
        workload_name: { type: string }
        node_name: { type: string }
        phase: { type: string }
        ready: { type: boolean }
        reporting: { type: boolean }

    ContainerStateFilter:
      type: string
      description: "`unknown`: the agent sends no state (no Docker API access, or an agent without openlog.container.status)"
      enum: [running, paused, restarting, exited, created, dead, removing, unknown]

    Container:
      type: object
      required: [container_id, name, image_name, image_tags, runtime, host_id, host_name, compose_project, compose_service,
        k8s_pod_name, k8s_namespace_name, k8s_container_name, state, health, started_at, restart_count, first_seen, last_seen,
        reporting, cpu_utilization, memory_usage, memory_limit, cpu_sparkline, memory_sparkline]
      properties:
        container_id: { type: string }
        name: { type: string, description: "Empty without Docker metadata" }
        image_name: { type: string }
        image_tags: { type: array, items: { type: string } }
        runtime: { type: string, description: "docker, containerd, cri-o, podman or empty" }
        host_id: { type: string }
        host_name: { type: string }
        compose_project: { type: string }
        compose_service: { type: string }
        k8s_pod_name: { type: string }
        k8s_namespace_name: { type: string }
        k8s_container_name: { type: string }
        state: { type: string, description: "Docker state (running, exited, …); empty when unknown" }
        health: { type: string, description: "healthy, unhealthy, starting or empty" }
        started_at: { type: [string, "null"], description: RFC3339 }
        restart_count: { type: integer }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
        reporting: { type: boolean, description: "Data within the last 5 minutes" }
        cpu_utilization: { type: [number, "null"], description: "0..1 of the host's CPUs" }
        memory_usage: { type: [number, "null"], description: bytes }
        memory_limit: { type: [number, "null"], description: "bytes (host memory when unlimited)" }
        cpu_sparkline:
          type: array
          items: { $ref: "#/components/schemas/MetricPoint" }
        memory_sparkline:
          type: array
          items: { $ref: "#/components/schemas/MetricPoint" }

    ContainerDetail:
      allOf:
        - $ref: "#/components/schemas/Container"
        - type: object
          required: [attributes]
          properties:
            attributes: { $ref: "#/components/schemas/StringMap" }

    ComposeService:
      type: object
      required: [compose_service, containers, running, cpu_utilization, memory_usage]
      properties:
        compose_service: { type: string }
        containers: { type: integer }
        running: { type: integer, description: "Reporting containers in state running" }
        cpu_utilization: { type: [number, "null"], description: "Sum over reporting containers" }
        memory_usage: { type: [number, "null"] }

    ComposeProject:
      type: object
      required: [compose_project, host_ids, containers, running, services]
      properties:
        compose_project: { type: string, description: "Empty: containers without a compose project" }
        host_ids: { type: array, items: { type: string } }
        containers: { type: integer }
        running: { type: integer }
        services:
          type: array
          items: { $ref: "#/components/schemas/ComposeService" }

    ContainerTimeseries:
      type: object
      required: [container_id, host_id, step, from, to, series]
      properties:
        container_id: { type: string }
        host_id: { type: string }
        step: { type: string, example: 20s }
        from: { type: integer, description: unix ms }
        to: { type: integer, description: unix ms }
        series:
          type: object
          required: [cpu_utilization, memory_usage, memory_limit, network_receive, network_transmit, blockio_read, blockio_write]
          properties:
            cpu_utilization: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
            memory_usage: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
            memory_limit: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
            network_receive: { type: array, items: { $ref: "#/components/schemas/MetricPoint" }, description: bytes/s }
            network_transmit: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
            blockio_read: { type: array, items: { $ref: "#/components/schemas/MetricPoint" }, description: bytes/s }
            blockio_write: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }

    MetricType:
      type: string
      description: Empty string when the metric has no data in range.
      enum: [gauge, sum, histogram, exponential_histogram, summary, ""]

    MetricMeta:
      type: object
      required: [name, type, unit]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/MetricType" }
        unit: { type: string }

    Aggregation:
      type: string
      enum: [avg, min, max, sum, last, rate]

    MetricPoint:
      type: array
      description: "[unix milliseconds, value]"
      prefixItems:
        - { type: integer }
        - { type: number }
      minItems: 2
      maxItems: 2
      items: { type: number }

    MetricSeries:
      type: object
      required: [attributes, points]
      properties:
        attributes: { $ref: "#/components/schemas/StringMap" }
        points:
          type: array
          items: { $ref: "#/components/schemas/MetricPoint" }

    MetricSeriesResponse:
      type: object
      required: [metric, step, series]
      properties:
        metric: { $ref: "#/components/schemas/MetricMeta" }
        step: { type: string, description: "Whole seconds, e.g. 60s" }
        series:
          type: array
          items: { $ref: "#/components/schemas/MetricSeries" }

    InventoryCategory:
      type: string
      description: Known categories (semantic-conventions §3.3); the API accepts any string.
      examples: [os, hardware, kernel_module, package, systemd_unit, listening_port, process, user, network_interface, mount, discovered_service]

    InventoryItem:
      type: object
      required: [category, key, data]
      properties:
        category: { type: string }
        key: { type: string }
        data:
          description: The category's JSON body; non-JSON bodies are returned as a string.

    InventoryResponse:
      type: object
      required: [snapshot_id, snapshot_time, items]
      properties:
        snapshot_id: { type: string }
        snapshot_time:
          oneOf:
            - { $ref: "#/components/schemas/Timestamp" }
            - { type: "null" }
        items:
          type: array
          items: { $ref: "#/components/schemas/InventoryItem" }

    InventorySearchItem:
      allOf:
        - $ref: "#/components/schemas/InventoryItem"
        - type: object
          required: [host_id]
          properties:
            host_id: { type: string }
            host_name:
              type: string
              description: Omitted when the host is not found in the hosts table.

    DiscoveredService:
      type: object
      description: Body of `discovered_service` items (semantic-conventions §3.4). Unknown fields must be ignored; any field may be missing.
      properties:
        rule_id: { type: string }
        name: { type: string }
        category: { type: string }
        instance: { type: string }
        command:
          type: string
          description: >-
            Name of the running process (e.g. `redis-server`) when it differs from what `instance`
            (the executable path) suggests. Optional; older agents omit it.
        display_instance:
          type: string
          description: >-
            Invoked path of a multi-call or symlinked executable (e.g. `/usr/bin/redis-server` when `instance` is
            `/usr/bin/redis-check-rdb`). Display only; `instance` stays the key. Optional.
        version: { type: string }
        matched_by:
          type: array
          items: { type: string }
        pids:
          type: array
          items: { type: integer }
        ports:
          type: array
          items:
            type: object
            properties:
              protocol: { type: string }
              address: { type: string }
              port: { type: integer }
        systemd_units:
          type: array
          description: systemd units of the service (Linux); empty on macOS and Windows.
          items: { type: string }
        services:
          type: array
          description: launchd labels (macOS) or Windows service names of the service. Optional; Linux agents omit it.
          items: { type: string }
        packages:
          type: array
          items: { type: string }
        container_ids:
          type: array
          items: { type: string }
        integration:
          type: object
          description: Running integration of the service (semantic-conventions §3.4, §6).
          properties:
            id: { type: string, description: "Integration id: nginx, redis, mysql, postgresql, docker, …" }
            status:
              type: string
              enum: [enabled, needs_configuration, error, not_available]
            error:
              type: string
              description: Sanitized reason (≤ 256 bytes, never credentials); also set on partial collections with status enabled.
            hint:
              type: string
              description: Multi-line config.yaml snippet that configures the instance (with needs_configuration); shown verbatim.
            endpoint:
              type: string
              description: Endpoint of the last successful collection (host:port, unix:<path> or the nginx status URL).
        apm_hint:
          oneOf:
            - type: "null"
            - type: object
              properties:
                language: { type: string, description: "Runtime language of the discovered service (php, nodejs, python, java, dotnet)" }
                agent: { type: string, description: "Discovery identifier of the matching agent (e.g. openlog-agent-php); not a package name" }
                status:
                  type: string
                  enum: [active, not_installed]
                  description: "Set by the infra agent for openlog-agent-php: active = PHP spans received in the last 10 minutes (semantic-conventions §3.4)"

    LogRecord:
      type: object
      required: [timestamp, severity_text, severity_number, body, host_id, service_name, trace_id, span_id, attributes, resource_attributes]
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        severity_text: { type: string }
        severity_number: { type: integer, minimum: 0, maximum: 255 }
        body: { type: string }
        host_id: { type: string }
        service_name: { type: string }
        trace_id: { type: string, description: "32 lowercase hex characters or empty" }
        span_id: { type: string, description: "16 lowercase hex characters or empty" }
        attributes: { $ref: "#/components/schemas/StringMap" }
        resource_attributes: { $ref: "#/components/schemas/StringMap" }

    # ---- explorer: fields, structured log queries, metrics explorer, saved views (api.md "Fields", D-118, D-119) ----

    FieldSignal:
      type: string
      enum: [logs, metrics, traces]

    FieldSource:
      type: string
      description: |
        `field`: top-level column (e.g. `service.name`, `severity_text`, `body`); `attribute`: record / span / data
        point attribute (`attributes.<k>`); `resource`: resource attribute (`resource.<k>`); `body`: top-level key of a
        JSON log body (`body.<k>`).
      enum: [field, attribute, resource, body]

    FieldType:
      type: string
      enum: [string, number, bool]

    FieldKey:
      type: object
      required: [key, name, source, type, count, cardinality]
      properties:
        key: { type: string, description: "Key to use in filters, columns and group_by, e.g. `resource.k8s.pod.name`" }
        name: { type: string, description: "Key without the source prefix" }
        source: { $ref: "#/components/schemas/FieldSource" }
        type: { $ref: "#/components/schemas/FieldType" }
        count: { type: [integer, "null"], description: "Records with the key in the range (null for top-level fields)" }
        cardinality: { type: [integer, "null"], description: "Approximate distinct values (null when unknown)" }

    FieldKeysResponse:
      type: object
      required: [keys, sampled]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/FieldKey" }
        sampled: { type: boolean }

    FieldValue:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }

    FieldValuesResponse:
      type: object
      required: [key, type, values, total, sampled]
      properties:
        key: { type: string }
        type: { $ref: "#/components/schemas/FieldType" }
        values:
          type: array
          items: { $ref: "#/components/schemas/FieldValue" }
        total: { type: integer, description: "Records counted (all values); a value's share is count / total" }
        sampled: { type: boolean }

    FilterOp:
      type: string
      enum: ["=", "!=", in, not_in, contains, not_contains, like, not_like, regex, not_regex, exists, not_exists, ">", ">=", "<", "<="]

    QueryFilter:
      type: object
      description: |
        One condition. Keys: top-level fields of the signal, `attributes.<k>`, `resource.<k>`, `body.<k>` (logs, JSON
        body) or a bare attribute key (record attribute, else resource attribute). `in`/`not_in` take `values`
        (1–100); `exists`/`not_exists` take no value; the others take `value`. `contains` is case-insensitive;
        `like` uses SQL wildcards (`%`, `_`, case-sensitive); `regex` is RE2. `contains` matches `%` and `_` literally
        (same as OQL CONTAINS). `>`…`<=` compare numerically (attribute
        values that are not numbers never match). Values are at most 1024 bytes.
      required: [key, op]
      properties:
        key: { type: string, maxLength: 256 }
        op: { $ref: "#/components/schemas/FilterOp" }
        value: { type: [string, number, boolean] }
        values:
          type: array
          maxItems: 100
          items: { type: [string, number, boolean] }

    FilterGroups:
      type: array
      description: OR of AND-groups ([[a, b], [c]] = (a AND b) OR c), AND-ed with `filters`. At most 10 groups and 50 conditions in total.
      maxItems: 10
      items:
        type: array
        items: { $ref: "#/components/schemas/QueryFilter" }

    LogsQueryRequest:
      type: object
      properties:
        from: { type: [string, integer], description: "RFC3339 or unix ms (default now-1h)" }
        to: { type: [string, integer], description: "RFC3339 or unix ms (default now)" }
        filters:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/QueryFilter" }
        groups: { $ref: "#/components/schemas/FilterGroups" }
        q: { type: string, maxLength: 1024, description: Case-insensitive substring of the body }
        transaction: { type: string, maxLength: 4096, description: "APM transaction name; with transaction_service: logs of that transaction's traces" }
        transaction_service: { type: string, maxLength: 512 }
        order: { type: string, enum: [desc, asc], default: desc }
        limit: { type: integer, minimum: 1, description: "Default 100, capped by OPENLOG_API_MAX_ROWS" }
        cursor: { type: string, description: "next_cursor of the previous page (same request otherwise)" }
        columns:
          type: array
          maxItems: 50
          description: Keys to return in `fields` (top-level fields, attributes, resource attributes, JSON body keys)
          items: { type: string, maxLength: 256 }
        include_record: { type: boolean, default: false, description: Also return `attributes` and `resource_attributes` }

    LogQueryRow:
      type: object
      required: [id, timestamp, observed_timestamp, severity_text, severity_number, body, service_name, host_id, host_name, trace_id, span_id, fields]
      properties:
        id: { type: string, description: "Row identity within the result (timestamp and content hash)" }
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        observed_timestamp: { $ref: "#/components/schemas/Timestamp" }
        severity_text: { type: string }
        severity_number: { type: integer }
        body: { type: string }
        service_name: { type: string }
        host_id: { type: string }
        host_name: { type: string }
        trace_id: { type: string }
        span_id: { type: string }
        fields:
          type: object
          description: Requested columns; keys the record does not have are omitted
          additionalProperties: { type: string }
        attributes: { $ref: "#/components/schemas/StringMap" }
        resource_attributes: { $ref: "#/components/schemas/StringMap" }

    LogsQueryResponse:
      type: object
      required: [rows, next_cursor]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/LogQueryRow" }
        next_cursor: { type: [string, "null"] }

    LogsAggregateRequest:
      type: object
      properties:
        from: { type: [string, integer] }
        to: { type: [string, integer] }
        filters:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/QueryFilter" }
        groups: { $ref: "#/components/schemas/FilterGroups" }
        q: { type: string, maxLength: 1024 }
        transaction: { type: string, maxLength: 4096 }
        transaction_service: { type: string, maxLength: 512 }
        step: { type: string, description: "Go duration ≥ 1s; default: a round step giving at most ~120 buckets" }
        group_by: { type: string, maxLength: 256, description: Key whose values split the counts }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10, description: Series of group_by values }

    LogsAggregateSeries:
      type: object
      required: [group, other, total, points]
      properties:
        group: { type: string, description: "Value of group_by (\"\" without group_by, or when the key is missing)" }
        other: { type: boolean, description: All values outside the top `limit` }
        total: { type: integer }
        points:
          type: array
          description: "[bucket start unix ms, count]; buckets without records are omitted"
          items: { $ref: "#/components/schemas/MetricPoint" }

    LogsAggregateResponse:
      type: object
      required: [step, total, series]
      properties:
        step: { type: string, example: 60s }
        total: { type: integer }
        series:
          type: array
          items: { $ref: "#/components/schemas/LogsAggregateSeries" }

    LogsPatternsRequest:
      type: object
      properties:
        from: { type: [string, integer], description: "RFC3339 or unix ms (default now-1h)" }
        to: { type: [string, integer], description: "RFC3339 or unix ms (default now)" }
        filters:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/QueryFilter" }
        groups: { $ref: "#/components/schemas/FilterGroups" }
        q: { type: string, maxLength: 1024, description: Case-insensitive substring of the body }
        transaction: { type: string, maxLength: 4096 }
        transaction_service: { type: string, maxLength: 512 }
        limit: { type: integer, minimum: 1, maximum: 500, default: 50, description: Patterns returned, most records first }

    LogPatternSeverityMix:
      type: object
      required: [unspecified, trace, debug, info, warn, error, fatal]
      description: Records of the pattern per OpenTelemetry severity range
      properties:
        unspecified: { type: integer }
        trace: { type: integer }
        debug: { type: integer }
        info: { type: integer }
        warn: { type: integer }
        error: { type: integer }
        fatal: { type: integer }

    LogPatternSample:
      type: object
      required: [timestamp, body, service_name, severity_text, severity_number, trace_id]
      description: Newest record of the pattern in the range; a rollup response carries only body, service and time
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        body: { type: string }
        service_name: { type: string }
        severity_text: { type: string }
        severity_number: { type: integer }
        trace_id: { type: string }

    LogPattern:
      type: object
      required: [pattern_id, template, count, severity, max_severity_number, services, first_seen, last_seen, sample]
      properties:
        pattern_id: { type: string, description: "64-bit id as text; also the value of the pattern_id filter key" }
        template: { type: string, example: "user <*> logged in from <*>" }
        count: { type: integer }
        severity: { $ref: "#/components/schemas/LogPatternSeverityMix" }
        max_severity_number: { type: integer }
        services:
          type: array
          maxItems: 5
          items: { type: string }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
        sample: { $ref: "#/components/schemas/LogPatternSample" }

    LogsPatternsResponse:
      type: object
      required: [patterns, total, unclassified, rollup, truncated]
      properties:
        patterns:
          type: array
          items: { $ref: "#/components/schemas/LogPattern" }
        total: { type: integer, description: Matching records over every pattern, not only the returned ones }
        unclassified:
          type: integer
          description: "Matching records without a pattern (empty body, or stored before the 0091_log_patterns migration); 0 on a rollup response"
        rollup: { type: boolean, description: Answered from the hourly rollup (counts cover whole hours) }
        truncated: { type: boolean, description: More patterns exist than `limit` }

    TracesQueryRequest:
      type: object
      properties:
        from: { type: [string, integer], description: "RFC3339 or unix ms (default now-1h)" }
        to: { type: [string, integer], description: "RFC3339 or unix ms (default now)" }
        filters:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/QueryFilter" }
        groups: { $ref: "#/components/schemas/FilterGroups" }
        root_only: { type: boolean, default: false, description: Spans without a parent span id }
        order: { type: string, enum: [desc, asc], default: desc }
        sort: { type: string, enum: [timestamp, duration], default: timestamp, description: "duration: slowest spans, one page" }
        limit: { type: integer, minimum: 1, description: "Default 100, capped by OPENLOG_API_MAX_ROWS" }
        cursor: { type: string }
        columns:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 256 }
        include_record: { type: boolean, default: false }

    SpanQueryRow:
      type: object
      required: [id, timestamp, trace_id, span_id, parent_span_id, name, kind, status_code, status_message, service_name, host_id, duration_ns, duration_ms, is_entry, is_error, http_status_code, transaction_name, fields]
      properties:
        id: { type: string }
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        trace_id: { type: string }
        span_id: { type: string }
        parent_span_id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/SpanKind" }
        status_code: { $ref: "#/components/schemas/SpanStatusCode" }
        status_message: { type: string }
        service_name: { type: string }
        host_id: { type: string }
        duration_ns: { type: integer }
        duration_ms: { type: number }
        is_entry: { type: boolean }
        is_error: { type: boolean }
        http_status_code: { type: integer }
        transaction_name: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        attributes: { $ref: "#/components/schemas/StringMap" }
        resource_attributes: { $ref: "#/components/schemas/StringMap" }

    TracesQueryResponse:
      type: object
      required: [rows, next_cursor]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/SpanQueryRow" }
        next_cursor: { type: [string, "null"] }

    TracesAggregateRequest:
      type: object
      properties:
        from: { type: [string, integer] }
        to: { type: [string, integer] }
        filters:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/QueryFilter" }
        groups: { $ref: "#/components/schemas/FilterGroups" }
        root_only: { type: boolean, default: false }
        step: { type: string }
        group_by: { type: string, maxLength: 256 }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }

    TracesAggregateResponse:
      type: object
      required: [step, total, series, latency]
      properties:
        step: { type: string, example: 60s }
        total: { type: integer }
        series:
          type: array
          items: { $ref: "#/components/schemas/LogsAggregateSeries" }
        latency:
          type: object
          required: [p50, p95, p99]
          description: Span duration percentiles in milliseconds per bucket
          properties:
            p50: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
            p95: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
            p99: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }

    MetricTemporality:
      type: string
      enum: [unspecified, delta, cumulative]

    MetricInfo:
      type: object
      required: [name, type, unit, description, temporality, monotonic, last_seen, series, services]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/MetricType" }
        unit: { type: string }
        description: { type: string }
        temporality: { $ref: "#/components/schemas/MetricTemporality" }
        monotonic: { type: boolean }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
        series: { type: integer, description: Approximate number of series in the range }
        services:
          type: array
          description: Up to 5 most frequent service.name values (empty service names omitted)
          items: { type: string }

    MetricListResponse:
      type: object
      required: [metrics, truncated]
      properties:
        metrics:
          type: array
          items: { $ref: "#/components/schemas/MetricInfo" }
        truncated: { type: boolean }

    MetricAggregation:
      type: string
      enum: [avg, min, max, sum, last, count, rate, increase, p50, p75, p90, p95, p99]

    MetricDetail:
      allOf:
        - $ref: "#/components/schemas/MetricInfo"
        - type: object
          required: [attribute_keys, resource_keys, aggregations, default_aggregation]
          properties:
            attribute_keys:
              type: array
              items: { $ref: "#/components/schemas/FieldKey" }
            resource_keys:
              type: array
              items: { $ref: "#/components/schemas/FieldKey" }
            aggregations:
              type: array
              items: { $ref: "#/components/schemas/MetricAggregation" }
            default_aggregation: { $ref: "#/components/schemas/MetricAggregation" }

    MetricQueryRequest:
      type: object
      required: [metric]
      properties:
        metric: { type: string, maxLength: 512 }
        from: { type: [string, integer] }
        to: { type: [string, integer] }
        filters:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/QueryFilter" }
        groups: { $ref: "#/components/schemas/FilterGroups" }
        aggregation: { $ref: "#/components/schemas/MetricAggregation" }
        group_by:
          type: array
          maxItems: 5
          items: { type: string, maxLength: 256 }
        step: { type: string, description: "Go duration ≥ 10s; default ≈ 300 points" }
        limit: { type: integer, minimum: 1, maximum: 200, default: 50, description: Maximum series }

    MetricQueryResponse:
      type: object
      required: [metric, aggregation, step, series, truncated]
      properties:
        metric:
          type: object
          required: [name, type, unit, temporality, monotonic]
          properties:
            name: { type: string }
            type: { $ref: "#/components/schemas/MetricType" }
            unit: { type: string }
            temporality: { $ref: "#/components/schemas/MetricTemporality" }
            monotonic: { type: boolean }
        aggregation: { $ref: "#/components/schemas/MetricAggregation" }
        step: { type: string, example: 60s }
        series:
          type: array
          items: { $ref: "#/components/schemas/MetricSeries" }
        truncated: { type: boolean }

    MetricExemplarsRequest:
      type: object
      required: [metric]
      properties:
        metric: { type: string, maxLength: 512 }
        from: { type: [string, integer] }
        to: { type: [string, integer] }
        filters:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/QueryFilter" }
        groups: { $ref: "#/components/schemas/FilterGroups" }
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum exemplars; also the number of buckets the range is divided into

    MetricExemplar:
      type: object
      required: [timestamp, value, trace_id, span_id, service_name, attributes, filtered_attributes]
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        value: { type: number, description: The exemplar's own measurement, not the data point's aggregate }
        trace_id: { type: string, description: 32 hex characters; never empty }
        span_id: { type: string, description: 16 hex characters, or empty when recorded outside a span }
        service_name: { type: string }
        attributes:
          allOf:
            - $ref: "#/components/schemas/StringMap"
          description: Attributes of the data point the exemplar belongs to
        filtered_attributes:
          allOf:
            - $ref: "#/components/schemas/StringMap"
          description: Measurement attributes the SDK dropped from the metric's own attributes

    MetricExemplarsResponse:
      type: object
      required: [exemplars, total, truncated]
      properties:
        exemplars:
          type: array
          items: { $ref: "#/components/schemas/MetricExemplar" }
        total: { type: integer, description: Matching exemplars in the range, not only the returned ones }
        truncated: { type: boolean, description: More exemplars exist than were returned }

    SavedViewSignal:
      type: string
      enum: [logs, metrics, traces]

    SavedViewInput:
      type: object
      required: [signal, name, visibility, state]
      properties:
        signal: { $ref: "#/components/schemas/SavedViewSignal" }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        visibility: { type: string, enum: [private, org] }
        state:
          type: object
          description: "Explorer state (JSON object ≤ 32 KiB), e.g. logs: {filters, groups, q, columns, order, group_by, range, from, to}"
          additionalProperties: true

    SavedView:
      type: object
      required: [id, signal, name, description, visibility, state, created_by_user_id, created_by_email, can_edit, created_at, updated_at]
      properties:
        id: { type: string }
        signal: { $ref: "#/components/schemas/SavedViewSignal" }
        name: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [private, org] }
        state: { type: object, additionalProperties: true }
        created_by_user_id: { type: [string, "null"] }
        created_by_email: { type: string }
        can_edit: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    SpanKind:
      type: string
      enum: [unspecified, internal, server, client, producer, consumer]

    SpanStatusCode:
      type: string
      enum: [unset, ok, error]

    SpanEvent:
      type: object
      required: [timestamp, name, attributes]
      properties:
        timestamp: { type: string, description: "RFC3339 with nanoseconds; empty if missing" }
        name: { type: string }
        attributes: { $ref: "#/components/schemas/StringMap" }

    Span:
      type: object
      required: [span_id, parent_span_id, name, kind, service_name, start, duration_ns, status_code, status_message, attributes, resource_attributes, events]
      properties:
        span_id: { type: string }
        parent_span_id: { type: string, description: "Empty for root spans" }
        name: { type: string }
        kind: { $ref: "#/components/schemas/SpanKind" }
        service_name: { type: string }
        start: { $ref: "#/components/schemas/Timestamp" }
        duration_ns: { type: integer, minimum: 0 }
        status_code: { $ref: "#/components/schemas/SpanStatusCode" }
        status_message: { type: string }
        attributes: { $ref: "#/components/schemas/StringMap" }
        resource_attributes: { $ref: "#/components/schemas/StringMap" }
        events:
          type: array
          items: { $ref: "#/components/schemas/SpanEvent" }

    Trace:
      type: object
      required: [trace_id, spans]
      properties:
        trace_id: { type: string }
        spans:
          type: array
          items: { $ref: "#/components/schemas/Span" }

    # ------------------------------------------------------------ auth & management
    # ---- APM (apm.md) ----
    ApmNullableNumber:
      type: [number, "null"]
    ApmRed:
      type: object
      description: Weighted metrics of apm.md §4; avg/percentiles/apdex are null without requests.
      required: [requests, throughput, errors, error_rate, avg_ms, p50_ms, p95_ms, p99_ms, apdex]
      properties:
        requests: { type: number }
        throughput: { type: number, description: Requests per minute }
        errors: { type: number }
        error_rate: { type: number, minimum: 0, maximum: 1 }
        avg_ms: { $ref: "#/components/schemas/ApmNullableNumber" }
        p50_ms: { $ref: "#/components/schemas/ApmNullableNumber" }
        p95_ms: { $ref: "#/components/schemas/ApmNullableNumber" }
        p99_ms: { $ref: "#/components/schemas/ApmNullableNumber" }
        apdex: { $ref: "#/components/schemas/ApmNullableNumber" }
    ApmTransactionType:
      type: string
      enum: [web, rpc, messaging, other]
    ApmService:
      allOf:
        - $ref: "#/components/schemas/ApmRed"
        - type: object
          required: [service_name, service_namespace, environment, language, version, last_seen, apdex_t_ms, sparkline]
          properties:
            service_name: { type: string }
            service_namespace: { type: string }
            environment: { type: string }
            language: { type: string, description: telemetry.sdk.language }
            version: { type: string, description: service.version }
            last_seen: { $ref: "#/components/schemas/Timestamp" }
            apdex_t_ms: { type: number }
            sparkline:
              type: array
              description: "[unix ms, requests per minute]"
              items: { $ref: "#/components/schemas/MetricPoint" }
    ApmServiceInstance:
      type: object
      required: [service_namespace, environment, first_seen, last_seen, version, language, sdk_name, resource_attributes]
      properties:
        service_namespace: { type: string }
        environment: { type: string }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
        version: { type: string }
        language: { type: string }
        sdk_name: { type: string }
        resource_attributes: { $ref: "#/components/schemas/StringMap" }
    ApmServiceHost:
      type: object
      required: [host_id, host_name, first_seen, last_seen, known]
      properties:
        host_id: { type: string }
        host_name: { type: string }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
        known: { type: boolean, description: "The host has a host record (GET /hosts/{host_id})" }
    ApmAgentStatus:
      type: string
      enum: [ok, outdated, unsupported, unknown, third_party]
      description: |
        outdated: older than release.latest; unsupported: older than release.oldest_supported; unknown: no release
        catalog or a version that is not SemVer (development builds); third_party: not an openlog distro, not compared.
    ApmAgentRelease:
      type: object
      required: [catalog, channel, latest, oldest_supported, notes_url]
      properties:
        catalog: { type: string, enum: [ok, unavailable, disabled] }
        channel: { type: string, enum: [stable, beta] }
        latest: { type: string, nullable: true }
        oldest_supported: { type: string, nullable: true, description: compatibility.oldest_supported_agent }
        notes_url: { type: string }
    ApmAgentVersion:
      type: object
      required: [version, status, instances, spans, last_seen]
      properties:
        version: { type: string, description: "telemetry.distro.version (third_party: telemetry.sdk.version)" }
        status: { $ref: "#/components/schemas/ApmAgentStatus" }
        instances: { type: integer, description: "Distinct service.instance.id (else host.id), approximate" }
        spans: { type: integer }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
    ApmAgentUpgrade:
      type: object
      required: [package, version, command, lang, registry, registry_url, release_asset_url, docs_url, docs_section, notes]
      properties:
        package: { type: string }
        version: { type: string, description: Package version of release.latest (PEP 440 for Python) }
        command: { type: string }
        lang: { type: string }
        registry: { type: string, enum: [available, missing, unknown, ""], description: "npm, PyPI, nuget.org; empty for other kinds" }
        registry_url: { type: string }
        release_asset_url: { type: string }
        docs_url: { type: string }
        docs_section: { type: string }
        notes:
          type: array
          items: { type: string, enum: [go_modules, java_fleet_auto, php_fleet_auto, registry_fallback] }
    ApmServiceAgent:
      type: object
      required: [kind, distro_name, sdk_name, sdk_language, status, instances, last_seen, versions, versions_truncated, instrumentation_modules, upgrade]
      properties:
        kind: { type: string, enum: [go, node, python, java, dotnet, php, unknown, third_party] }
        distro_name: { type: string }
        sdk_name: { type: string }
        sdk_language: { type: string }
        status: { $ref: "#/components/schemas/ApmAgentStatus" }
        instances: { type: integer }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
        versions:
          type: array
          description: Newest first, at most 20
          items: { $ref: "#/components/schemas/ApmAgentVersion" }
        versions_truncated: { type: boolean }
        instrumentation_modules:
          type: array
          description: openlog Go instrumentation modules recognised from span scopes (gin, echo, grpc)
          items: { type: string }
        upgrade:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ApmAgentUpgrade" }]
    ApmServiceAgents:
      type: object
      required: [service_name, service_namespace, environment, status, agents]
      properties:
        service_name: { type: string }
        service_namespace: { type: string }
        environment: { type: string }
        status: { $ref: "#/components/schemas/ApmAgentStatus" }
        agents:
          type: array
          items: { $ref: "#/components/schemas/ApmServiceAgent" }
    ApmServiceContainer:
      type: object
      required: [container_id, name, host_id, host_name, first_seen, last_seen, known, state, reporting, cpu_utilization, memory_usage, memory_limit]
      properties:
        container_id: { type: string }
        name: { type: string, description: "Docker name, else the span resource's container.name" }
        host_id: { type: string }
        host_name: { type: string }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
        known: { type: boolean, description: "The container has infra agent data (GET /containers/{container_id})" }
        state: { type: string }
        reporting: { type: boolean }
        cpu_utilization: { type: [number, "null"] }
        memory_usage: { type: [number, "null"] }
        memory_limit: { type: [number, "null"] }
    ContainerService:
      allOf:
        - $ref: "#/components/schemas/ApmRed"
        - type: object
          required: [service_name, service_namespace, environment, first_seen, last_seen, apdex_t_ms]
          properties:
            service_name: { type: string }
            service_namespace: { type: string }
            environment: { type: string }
            first_seen: { $ref: "#/components/schemas/Timestamp" }
            last_seen: { $ref: "#/components/schemas/Timestamp" }
            apdex_t_ms: { type: number }
    ApmServiceDetail:
      type: object
      required: [service_name, instances, hosts, apdex_t_ms, apdex_t_default]
      properties:
        service_name: { type: string }
        instances:
          type: array
          items: { $ref: "#/components/schemas/ApmServiceInstance" }
        hosts:
          type: array
          items: { $ref: "#/components/schemas/ApmServiceHost" }
        apdex_t_ms: { type: number }
        apdex_t_default: { type: boolean }
    ApmPoint:
      allOf:
        - $ref: "#/components/schemas/ApmRed"
        - type: object
          required: [t]
          properties:
            t: { type: integer, description: Bucket start, unix ms }
    ApmOverview:
      type: object
      required: [step, apdex_t_ms, totals, series]
      properties:
        step: { type: string }
        apdex_t_ms: { type: number }
        totals: { $ref: "#/components/schemas/ApmRed" }
        series:
          type: array
          items: { $ref: "#/components/schemas/ApmPoint" }
    ApmTransaction:
      allOf:
        - $ref: "#/components/schemas/ApmRed"
        - type: object
          required: [transaction_type, transaction_name, time_consumed_ms, time_share, max_ms]
          properties:
            transaction_type: { type: string }
            transaction_name: { type: string }
            time_consumed_ms: { type: number }
            time_share: { type: number, minimum: 0, maximum: 1 }
            max_ms: { type: number }
    ApmHistogramBin:
      type: object
      required: [from_ms, to_ms, count]
      properties:
        from_ms: { type: number }
        to_ms: { type: number }
        count: { type: number }
    ApmTraceSample:
      type: object
      required: [trace_id, span_id, timestamp, duration_ms, is_error, http_status_code, service_name, transaction_name]
      properties:
        trace_id: { type: string }
        span_id: { type: string }
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        duration_ms: { type: number }
        is_error: { type: boolean }
        http_status_code: { type: integer }
        service_name: { type: string }
        transaction_name: { type: string }
    ApmTransactionDetail:
      type: object
      required: [transaction_name, transaction_type, step, apdex_t_ms, totals, max_ms, series, histogram, slowest]
      properties:
        transaction_name: { type: string }
        transaction_type: { type: string }
        step: { type: string }
        apdex_t_ms: { type: number }
        totals: { $ref: "#/components/schemas/ApmRed" }
        max_ms: { type: number }
        series:
          type: array
          items: { $ref: "#/components/schemas/ApmPoint" }
        histogram:
          type: array
          items: { $ref: "#/components/schemas/ApmHistogramBin" }
        slowest:
          type: array
          items: { $ref: "#/components/schemas/ApmTraceSample" }
    ApmErrorGroup:
      type: object
      allOf:
        - $ref: "#/components/schemas/ApmErrorWorkflow"
      required: [group_id, service_name, service_namespace, environment, error_type, message, count, total_count, first_seen, last_seen,
        last_trace_id, last_span_name, sparkline]
      properties:
        group_id: { type: string, description: 16 hex digits }
        service_name: { type: string }
        service_namespace: { type: string }
        environment: { type: string }
        error_type: { type: string }
        message: { type: string, description: Normalized message }
        count: { type: number, description: Occurrences in the range (weighted) }
        total_count: { type: number, description: Occurrences within retention }
        first_seen: { $ref: "#/components/schemas/NullableTimestamp" }
        last_seen: { $ref: "#/components/schemas/NullableTimestamp" }
        last_trace_id: { type: string }
        last_span_name: { type: string }
        sparkline:
          type: array
          items: { $ref: "#/components/schemas/MetricPoint" }
    ApmErrorSample:
      type: object
      required: [trace_id, span_id, timestamp, span_name, transaction_name, duration_ms, message, version, host_id]
      properties:
        trace_id: { type: string }
        span_id: { type: string }
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        span_name: { type: string }
        transaction_name: { type: string }
        duration_ms: { type: number }
        message: { type: string }
        version: { type: string, description: service.version of the span resource }
        host_id: { type: string }
    ApmErrorGroupDetail:
      type: object
      allOf:
        - $ref: "#/components/schemas/ApmErrorWorkflow"
      required: [group_id, service_name, service_namespace, environment, error_type, message, count, total_count, first_seen, last_seen,
        last_message, stacktrace, stacktrace_minified, symbolicated_frames, last_trace_id, last_span_id, last_span_name, step,
        series, samples, affected, comments, activity, workflow]
      properties:
        group_id: { type: string }
        service_name: { type: string }
        service_namespace: { type: string }
        environment: { type: string }
        affected: { $ref: "#/components/schemas/ApmErrorAffected" }
        comments:
          type: array
          items: { $ref: "#/components/schemas/ApmErrorComment" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/ApmErrorActivity" }
        workflow: { type: boolean, description: "false without PostgreSQL (static auth mode): no state, comments or activity" }
        error_type: { type: string }
        message: { type: string }
        count: { type: number }
        total_count: { type: number }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
        last_message: { type: string }
        stacktrace:
          type: string
          description: >-
            The best available stack: un-minified through the uploaded source maps when any frame resolved
            (rum.md §8), otherwise the stored one.
        stacktrace_minified:
          type: string
          description: >-
            The stack as it was stored. Equal to `stacktrace` when nothing was symbolicated; kept beside it
            because a partly resolved stack is still read against the original.
        symbolicated_frames:
          type: integer
          description: How many frames a source map resolved; 0 when none did.
        last_trace_id: { type: string }
        last_span_id: { type: string }
        last_span_name: { type: string }
        step: { type: string }
        series:
          type: array
          items: { $ref: "#/components/schemas/MetricPoint" }
        samples:
          type: array
          items: { $ref: "#/components/schemas/ApmErrorSample" }
    ApmDbQuery:
      type: object
      required: [db_system, db_name, db_operation, statement, calls, throughput, errors, error_rate, avg_ms, p95_ms, max_ms, time_consumed_ms, time_share]
      properties:
        db_system: { type: string }
        db_name: { type: string }
        db_operation: { type: string }
        statement: { type: string, description: Normalized statement (apm.md §7) }
        calls: { type: number }
        throughput: { type: number }
        errors: { type: number }
        error_rate: { type: number }
        avg_ms: { $ref: "#/components/schemas/ApmNullableNumber" }
        p95_ms: { $ref: "#/components/schemas/ApmNullableNumber" }
        max_ms: { type: number }
        time_consumed_ms: { type: number }
        time_share: { type: number }
    ApmHostService:
      type: object
      required: [service_name, service_namespace, environment, first_seen, last_seen]
      properties:
        service_name: { type: string }
        service_namespace: { type: string }
        environment: { type: string }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
    ApmSettings:
      type: object
      required: [service_name, service_namespace, environment, apdex_t_ms, is_default, updated_at, updated_by_email]
      properties:
        service_name: { type: string }
        service_namespace: { type: string }
        environment: { type: string }
        apdex_t_ms: { type: number }
        is_default: { type: boolean }
        updated_at: { $ref: "#/components/schemas/NullableTimestamp" }
        updated_by_email: { type: string }
    ApmSettingsInput:
      type: object
      required: [apdex_t_ms]
      properties:
        apdex_t_ms: { type: integer, minimum: 1, maximum: 600000 }
    SloSliType:
      type: string
      enum: [availability, latency]
      description: availability = non-error requests / requests; latency = requests at or below the threshold / requests (slo.md §2)
    SloInput:
      type: object
      required: [name, service_name, sli_type, objective, window_days]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        service_name: { type: string, minLength: 1, maxLength: 512 }
        service_namespace:
          type: string
          nullable: true
          description: null = every namespace (aggregated), a string (also "") = exact match
        environment: { type: string, nullable: true, description: 'null = every environment, a string (also "") = exact match' }
        sli_type: { $ref: "#/components/schemas/SloSliType" }
        latency_threshold_ms:
          type: integer
          minimum: 1
          maximum: 600000
          description: Latency SLI only; rejected for availability
        objective: { type: number, minimum: 50, exclusiveMaximum: 100, description: "Target in percent, e.g. 99.9" }
        window_days: { type: integer, enum: [7, 28, 30] }
    Slo:
      type: object
      required: [id, name, description, service_name, service_namespace, environment, sli_type, latency_threshold_ms,
                 objective, window_days, created_by_email, updated_by_email, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        service_name: { type: string }
        service_namespace: { type: string, nullable: true }
        environment: { type: string, nullable: true }
        sli_type: { $ref: "#/components/schemas/SloSliType" }
        latency_threshold_ms: { type: number, nullable: true }
        objective: { type: number }
        window_days: { type: integer }
        created_by_email: { type: string }
        updated_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    SloBudget:
      type: object
      description: Error budget over one range; ratios are null without requests (slo.md §2).
      required: [requests, good, bad, sli, budget_requests, budget_consumed, budget_remaining, remaining_ratio, burn_rate, met]
      properties:
        requests: { type: number, description: Weighted requests (apm.md §4) }
        good: { type: number }
        bad: { type: number }
        sli: { type: number, nullable: true, description: good / requests, 0..1 }
        budget_requests: { type: number, description: "(1 − objective) × requests" }
        budget_consumed: { type: number }
        budget_remaining: { type: number, description: Negative once the objective is missed }
        remaining_ratio: { type: number, nullable: true, description: Share of the budget left (1 = untouched, < 0 = missed) }
        burn_rate: { type: number, nullable: true, description: "(bad / requests) / (1 − objective)" }
        met: { type: boolean }
    SloStatus:
      type: object
      required: [from, to, window_days, budget]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        window_days: { type: integer }
        budget: { $ref: "#/components/schemas/SloBudget" }
    SloListItem:
      allOf:
        - $ref: "#/components/schemas/Slo"
        - type: object
          required: [status]
          properties:
            status:
              allOf: [{ $ref: "#/components/schemas/SloStatus" }]
              nullable: true
              description: null when the status was not computed (status=false or beyond the 50 SLO limit)
    SloBurnWindowResult:
      type: object
      description: One long/short burn window (slo.md §3); rate and ratio are null when a window has no requests.
      required: [name, factor, long_seconds, short_seconds, long, short, rate, ratio, breaching]
      properties:
        name: { type: string }
        factor: { type: number }
        long_seconds: { type: integer }
        short_seconds: { type: integer }
        long: { $ref: "#/components/schemas/SloBudget" }
        short: { $ref: "#/components/schemas/SloBudget" }
        rate: { type: number, nullable: true, description: min(long burn rate, short burn rate) }
        ratio: { type: number, nullable: true, description: rate / factor (breaching at 1) }
        breaching: { type: boolean }
    SloPoint:
      type: object
      required: [t, requests, good, bad, sli, burn_rate, remaining_ratio]
      properties:
        t: { type: integer, format: int64, description: Bucket start (unix milliseconds) }
        requests: { type: number }
        good: { type: number }
        bad: { type: number }
        sli: { type: number, nullable: true, description: Of this bucket }
        burn_rate: { type: number, nullable: true, description: Of this bucket }
        remaining_ratio: { type: number, nullable: true, description: Share of the window's budget left after this bucket (burndown) }
    SloResults:
      type: object
      required: [slo, status, step, burn, series]
      properties:
        slo: { $ref: "#/components/schemas/Slo" }
        status: { $ref: "#/components/schemas/SloStatus" }
        step: { type: string, description: Bucket width of the series (Go duration) }
        burn:
          type: array
          items: { $ref: "#/components/schemas/SloBurnWindowResult" }
        series:
          type: array
          items: { $ref: "#/components/schemas/SloPoint" }
    SyntheticAssertionType:
      type: string
      enum: [none, contains, not_contains, json_path]
      description: Assertion on the response body; json_path compares a dotted path of the decoded JSON (api.md "Synthetic monitoring")
    SyntheticCheckInput:
      type: object
      required: [name]
      description: >
        A check addresses exactly one thing: an http check has a url, every other type has a target.
        The fields of the other types are ignored and stored empty.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: "#/components/schemas/SyntheticCheckType" }
        enabled: { type: boolean, default: true }
        url: { type: string, maxLength: 2048, description: "http only: http(s), without credentials or a fragment" }
        target:
          type: string
          maxLength: 512
          description: "tcp and tls: host:port; dns: the name to resolve"
        dns_record_type: { $ref: "#/components/schemas/SyntheticDnsRecordType" }
        dns_expected:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 1024 }
          description: "dns only: the answers that make the run succeed (empty = any answer does)"
        tls_warning_days:
          type: integer
          minimum: 0
          maximum: 365
          default: 14
          description: "tls only: the run fails while the certificate expires within this many days (0 = only an expired one)"
        method: { type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS], default: GET }
        headers:
          type: object
          additionalProperties: { type: string }
          description: At most 20 headers; Host, Content-Length, Connection, Transfer-Encoding and Upgrade are rejected
        body: { type: string, maxLength: 65536, description: Only with a method that sends a body }
        expected_status:
          type: array
          maxItems: 10
          items: { type: integer, minimum: 100, maximum: 599 }
          description: "The run succeeds only with one of these codes (default [200])"
        assertion_type: { $ref: "#/components/schemas/SyntheticAssertionType" }
        assertion_path: { type: string, maxLength: 1024, description: "json_path only, e.g. data.items.0.status" }
        assertion_value: { type: string, maxLength: 1024 }
        timeout_ms: { type: integer, minimum: 500, maximum: 60000, default: 10000, description: Must not be longer than interval_seconds }
        interval_seconds: { type: integer, minimum: 30, maximum: 86400, default: 300 }
        locations:
          type: array
          maxItems: 10
          items: { type: string }
          description: 'Default ["local"] (the openlog server itself)'
    VulnSeverity:
      type: string
      enum: [critical, high, medium, low, none]
      description: The CVSS base score bucket; "none" is an advisory the feed carries no score for.
    VulnGroup:
      type: object
      required: [vuln_id, cve, severity, score, summary, hosts, packages, first_seen, last_seen]
      properties:
        vuln_id: { type: string, description: "The advisory id as the feed publishes it (CVE-…, DSA-…, GHSA-…)" }
        cve: { type: string, description: "The CVE it is known by, '' when it has none" }
        severity: { $ref: "#/components/schemas/VulnSeverity" }
        score: { type: number, description: CVSS base score (0 when the feed carries none) }
        summary: { type: string }
        hosts: { type: integer, format: int64, description: Hosts with an open finding }
        packages:
          type: array
          items: { type: string }
          description: The affected package names, at most 20
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
    VulnFinding:
      type: object
      required: [host_id, host_name, vuln_id, cve, severity, score, ecosystem, package, version, fixed_in,
                 summary, first_seen, last_seen]
      properties:
        host_id: { type: string }
        host_name: { type: string }
        vuln_id: { type: string }
        cve: { type: string }
        severity: { $ref: "#/components/schemas/VulnSeverity" }
        score: { type: number }
        ecosystem: { type: string, description: "The OSV ecosystem including its release (Debian:12, Alpine:v3.19)" }
        package: { type: string }
        version: { type: string, description: The version the host has installed }
        fixed_in: { type: string, description: "The version that resolves it, '' when the feed knows none" }
        summary: { type: string }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
    VulnCatalogStatus:
      type: object
      required: [vulnerabilities, affected_ranges, ecosystems, last_synced_at, sources]
      properties:
        vulnerabilities: { type: integer }
        affected_ranges: { type: integer }
        ecosystems: { type: integer }
        last_synced_at: { $ref: "#/components/schemas/NullableTimestamp" }
        sources:
          type: array
          items:
            type: object
            required: [source, ecosystem, synced_at, count, error]
            properties:
              source: { type: string }
              ecosystem: { type: string }
              synced_at: { $ref: "#/components/schemas/Timestamp" }
              count: { type: integer }
              error: { type: string }
    JobScheduleKind:
      type: string
      enum: [cron, interval]
      default: cron
      description: >-
        cron: the crontab expression that starts the job. interval: the job reports at least this often,
        which is what a daemon's heartbeat is.
    JobRunStatus:
      type: string
      enum: [running, success, failure, missed, overrun]
      description: >-
        running and success/failure are what the job reports; missed (nothing arrived in time) and overrun
        (a run started and never reported an end) are what openlog concludes.
    JobMonitorInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        kind: { $ref: "#/components/schemas/JobScheduleKind" }
        cron:
          type: string
          maxLength: 200
          description: "cron only: five fields (minute hour day month weekday) or a macro (@daily, @hourly, …)"
        time_zone:
          type: string
          maxLength: 64
          description: "cron only: the IANA zone the expression is read in (empty = UTC)"
        interval_seconds:
          type: integer
          minimum: 60
          maximum: 7776000
          description: "interval only: how often the job is expected to report"
        grace_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 300
          description: How long after the expected time a run may still arrive before it counts as missed
        enabled: { type: boolean, default: true }
        tags:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 64 }
    JobMonitorState:
      type: object
      required: [status, last_ping_at, last_started_at, last_finished_at, last_duration_ms, last_exit_code,
                 last_message, expected_at, consecutive_failures, late]
      properties:
        status: { type: string, description: "The last concluded status, '' until the first run" }
        last_ping_at: { $ref: "#/components/schemas/NullableTimestamp" }
        last_started_at: { $ref: "#/components/schemas/NullableTimestamp" }
        last_finished_at: { $ref: "#/components/schemas/NullableTimestamp" }
        last_duration_ms: { type: number }
        last_exit_code: { type: integer }
        last_message: { type: string }
        expected_at: { $ref: "#/components/schemas/Timestamp" }
        consecutive_failures: { type: integer }
        late: { type: boolean, description: Past the expected time plus grace, not yet concluded }
    JobSummary:
      type: object
      required: [runs, failures, missed, avg_ms, max_ms, last_at]
      properties:
        runs: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        missed: { type: integer, format: int64 }
        avg_ms: { type: number, nullable: true }
        max_ms: { type: number, nullable: true }
        last_at: { $ref: "#/components/schemas/NullableTimestamp" }
    JobMonitor:
      type: object
      required: [id, name, description, kind, cron, time_zone, interval_seconds, grace_seconds, enabled,
                 tags, ping_url, created_by_email, updated_by_email, created_at, updated_at, state]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        kind: { type: string }
        cron: { type: string }
        time_zone: { type: string }
        interval_seconds: { type: integer }
        grace_seconds: { type: integer }
        enabled: { type: boolean }
        tags:
          type: array
          items: { type: string }
        ping_url:
          type: string
          description: >-
            The URL the job calls. It is public by construction — it lives in a crontab — and what it
            authorizes is this monitor's own status (D-141).
        created_by_email: { type: string }
        updated_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        state: { $ref: "#/components/schemas/JobMonitorState" }
        summary: { $ref: "#/components/schemas/JobSummary" }
    JobRun:
      type: object
      required: [timestamp, status, started_at, duration_ms, exit_code, late_seconds, message, source]
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        status: { $ref: "#/components/schemas/JobRunStatus" }
        started_at: { $ref: "#/components/schemas/NullableTimestamp" }
        duration_ms: { type: number }
        exit_code: { type: integer }
        late_seconds: { type: number, description: "Seconds past the expected time; negative means early" }
        message: { type: string }
        source: { type: string, description: The address the ping came from }
    SyntheticCheckType:
      type: string
      enum: [http, tcp, dns, tls]
      default: http
      description: >
        http requests a URL, tcp opens a connection, dns resolves a name and compares the answer, and tls
        completes a handshake and fails while the certificate is expired or expiring (D-140).
    SyntheticDnsRecordType:
      type: string
      enum: [A, AAAA, CNAME, MX, NS, TXT]
      default: A
      description: "dns only: the record the check asks for"
    SyntheticLocationStatus:
      type: object
      description: The schedule row of one location - the last outcome and when the next run is due.
      required: [location, next_run_at, last_run_at, last_success, last_status_code, last_duration_ms, last_error_kind, last_error]
      properties:
        location: { type: string }
        next_run_at: { $ref: "#/components/schemas/Timestamp" }
        last_run_at: { $ref: "#/components/schemas/NullableTimestamp" }
        last_success: { type: boolean, nullable: true, description: null until the first run }
        last_status_code: { type: integer, description: 0 when the run failed before a response }
        last_duration_ms: { type: number }
        last_error_kind: { type: string, description: "dns, connect, tls, certificate, record, timeout, blocked, redirect, status, assertion, body, request" }
        last_error: { type: string }
    DbInstance:
      type: object
      required: [instance, db_system, host_id, host_name, server_address, server_port, calls, throughput, total_time_ms, avg_ms, statements, errors, avg_active_sessions, top_wait, last_seen]
      properties:
        instance: { type: string }
        db_system: { type: string, example: postgresql }
        host_id: { type: string }
        host_name: { type: string }
        server_address: { type: string }
        server_port: { type: integer }
        calls: { type: integer }
        throughput: { type: number, description: calls per second }
        total_time_ms: { type: number }
        avg_ms: { type: number, nullable: true }
        statements: { type: integer }
        errors: { type: integer }
        avg_active_sessions: { type: number, nullable: true, description: null without session samples }
        top_wait: { type: string, description: 'wait type with the most samples ("CPU" = no wait)' }
        last_seen: { type: string, format: date-time }
    DbQuery:
      type: object
      required: [fingerprint, query_id, text, db_names, calls, throughput, total_time_ms, avg_ms, time_share, rows, rows_per_call, rows_examined, errors, no_index_used, blocks_hit, blocks_read, cache_hit_ratio]
      properties:
        fingerprint: { type: string }
        query_id: { type: string }
        text: { type: string }
        db_names: { type: array, items: { type: string } }
        calls: { type: integer }
        throughput: { type: number }
        total_time_ms: { type: number }
        avg_ms: { type: number, nullable: true }
        time_share: { type: number, description: share of the instance's statement time, 0..1 }
        rows: { type: integer }
        rows_per_call: { type: number, nullable: true }
        rows_examined: { type: integer }
        errors: { type: integer }
        no_index_used: { type: integer }
        blocks_hit: { type: integer }
        blocks_read: { type: integer }
        cache_hit_ratio: { type: number, nullable: true }
    DbPlan:
      type: object
      required: [plan_hash, format, plan, total_cost, db_name, first_seen, last_seen, captures, is_current, plan_change]
      properties:
        plan_hash: { type: string }
        format: { type: string, enum: [json, xml] }
        plan: { type: string }
        total_cost: { type: number }
        db_name: { type: string }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        captures: { type: integer }
        is_current: { type: boolean }
        plan_change: { type: boolean, description: the current plan replaced an earlier one }
    DbWait:
      type: object
      required: [type, event, samples, share]
      properties:
        type: { type: string }
        event: { type: string }
        samples: { type: integer }
        share: { type: number }
    DbQueryDetail:
      type: object
      required: [from, to, step, db_system, query, points, plans, waits, callers]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step: { type: string }
        db_system: { type: string }
        query: { $ref: "#/components/schemas/DbQuery" }
        points:
          type: array
          items:
            type: object
            required: [t, calls, throughput, total_time_ms, avg_ms, rows]
            properties:
              t: { type: integer, format: int64 }
              calls: { type: integer }
              throughput: { type: number }
              total_time_ms: { type: number }
              avg_ms: { type: number, nullable: true }
              rows: { type: integer }
        plans: { type: array, items: { $ref: "#/components/schemas/DbPlan" } }
        waits: { type: array, items: { $ref: "#/components/schemas/DbWait" } }
        callers:
          type: array
          items:
            type: object
            required: [service_name, environment, calls, avg_ms, errors]
            properties:
              service_name: { type: string }
              environment: { type: string }
              calls: { type: number }
              avg_ms: { type: number, nullable: true }
              errors: { type: number }
    DbActivity:
      type: object
      required: [from, to, step, series, waits, top_queries]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step: { type: string }
        series:
          type: array
          items:
            type: object
            required: [wait_type, points]
            properties:
              wait_type: { type: string }
              points: { type: array, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } }, description: "[t ms, average active sessions]" }
        waits: { type: array, items: { $ref: "#/components/schemas/DbWait" } }
        top_queries:
          type: array
          items:
            type: object
            required: [fingerprint, text, samples, avg_active_sessions, top_wait]
            properties:
              fingerprint: { type: string }
              text: { type: string }
              samples: { type: integer }
              avg_active_sessions: { type: number }
              top_wait: { type: string }
    DbSession:
      type: object
      required: [session_id, state, wait_type, wait_event, db_name, user, application, client_address, duration_ms, fingerprint, text, blocking_session_ids, blocks]
      properties:
        session_id: { type: string }
        state: { type: string }
        wait_type: { type: string }
        wait_event: { type: string }
        db_name: { type: string }
        user: { type: string }
        application: { type: string }
        client_address: { type: string }
        duration_ms: { type: number }
        fingerprint: { type: string }
        text: { type: string }
        blocking_session_ids: { type: array, items: { type: string } }
        blocks: { type: integer, description: sessions waiting on this one, directly or transitively }
    RumApp:
      type: object
      required: [app, environment, views, sessions, errors, last_seen]
      properties:
        app: { type: string }
        environment: { type: string }
        views: { type: number }
        sessions: { type: integer, format: int64 }
        errors: { type: number }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
    RumVital:
      type: object
      description: >-
        One Core Web Vital over a range. Percentiles are null without measurements. The thresholds are the
        published Core Web Vitals boundaries and are constants, not settings (rum.md §2.1).
      required: [name, unit, count, p50, p75, p95, avg, good, needs_improvement, poor, rating,
                 good_threshold, poor_threshold]
      properties:
        name: { type: string, enum: [lcp, inp, cls, fcp, ttfb] }
        unit: { type: string, description: "\"ms\", or \"\" for the unitless CLS" }
        count: { type: number }
        p50: { type: number, nullable: true }
        p75: { type: number, nullable: true }
        p95: { type: number, nullable: true }
        avg: { type: number, nullable: true }
        good: { type: number, description: Share of measurements rated good, 0..1 }
        needs_improvement: { type: number }
        poor: { type: number }
        rating: { type: string, description: "Rating of the p75: good, needs_improvement, poor, or \"\" without data" }
        good_threshold: { type: number }
        poor_threshold: { type: number }
    ProfileService:
      type: object
      required: [service, environment, type, unit, samples, total, last_seen]
      properties:
        service: { type: string }
        environment: { type: string }
        type: { type: string, description: The sample type of the profile such as cpu or alloc_space }
        unit: { type: string, description: The unit of the profile such as nanoseconds or bytes }
        samples: { type: integer }
        total: { type: integer, format: int64 }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
    ProfileFunction:
      type: object
      required: [function, self, samples]
      properties:
        function: { type: string, description: The innermost frame the value is attributed to }
        self: { type: integer, format: int64 }
        samples: { type: integer }
    FlameNode:
      type: object
      description: >-
        One block of a flame graph — a frame, the total value below it, and the frames it called. The root is
        named "all" and holds the total of every stack returned.
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: integer, format: int64 }
        children:
          type: array
          items: { $ref: "#/components/schemas/FlameNode" }
    RumPage:
      type: object
      required: [route, views, avg_ms, p50_ms, p75_ms, p95_ms, max_ms, ttfb_avg_ms, lcp_p75, errors]
      properties:
        route: { type: string, description: The normalized route (rum.md §4), never a raw URL }
        views: { type: number }
        avg_ms: { type: number, nullable: true }
        p50_ms: { type: number, nullable: true }
        p75_ms: { type: number, nullable: true }
        p95_ms: { type: number, nullable: true }
        max_ms: { type: number }
        ttfb_avg_ms: { type: number, nullable: true }
        lcp_p75: { type: number, nullable: true }
        errors: { type: number }
    RumOverview:
      type: object
      required: [from, to, step, vitals, points, totals]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        step: { type: string }
        vitals:
          type: array
          items: { $ref: "#/components/schemas/RumVital" }
        points:
          type: array
          items:
            type: object
            required: [t, views, avg_ms]
            properties:
              t: { type: integer, format: int64, description: Bucket start (unix milliseconds) }
              views: { type: number }
              avg_ms: { type: number, nullable: true }
        totals:
          type: object
          required: [views, sessions, errors, avg_ms]
          properties:
            views: { type: number }
            sessions: { type: integer, format: int64 }
            errors: { type: number }
            avg_ms: { type: number, nullable: true }
    RumSession:
      type: object
      description: A visit, not a person; the id is random, per tab and expiring (rum.md §1.1).
      required: [session_id, app, environment, started_at, ended_at, duration_ms, page_views, errors,
                 entry_route, exit_route, device_type, browser_name, browser_version, os_name, trace_id]
      properties:
        session_id: { type: string }
        app: { type: string }
        environment: { type: string }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        ended_at: { $ref: "#/components/schemas/Timestamp" }
        duration_ms: { type: number }
        page_views: { type: number }
        errors: { type: number }
        entry_route: { type: string }
        exit_route: { type: string }
        device_type: { type: string }
        browser_name: { type: string }
        browser_version: { type: string }
        os_name: { type: string }
        trace_id: { type: string, description: The session's newest trace, so it always opens somewhere }
    RumEvent:
      type: object
      required: [timestamp, event, name, route, duration_ms, trace_id, span_id, error_group_id, status_code]
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        event: { type: string, enum: [page_view, vital, error, resource] }
        name: { type: string }
        route: { type: string }
        duration_ms: { type: number }
        trace_id: { type: string }
        span_id: { type: string }
        error_group_id:
          type: string
          description: >-
            16 hex digits linking an error to its APM error group. "" when the row is not an error, and when
            the span is no longer the group's newest sample: a span does not store its group, so it is
            resolved through apm_error_groups, which keeps one sample per group
        status_code: { type: integer }
    SourceMap:
      type: object
      description: >-
        A stored source map (rum.md §8). Keyed by the generated file name, because a RUM span carries no
        build identifier and the content hash inside that name identifies one build exactly.
      required: [id, app, script, size_bytes, sha256, created_by_email, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        app: { type: string, description: "The browser application (the browser key's service_name)" }
        script: { type: string, example: "main.3f2a1b9c.js" }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string, description: "Hex digest of the stored document" }
        created_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    BrowserKey:
      type: object
      description: >-
        A public key of the RUM SDK (rum.md §3). The value is not returned by any read: it is public, but the
        API is not a place to read credentials back from.
      required: [id, name, prefix, service_name, environment, kind, origins, app_ids,
                 rate_limit_per_minute, sample_rate,
                 created_by_email, created_at, updated_at, last_used_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, example: olb_1a2b3c4d }
        service_name: { type: string, description: The application every payload of this key is stored under }
        environment: { type: string }
        kind: { $ref: "#/components/schemas/BrowserKeyKind" }
        origins:
          type: array
          description: Exact origins and subdomain wildcards. Non-empty for a browser key, empty for a mobile one.
          items: { type: string }
        app_ids:
          type: array
          description: >-
            Android package names and iOS bundle identifiers. Non-empty for a mobile key, empty for a
            browser one. Self-declared by the application and therefore weaker than origins (rum.md §3.6).
          items: { type: string }
        rate_limit_per_minute: { type: integer }
        sample_rate: { type: number }
        created_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { $ref: "#/components/schemas/Timestamp" }
        revoked_at: { $ref: "#/components/schemas/Timestamp" }
    BrowserKeyKind:
      type: string
      enum: [browser, mobile]
      default: browser
      description: >-
        Which allowlist bounds the key. A browser key is scoped by origins, which a browser sets and page
        JavaScript cannot forge; a mobile key is scoped by application ids, which the application declares
        about itself. The two are mutually exclusive and not equally strong (rum.md §3.6).
    BrowserKeyInput:
      type: object
      description: >-
        Exactly one allowlist must be sent, the one belonging to `kind`: `origins` for a browser key,
        `app_ids` for a mobile one. Sending the other, or neither, is 400.
      required: [name, service_name]
      properties:
        name: { type: string, maxLength: 200 }
        service_name: { type: string, maxLength: 512 }
        environment: { type: string, maxLength: 256 }
        kind: { $ref: "#/components/schemas/BrowserKeyKind" }
        origins:
          type: array
          description: Required when kind is browser; must be absent or empty when kind is mobile.
          maxItems: 50
          items: { type: string, example: "https://app.example.com" }
        app_ids:
          type: array
          description: Required when kind is mobile; must be absent or empty when kind is browser.
          maxItems: 50
          items: { type: string, example: "com.example.shop" }
        rate_limit_per_minute: { type: integer, minimum: 60, maximum: 10000000, default: 6000 }
        sample_rate: { type: number, exclusiveMinimum: 0, maximum: 1, default: 1 }
    SyntheticCheck:
      type: object
      required: [id, name, type, enabled, url, method, headers, body, expected_status, assertion_type,
                 assertion_path, assertion_value, timeout_ms, interval_seconds, locations, target,
                 dns_record_type, dns_expected, tls_warning_days,
                 created_by_email, updated_by_email, created_at, updated_at, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        enabled: { type: boolean }
        url: { type: string }
        method: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        body: { type: string }
        expected_status:
          type: array
          items: { type: integer }
        assertion_type: { $ref: "#/components/schemas/SyntheticAssertionType" }
        assertion_path: { type: string }
        assertion_value: { type: string }
        timeout_ms: { type: integer }
        interval_seconds: { type: integer }
        locations:
          type: array
          items: { type: string }
        target: { type: string, description: "tcp and tls: host:port; dns: the name; empty for http" }
        dns_record_type: { type: string, description: "dns only" }
        dns_expected:
          type: array
          items: { type: string }
        tls_warning_days: { type: integer, description: "tls only" }
        created_by_email: { type: string }
        updated_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        status:
          type: array
          items: { $ref: "#/components/schemas/SyntheticLocationStatus" }
    SyntheticPoint:
      type: object
      required: [t, runs, failures, uptime, p95_ms]
      properties:
        t: { type: integer, format: int64, description: Bucket start (unix milliseconds) }
        runs: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        uptime: { type: number, nullable: true, description: Successful runs of the bucket in percent }
        p95_ms: { type: number, nullable: true }
    SyntheticSummary:
      type: object
      description: Uptime and latency over one range; ratios and percentiles are null without runs.
      required: [from, to, step, runs, failures, uptime, avg_ms, p50_ms, p95_ms, p99_ms, points]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        step: { type: string, description: Bucket width of the series (Go duration) }
        runs: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        uptime: { type: number, nullable: true, description: Successful runs in percent }
        avg_ms: { type: number, nullable: true }
        p50_ms: { type: number, nullable: true }
        p95_ms: { type: number, nullable: true }
        p99_ms: { type: number, nullable: true }
        points:
          type: array
          items: { $ref: "#/components/schemas/SyntheticPoint" }
    SyntheticCheckListItem:
      allOf:
        - $ref: "#/components/schemas/SyntheticCheck"
        - type: object
          required: [summary]
          properties:
            summary:
              allOf: [{ $ref: "#/components/schemas/SyntheticSummary" }]
              nullable: true
              description: null when it was not computed (summary=false) or the check has no run in the range
    SyntheticFailure:
      type: object
      required: [timestamp, location, status_code, error_kind, error, duration_ms]
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        location: { type: string }
        status_code: { type: integer }
        error_kind: { type: string }
        error: { type: string }
        duration_ms: { type: number }
    SyntheticResults:
      type: object
      required: [check, summary, failures]
      properties:
        check: { $ref: "#/components/schemas/SyntheticCheck" }
        summary: { $ref: "#/components/schemas/SyntheticSummary" }
        failures:
          type: array
          items: { $ref: "#/components/schemas/SyntheticFailure" }
    CloudProviderName:
      type: string
      enum: [aws, azure, gcp]
    CloudCredentialField:
      type: object
      description: One credential input of a provider. A field marked secret is a password input and is never prefilled.
      required: [key, required, secret]
      properties:
        key: { type: string, description: "access_key_id, secret_access_key, session_token, tenant_id, client_id, client_secret, client_email, private_key, token_uri" }
        required: { type: boolean }
        secret: { type: boolean }
    CloudProvider:
      type: object
      required: [id, scope_label, credentials, services]
      properties:
        id: { $ref: "#/components/schemas/CloudProviderName" }
        scope_label: { type: string, description: What one scope is called - region (AWS), subscription (Azure), project (GCP) }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/CloudCredentialField" }
        services:
          type: array
          items:
            type: object
            required: [id, metrics]
            properties:
              id: { type: string, description: "Service id stored on a connection (rds, s3, lambda, azure_sql, cloud_sql, ...)" }
              metrics: { type: integer, description: How many metrics of this service are collected }
    CloudProviderCatalog:
      type: object
      required: [providers, secrets_configured, test_supported]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/CloudProvider" }
        secrets_configured: { type: boolean, description: false when OPENLOG_SECRETS_KEY is unset, so credentials cannot be stored }
        test_supported: { type: boolean }
    CloudCredentials:
      type: object
      description: >-
        Write-only provider secrets; the fields a provider does not use are rejected. Never part of a
        response - CloudConnection.credentials_set says whether any are stored.
      properties:
        access_key_id: { type: string, description: AWS }
        secret_access_key: { type: string, description: AWS }
        session_token: { type: string, description: AWS, optional (temporary credentials) }
        tenant_id: { type: string, description: Azure }
        client_id: { type: string, description: Azure }
        client_secret: { type: string, description: Azure }
        client_email: { type: string, description: GCP service account }
        private_key: { type: string, description: GCP service account private key (PEM) }
        token_uri: { type: string, description: GCP, optional }
    CloudConnectionInput:
      type: object
      required: [name, provider, scopes, services]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        provider: { $ref: "#/components/schemas/CloudProviderName" }
        ingest_mode:
          type: string
          enum: [poll, push]
          default: poll
          description: Only poll exists; push is reserved for provider-side delivery and is not collected yet.
        enabled: { type: boolean, default: true }
        scopes:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, maxLength: 200 }
          description: >-
            AWS regions, Azure subscriptions or GCP projects. Each is polled on its own schedule, so one that
            fails or throttles never stops the others. Letters, digits, '-', '_' and '.' only.
        services:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string }
          description: Service ids of the provider's catalog (GET /api/v1/cloud/providers); stored in catalog order.
        poll_interval_seconds: { type: integer, minimum: 60, maximum: 86400, default: 300 }
        max_metrics_per_poll:
          type: integer
          minimum: 100
          maximum: 200000
          default: 5000
          description: Data points one poll of one scope may collect; reaching it makes the poll partial, not ok.
        max_api_calls_per_poll:
          type: integer
          minimum: 1
          maximum: 5000
          default: 200
          description: Provider requests one poll of one scope may make. These APIs are billed per request.
        credentials:
          allOf: [{ $ref: "#/components/schemas/CloudCredentials" }]
          nullable: true
          description: Omitted on PUT keeps the stored credentials; required when the provider changes.
    CloudScopeStatus:
      type: object
      description: The schedule row of one scope - the last poll and when the next one is due.
      required: [scope, next_run_at, last_run_at, last_status, last_error, last_metrics, last_api_calls,
                 last_duration_ms, consecutive_errors]
      properties:
        scope: { type: string }
        next_run_at: { $ref: "#/components/schemas/Timestamp" }
        last_run_at: { $ref: "#/components/schemas/NullableTimestamp" }
        last_status: { type: string, enum: ["", ok, partial, error], description: '"" until the first poll' }
        last_error: { type: string }
        last_metrics: { type: integer }
        last_api_calls: { type: integer }
        last_duration_ms: { type: number }
        consecutive_errors: { type: integer, description: Consecutive failures; the next poll is backed off exponentially }
    CloudConnection:
      type: object
      required: [id, name, provider, ingest_mode, enabled, scopes, services, poll_interval_seconds,
                 max_metrics_per_poll, max_api_calls_per_poll, credentials_set, credentials_key_id,
                 created_by_email, updated_by_email, created_at, updated_at, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        provider: { $ref: "#/components/schemas/CloudProviderName" }
        ingest_mode: { type: string, enum: [poll, push] }
        enabled: { type: boolean }
        scopes:
          type: array
          items: { type: string }
        services:
          type: array
          items: { type: string }
        poll_interval_seconds: { type: integer }
        max_metrics_per_poll: { type: integer }
        max_api_calls_per_poll: { type: integer }
        credentials_set: { type: boolean, description: Whether credentials are stored; the values never leave the server }
        credentials_key_id: { type: string, description: Id of the OPENLOG_SECRETS_KEY that encrypted them (key rotation) }
        created_by_email: { type: string }
        updated_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        status:
          type: array
          items: { $ref: "#/components/schemas/CloudScopeStatus" }
    CloudConnectionList:
      type: object
      required: [connections, secrets_configured, test_supported]
      properties:
        connections:
          type: array
          items: { $ref: "#/components/schemas/CloudConnection" }
        secrets_configured: { type: boolean }
        test_supported: { type: boolean }
    CloudServiceRun:
      type: object
      required: [service, metrics, error]
      properties:
        service: { type: string }
        metrics: { type: integer }
        error: { type: string, description: '"" when the service was read completely' }
    CloudRun:
      type: object
      description: One recorded poll of one scope.
      required: [id, scope, started_at, duration_ms, status, metrics, api_calls, throttled, error, services]
      properties:
        id: { type: integer, format: int64 }
        scope: { type: string }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        duration_ms: { type: number }
        status:
          type: string
          enum: [ok, partial, error]
          description: >-
            partial means some services or resources failed, or a per-poll cap stopped the run; error means
            nothing was collected for this scope.
        metrics: { type: integer, description: Data points written }
        api_calls: { type: integer, description: Provider requests made (what the provider bills for) }
        throttled: { type: integer, description: How often the provider rate-limited this poll }
        error: { type: string }
        services:
          type: array
          items: { $ref: "#/components/schemas/CloudServiceRun" }
    CloudRunList:
      type: object
      required: [connection, runs]
      properties:
        connection: { $ref: "#/components/schemas/CloudConnection" }
        runs:
          type: array
          items: { $ref: "#/components/schemas/CloudRun" }
    CloudTestRequest:
      type: object
      description: >-
        Either submitted credentials (the form before saving) or connection_id alone (test what is stored).
      properties:
        connection_id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/CloudProviderName" }
        scope: { type: string, description: The region, subscription or project to test; defaults to the connection's first scope }
        credentials:
          allOf: [{ $ref: "#/components/schemas/CloudCredentials" }]
          nullable: true
    CloudTestResult:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean }
        error: { type: string, description: The provider's message when ok is false }
    TailSamplingRule:
      type: object
      description: One rule of a tail sampling policy; the first matching rule gives the keep ratio (apm.md §4.2).
      required: [name, type]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        type: { type: string, enum: [error, latency, service, route, attribute] }
        ratio: { type: number, minimum: 0, maximum: 1, description: "Keep probability, default 1" }
        threshold_ms: { type: integer, minimum: 1, maximum: 3600000, description: "latency: trace duration, or a span of `service`" }
        service: { type: string, maxLength: 512, description: "Restricts error, latency, route and attribute rules to spans of this service" }
        services: { type: array, maxItems: 50, items: { type: string, minLength: 1 }, description: "service rule" }
        route: { type: string, maxLength: 512, description: "route rule: glob on http.route (span name without route); a trailing * is a prefix match" }
        key: { type: string, maxLength: 512, description: "attribute rule: span or resource attribute key" }
        value: { type: string, maxLength: 512, description: "attribute rule: required value (empty: key present)" }
    TailSamplingPolicy:
      type: object
      required: [enabled, baseline_ratio, max_spans_per_second, rules]
      additionalProperties: false
      properties:
        enabled: { type: boolean, description: "false keeps every trace (the policy is stored but inactive)" }
        baseline_ratio: { type: number, minimum: 0, maximum: 1 }
        max_spans_per_second: { type: number, minimum: 0, maximum: 10000000, description: "Per sampler instance; 0 = unlimited" }
        rules: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/TailSamplingRule" } }
    TailSamplingPolicyInput:
      type: object
      required: [policy, version]
      properties:
        policy: { $ref: "#/components/schemas/TailSamplingPolicy" }
        version: { type: integer, minimum: 0 }
    TailSamplingPolicyState:
      type: object
      required: [enabled, policy, is_default, version, updated_at, updated_by_email]
      properties:
        enabled: { type: boolean, description: "OPENLOG_TAILSAMPLING_ENABLED" }
        policy: { $ref: "#/components/schemas/TailSamplingPolicy" }
        is_default: { type: boolean }
        version: { type: integer }
        updated_at: { $ref: "#/components/schemas/NullableTimestamp" }
        updated_by_email: { type: string }
    TailSamplingPreview:
      type: object
      required: [window_minutes, traces_examined, sampled_fraction, estimated_traces, kept_trace_ratio, kept_span_ratio, rules]
      properties:
        window_minutes: { type: integer }
        traces_examined: { type: integer }
        sampled_fraction: { type: number }
        estimated_traces: { type: number, description: "Adjusted count of traces in the window" }
        kept_trace_ratio: { type: number }
        kept_span_ratio: { type: number }
        rules:
          type: array
          description: Per rule in order, then `baseline` (traces matching no rule)
          items:
            type: object
            required: [name, matched_trace_ratio, kept_trace_ratio]
            properties:
              name: { type: string }
              matched_trace_ratio: { type: number }
              kept_trace_ratio: { type: number }
    ApmMapNode:
      type: object
      required: [id, type, name, service_namespace, environment, requests, throughput, error_rate, avg_ms, p95_ms, apdex, host_count, container_count]
      properties:
        id: { type: string }
        type: { type: string, enum: [service, db, external, messaging] }
        name: { type: string }
        service_namespace: { type: string }
        environment: { type: string }
        requests: { type: number }
        throughput: { type: number }
        error_rate: { type: number }
        avg_ms: { $ref: "#/components/schemas/ApmNullableNumber" }
        p95_ms: { $ref: "#/components/schemas/ApmNullableNumber" }
        apdex: { $ref: "#/components/schemas/ApmNullableNumber" }
        host_count: { type: integer, description: "Services: hosts that reported the service since from (0 for dependencies)" }
        container_count: { type: integer, description: "Services: containers that reported the service since from" }
    ApmMapEdge:
      type: object
      required: [id, source, target, target_type, calls, throughput, errors, error_rate, avg_ms, p95_ms]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        target_type: { type: string, enum: [service, db, external, messaging] }
        calls: { type: number }
        throughput: { type: number }
        errors: { type: number }
        error_rate: { type: number }
        avg_ms: { $ref: "#/components/schemas/ApmNullableNumber" }
        p95_ms: { $ref: "#/components/schemas/ApmNullableNumber" }
    ApmMap:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/ApmMapNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/ApmMapEdge" }
    ApmErrorStatus: { type: string, enum: [unresolved, resolved, ignored] }
    ApmErrorAssignee:
      type: object
      required: [user_id, email, name]
      properties:
        user_id: { type: string }
        email: { type: string }
        name: { type: string }
    ApmErrorWorkflow:
      type: object
      description: Workflow state of an error group (apm.md §3.4); a group without state is unresolved and unassigned.
      required: [status, assignee, resolved_at, resolved_in_version, resolved_by_email, regressed_at, regression_count, comment_count, updated_at, updated_by_email]
      properties:
        status: { $ref: "#/components/schemas/ApmErrorStatus" }
        assignee:
          oneOf:
            - { $ref: "#/components/schemas/ApmErrorAssignee" }
            - { type: "null" }
        resolved_at: { $ref: "#/components/schemas/NullableTimestamp" }
        resolved_in_version: { type: string }
        resolved_by_email: { type: string }
        regressed_at: { $ref: "#/components/schemas/NullableTimestamp" }
        regression_count: { type: integer }
        comment_count: { type: integer }
        updated_at: { $ref: "#/components/schemas/NullableTimestamp" }
        updated_by_email: { type: string }
    ApmErrorInbox:
      type: object
      required: [groups, step, counts, truncated, workflow]
      properties:
        step: { type: string }
        groups:
          type: array
          items: { $ref: "#/components/schemas/ApmErrorGroup" }
        counts:
          type: object
          description: Groups per status after the assignee and q filters (before the status filter)
          required: [unresolved, resolved, ignored]
          properties:
            unresolved: { type: integer }
            resolved: { type: integer }
            ignored: { type: integer }
        truncated: { type: boolean, description: More than 2000 candidate groups or more than limit results }
        workflow: { type: boolean, description: "false without PostgreSQL (static auth mode): every group is unresolved" }
    ApmErrorGroupState:
      allOf:
        - type: object
          required: [group_id, service_name, service_namespace, environment]
          properties:
            group_id: { type: string }
            service_name: { type: string }
            service_namespace: { type: string }
            environment: { type: string }
        - $ref: "#/components/schemas/ApmErrorWorkflow"
    ApmErrorGroupPatch:
      type: object
      required: [group_ids]
      properties:
        group_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, pattern: "^[0-9a-fA-F]{16}$" }
        status: { $ref: "#/components/schemas/ApmErrorStatus" }
        assignee_user_id: { type: string, description: 'A member''s user id; "" unassigns; omitted = unchanged' }
        resolved_in_version: { type: string, maxLength: 256, description: Only with status resolved (apm.md §3.4 regression rules) }
    ApmErrorComment:
      type: object
      required: [id, author_user_id, author_email, author_name, body, created_at]
      properties:
        id: { type: string }
        author_user_id: { type: string }
        author_email: { type: string }
        author_name: { type: string }
        body: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ApmErrorCommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
    ApmErrorActivity:
      type: object
      required: [action, actor_email, details, created_at]
      properties:
        action: { type: string, description: "apm.error_group.update, .regressed, .comment, .comment_delete" }
        actor_email: { type: string }
        details: { type: object, additionalProperties: true }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ApmAffected:
      type: object
      required: [value, name, count, first_seen, last_seen]
      properties:
        value: { type: string }
        name: { type: string, description: Host or container name when known }
        count: { type: number }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }
    ApmErrorAffected:
      type: object
      description: Top 20 per dimension over retention (apm_error_group_dims)
      required: [versions, hosts, containers, transactions]
      properties:
        versions: { type: array, items: { $ref: "#/components/schemas/ApmAffected" } }
        hosts: { type: array, items: { $ref: "#/components/schemas/ApmAffected" } }
        containers: { type: array, items: { $ref: "#/components/schemas/ApmAffected" } }
        transactions: { type: array, items: { $ref: "#/components/schemas/ApmAffected" } }
    ApmDeployment:
      type: object
      required: [timestamp, t, service_namespace, environment, version, previous_version, initial, rollback]
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        t: { type: integer, description: Unix milliseconds }
        service_namespace: { type: string }
        environment: { type: string }
        version: { type: string }
        previous_version: { type: string }
        initial: { type: boolean }
        rollback: { type: boolean }
    ApmPeriod:
      allOf:
        - type: object
          required: [from, to]
          properties:
            from: { $ref: "#/components/schemas/Timestamp" }
            to: { $ref: "#/components/schemas/Timestamp" }
        - $ref: "#/components/schemas/ApmRed"
    ApmDeploymentCompare:
      type: object
      required: [at, window_seconds, apdex_t_ms, before, after, new_error_groups]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        window_seconds: { type: integer }
        apdex_t_ms: { type: number }
        before: { $ref: "#/components/schemas/ApmPeriod" }
        after: { $ref: "#/components/schemas/ApmPeriod" }
        new_error_groups:
          type: array
          items:
            type: object
            required: [group_id, error_type, message, first_seen, total_count]
            properties:
              group_id: { type: string }
              error_type: { type: string }
              message: { type: string }
              first_seen: { $ref: "#/components/schemas/Timestamp" }
              total_count: { type: number }
    ApmMapPath:
      type: object
      required: [trace_count, nodes, edges]
      properties:
        trace_count: { type: integer }
        nodes: { type: array, items: { type: string } }
        edges: { type: array, items: { type: string } }
    ApmTraceResult:
      allOf:
        - $ref: "#/components/schemas/ApmTraceSample"
        - type: object
          required: [service_namespace, environment, transaction_type]
          properties:
            service_namespace: { type: string }
            environment: { type: string }
            transaction_type: { type: string }
    Role:
      type: string
      enum: [owner, admin, member, viewer]

    NullableTimestamp:
      oneOf:
        - { $ref: "#/components/schemas/Timestamp" }
        - { type: "null" }

    AuthConfig:
      type: object
      required: [mode, signup_enabled, password_min_length, email_enabled, email_verification_required, captcha]
      properties:
        mode: { type: string, enum: [postgres, static] }
        signup_enabled: { type: boolean }
        password_min_length: { type: integer }
        email_enabled: { type: boolean, description: "Invitation and verification e-mails are sent (SMTP and OPENLOG_PUBLIC_URL configured)" }
        email_verification_required: { type: boolean, description: "Sign-ups must confirm their e-mail before creating keys or inviting" }
        captcha:
          description: CAPTCHA widget for sign-up; null when not configured or sign-up is disabled.
          oneOf:
            - type: object
              required: [provider, site_key]
              properties:
                provider: { type: string, enum: [turnstile, hcaptcha] }
                site_key: { type: string }
            - { type: "null" }
        sso_enabled: { type: boolean, description: "“Sign in with SSO” is offered (postgres mode, OPENLOG_SSO_ENABLED, OPENLOG_PUBLIC_URL). Always present since M4." }

    SSODiscovery:
      type: object
      required: [sso, organization_name, connection_name, protocol, enforced]
      properties:
        sso: { type: boolean }
        organization_name: { type: [string, "null"] }
        connection_name: { type: [string, "null"], description: "Name of the connection the e-mail domain routes to" }
        protocol:
          oneOf:
            - { type: string, enum: [oidc, saml] }
            - { type: "null" }
        enforced: { type: boolean }

    SSOState:
      type: object
      required: [available, secrets_encrypted, scim_enabled, email_verification_available, domain_email_local_parts, service_provider, connection, connections]
      properties:
        available: { type: boolean, description: "OPENLOG_PUBLIC_URL is set (SSO cannot be used without it)" }
        secrets_encrypted: { type: boolean, description: "Client secrets and SP keys are sealed (OPENLOG_SSO_SECRET_KEY or OPENLOG_KEY_HASH_SECRET)" }
        scim_enabled: { type: boolean }
        email_verification_available: { type: boolean, description: "Domains can be verified by e-mail (SMTP configured)" }
        domain_email_local_parts: { type: array, items: { type: string } }
        service_provider:
          type: object
          description: Values to register at the identity provider. SAML values are those of the addressed SAML connection.
          required: [oidc_redirect_uri, oidc_post_logout_redirect_uri, oidc_backchannel_logout_uri, oidc_frontchannel_logout_uri, scim_base_url,
            saml_entity_id, saml_acs_url, saml_slo_url, saml_slo_soap_url, saml_metadata_url, saml_certificate_pem]
          properties:
            oidc_redirect_uri: { type: string }
            oidc_post_logout_redirect_uri: { type: string, description: "Register as a valid post logout redirect URI (RP-initiated logout)" }
            oidc_backchannel_logout_uri: { type: [string, "null"], description: "Back-channel logout URI of the addressed OIDC connection (register with sid required)" }
            oidc_frontchannel_logout_uri: { type: [string, "null"], description: "Front-channel logout URI of the addressed OIDC connection (register with session required)" }
            saml_slo_soap_url: { type: [string, "null"], description: "SOAP single logout service of the addressed SAML connection (back-channel), also in the SP metadata" }
            scim_base_url: { type: string }
            saml_entity_id: { type: [string, "null"] }
            saml_acs_url: { type: [string, "null"] }
            saml_slo_url: { type: [string, "null"], description: "Single logout service (HTTP-Redirect and HTTP-POST), also in the SP metadata" }
            saml_metadata_url: { type: [string, "null"] }
            saml_certificate_pem: { type: [string, "null"] }
        connection:
          description: The addressed connection (the default connection on the single-connection API; null on the list)
          oneOf:
            - { $ref: "#/components/schemas/SSOConnection" }
            - { type: "null" }
        connections: { type: array, items: { $ref: "#/components/schemas/SSOConnection" }, description: "All connections, the default first" }

    SSOHealth:
      type: object
      description: Background refresh of the IdP documents (OIDC discovery/JWKS, SAML metadata) and certificate/metadata expiry.
      required: [status, message, checked_at, next_at, failures, metadata_valid_until]
      properties:
        status: { type: string, enum: [ok, warning, error, unknown], description: "unknown = not refreshed yet; error = 3 consecutive failures or an expired certificate" }
        message: { type: string }
        checked_at: { $ref: "#/components/schemas/NullableTimestamp" }
        next_at: { $ref: "#/components/schemas/NullableTimestamp" }
        failures: { type: integer, description: Consecutive failed refreshes }
        metadata_valid_until: { $ref: "#/components/schemas/NullableTimestamp" }

    SSORoleMappings:
      type: object
      required: [mappings, connection_id]
      properties:
        mappings: { type: array, items: { $ref: "#/components/schemas/SSORoleMapping" } }
        connection_id: { type: [string, "null"], description: "null = organization-wide" }

    SSOSessionInfo:
      type: object
      required: [sso, protocol, connection_id, connection_name, idp_logout]
      properties:
        sso: { type: boolean, description: The session was created by single sign-on }
        protocol:
          oneOf:
            - { type: string, enum: [oidc, saml] }
            - { type: "null" }
        connection_id: { type: [string, "null"] }
        connection_name: { type: [string, "null"] }
        idp_logout: { type: boolean, description: "The IdP session can be ended (SAML SingleLogoutService or OIDC end_session_endpoint)" }

    SSOLogoutResult:
      type: object
      required: [protocol, redirect_url, post, revoked_sessions]
      properties:
        protocol:
          oneOf:
            - { type: string, enum: [oidc, saml] }
            - { type: "null" }
        redirect_url: { type: [string, "null"], description: "Navigate the browser here to end the IdP session" }
        post:
          oneOf:
            - type: object
              required: [url, fields]
              properties:
                url: { type: string }
                fields: { type: object, additionalProperties: { type: string } }
            - { type: "null" }
        revoked_sessions: { type: integer }

    SSOConnection:
      type: object
      required: [id, protocol, name, enabled, default, oidc, saml, email_attribute, name_attribute, groups_attribute, jit_enabled, default_role,
        session_max_age_seconds, logout_redirect_allowlist, allow_external_invitations, enforce, break_glass_user_ids, config_version, tested,
        last_test, health, created_at, updated_at]
      properties:
        id: { type: string }
        protocol: { type: string, enum: [oidc, saml] }
        name: { type: string }
        enabled: { type: boolean }
        default: { type: boolean, description: "The organization's default (oldest) connection: domains without connection_id route to it" }
        oidc:
          oneOf:
            - type: object
              required: [issuer, client_id, scopes, require_email_verified, client_secret_set]
              properties:
                issuer: { type: string }
                client_id: { type: string }
                scopes: { type: array, items: { type: string } }
                require_email_verified: { type: boolean }
                client_secret_set: { type: boolean, description: The secret itself is never returned }
            - { type: "null" }
        saml:
          oneOf:
            - type: object
              required: [idp_metadata_url, idp_entity_id, idp_sso_url, idp_slo_url, idp_certificates, idp_cert_not_after, allow_idp_initiated, relay_state_allowlist, sign_authn_requests,
                metadata_signing_certificates, allow_unsigned_metadata, pending_metadata]
              properties:
                idp_metadata_url: { type: string, description: "Re-fetched by the background refresh" }
                idp_entity_id: { type: string }
                idp_sso_url: { type: string }
                idp_slo_url: { type: [string, "null"], description: "IdP SingleLogoutService (null: no SAML single logout)" }
                idp_certificates: { type: array, items: { type: string }, description: SHA-256 fingerprints of the IdP signing certificates }
                idp_cert_not_after: { $ref: "#/components/schemas/NullableTimestamp" }
                allow_idp_initiated: { type: boolean }
                relay_state_allowlist: { type: array, items: { type: string } }
                sign_authn_requests: { type: boolean }
                metadata_signing_certificates:
                  type: array
                  items: { type: string }
                  description: "SHA-256 fingerprints of the pinned metadata signing certificates (D-098); empty = unsigned metadata"
                allow_unsigned_metadata: { type: boolean, description: "The administrator allowed unsigned metadata from idp_metadata_url" }
                pending_metadata:
                  description: "A refreshed metadata change that waits for POST …/metadata/accept (null: none)"
                  oneOf:
                    - type: object
                      required: [digest, reason, detected_at, idp_certificates, idp_sso_url, idp_slo_url, signer_certificate]
                      properties:
                        digest: { type: string }
                        reason: { type: string, enum: [changed, signer_changed], description: "changed: unsigned metadata with other certificates or endpoints; signer_changed: signed by a certificate that is not pinned" }
                        detected_at: { $ref: "#/components/schemas/Timestamp" }
                        idp_certificates: { type: array, items: { type: string } }
                        idp_sso_url: { type: string }
                        idp_slo_url: { type: [string, "null"] }
                        signer_certificate: { type: [string, "null"], description: "SHA-256 fingerprint of the new metadata signing certificate" }
                    - { type: "null" }
            - { type: "null" }
        email_attribute: { type: string, description: "Empty = default (OIDC email; SAML email/mail/… or an e-mail NameID)" }
        name_attribute: { type: string }
        groups_attribute: { type: string, description: "Empty = groups" }
        jit_enabled: { type: boolean }
        default_role: { type: string, enum: [admin, member, viewer] }
        session_max_age_seconds: { type: integer, description: "0 = OPENLOG_SESSION_TTL only" }
        logout_redirect_allowlist: { type: array, items: { type: string }, description: "UI paths single logout may return to besides /login" }
        allow_external_invitations: { type: boolean, description: "Members of domains routed here may accept invitations of other organizations with a password" }
        enforce: { type: boolean }
        break_glass_user_ids: { type: array, items: { type: string } }
        config_version: { type: integer }
        tested: { type: boolean, description: The current settings passed a test sign-in (required for enforcement) }
        last_test:
          oneOf:
            - type: object
              required: [at, ok, current, error, details]
              properties:
                at: { $ref: "#/components/schemas/Timestamp" }
                ok: { type: boolean }
                current: { type: boolean, description: "false when the settings changed since this successful test" }
                error: { type: string }
                details: { type: object, additionalProperties: true, description: "email, name, subject, groups, role, role_mapped" }
            - { type: "null" }
        health: { $ref: "#/components/schemas/SSOHealth" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    SSOConnectionInput:
      type: object
      required: [protocol, enabled]
      properties:
        protocol: { type: string, enum: [oidc, saml] }
        name: { type: string, maxLength: 200 }
        enabled: { type: boolean }
        oidc:
          type: object
          required: [issuer, client_id]
          properties:
            issuer: { type: string }
            client_id: { type: string }
            client_secret: { type: [string, "null"], description: "Omitted or null keeps the stored secret; empty removes it" }
            scopes: { type: array, items: { type: string } }
            require_email_verified: { type: boolean, default: true }
        saml:
          type: object
          properties:
            idp_metadata_url: { type: string, description: Fetched when saved }
            idp_metadata_xml: { type: string }
            metadata_signing_certificate_pem:
              type: [string, "null"]
              description: >-
                With idp_metadata_url: PEM certificate(s) (≤ 5) the metadata must be signed with. Omitted or null keeps the
                pinned certificates of an unchanged URL, otherwise the signer of signed metadata is pinned; "" removes them
            allow_unsigned_metadata: { type: boolean, description: "With idp_metadata_url: accept unsigned metadata (changed certificates or endpoints then wait for confirmation); required when the metadata is unsigned and no certificate is set" }
            allow_idp_initiated: { type: boolean }
            relay_state_allowlist: { type: array, items: { type: string } }
            sign_authn_requests: { type: boolean }
        email_attribute: { type: string }
        name_attribute: { type: string }
        groups_attribute: { type: string }
        jit_enabled: { type: boolean, default: true }
        default_role: { type: string, enum: [admin, member, viewer], default: viewer }
        session_max_age_seconds: { type: integer, description: "0 or 300–2592000" }
        logout_redirect_allowlist: { type: array, items: { type: string }, maxItems: 20 }
        allow_external_invitations: { type: boolean, description: "Omitted keeps the stored value (true for a new connection)" }

    SSOTestResult:
      type: object
      required: [ok, checks]
      properties:
        ok: { type: boolean }
        checks:
          type: array
          items:
            type: object
            required: [name, ok, message]
            properties:
              name: { type: string, description: "public_url, discovery, signing_algorithms, jwks, pkce, client_secret, idp_metadata, idp_certificate, sp_key" }
              ok: { type: boolean }
              message: { type: string }

    SSODomain:
      type: object
      required: [id, domain, verified, verified_at, verification_method, dns_record, email_address, email_expires_at, last_checked_at, connection_id, created_at]
      properties:
        id: { type: string }
        domain: { type: string }
        verified: { type: boolean }
        verified_at: { $ref: "#/components/schemas/NullableTimestamp" }
        verification_method: { type: [string, "null"], description: "dns_txt or email" }
        dns_record:
          type: object
          required: [type, name, value]
          properties:
            type: { type: string, enum: [TXT] }
            name: { type: string, description: "_openlog-verification.<domain>" }
            value: { type: string, description: "openlog-domain-verification=<token>" }
        email_address: { type: [string, "null"], description: Address of a pending e-mail verification }
        email_expires_at: { $ref: "#/components/schemas/NullableTimestamp" }
        last_checked_at: { $ref: "#/components/schemas/NullableTimestamp" }
        connection_id: { type: [string, "null"], description: "Connection sign-ins of the domain use (null = the default connection)" }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    SSORoleMapping:
      type: object
      required: [group, role]
      properties:
        group: { type: string, minLength: 1, maxLength: 512 }
        role: { type: string, enum: [admin, member, viewer] }

    SCIMToken:
      type: object
      required: [id, name, prefix, created_by_email, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        created_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { $ref: "#/components/schemas/NullableTimestamp" }
        expires_at: { $ref: "#/components/schemas/NullableTimestamp" }
        revoked_at: { $ref: "#/components/schemas/NullableTimestamp" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    SignupRequest:
      type: object
      required: [email, password, organization_name]
      properties:
        email: { type: string }
        password: { type: string, minLength: 8 }
        name: { type: string }
        organization_name: { type: string }
        captcha_token: { type: string, description: "Widget response; required when AuthConfig.captcha is set" }

    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }

    NameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    User:
      type: object
      required: [id, email, name, email_verified, language]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        email_verified: { type: boolean, description: "false only for sign-ups that have not confirmed their address" }
        language: { $ref: "#/components/schemas/UserLanguage" }

    UserLanguage:
      type: string
      enum: [auto, en, tr]
      description: The user's language for the web UI and e-mails sent to them; auto = the browser's (D-095).

    OrgLanguage:
      type: string
      enum: ["", en, tr]
      description: Default e-mail language of the organization, used when a recipient has no preference; "" = none (D-095).

    VersionInfo:
      type: object
      required: [version, commit, date, latest_available, update_check, updater, update_requests]
      properties:
        update_requests:
          description: '"Check now" / "Update now" channel to openlog-updater; null in OPENLOG_AUTH_MODE=static.'
          oneOf:
            - $ref: "#/components/schemas/UpdateRequests"
            - { type: "null" }
        version: { type: string, description: "SemVer product version; dev builds 0.0.0-dev+<commit>", example: "0.9.1" }
        commit: { type: string }
        date: { type: string, description: Build time (RFC3339) or empty }
        latest_available:
          description: Newest verified release of OPENLOG_UPDATE_CHANNEL when newer than this pod; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/AvailableRelease"
            - { type: "null" }
        update_check: { type: string, enum: [enabled, disabled, failed] }
        updater:
          description: Status reported by openlog-updater (null when no updater runs). See docs/operations/upgrading.md.
          oneOf:
            - $ref: "#/components/schemas/UpdaterStatus"
            - { type: "null" }

    UpdateRequests:
      type: object
      required: [can_request, updater_listening, updater_polled_at, latest]
      properties:
        can_request:
          type: boolean
          description: The caller may use POST /version/check and /version/update (signed-in admin or owner; with OPENLOG_SIGNUP_ENABLED=true a superadmin of OPENLOG_SUPERADMIN_EMAILS instead).
        updater_listening:
          type: boolean
          description: A Compose updater polled update_requests recently (picks up requests within seconds). The Kubernetes CronJob never listens; it handles requests at its next scheduled run.
        updater_polled_at:
          type: [string, "null"]
          format: date-time
        latest:
          description: The newest request (any action); null when none was made.
          oneOf:
            - $ref: "#/components/schemas/UpdateRequest"
            - { type: "null" }

    UpdateRequest:
      type: object
      required: [id, action, target_version, ignore_maintenance_window, state, message, requested_by_email, requested_at, picked_at, finished_at]
      properties:
        id: { type: string }
        action: { type: string, enum: [check, apply] }
        target_version: { type: string, description: "apply only; empty for check" }
        ignore_maintenance_window: { type: boolean }
        state:
          type: string
          enum: [pending, running, done, failed, expired]
          description: "expired: no updater picked the request up within 15 minutes"
        message: { type: string, description: Result reported by the updater (e.g. the reason a request failed) }
        message_code:
          type: string
          description: "Stable code of message when it is a fixed updater message (see UpdaterStatus.message_code; request-only codes: request_mode_off, request_not_installable, request_target_changed, request_outside_window, request_interrupted, request_expired); omitted for free text"
        message_params:
          type: object
          additionalProperties: { type: string }
          description: "Parameters of message_code (e.g. version, from, to, reason, details; error = English error appended to the message)"
        requested_by_email:
          type: [string, "null"]
          description: Only for callers with can_request
        requested_at: { type: string, format: date-time }
        picked_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    OnboardingEndpoint:
      type: object
      required: [url, source]
      properties:
        url: { type: string, example: "https://ingest.openlog.example.com:4318" }
        source:
          type: string
          description: |
            configured: OPENLOG_PUBLIC_URL / OPENLOG_INGEST_PUBLIC_URL / OPENLOG_INGEST_PUBLIC_GRPC_URL.
            derived_public_url: scheme and host of OPENLOG_PUBLIC_URL with port 4318 (gRPC 4317).
            derived_ingest_url: gRPC only, host of OPENLOG_INGEST_PUBLIC_URL with port 4317.
            derived_request: scheme and host the browser used (well-formed X-Forwarded-Proto/-Host win).
          enum: [configured, derived_public_url, derived_ingest_url, derived_request]

    Onboarding:
      type: object
      description: Inputs of the web UI's "Add data" install commands (GET /api/v1/onboarding). No secrets.
      required: [ui_url, otlp_http, otlp_grpc, server_version, agent_version, release_channel, cors_enabled, cors_allowed_origins,
        auth_mode, organization, role, features]
      properties:
        ui_url: { $ref: "#/components/schemas/OnboardingEndpoint" }
        otlp_http: { $ref: "#/components/schemas/OnboardingEndpoint" }
        otlp_grpc: { $ref: "#/components/schemas/OnboardingEndpoint" }
        server_version: { type: string, example: "0.9.1" }
        agent_version:
          type: [string, "null"]
          description: >-
            Release the commands pin (Java jar, container image tag, Helm chart tag): the newest verified release of
            release_channel when the release check found one, else this server's release version; null for dev builds.
          example: "0.9.2"
        release_channel: { type: string, enum: [stable, beta] }
        cors_enabled: { type: boolean, description: OPENLOG_INGEST_CORS_ALLOWED_ORIGINS is set (browser OTLP/JSON logs) }
        cors_allowed_origins:
          type: array
          items: { type: string }
        auth_mode: { type: string, enum: [postgres, static] }
        organization:
          type: object
          required: [id, tenant_id, name]
          properties:
            id: { type: string }
            tenant_id: { type: string }
            name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        features:
          type: object
          required: [license_keys, can_create_license_keys, can_list_license_keys, fleet_php_install, tail_sampling]
          properties:
            license_keys: { type: boolean, description: License key management endpoints exist (postgres auth mode) }
            can_create_license_keys: { type: boolean, description: The caller is a signed-in admin or owner }
            can_list_license_keys: { type: boolean, description: The caller is a signed-in member or higher }
            fleet_php_install: { type: boolean, description: The fleet can install the PHP agent (php-agent.md §7.3) }
            tail_sampling: { type: boolean, description: OPENLOG_TAILSAMPLING_ENABLED }
        agent_packages:
          description: >-
            Node.js, Python and .NET agent packages of agent_version: whether npm, PyPI and nuget.org serve that version
            (checked by the server, cached for an hour) and the files attached to the GitHub release. Null when
            agent_version is null. Commands install from the registry only when registry is "available".
          oneOf:
            - type: object
              required: [node, python, dotnet]
              properties:
                node: { $ref: "#/components/schemas/OnboardingAgentPackage" }
                python: { $ref: "#/components/schemas/OnboardingAgentPackage" }
                dotnet: { $ref: "#/components/schemas/OnboardingAgentPackage" }
            - { type: "null" }

    OnboardingAgentPackage:
      type: object
      required: [name, version, registry, registry_url, release_asset_url, release_asset_sha256_url]
      properties:
        name: { type: string, example: "openlog-node" }
        version: { type: string, description: agent_version (PEP 440 form for Python), example: "0.9.2" }
        registry:
          type: string
          enum: [available, missing, unknown]
          description: "available: the registry answered 200; missing: 404; unknown: not checked, offline, timeout or another answer"
        registry_url: { type: string }
        release_asset_url: { type: string, example: "https://github.com/onuragtas/openlog/releases/download/v0.9.2/openlog-node-0.9.2.tgz" }
        release_asset_sha256_url: { type: string, description: sha256sum file of the release asset }

    AvailableRelease:
      type: object
      required: [version, notes_url, checked_at]
      properties:
        version: { type: string, example: "0.9.2" }
        notes_url: { type: string }
        checked_at: { type: string, format: date-time }

    UpdaterStatus:
      type: object
      required: [engine, mode, state, checked_at]
      properties:
        engine: { type: string, enum: [compose, kubernetes] }
        mode: { type: string, enum: ["off", notify, auto] }
        state:
          type: string
          enum: ["off", error, up_to_date, available, waiting_for_maintenance_window, updating, succeeded, failed, rolled_back, rollback_failed]
        message: { type: string, description: English text (kept for older clients and logs) }
        message_code:
          type: string
          description: "Stable code of message for translation; absent for free text and in documents of older updaters. Known: mode_off, update_available, update_available_notify, waiting_for_window, updated, rolled_back, rollback_failed, failed_before_change, up_to_date_newest, up_to_date_no_eligible"
        message_params:
          type: object
          additionalProperties: { type: string }
          description: "Parameters of message_code: version, from, to, channel, details (English)"
        error: { type: string }
        current_version: { type: string }
        target_version: { type: string }
        previous_version: { type: string }
        notes_url: { type: string }
        checked_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        backup_file: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [name, status, started_at]
            properties:
              name: { type: string, description: "backup, pull, compose-bundle, migrate, recreate / rollout, health, rollback, cleanup, contract-migrate, self-update (Compose, D-120)" }
              status: { type: string, enum: [running, ok, failed] }
              detail: { type: string }
              started_at: { type: string, format: date-time }
              finished_at: { type: string, format: date-time }
        failed_versions: { type: array, items: { type: string } }
        history:
          type: array
          items:
            type: object
            required: [from, to, result, at]
            properties:
              from: { type: string }
              to: { type: string }
              result: { type: string }
              error: { type: string }
              at: { type: string, format: date-time }
        notices:
          type: array
          description: >-
            Installation hints refreshed on every updater run (Compose; D-111). Codes: compose_outdated
            {files_version, running_version} (compose files not managed by install-server.sh are older than the running
            version), compose_outdated_bundle {files_version, running_version} (re-run install-server.sh),
            compose_changes_pending {version, services} (compose changes the updater does not apply);
            updater_outdated, updater_outdated_bundle, updater_outdated_kubernetes {updater_version, running_version}
            (the updater is older than the running version; the api adds updater_outdated / _kubernetes with
            updater_version "< <running>" to documents without updater_version), updater_self_update_failed
            {version, reason} (D-120).
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string, description: English text }
              params: { type: object, additionalProperties: { type: string } }
        updater_version: { type: string, description: Version of the openlog-updater that wrote the document (absent in documents of updaters before 0.1.26) }
        maintenance_window:
          description: >-
            OPENLOG_UPDATER_MAINTENANCE_WINDOW of the updater (UTC; D-121). Absent in documents of updaters before this
            field. The api re-evaluates open_now and next_open_at when it answers. On Kubernetes the CronJob schedule of
            the chart decides when the updater runs; the window only limits which runs may install.
          type: object
          required: [spec, windows, open_now]
          properties:
            spec: { type: string, description: 'Normalized window, e.g. "sat,sun 02:00-05:00; mon-fri 03:00-04:00"; empty = updates may run at any time', example: "sat,sun 02:00-05:00" }
            windows: { type: array, items: { $ref: "#/components/schemas/MaintenanceWindow" } }
            open_now: { type: boolean, description: Inside a window now (always true without windows) }
            next_open_at: { type: string, format: date-time, description: "Next opening (UTC); absent without windows or when the windows never close" }
        self_update:
          description: Last attempt of the Compose updater to replace its own container with the installed release (D-120); one attempt per target version.
          type: object
          required: [target_version, from_version, state, started_at]
          properties:
            target_version: { type: string }
            from_version: { type: string }
            state: { type: string, enum: [running, succeeded, failed] }
            error: { type: string }
            started_at: { type: string, format: date-time }
            finished_at: { type: string, format: date-time }
        compose_changes:
          description: Compose changes of an installed bundle that wait for `docker compose up -d` or a restart (Compose).
          type: object
          required: [version, installed_at, services]
          properties:
            version: { type: string }
            installed_at: { type: string, format: date-time }
            services:
              type: array
              items:
                type: object
                required: [service, reason]
                properties:
                  service: { type: string }
                  reason: { type: string, enum: [definition, files] }
                  config_hash: { type: string }

    OrgRef:
      type: object
      required: [id, tenant_id, name]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Me:
      type: object
      required: [auth, user, api_key, organization, role, organizations, csrf_token]
      properties:
        auth: { type: string, enum: [session, api_key, license_key] }
        user:
          oneOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
        api_key:
          description: The API key that authenticated this request and the role it acts with; null unless auth is api_key (D-133).
          oneOf:
            - type: object
              required: [id, name, role]
              properties:
                id: { type: string }
                name: { type: string }
                role: { type: string, enum: [viewer, member, admin] }
            - { type: "null" }
        organization:
          description: The organization of this request (X-Openlog-Org-Id or the default one); null without memberships.
          oneOf:
            - { $ref: "#/components/schemas/OrgRef" }
            - { type: "null" }
        role:
          oneOf:
            - { $ref: "#/components/schemas/Role" }
            - { type: "null" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/OrgRef" }
        csrf_token:
          type: [string, "null"]
          description: Send as X-CSRF-Token on mutating cookie-authenticated requests. Null for API keys.

    Organization:
      type: object
      required: [id, tenant_id, name, role, created_at, language]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        language: { $ref: "#/components/schemas/OrgLanguage" }

    Member:
      type: object
      required: [user_id, email, name, role, joined_at]
      properties:
        user_id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { $ref: "#/components/schemas/Timestamp" }

    Invitation:
      type: object
      required: [id, email, role, invited_by_email, created_at, expires_at, expired, last_sent_at, send_count]
      properties:
        id: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invited_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        expired: { type: boolean }
        last_sent_at: { $ref: "#/components/schemas/NullableTimestamp" }
        send_count: { type: integer, description: "Invitation e-mails sent" }

    InvitationLookup:
      type: object
      required: [organization_name, email, role, expires_at, user_exists, sso]
      properties:
        organization_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        user_exists: { type: boolean, description: "true: sign in with the existing password to accept" }
        sso:
          description: >-
            Claimed-domain redirection (D-089): the invitation must be accepted with single sign-on — the e-mail domain is
            verified by an organization with an enabled connection (the inviting one, `same_organization`, or another one
            that does not allow external invitations). Password acceptance answers 409.
          oneOf:
            - type: object
              required: [required, organization_name, connection_name, protocol, same_organization]
              properties:
                required: { type: boolean }
                organization_name: { type: string }
                connection_name: { type: string }
                protocol: { type: string, enum: [oidc, saml] }
                same_organization: { type: boolean }
            - { type: "null" }

    LicenseKey:
      type: object
      required: [id, name, prefix, custom, created_by_email, created_at, last_used_at, revoked_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: "Visible, non-secret start of the key, e.g. olk_1a2b3c4d (at most half of an imported value)" }
        custom: { type: boolean, description: "true: the value was chosen by an operator (imported or bootstrap) instead of generated" }
        created_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { $ref: "#/components/schemas/NullableTimestamp" }
        revoked_at: { $ref: "#/components/schemas/NullableTimestamp" }

    APIKey:
      type: object
      required: [id, name, prefix, role, scope, created_by_user_id, created_by_email, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        role: { type: string, enum: [viewer, member, admin], description: "What the key may do (api.md \"Roles\", D-133); owner is not a key role" }
        scope: { type: string, enum: [read, write], description: "Derived from role and kept for older clients: read for a viewer key, write for a member or admin key" }
        created_by_user_id: { type: string }
        created_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { $ref: "#/components/schemas/NullableTimestamp" }
        expires_at: { $ref: "#/components/schemas/NullableTimestamp" }
        revoked_at: { $ref: "#/components/schemas/NullableTimestamp" }

    Session:
      type: object
      required: [id, created_at, last_seen_at, expires_at, ip, user_agent, current]
      properties:
        id: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_seen_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        ip: { type: string }
        user_agent: { type: string }
        current: { type: boolean }

    AuditEvent:
      type: object
      required: [id, actor_email, actor_api_key, action, target_type, target_id, details, ip, created_at]
      properties:
        id: { type: integer }
        actor_email: { type: string, description: "Empty for a change made with an API key: the key is the actor (D-133)" }
        actor_api_key:
          description: The API key that made the change, by id and by the name it had then; null when a signed-in user did.
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            - { type: "null" }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        details: { type: object, additionalProperties: true }
        ip: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    IntegrationName: { type: string, enum: [nginx, apache, redis, memcached, mysql, postgresql, mongodb, docker, mssql, iis, haproxy, rabbitmq, elasticsearch] }

    IntegrationMatch:
      type: object
      required: [port, container, endpoint, instance]
      properties:
        port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        container: { type: string }
        endpoint: { type: string }
        instance: { type: string, description: "discovered_service instance (e.g. an executable path or a container id)" }

    IntegrationMatchInput:
      type: object
      properties:
        port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        container: { type: string, maxLength: 512 }
        endpoint: { type: string, maxLength: 512 }
        instance: { type: string, maxLength: 512 }

    IntegrationSettingInput:
      type: object
      required: [integration]
      description: >-
        Fields an integration does not use must be empty (nginx: endpoint; redis, mysql: endpoint, username, password;
        postgresql: endpoint, username, password, database, databases; docker: none).
      properties:
        host_id: { type: [string, "null"], maxLength: 256, description: null or "" = all hosts of the organization }
        integration: { $ref: "#/components/schemas/IntegrationName" }
        match: { $ref: "#/components/schemas/IntegrationMatchInput" }
        enabled: { type: boolean, default: true }
        endpoint: { type: string, maxLength: 512, description: "nginx: http(s) URL; others: host:port or unix:/absolute/path" }
        username: { type: string, maxLength: 512 }
        password: { type: [string, "null"], maxLength: 512, description: 'Write-only. Omitted or null = keep (PUT), "" = clear' }
        database: { type: string, maxLength: 512 }
        databases:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 512 }

    IntegrationSetting:
      type: object
      required: [id, host_id, integration, match, enabled, endpoint, username, password_set, database, databases, created_at, updated_at, updated_by_email]
      properties:
        id: { type: string }
        host_id: { type: [string, "null"], description: null = all hosts }
        integration: { $ref: "#/components/schemas/IntegrationName" }
        match: { $ref: "#/components/schemas/IntegrationMatch" }
        enabled: { type: boolean }
        endpoint: { type: string }
        username: { type: string }
        password_set: { type: boolean }
        database: { type: string }
        databases:
          type: array
          items: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        updated_by_email: { type: string }

    IntegrationSettingsHost:
      type: object
      required: [host_id, revision, applied_revision, applied_at, remote_config_disabled]
      properties:
        host_id: { type: string }
        revision: { type: string, description: "Revision sync sends this host now (sha256:…)" }
        applied_revision: { type: string, description: 'Revision the agent reported in its last sync; "" = none' }
        applied_at: { $ref: "#/components/schemas/NullableTimestamp" }
        remote_config_disabled: { type: boolean, description: The agent reported remote config as disabled }

    IntegrationSettingsList:
      type: object
      required: [items, host]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IntegrationSetting" }
        host:
          oneOf:
            - { $ref: "#/components/schemas/IntegrationSettingsHost" }
            - { type: "null" }

    FleetMode: { type: string, enum: [off, notify, auto] }
    FleetChannel: { type: string, enum: [stable, beta] }
    FleetTarget: { type: string, enum: [latest, patch, pinned] }
    FleetUpdateState:
      type: string
      enum: [idle, downloading, verifying, staged, restarting, confirming, succeeded, failed, rolled_back]
    FleetRolloutState: { type: string, enum: [active, paused, halted, completed, superseded] }

    MaintenanceWindow:
      type: object
      required: [days, start, end]
      properties:
        days:
          type: array
          description: Empty = every day
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        start: { type: string, description: "HH:MM UTC", example: "02:00" }
        end: { type: string, description: "HH:MM UTC, 24:00 allowed; end <= start spans midnight", example: "05:00" }

    FleetPolicyInput:
      type: object
      required: [mode, channel, target, waves, wave_soak_minutes, halt_failure_rate, maintenance_windows]
      properties:
        mode: { $ref: "#/components/schemas/FleetMode" }
        channel: { $ref: "#/components/schemas/FleetChannel" }
        target: { $ref: "#/components/schemas/FleetTarget" }
        pinned_version: { type: [string, "null"] }
        waves:
          type: array
          description: Strictly increasing percentages, last = 100
          items: { type: integer, minimum: 1, maximum: 100 }
        wave_soak_minutes: { type: integer, minimum: 0, maximum: 43200 }
        halt_failure_rate: { type: number, minimum: 0, maximum: 1 }
        maintenance_windows:
          type: array
          items: { $ref: "#/components/schemas/MaintenanceWindow" }
        php_agent:
          description: Omitted = keep the stored section. changed_at is set by the server.
          allOf: [{ $ref: "#/components/schemas/FleetPHPAgentPolicyInput" }]
        java_agent:
          description: Omitted = keep the stored section. changed_at is set by the server.
          allOf: [{ $ref: "#/components/schemas/FleetJavaAgentPolicyInput" }]

    FleetJavaAgentMode: { type: string, enum: [off, manual, auto] }

    FleetJavaAgentPolicyInput:
      type: object
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/FleetJavaAgentMode" }
        version: { type: string, description: "agent (the host's infra agent version; default) or a SemVer version" }

    FleetJavaAgentPolicy:
      type: object
      required: [mode, version, changed_at]
      properties:
        mode: { $ref: "#/components/schemas/FleetJavaAgentMode" }
        version: { type: string }
        changed_at:
          description: Last change of the section; Java agent waves start then (or at the target's release time if later)
          allOf: [{ $ref: "#/components/schemas/NullableTimestamp" }]

    FleetPHPAgentMode: { type: string, enum: [off, manual, auto] }

    FleetPHPAgentPolicyInput:
      type: object
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/FleetPHPAgentMode" }
        version: { type: string, description: "agent (the host's infra agent version; default) or a SemVer version" }
        reload: { type: string, enum: [none, graceful] }
        exclude_bins:
          type: array
          maxItems: 50
          items: { type: string, description: "Glob of PHP binaries never enabled (filepath.Match syntax)" }

    FleetPHPAgentPolicy:
      type: object
      required: [mode, version, reload, exclude_bins, changed_at]
      properties:
        mode: { $ref: "#/components/schemas/FleetPHPAgentMode" }
        version: { type: string }
        reload: { type: string, enum: [none, graceful] }
        exclude_bins:
          type: array
          items: { type: string }
        changed_at:
          description: Last change of the section; PHP agent waves start then (or at the target's release time if later)
          allOf: [{ $ref: "#/components/schemas/NullableTimestamp" }]

    FleetPolicy:
      type: object
      required: [mode, channel, target, pinned_version, waves, wave_soak_minutes, halt_failure_rate, maintenance_windows, php_agent, java_agent, is_default, updated_at, updated_by_email]
      properties:
        mode: { $ref: "#/components/schemas/FleetMode" }
        channel: { $ref: "#/components/schemas/FleetChannel" }
        target: { $ref: "#/components/schemas/FleetTarget" }
        pinned_version: { type: [string, "null"] }
        waves:
          type: array
          items: { type: integer }
        wave_soak_minutes: { type: integer }
        halt_failure_rate: { type: number }
        maintenance_windows:
          type: array
          items: { $ref: "#/components/schemas/MaintenanceWindow" }
        php_agent: { $ref: "#/components/schemas/FleetPHPAgentPolicy" }
        java_agent: { $ref: "#/components/schemas/FleetJavaAgentPolicy" }
        is_default: { type: boolean }
        updated_at: { $ref: "#/components/schemas/NullableTimestamp" }
        updated_by_email: { type: string }

    FleetRolloutCounters:
      type: object
      required: [pending, attempted, succeeded, failed, rolled_back]
      properties:
        pending: { type: integer }
        attempted: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        rolled_back: { type: integer }

    FleetRollout:
      type: object
      required: [id, action, from_version, to_version, targets, waves, current_wave, wave_percent, wave_started_at, next_wave_at,
        wave_soak_minutes, halt_failure_rate, state, state_reason, counters, created_by_email, created_at, updated_at, ended_at]
      properties:
        id: { type: string }
        action: { type: string, enum: [upgrade, rollback] }
        from_version: { type: [string, "null"] }
        to_version: { type: [string, "null"], description: "null for target=patch rollouts (see targets)" }
        targets:
          type: object
          description: 'target=patch: "major.minor" → version'
          additionalProperties: { type: string }
        waves:
          type: array
          items: { type: integer }
        current_wave: { type: integer }
        wave_percent: { type: integer }
        wave_started_at: { $ref: "#/components/schemas/Timestamp" }
        next_wave_at: { $ref: "#/components/schemas/NullableTimestamp" }
        wave_soak_minutes: { type: integer }
        halt_failure_rate: { type: number }
        state: { $ref: "#/components/schemas/FleetRolloutState" }
        state_reason: { type: string }
        counters: { $ref: "#/components/schemas/FleetRolloutCounters" }
        created_by_email: { type: [string, "null"], description: null = rollout controller }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        ended_at: { $ref: "#/components/schemas/NullableTimestamp" }

    FleetReleaseInfo:
      type: object
      required: [version, channel, released_at, notes_url]
      properties:
        version: { type: string }
        channel: { $ref: "#/components/schemas/FleetChannel" }
        released_at: { $ref: "#/components/schemas/Timestamp" }
        notes_url: { type: string }

    FleetCatalogStatus:
      type: object
      required: [status, source, checked_at, last_success_at, error, releases, warnings]
      properties:
        status: { type: string, enum: [ok, pending, error, disabled] }
        source: { type: string }
        checked_at: { $ref: "#/components/schemas/NullableTimestamp" }
        last_success_at: { $ref: "#/components/schemas/NullableTimestamp" }
        error: { type: string }
        releases: { type: integer }
        warnings:
          type: array
          items: { type: string }

    FleetSummary:
      type: object
      required: [total_hosts, active_hosts, update_capable, not_update_capable, outdated, unsupported, in_progress, failed, held, pinned,
        versions, latest, target, oldest_supported_version, policy_mode, update_available, stale_after_seconds, catalog, current_rollout]
      properties:
        total_hosts: { type: integer }
        active_hosts: { type: integer }
        update_capable: { type: integer }
        not_update_capable:
          type: array
          items:
            type: object
            required: [reason, hosts]
            properties:
              reason: { type: string, description: install_method (container, dev, …) or unknown }
              hosts: { type: integer }
        outdated: { type: integer }
        unsupported: { type: integer }
        in_progress: { type: integer }
        failed: { type: integer }
        held: { type: integer }
        pinned: { type: integer }
        versions:
          type: array
          items:
            type: object
            required: [version, hosts, latest, outdated, supported]
            properties:
              version: { type: string }
              hosts: { type: integer }
              latest: { type: boolean }
              outdated: { type: boolean }
              supported: { type: boolean }
        latest:
          type: object
          required: [stable, beta]
          properties:
            stable:
              anyOf: [{ $ref: "#/components/schemas/FleetReleaseInfo" }, { type: "null" }]
            beta:
              anyOf: [{ $ref: "#/components/schemas/FleetReleaseInfo" }, { type: "null" }]
        target:
          anyOf: [{ $ref: "#/components/schemas/FleetReleaseInfo" }, { type: "null" }]
        oldest_supported_version: { type: string }
        policy_mode: { $ref: "#/components/schemas/FleetMode" }
        update_available: { type: boolean }
        stale_after_seconds: { type: integer }
        catalog: { $ref: "#/components/schemas/FleetCatalogStatus" }
        current_rollout:
          anyOf: [{ $ref: "#/components/schemas/FleetRollout" }, { type: "null" }]

    FleetOverride:
      type: object
      required: [action, version, updated_at]
      properties:
        action: { type: string, enum: [hold, pin] }
        version: { type: [string, "null"] }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    FleetPHPOverride:
      type: object
      required: [mode, updated_at]
      properties:
        mode: { $ref: "#/components/schemas/FleetPHPAgentMode" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    FleetPHPRuntime:
      type: object
      description: One PHP binary of the host (openlog-php-install status --json, php-agent.md §7.2)
      required: [bin, version, api, zts, debug, libc, scan_dir, module, supported, enabled, loaded, excluded]
      properties:
        bin: { type: string }
        version: { type: string }
        api: { type: string, description: ZEND_MODULE_API_NO }
        zts: { type: boolean }
        debug: { type: boolean }
        libc: { type: string }
        scan_dir: { type: string }
        module: { type: string, description: "<api>-<nts|zts>-<glibc|musl>" }
        supported: { type: boolean, description: A module exists for the ABI }
        enabled: { type: boolean, description: The managed ini file exists }
        loaded: { type: boolean, description: "`-m` lists openlog" }
        excluded: { type: boolean, description: Matched by php_agent.exclude_bins }

    FleetPHPAgentUpdate:
      type: object
      required: [operation, version, state, error, changed_at]
      properties:
        operation: { type: string, description: "install, upgrade, rollback or uninstall" }
        version: { type: string }
        state: { type: string, description: "downloading, restarting, confirming, applied, failed, rolled_back, uninstalled" }
        error: { type: string }
        changed_at: { type: string }

    FleetHostPHPAgent:
      type: object
      required: [reported, mode, agent_mode, source, capable, reason, managed_by, version, runtimes, update, override, status, status_target]
      properties:
        reported: { type: boolean, description: false for agents that do not report PHP runtimes (older versions) }
        mode: { $ref: "#/components/schemas/FleetPHPAgentMode" }
        agent_mode: { type: string, description: Mode the agent applies ("" when not reported) }
        source: { type: string, description: "remote (fleet settings) or local (config.yaml)" }
        capable: { type: boolean, description: The privileged pre-start step runs on the host }
        reason: { type: string }
        managed_by: { type: string, enum: [fleet, package, manual, none] }
        version: { type: [string, "null"], description: Installed PHP agent version }
        runtimes:
          type: array
          items: { $ref: "#/components/schemas/FleetPHPRuntime" }
        update:
          anyOf: [{ $ref: "#/components/schemas/FleetPHPAgentUpdate" }, { type: "null" }]
        override:
          anyOf: [{ $ref: "#/components/schemas/FleetPHPOverride" }, { type: "null" }]
        status:
          type: string
          description: PHP agent decision for the host now
          enum: [offer, up_to_date, mode_off, manual, not_reported, not_capable, managed_elsewhere, no_php, invalid_version, no_catalog,
            target_unavailable, no_artifact, already_failed, not_in_wave, outside_window]
        status_target: { type: [string, "null"] }

    FleetHost:
      type: object
      required: [host_id, host_name, agent, update, first_seen_at, last_sync_at, rollout_id, override, outdated, supported, status, status_target, php_agent, php_access, java_agent]
      properties:
        host_id: { type: string }
        host_name: { type: string }
        agent:
          type: object
          required: [name, version, commit, os, arch, install_method, update_capable]
          properties:
            name: { type: string }
            version: { type: string }
            commit: { type: string }
            os: { type: string }
            arch: { type: string }
            install_method: { type: string }
            update_capable: { type: boolean }
        update:
          type: object
          required: [state, from_version, to_version, error, changed_at]
          properties:
            state: { type: string, description: "FleetUpdateState; unknown values are passed through" }
            from_version: { type: string }
            to_version: { type: string }
            error: { type: string }
            changed_at: { $ref: "#/components/schemas/NullableTimestamp" }
        first_seen_at: { $ref: "#/components/schemas/Timestamp" }
        last_sync_at: { $ref: "#/components/schemas/Timestamp" }
        rollout_id: { type: [string, "null"] }
        override:
          anyOf: [{ $ref: "#/components/schemas/FleetOverride" }, { type: "null" }]
        outdated: { type: boolean }
        supported: { type: boolean }
        status:
          type: string
          description: Update decision for the host now
          enum: [offer, no_catalog, mode_off, notify_only, invalid_version, hold, not_capable, no_rollout, rollout_paused, rollout_halted,
            rollout_outdated, not_in_rollout, up_to_date, not_in_wave, target_unavailable, incompatible, already_failed, no_artifact, outside_window]
        status_target: { type: [string, "null"] }
        php_agent: { $ref: "#/components/schemas/FleetHostPHPAgent" }
        php_access:
          description: PHP-FPM pools and whether their users may send spans to php.sock (php-agent.md §1); null when not reported
          anyOf: [{ $ref: "#/components/schemas/FleetPHPAccess" }, { type: "null" }]
        java_agent: { $ref: "#/components/schemas/FleetHostJavaAgent" }

    FleetJavaOverride:
      type: object
      required: [mode, updated_at]
      properties:
        mode: { $ref: "#/components/schemas/FleetJavaAgentMode" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    FleetJavaJVM:
      type: object
      description: A running JVM that loads an openlog Java agent (-javaagent on its command line or in JAVA_TOOL_OPTIONS)
      required: [pid, name, command, agent_path, loaded_version, managed, restart_pending, started_at, container]
      properties:
        pid: { type: integer }
        name: { type: string }
        command: { type: string, description: Command line with secrets masked }
        agent_path: { type: string, description: The -javaagent path as the JVM received it }
        loaded_version: { type: string, description: 'Version the JVM loaded ("" = unknown)' }
        managed: { type: boolean, description: The path is the managed link_path or inside install_root }
        restart_pending: { type: boolean, description: Managed and running another version than the installed one; restart the application to load it }
        started_at: { type: string }
        container: { type: boolean, description: Runs in a container (never managed) }

    FleetJavaAgentUpdate:
      type: object
      required: [operation, version, state, error, changed_at]
      properties:
        operation: { type: string, description: "install, upgrade, rollback, switch or uninstall" }
        version: { type: string }
        state: { type: string, description: "downloading, restarting, confirming, applied, failed, rolled_back, uninstalled" }
        error: { type: string }
        changed_at: { type: string }

    FleetHostJavaAgent:
      type: object
      required: [reported, mode, agent_mode, source, capable, reason, managed, version, state, detail, link_path, link_state, jvms, update, override, status, status_target]
      properties:
        reported: { type: boolean, description: false for agents that do not report JVMs (older versions) }
        mode: { $ref: "#/components/schemas/FleetJavaAgentMode" }
        agent_mode: { type: string, description: Mode the agent applies ("" when not reported) }
        source: { type: string, description: "remote (fleet settings) or local (config.yaml)" }
        capable: { type: boolean, description: The host can apply installations (privileged step) }
        reason: { type: string }
        managed: { type: boolean, description: The install root carries the infra agent's marker }
        version: { type: [string, "null"], description: Version of the managed jar (current) }
        state:
          type: string
          description: 'Agent-reported state: installed, staged, restart_pending, unmanaged (link_path is a file openlog did not create), error, not_found; "" when not reported'
        detail: { type: string, description: Explanation of state (guidance, error, applications to restart) }
        link_path: { type: string }
        link_state: { type: string, description: "missing, managed, unmanaged, pending (Windows: locked by a JVM) or error" }
        jvms:
          type: array
          items: { $ref: "#/components/schemas/FleetJavaJVM" }
        update:
          anyOf: [{ $ref: "#/components/schemas/FleetJavaAgentUpdate" }, { type: "null" }]
        override:
          anyOf: [{ $ref: "#/components/schemas/FleetJavaOverride" }, { type: "null" }]
        status:
          type: string
          description: Java agent decision for the host now
          enum: [offer, up_to_date, mode_off, manual, not_reported, not_capable, invalid_version, no_catalog, target_unavailable, no_artifact,
            already_failed, not_in_wave, outside_window]
        status_target: { type: [string, "null"] }

    FleetPHPAccess:
      type: object
      required: [socket_group, group, group_exists, agent_member, grants, pools]
      properties:
        socket_group: { type: string, description: 'Group applied to php.sock ("" when none)' }
        group: { type: string, description: The dedicated socket group (openlog-php) }
        group_exists: { type: boolean }
        agent_member: { type: boolean }
        grants: { type: string, description: "auto (the privileged step adds pool users) or opted_out" }
        pools:
          type: array
          items: { $ref: "#/components/schemas/FleetPHPPoolAccess" }

    FleetPHPPoolAccess:
      type: object
      required: [pool, php_version, user, unit, access]
      properties:
        pool: { type: string }
        php_version: { type: string, description: '"" when the layout has no version (e.g. /etc/php-fpm.d)' }
        user: { type: string }
        unit: { type: string, description: systemd service of the PHP-FPM master (e.g. php8.2-fpm.service) }
        access: { type: string, description: "ok, missing, opted_out or unsupported_user (root or not a local account); unknown values are passed through" }

    # ---- Alerting (docs/contracts/alerting.md) ----
    AlertRuleType: { type: string, enum: [metric_threshold, log_match, no_data, discovery, apm, apm_no_data, apm_error, oql, slo_burn, anomaly] }
    AlertSeverity: { type: string, enum: [critical, warning, info] }
    AlertOperator: { type: string, enum: [gt, gte, lt, lte] }
    AlertSeriesStateName: { type: string, enum: [ok, pending, firing] }
    AlertIncidentState: { type: string, enum: [open, acknowledged, resolved] }
    AlertResolveReason: { type: string, enum: [recovered, manual, no_data, expired, rule_disabled, rule_deleted, rule_changed] }
    AlertChannelType: { type: string, enum: [slack, email, webhook, teams, pagerduty, opsgenie] }
    AlertNotificationKind: { type: string, enum: [opened, acknowledged, resolved, renotify, test] }
    AlertNotificationStatus: { type: string, enum: [pending, sending, delivered, failed, suppressed] }
    AlertLabels:
      type: object
      additionalProperties: { type: string }

    AlertRuleTypeInfo:
      type: object
      required: [type, available, reason]
      properties:
        type: { $ref: "#/components/schemas/AlertRuleType" }
        available: { type: boolean }
        reason: { type: string, description: Why the type is not available (empty when available) }

    AlertFilter:
      type: object
      required: [field, op, values]
      properties:
        field: { type: string, description: "host.id, host.name, service.name, attr.<key>, resource.<key>", example: resource.env }
        op: { type: string, enum: [eq, neq, in, not_in, contains] }
        values:
          type: array
          items: { type: string }

    AlertBurnWindow:
      type: object
      description: One long/short burn window of a slo_burn condition (alerting.md §2.11); both are rounded up to whole minutes.
      required: [name, factor, long_seconds, short_seconds]
      properties:
        name: { type: string, pattern: "^[a-z0-9_-]{1,32}$" }
        factor: { type: number, exclusiveMinimum: 0, maximum: 1000 }
        long_seconds: { type: integer, minimum: 300, maximum: 86400 }
        short_seconds: { type: integer, minimum: 60, maximum: 86400 }
    AlertCondition:
      type: object
      description: |
        Type-specific condition (alerting.md §2.2–2.5). metric_threshold: metric, aggregation, series_aggregation,
        window_seconds, filters, group_by, operator, threshold, recovery_threshold, missing_data. log_match: query,
        severity_min, filters, group_by, window_seconds, operator, threshold, recovery_threshold. no_data: signal,
        metric, filters, group_by, window_seconds, lookback_seconds. discovery: event, filters, match, window_seconds,
        lookback_seconds. apm: service_name, service_namespace, environment, transaction_type, transaction_name,
        metric (throughput, error_rate, errors, avg_ms, p50_ms, p95_ms, p99_ms, apdex), group_by (environment,
        transaction), window_seconds, min_requests, operator, threshold, recovery_threshold, missing_data.
        apm_no_data (§2.7): service_name ("" = every service), service_namespace, environment, group_by (namespace,
        environment), window_seconds, lookback_seconds.
        apm_error (§2.9): event (new_group, regressed), service_name ("" = every service), service_namespace, environment,
        match, window_seconds, min_count (new_group only).
        oql (§2.10): query (OQL with exactly one number column; FACET = series labels; no TIMESERIES, SINCE/UNTIL,
        COMPARE WITH, histogram or variables), window_seconds (60-21600), operator, threshold, recovery_threshold, missing_data.
        slo_burn (§2.11): slo_id, windows (1-4 long/short burn windows with their factor), min_requests. The comparison
        is fixed (gte 1): the value is the largest min(long, short) burn rate divided by the window's factor.
        anomaly (§2.12): signal (metric = the metric_threshold selector, apm = the apm selector), window_seconds,
        seasonality (none, hourly, daily, weekly), lookback_days, direction (upper, lower, both), sensitivity
        (standard deviations, default 3), min_samples, min_deviation. The comparison is fixed (gte 1): the value is
        the deviation from the median of the same seasonal slot divided by sensitivity x 1.4826 x MAD.
      properties:
        metric: { type: string }
        service_name: { type: string }
        service_namespace: { type: [string, "null"] }
        environment: { type: [string, "null"] }
        transaction_type: { type: string }
        transaction_name: { type: string }
        min_requests: { type: number }
        aggregation: { type: string, enum: [avg, min, max, sum, last, count, rate, p50, p95, p99] }
        series_aggregation: { type: string, enum: [avg, sum, min, max] }
        window_seconds: { type: integer }
        lookback_seconds: { type: integer }
        filters:
          type: array
          items: { $ref: "#/components/schemas/AlertFilter" }
        group_by:
          type: array
          items: { type: string, description: "host, service, attr.<key>, resource.<key>; apm: environment, transaction; apm_no_data: namespace, environment" }
        operator: { $ref: "#/components/schemas/AlertOperator" }
        threshold: { type: number }
        recovery_threshold: { type: [number, "null"] }
        missing_data: { type: string, enum: [keep, ok, breach] }
        query: { type: string }
        severity_min: { type: string }
        signal: { type: string, enum: [host, metric, log, apm], description: "no_data: host, metric, log; anomaly: metric or apm" }
        seasonality: { type: string, enum: [none, hourly, daily, weekly], description: "anomaly: the season whose same slot forms the baseline" }
        lookback_days: { type: integer, minimum: 1, maximum: 28, description: "anomaly: how far back the baseline samples reach" }
        direction: { type: string, enum: [upper, lower, both], description: "anomaly: the side of the band that alerts" }
        sensitivity: { type: number, minimum: 0.5, maximum: 20, description: "anomaly: half the band width in standard deviations" }
        min_samples: { type: integer, minimum: 2, maximum: 50, description: "anomaly: baseline samples a series needs before it has a value" }
        min_deviation: { type: number, minimum: 0, description: "anomaly: absolute deviation below which nothing alerts" }
        slo_id: { type: string, format: uuid, description: "slo_burn: the SLO whose error budget is watched" }
        windows:
          type: array
          description: "slo_burn: 1-4 burn windows (alerting.md §2.11)"
          items: { $ref: "#/components/schemas/AlertBurnWindow" }
        event: { type: string, enum: [service_disappeared, port_opened, new_group, regressed] }
        match: { type: string }
        min_count: { type: number, minimum: 0 }

    AlertFlapping:
      type: object
      required: [enabled, transitions, window_seconds, hold_seconds]
      properties:
        enabled: { type: boolean }
        transitions: { type: integer, minimum: 2, maximum: 20 }
        window_seconds: { type: integer, minimum: 300, maximum: 86400 }
        hold_seconds: { type: integer, minimum: 60, maximum: 86400 }

    AlertRuleInput:
      type: object
      required: [name, type, condition]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        type: { $ref: "#/components/schemas/AlertRuleType" }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        enabled: { type: boolean }
        interval_seconds: { type: integer, minimum: 10, maximum: 3600 }
        for_seconds: { type: integer, minimum: 0, maximum: 86400 }
        recovery_for_seconds: { type: integer, minimum: 0, maximum: 86400 }
        condition: { $ref: "#/components/schemas/AlertCondition" }
        channel_ids:
          type: array
          items: { type: string }
        renotify_interval_seconds: { type: integer, minimum: 0 }
        flapping: { $ref: "#/components/schemas/AlertFlapping" }
        runbook_url: { type: string }
        labels: { $ref: "#/components/schemas/AlertLabels" }
        version: { type: integer, description: "PUT only: optimistic concurrency" }

    AlertRuleStatus:
      type: object
      required: [state, series_pending, series_firing, open_incidents, last_evaluated_at, last_result, last_error, last_duration_ms, next_evaluation_at, owner]
      properties:
        state: { type: string, enum: [disabled, unknown, ok, pending, firing, error] }
        series_pending: { type: integer }
        series_firing: { type: integer }
        open_incidents: { type: integer }
        last_evaluated_at: { $ref: "#/components/schemas/NullableTimestamp" }
        last_result: { type: string }
        last_error: { type: string }
        last_duration_ms: { type: integer }
        next_evaluation_at: { $ref: "#/components/schemas/NullableTimestamp" }
        owner: { type: [string, "null"], description: Evaluator instance holding the lease }

    AlertRule:
      type: object
      required: [id, name, description, type, severity, enabled, interval_seconds, for_seconds, recovery_for_seconds, condition, channel_ids,
        renotify_interval_seconds, flapping, runbook_url, labels, version, created_by_user_id, created_by_email, created_at, updated_at, status]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/AlertRuleType" }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        enabled: { type: boolean }
        interval_seconds: { type: integer }
        for_seconds: { type: integer }
        recovery_for_seconds: { type: integer }
        condition: { $ref: "#/components/schemas/AlertCondition" }
        channel_ids:
          type: array
          items: { type: string }
        renotify_interval_seconds: { type: integer }
        flapping: { $ref: "#/components/schemas/AlertFlapping" }
        runbook_url: { type: string }
        labels: { $ref: "#/components/schemas/AlertLabels" }
        version: { type: integer }
        created_by_user_id: { type: [string, "null"] }
        created_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        status: { $ref: "#/components/schemas/AlertRuleStatus" }

    AlertSeriesState:
      type: object
      required: [series_key, labels, state, value, pending_since, firing_since, recovering_since, incident_id, flapping, updated_at]
      properties:
        series_key: { type: string }
        labels: { $ref: "#/components/schemas/AlertLabels" }
        state: { $ref: "#/components/schemas/AlertSeriesStateName" }
        value: { type: [number, "null"] }
        pending_since: { $ref: "#/components/schemas/NullableTimestamp" }
        firing_since: { $ref: "#/components/schemas/NullableTimestamp" }
        recovering_since: { $ref: "#/components/schemas/NullableTimestamp" }
        incident_id: { type: [string, "null"] }
        flapping: { type: boolean }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    AlertRuleDetail:
      allOf:
        - { $ref: "#/components/schemas/AlertRule" }
        - type: object
          required: [series]
          properties:
            series:
              type: array
              items: { $ref: "#/components/schemas/AlertSeriesState" }

    AlertRulePreviewRequest:
      type: object
      required: [rule]
      properties:
        rule: { $ref: "#/components/schemas/AlertRuleInput" }
        hours: { type: integer, minimum: 1, maximum: 24, description: Default 6 }

    AlertPreviewSeries:
      type: object
      required: [key, labels, points, transitions, incidents]
      properties:
        key: { type: string }
        labels: { $ref: "#/components/schemas/AlertLabels" }
        points:
          type: array
          description: "[unix ms, value or null] per evaluation step"
          items:
            type: array
            prefixItems: [{ type: integer }, { type: [number, "null"] }]
            minItems: 2
            maxItems: 2
        transitions:
          type: array
          items:
            type: object
            required: [at, state, value]
            properties:
              at: { $ref: "#/components/schemas/Timestamp" }
              state: { $ref: "#/components/schemas/AlertSeriesStateName" }
              value: { type: [number, "null"] }
        incidents:
          type: array
          items:
            type: object
            required: [opened_at, resolved_at, peak]
            properties:
              opened_at: { $ref: "#/components/schemas/Timestamp" }
              resolved_at: { $ref: "#/components/schemas/NullableTimestamp" }
              peak: { type: [number, "null"] }

    AlertRulePreview:
      type: object
      required: [from, to, step_seconds, operator, threshold, recovery_threshold, unit, series, truncated, approximate]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        step_seconds: { type: integer }
        operator: { type: [string, "null"], description: "null for no_data/discovery (breach = value >= threshold)" }
        threshold: { type: [number, "null"] }
        recovery_threshold: { type: [number, "null"] }
        unit: { type: string }
        series:
          type: array
          items: { $ref: "#/components/schemas/AlertPreviewSeries" }
        truncated: { type: boolean, description: More series matched than returned }
        approximate: { type: boolean }

    AlertRuleEvaluations:
      type: object
      required: [from, to, step_seconds, evaluations, series, truncated]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        step_seconds: { type: integer }
        evaluations:
          type: array
          description: One entry per bucket with evaluations (rule rows, oldest first)
          items:
            type: object
            required: [at, firing_series, evaluations, errors, duration_ms, max_duration_ms]
            properties:
              at: { $ref: "#/components/schemas/Timestamp" }
              firing_series: { type: [number, "null"], description: Maximum number of firing series in the bucket }
              evaluations: { type: integer }
              errors: { type: integer }
              duration_ms: { type: integer, description: Duration of the latest evaluation in the bucket }
              max_duration_ms: { type: integer }
        series:
          type: array
          description: At most 50 series, most non-ok buckets first
          items:
            type: object
            required: [series_key, labels, points]
            properties:
              series_key: { type: string }
              labels: { $ref: "#/components/schemas/AlertLabels" }
              points:
                type: array
                description: "[unix ms of the latest evaluation in the bucket, latest value or null, worst state]"
                items:
                  type: array
                  prefixItems: [{ type: integer }, { type: [number, "null"] }, { $ref: "#/components/schemas/AlertSeriesStateName" }]
                  minItems: 3
                  maxItems: 3
        truncated: { type: boolean, description: Series or rows were cut }

    AlertIncident:
      type: object
      required: [id, rule_id, rule_name, rule_type, severity, state, series_key, labels, summary, value, last_value, threshold, flapping, muted,
        opened_at, acknowledged_at, acknowledged_by_email, resolved_at, resolved_by_email, resolve_reason, channel_ids]
      properties:
        id: { type: string }
        rule_id: { type: [string, "null"], description: null when the rule was deleted }
        rule_name: { type: string }
        rule_type: { $ref: "#/components/schemas/AlertRuleType" }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        state: { $ref: "#/components/schemas/AlertIncidentState" }
        series_key: { type: string }
        labels: { $ref: "#/components/schemas/AlertLabels" }
        summary: { type: string }
        value: { type: [number, "null"] }
        last_value: { type: [number, "null"] }
        threshold: { type: [number, "null"] }
        flapping: { type: boolean }
        muted: { type: boolean }
        opened_at: { $ref: "#/components/schemas/Timestamp" }
        acknowledged_at: { $ref: "#/components/schemas/NullableTimestamp" }
        acknowledged_by_email: { type: [string, "null"] }
        resolved_at: { $ref: "#/components/schemas/NullableTimestamp" }
        resolved_by_email: { type: [string, "null"], description: null = resolved automatically }
        resolve_reason:
          anyOf: [{ $ref: "#/components/schemas/AlertResolveReason" }, { type: "null" }]
        channel_ids:
          type: array
          items: { type: string }

    AlertIncidentEvent:
      type: object
      required: [id, at, kind, actor_email, message, details]
      properties:
        id: { type: integer }
        at: { $ref: "#/components/schemas/Timestamp" }
        kind:
          type: string
          enum: [opened, flapping, acknowledged, note, renotified, resolved, notification_delivered, notification_failed, notification_suppressed, notification_muted]
        actor_email: { type: [string, "null"] }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    AlertIncidentDetail:
      allOf:
        - { $ref: "#/components/schemas/AlertIncident" }
        - type: object
          required: [events, deliveries]
          properties:
            events:
              type: array
              items: { $ref: "#/components/schemas/AlertIncidentEvent" }
            deliveries:
              type: array
              items: { $ref: "#/components/schemas/AlertDelivery" }

    AlertChannelConfig:
      type: object
      description: >
        Non-secret settings, one section per channel type. email: to (required), smtp (optional override);
        pagerduty: pagerduty; opsgenie: opsgenie (alerting.md §5.3).
      properties:
        to:
          type: array
          items: { type: string }
        smtp:
          type: object
          properties:
            host: { type: string }
            port: { type: integer }
            username: { type: string }
            from: { type: string }
            tls: { type: string, enum: [starttls, tls, none] }
        pagerduty:
          type: object
          properties:
            region: { type: string, enum: [us, eu], description: "PagerDuty service region (default us)" }
        opsgenie:
          type: object
          properties:
            region: { type: string, enum: [us, eu], description: "Opsgenie service region (default us)" }
            priority:
              type: string
              enum: ["", P1, P2, P3, P4, P5]
              description: Overrides the severity mapping (critical P1, warning P3, info P5)
            responders:
              type: array
              maxItems: 20
              items:
                type: object
                required: [type]
                properties:
                  type: { type: string, enum: [team, user, escalation, schedule] }
                  name: { type: string, description: Exactly one of name and id }
                  id: { type: string }
            tags:
              type: array
              maxItems: 18
              items: { type: string }

    AlertChannelSecrets:
      type: object
      description: >
        Write-only. slack/teams/webhook: url; webhook: hmac_secret; email: smtp_password;
        pagerduty: routing_key (Events API v2 integration key); opsgenie: api_key.
      properties:
        url: { type: string }
        hmac_secret: { type: string }
        smtp_password: { type: string }
        routing_key: { type: string }
        api_key: { type: string }

    AlertChannelInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: "#/components/schemas/AlertChannelType" }
        enabled: { type: boolean }
        config: { $ref: "#/components/schemas/AlertChannelConfig" }
        secrets: { $ref: "#/components/schemas/AlertChannelSecrets" }

    AlertChannel:
      type: object
      required: [id, name, type, enabled, config, secret_hints, created_by_email, created_at, updated_at, last_delivery]
      properties:
        id: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/AlertChannelType" }
        enabled: { type: boolean }
        config: { $ref: "#/components/schemas/AlertChannelConfig" }
        secret_hints:
          type: object
          description: 'Masked secret values, e.g. {"url": "https://hooks.slack.com/…/•••f3a9"}'
          additionalProperties: { type: string }
        generated_secrets:
          type: object
          description: Create response only (webhook without hmac_secret)
          additionalProperties: { type: string }
        created_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        last_delivery:
          anyOf:
            - type: object
              required: [at, status, error]
              properties:
                at: { $ref: "#/components/schemas/Timestamp" }
                status: { $ref: "#/components/schemas/AlertNotificationStatus" }
                error: { type: string }
            - { type: "null" }

    AlertChannelTestResult:
      type: object
      required: [success, status_code, error, duration_ms, notification_id]
      properties:
        success: { type: boolean }
        status_code: { type: integer, description: HTTP status or SMTP reply code (0 = no response) }
        error: { type: string }
        duration_ms: { type: integer }
        notification_id: { type: string }

    AlertRouteMatcher:
      type: object
      required: [label, op, value]
      properties:
        label: { type: string, maxLength: 128, example: env }
        op: { type: string, enum: [eq, neq, contains] }
        value: { type: string, maxLength: 1024 }

    AlertRouteWindow:
      type: object
      description: Local window of a route (alerting.md §5.6); end_time at or before start_time means the next day.
      required: [timezone, start_time, end_time]
      properties:
        timezone: { type: string, example: Europe/Istanbul }
        days:
          type: array
          description: Empty = every day
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        start_time: { type: string, example: "09:00" }
        end_time: { type: string, example: "18:00" }

    AlertRouteMatch:
      type: object
      description: Route condition; the parts are AND-ed and an empty part matches everything.
      properties:
        severities:
          type: array
          items: { $ref: "#/components/schemas/AlertSeverity" }
        services:
          type: array
          items: { type: string }
        rule_types:
          type: array
          items: { $ref: "#/components/schemas/AlertRuleType" }
        labels:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/AlertRouteMatcher" }
        time_window:
          anyOf:
            - { $ref: "#/components/schemas/AlertRouteWindow" }
            - { type: "null" }

    AlertRoutingRuleInput:
      type: object
      required: [name, channel_ids]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        position: { type: integer, minimum: 0, maximum: 100, description: Evaluation order, 0 first }
        enabled: { type: boolean, default: true }
        is_default:
          type: boolean
          description: The default route matches every incident and is evaluated last; at most one per organization and its match must be empty
        channel_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string }
        match: { $ref: "#/components/schemas/AlertRouteMatch" }

    AlertRoutingRule:
      type: object
      required: [id, name, position, enabled, is_default, match, channel_ids, created_by_email, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        position: { type: integer }
        enabled: { type: boolean }
        is_default: { type: boolean }
        match: { $ref: "#/components/schemas/AlertRouteMatch" }
        channel_ids:
          type: array
          items: { type: string }
        created_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    AlertMuteMatcher:
      type: object
      required: [label, op, value]
      properties:
        label: { type: string, example: host.name }
        op: { type: string, enum: [eq, neq, contains] }
        value: { type: string }

    AlertMuteScheduleInput:
      type: object
      description: |
        Recurring mute (alerting.md §5.2): occurrences on the selected local days from start_time to end_time (end ≤ start
        = next day), DST-safe in `timezone`. Give `days` or `rrule`.
      required: [start_time, end_time]
      properties:
        timezone: { type: string, description: "IANA time zone, default UTC", example: Europe/Istanbul }
        days:
          type: array
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        rrule:
          type: string
          description: "Subset FREQ=DAILY, FREQ=WEEKLY;BYDAY=MO,TU,… or FREQ=MONTHLY with BYMONTHDAY (±1..31), BYDAY (MO, 1MO, -1FR) and BYSETPOS (±1..31)"
          example: "FREQ=MONTHLY;BYDAY=MO,TU,WE,TH,FR;BYSETPOS=-1"
        start_time: { type: string, pattern: "^\\d{2}:\\d{2}$", example: "22:00" }
        end_time: { type: string, pattern: "^\\d{2}:\\d{2}$", example: "06:00" }
        from: { type: [string, "null"], description: "RFC3339 or unix ms; default now" }
        until: { type: [string, "null"], description: "RFC3339 or unix ms; empty = no end" }
        exdates:
          type: array
          maxItems: 366
          description: Local dates (YYYY-MM-DD or YYYYMMDD) on which no occurrence starts
          items: { type: string, example: "2026-10-29" }
        holiday_calendar_ids:
          type: array
          maxItems: 10
          description: Holiday calendars of the organization whose dates are exceptions too
          items: { type: string }

    AlertMuteSchedule:
      type: object
      required: [timezone, days, rrule, start_time, end_time, from, until, exdates, holiday_calendar_ids]
      properties:
        timezone: { type: string }
        days:
          type: array
          description: Weekly days (empty for monthly rules)
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        rrule: { type: [string, "null"], description: Normalized rule when the mute was created with one }
        start_time: { type: string }
        end_time: { type: string }
        from: { $ref: "#/components/schemas/Timestamp" }
        until: { $ref: "#/components/schemas/NullableTimestamp" }
        exdates:
          type: array
          items: { type: string }
        holiday_calendar_ids:
          type: array
          items: { type: string }

    AlertMuteOccurrence:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at: { $ref: "#/components/schemas/Timestamp" }
        ends_at: { $ref: "#/components/schemas/Timestamp" }

    AlertMuteInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        comment: { type: string, maxLength: 2000 }
        starts_at: { type: string, description: "RFC3339 or unix ms; required without schedule (ignored with one)" }
        ends_at: { type: string, description: "RFC3339 or unix ms; after starts_at, at most 90 days later; required without schedule" }
        rule_ids:
          type: array
          description: Empty = every rule
          items: { type: string }
        matchers:
          type: array
          items: { $ref: "#/components/schemas/AlertMuteMatcher" }
        schedule:
          oneOf:
            - { $ref: "#/components/schemas/AlertMuteScheduleInput" }
            - { type: "null" }

    AlertMute:
      type: object
      required: [id, name, comment, starts_at, ends_at, rule_ids, matchers, schedule, upcoming, active, created_by_user_id, created_by_email, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        comment: { type: string }
        starts_at: { $ref: "#/components/schemas/Timestamp", description: "Recurring mutes: start of the current or next occurrence" }
        ends_at: { $ref: "#/components/schemas/Timestamp", description: "Recurring mutes: end of the current or next occurrence" }
        rule_ids:
          type: array
          items: { type: string }
        matchers:
          type: array
          items: { $ref: "#/components/schemas/AlertMuteMatcher" }
        schedule:
          oneOf:
            - { $ref: "#/components/schemas/AlertMuteSchedule" }
            - { type: "null" }
        upcoming:
          type: array
          description: Recurring mutes, the current or next occurrences (up to 5); empty for one-off mutes
          items: { $ref: "#/components/schemas/AlertMuteOccurrence" }
        active: { type: boolean }
        created_by_user_id: { type: [string, "null"] }
        created_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    AlertHolidayCalendarInput:
      type: object
      required: [name, dates]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        dates:
          type: array
          maxItems: 1000
          description: "YYYY-MM-DD (one date), MM-DD or --MM-DD (every year); stored sorted and deduplicated"
          items: { type: string, example: "04-23" }

    AlertHolidayCalendar:
      type: object
      required: [id, name, description, dates, mute_count, created_by_email, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        dates:
          type: array
          items: { type: string }
        mute_count: { type: integer, description: Mutes that reference the calendar }
        created_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    AlertTemplateText:
      type: object
      description: Text per language
      required: [en, tr]
      properties:
        en: { type: string }
        tr: { type: string }

    AlertTemplateParam:
      type: object
      required: [key, kind, required, default, label]
      properties:
        key: { type: string, example: threshold }
        kind: { type: string, enum: [number, duration, host, instance, service, environment, text] }
        unit: { type: string, description: "number: ratio (0..1), seconds, count, per_second, ms, bytes, score", example: ratio }
        required: { type: boolean }
        default: { description: Default value (number or string) }
        min: { type: number }
        max: { type: number }
        label: { $ref: "#/components/schemas/AlertTemplateText" }

    AlertTemplate:
      type: object
      required: [id, category, rule_type, severity, name, description, params]
      properties:
        id: { type: string, example: redis_memory_high }
        category: { type: string, enum: [host, container, apm, integration, kubernetes] }
        integration: { type: string, description: "nginx, redis, mysql, postgresql (category integration)" }
        rule_type: { $ref: "#/components/schemas/AlertRuleType" }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        metric: { type: string, description: Main metric of metric_threshold templates }
        reference_metric: { type: string, description: "Ratio templates: threshold = ratio × latest value of this metric on the instance" }
        name: { $ref: "#/components/schemas/AlertTemplateText" }
        description: { $ref: "#/components/schemas/AlertTemplateText" }
        params:
          type: array
          items: { $ref: "#/components/schemas/AlertTemplateParam" }

    AlertTemplateRenderInput:
      type: object
      properties:
        params:
          type: object
          additionalProperties: true
          description: "Values by parameter key (unknown keys → 400); integration targets: host_id, discovery_id + instance (empty = every instance)"
        language: { type: string, enum: [en, tr], description: "Language of the generated name and description (default en)" }
        name: { type: string, description: Rule name (default template name – target) }
        channel_ids:
          type: array
          items: { type: string }

    AlertTemplateRender:
      type: object
      required: [rule, reference]
      properties:
        rule: { $ref: "#/components/schemas/AlertRuleInput" }
        reference:
          oneOf:
            - type: object
              required: [metric, value, ratio]
              properties:
                metric: { type: string }
                value: { type: number }
                ratio: { type: number }
            - { type: "null" }

    AlertDeliveryAttempt:
      type: object
      required: [attempt, at, duration_ms, success, status_code, error]
      properties:
        attempt: { type: integer }
        at: { $ref: "#/components/schemas/Timestamp" }
        duration_ms: { type: integer }
        success: { type: boolean }
        status_code: { type: integer }
        error: { type: string }

    AlertDelivery:
      type: object
      required: [id, incident_id, rule_id, rule_name, channel_id, channel_name, channel_type, kind, status, attempts, idempotency_key,
        created_at, finished_at, next_attempt_at, last_error, attempt_log]
      properties:
        id: { type: string, description: Notification id }
        incident_id: { type: [string, "null"] }
        rule_id: { type: [string, "null"] }
        rule_name: { type: string }
        channel_id: { type: [string, "null"] }
        channel_name: { type: string }
        channel_type: { $ref: "#/components/schemas/AlertChannelType" }
        kind: { $ref: "#/components/schemas/AlertNotificationKind" }
        status: { $ref: "#/components/schemas/AlertNotificationStatus" }
        attempts: { type: integer }
        idempotency_key: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/NullableTimestamp" }
        next_attempt_at: { $ref: "#/components/schemas/NullableTimestamp" }
        last_error: { type: string }
        attempt_log:
          type: array
          items: { $ref: "#/components/schemas/AlertDeliveryAttempt" }

    # ---- OQL (oql.md) ----

    OqlVariables:
      type: object
      description: 'Dashboard variable values: {"name": "value" | ["v1", "v2"]}'
      additionalProperties:
        oneOf:
          - { type: string }
          - { type: array, items: { type: string } }

    OqlQueryRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, maxLength: 8192 }
        from: { type: string, description: RFC3339 or unix ms; overrides SINCE (requires to) }
        to: { type: string, description: RFC3339 or unix ms; overrides UNTIL (requires from) }
        variables: { $ref: "#/components/schemas/OqlVariables" }
        filters:
          type: array
          maxItems: 10
          description: Dashboard cross-widget filters (oql.md §7), applied where the event type has the attribute
          items: { $ref: "#/components/schemas/DashboardFilter" }

    OqlColumn:
      type: object
      required: [name, function, type]
      properties:
        name: { type: string, description: Alias or rendered aggregate, e.g. "count(*)" }
        function: { type: string, example: percentile }
        type: { type: string, enum: [number, string] }

    OqlValue:
      type: [number, string, "null"]

    OqlRow:
      type: object
      required: [facets, values]
      properties:
        facets: { type: array, items: { type: string } }
        values: { type: array, items: { $ref: "#/components/schemas/OqlValue" } }

    OqlPoint:
      type: array
      description: "[bucket start unix milliseconds, value]"
      prefixItems:
        - { type: integer }
        - { type: [number, "null"] }
      minItems: 2
      maxItems: 2
      items: { type: [number, "null"] }

    OqlSeries:
      type: object
      required: [facets, column, points]
      properties:
        facets: { type: array, items: { type: string } }
        column: { type: integer, description: Index into columns }
        points: { type: array, items: { $ref: "#/components/schemas/OqlPoint" } }

    OqlHistogramBucket:
      type: object
      required: [from, to, count]
      properties:
        from: { type: number }
        to: { type: number }
        count: { type: number }

    OqlCompare:
      type: object
      required: [offset_seconds, rows, series, buckets]
      properties:
        offset_seconds: { type: integer }
        rows: { type: array, items: { $ref: "#/components/schemas/OqlRow" } }
        series: { type: array, items: { $ref: "#/components/schemas/OqlSeries" } }
        buckets: { type: array, items: { $ref: "#/components/schemas/OqlHistogramBucket" } }

    OqlMetadata:
      type: object
      required: [from, to, bucket_seconds, rollup, table, rows_read, bytes_read, elapsed_ms, queries, facet_limit, truncated, warnings]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        bucket_seconds: { type: [integer, "null"] }
        rollup: { type: boolean }
        table: { type: string }
        rows_read: { type: integer }
        bytes_read: { type: integer }
        elapsed_ms: { type: integer }
        queries: { type: integer }
        facet_limit: { type: integer }
        truncated: { type: boolean }
        warnings: { type: array, items: { type: string } }
        ignored_filters: { type: array, items: { type: string }, description: Dashboard filters (attributes) that do not apply to the event type; omitted when none }

    OqlResult:
      type: object
      required: [kind, event_type, columns, facets, rows, series, buckets, compare, metadata]
      properties:
        kind: { type: string, enum: [single, facets, timeseries, histogram] }
        event_type: { type: string }
        columns: { type: array, items: { $ref: "#/components/schemas/OqlColumn" } }
        facets: { type: array, items: { type: string } }
        rows: { type: array, items: { $ref: "#/components/schemas/OqlRow" } }
        series: { type: array, items: { $ref: "#/components/schemas/OqlSeries" } }
        buckets: { type: array, items: { $ref: "#/components/schemas/OqlHistogramBucket" } }
        compare:
          oneOf:
            - { $ref: "#/components/schemas/OqlCompare" }
            - { type: "null" }
        metadata: { $ref: "#/components/schemas/OqlMetadata" }

    OqlValidateRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, maxLength: 8192 }
        variables: { $ref: "#/components/schemas/OqlVariables" }

    OqlDiagnostic:
      type: object
      required: [message, offset, length, line, column]
      properties:
        message: { type: string }
        offset: { type: integer, description: Byte offset in the query }
        length: { type: integer }
        line: { type: integer, description: 1-based }
        column: { type: integer, description: 1-based (characters) }

    OqlValidation:
      type: object
      required: [valid, event_type, kind, variables, errors, warnings]
      properties:
        valid: { type: boolean }
        event_type: { type: [string, "null"] }
        kind: { type: [string, "null"], enum: [single, facets, timeseries, histogram, null] }
        variables: { type: array, items: { type: string } }
        errors: { type: array, items: { $ref: "#/components/schemas/OqlDiagnostic" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/OqlDiagnostic" } }

    OqlSchema:
      type: object
      required: [event_types, functions, keywords, attribute_keys, resource_keys, metric_names]
      properties:
        event_types:
          type: array
          items:
            type: object
            required: [name, description, attributes, maps, max_range_seconds]
            properties:
              name: { type: string }
              description: { type: string }
              maps: { type: array, items: { type: string, enum: [attributes, resource] } }
              max_range_seconds: { type: integer }
              attributes:
                type: array
                items:
                  type: object
                  required: [name, type, aliases, rollup]
                  properties:
                    name: { type: string }
                    type: { type: string, enum: [string, number, bool] }
                    aliases: { type: array, items: { type: string } }
                    rollup: { type: boolean, description: Available on the Metric 1-minute rollup }
        functions:
          type: array
          items:
            type: object
            required: [name, signature, description]
            properties:
              name: { type: string }
              signature: { type: string }
              description: { type: string }
        keywords: { type: array, items: { type: string } }
        attribute_keys: { type: array, items: { type: string } }
        resource_keys: { type: array, items: { type: string } }
        metric_names: { type: array, items: { type: string } }

    # ---- Dashboards ----

    DashboardVisibility:
      type: string
      enum: [org, private]

    DashboardVariable:
      type: object
      required: [name, label, type, query, values, default, multi, include_all]
      properties:
        name: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,63}$" }
        label: { type: string }
        type: { type: string, enum: [query, list, text] }
        query: { type: string, description: OQL query with FACET (type query) }
        values: { type: array, items: { type: string }, description: Static values (type list) }
        default: { type: array, items: { type: string } }
        multi: { type: boolean }
        include_all: { type: boolean }

    DashboardWidgetLayout:
      type: object
      required: [x, y, w, h]
      properties:
        x: { type: integer, minimum: 0, maximum: 11 }
        y: { type: integer, minimum: 0, maximum: 10000 }
        w: { type: integer, minimum: 1, maximum: 12 }
        h: { type: integer, minimum: 1, maximum: 50 }

    DashboardThreshold:
      type: object
      required: [value, severity]
      properties:
        value: { type: number }
        severity: { type: string, enum: [warning, critical] }

    DashboardVisualization:
      type: string
      enum: [line, area, bar, table, billboard, pie, heatmap, markdown]

    DashboardWidgetOptions:
      type: object
      properties:
        stacked: { type: boolean }
        legend: { type: boolean }

    DashboardUnit:
      type: string
      enum: ["", number, percent, bytes, bytesPerSec, ms, s]

    DashboardWidget:
      type: object
      required: [id, title, visualization, layout, query, markdown, unit, thresholds, options]
      properties:
        id: { type: string }
        title: { type: string }
        visualization: { $ref: "#/components/schemas/DashboardVisualization" }
        layout: { $ref: "#/components/schemas/DashboardWidgetLayout" }
        query: { type: string }
        markdown: { type: string }
        unit: { $ref: "#/components/schemas/DashboardUnit" }
        thresholds: { type: array, items: { $ref: "#/components/schemas/DashboardThreshold" } }
        options: { $ref: "#/components/schemas/DashboardWidgetOptions" }

    DashboardWidgetInput:
      type: object
      required: [visualization, layout]
      properties:
        id: { type: string, description: Kept when it is a widget id of the same dashboard }
        title: { type: string }
        visualization: { $ref: "#/components/schemas/DashboardVisualization" }
        layout: { $ref: "#/components/schemas/DashboardWidgetLayout" }
        query: { type: string }
        markdown: { type: string }
        unit: { $ref: "#/components/schemas/DashboardUnit" }
        thresholds: { type: array, items: { $ref: "#/components/schemas/DashboardThreshold" } }
        options: { $ref: "#/components/schemas/DashboardWidgetOptions" }

    DashboardPage:
      type: object
      required: [id, name, widgets]
      properties:
        id: { type: string }
        name: { type: string }
        widgets: { type: array, items: { $ref: "#/components/schemas/DashboardWidget" } }

    DashboardPageInput:
      type: object
      required: [name, widgets]
      properties:
        id: { type: string }
        name: { type: string }
        widgets: { type: array, items: { $ref: "#/components/schemas/DashboardWidgetInput" } }

    Dashboard:
      type: object
      required: [id, name, description, visibility, version, variables, pages, created_by_user_id, created_by_email, created_at, updated_at, can_edit]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { $ref: "#/components/schemas/DashboardVisibility" }
        version: { type: integer }
        variables: { type: array, items: { $ref: "#/components/schemas/DashboardVariable" } }
        pages: { type: array, items: { $ref: "#/components/schemas/DashboardPage" } }
        created_by_user_id: { type: [string, "null"] }
        created_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        can_edit: { type: boolean }

    DashboardInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        visibility: { $ref: "#/components/schemas/DashboardVisibility" }
        variables: { type: array, items: { $ref: "#/components/schemas/DashboardVariable" } }
        pages: { type: array, items: { $ref: "#/components/schemas/DashboardPageInput" } }
        version: { type: integer, description: Required on PUT (optimistic concurrency) }

    DashboardSummary:
      type: object
      required: [id, name, description, visibility, page_count, widget_count, created_by_email, updated_at, can_edit]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { $ref: "#/components/schemas/DashboardVisibility" }
        page_count: { type: integer }
        widget_count: { type: integer }
        created_by_email: { type: string }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        can_edit: { type: boolean }

    DashboardAddWidget:
      type: object
      required: [widget]
      properties:
        page_id: { type: string }
        widget: { $ref: "#/components/schemas/DashboardWidgetInput" }

    DashboardExport:
      type: object
      required: [openlog_dashboard, name, description, variables, pages]
      properties:
        openlog_dashboard: { type: integer, enum: [1] }
        name: { type: string }
        description: { type: string }
        variables: { type: array, items: { $ref: "#/components/schemas/DashboardVariable" } }
        pages:
          type: array
          items:
            type: object
            required: [name, widgets]
            properties:
              name: { type: string }
              widgets: { type: array, items: { $ref: "#/components/schemas/DashboardWidgetInput" } }

    DashboardImport:
      allOf:
        - { $ref: "#/components/schemas/DashboardExport" }
        - type: object
          properties:
            visibility: { $ref: "#/components/schemas/DashboardVisibility" }

    # ---- Dashboard filters, versions, sharing and reports (D-086, D-087) ----

    DashboardFilter:
      type: object
      required: [attribute, value]
      properties:
        attribute: { type: string, description: "OQL attribute: host.name, attributes['k'], resource['k']" }
        value: { type: string, maxLength: 4096 }
        event_type: { type: string, description: Event type of the widget the filter was taken from (implicit attributes apply only to it) }

    DashboardSettings:
      type: object
      required: [share_links_enabled, report_domains, updated_at, can_edit]
      properties:
        share_links_enabled: { type: boolean }
        report_domains: { type: array, items: { type: string } }
        updated_at: { type: [string, "null"] }
        can_edit: { type: boolean }

    DashboardSettingsInput:
      type: object
      required: [share_links_enabled]
      properties:
        share_links_enabled: { type: boolean }
        report_domains: { type: array, maxItems: 20, items: { type: string } }

    DashboardVersion:
      type: object
      required: [version, author_user_id, author_email, created_at, restored_from, page_count, widget_count]
      properties:
        version: { type: integer }
        author_user_id: { type: [string, "null"] }
        author_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        restored_from: { type: [integer, "null"] }
        page_count: { type: integer }
        widget_count: { type: integer }

    DashboardVersionList:
      type: object
      required: [versions, current_version, can_restore]
      properties:
        versions: { type: array, items: { $ref: "#/components/schemas/DashboardVersion" } }
        current_version: { type: integer }
        can_restore: { type: boolean }

    DashboardPageRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    DashboardWidgetRef:
      type: object
      required: [id, title, page]
      properties:
        id: { type: string }
        title: { type: string }
        page: { type: string, description: Page name }
        fields:
          type: array
          items: { type: string, enum: [title, visualization, layout, query, markdown, unit, thresholds, options, page] }

    DashboardDiff:
      type: object
      required: [name, description, visibility, variables, pages_added, pages_removed, pages_renamed, widgets_added, widgets_removed, widgets_changed]
      properties:
        name: { type: boolean }
        description: { type: boolean }
        visibility: { type: boolean }
        variables: { type: boolean }
        pages_added: { type: array, items: { $ref: "#/components/schemas/DashboardPageRef" } }
        pages_removed: { type: array, items: { $ref: "#/components/schemas/DashboardPageRef" } }
        pages_renamed: { type: array, items: { $ref: "#/components/schemas/DashboardPageRef" } }
        widgets_added: { type: array, items: { $ref: "#/components/schemas/DashboardWidgetRef" } }
        widgets_removed: { type: array, items: { $ref: "#/components/schemas/DashboardWidgetRef" } }
        widgets_changed: { type: array, items: { $ref: "#/components/schemas/DashboardWidgetRef" } }

    DashboardVersionDetail:
      allOf:
        - { $ref: "#/components/schemas/DashboardVersion" }
        - type: object
          required: [document, current_version, previous_version, changes, differences_from_current]
          properties:
            document:
              type: object
              required: [name, description, visibility, variables, pages]
              properties:
                name: { type: string }
                description: { type: string }
                visibility: { $ref: "#/components/schemas/DashboardVisibility" }
                variables: { type: array, items: { $ref: "#/components/schemas/DashboardVariable" } }
                pages: { type: array, items: { $ref: "#/components/schemas/DashboardPage" } }
            current_version: { type: integer }
            previous_version: { type: [integer, "null"] }
            changes:
              oneOf:
                - { $ref: "#/components/schemas/DashboardDiff" }
                - { type: "null" }
            differences_from_current: { $ref: "#/components/schemas/DashboardDiff" }

    DashboardRestore:
      type: object
      required: [version]
      properties:
        version: { type: integer, description: The current version of the dashboard that was read }

    DashboardLockedVariables:
      type: object
      description: Locked variable values by variable name
      additionalProperties: { type: array, items: { type: string } }

    DashboardShareInput:
      type: object
      required: [expires_at]
      properties:
        label: { type: string, maxLength: 100 }
        expires_at: { type: string, format: date-time, description: 5 minutes to 90 days ahead }
        range: { type: string, pattern: "^[1-9][0-9]{0,3}[mhd]$", description: Relative range (1 minute to 31 days); or from and to }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        variables: { $ref: "#/components/schemas/DashboardLockedVariables" }

    DashboardShare:
      type: object
      required: [id, label, range, from, to, variables, created_by_email, created_at, expires_at, revoked_at, last_used_at, use_count, active]
      properties:
        id: { type: string }
        label: { type: string }
        range: { type: [string, "null"] }
        from: { type: [string, "null"] }
        to: { type: [string, "null"] }
        variables: { $ref: "#/components/schemas/DashboardLockedVariables" }
        created_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        revoked_at: { type: [string, "null"] }
        last_used_at: { type: [string, "null"] }
        use_count: { type: integer }
        active: { type: boolean }

    DashboardShareCreated:
      allOf:
        - { $ref: "#/components/schemas/DashboardShare" }
        - type: object
          required: [token, path]
          properties:
            token: { type: string, description: Returned only when the link is created }
            path: { type: string, description: "Web UI page of the link: /shared/dashboards/{token}" }

    DashboardReportFrequency:
      type: string
      enum: [daily, weekly]

    DashboardReportInput:
      type: object
      required: [frequency, hour, recipients]
      properties:
        name: { type: string, maxLength: 100 }
        frequency: { $ref: "#/components/schemas/DashboardReportFrequency" }
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday (weekly) }
        hour: { type: integer, minimum: 0, maximum: 23 }
        minute: { type: integer, minimum: 0, maximum: 59 }
        timezone: { type: string, description: IANA time zone (default UTC) }
        recipients: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
        language: { type: string, enum: [en, tr] }
        range: { type: string, description: Relative range (default 24h daily, 7d weekly) }
        variables: { $ref: "#/components/schemas/DashboardLockedVariables" }
        enabled: { type: boolean }

    DashboardReportRun:
      type: object
      required: [period, status, error, recipients, started_at, finished_at]
      properties:
        period: { type: string, description: Local date YYYY-MM-DD }
        status: { type: string, enum: [running, sent, partial, failed, skipped] }
        error: { type: string }
        recipients: { type: integer }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { type: [string, "null"] }

    DashboardReport:
      type: object
      required: [id, name, frequency, weekday, hour, minute, timezone, recipients, language, range, variables, enabled, created_by_email, created_at, updated_at, next_run_at, last_run]
      properties:
        id: { type: string }
        name: { type: string }
        frequency: { $ref: "#/components/schemas/DashboardReportFrequency" }
        weekday: { type: integer }
        hour: { type: integer }
        minute: { type: integer }
        timezone: { type: string }
        recipients: { type: array, items: { type: string } }
        language: { type: string, enum: [en, tr] }
        range: { type: string }
        variables: { $ref: "#/components/schemas/DashboardLockedVariables" }
        enabled: { type: boolean }
        created_by_email: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        next_run_at: { type: [string, "null"] }
        last_run:
          oneOf:
            - { $ref: "#/components/schemas/DashboardReportRun" }
            - { type: "null" }

    SharedDashboardWidget:
      type: object
      required: [id, title, visualization, layout, markdown, unit, thresholds, options]
      properties:
        id: { type: string }
        title: { type: string }
        visualization: { $ref: "#/components/schemas/DashboardVisualization" }
        layout: { $ref: "#/components/schemas/DashboardWidgetLayout" }
        markdown: { type: string }
        unit: { $ref: "#/components/schemas/DashboardUnit" }
        thresholds: { type: array, items: { $ref: "#/components/schemas/DashboardThreshold" } }
        options: { $ref: "#/components/schemas/DashboardWidgetOptions" }

    SharedDashboard:
      type: object
      required: [name, description, pages, variables, time_range, expires_at]
      properties:
        name: { type: string }
        description: { type: string }
        pages:
          type: array
          items:
            type: object
            required: [id, name, widgets]
            properties:
              id: { type: string }
              name: { type: string }
              widgets: { type: array, items: { $ref: "#/components/schemas/SharedDashboardWidget" } }
        variables:
          type: array
          items:
            type: object
            required: [name, label, values]
            properties:
              name: { type: string }
              label: { type: string }
              values: { type: array, items: { type: string }, description: Locked values (empty = All) }
        time_range:
          type: object
          required: [range, from, to]
          properties:
            range: { type: [string, "null"] }
            from: { type: [string, "null"] }
            to: { type: [string, "null"] }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    # ---- Data export and deletion (api.md "Data export and deletion", D-107) ----
    DataExport:
      type: object
      required: [id, kind, status, signals, from, to, requested_by, size_bytes, telemetry_rows, truncated, error, created_at, started_at, completed_at, expires_at, download_available]
      properties:
        id: { type: string }
        kind: { type: string, enum: [organization, user] }
        status: { type: string, enum: [pending, running, completed, failed, expired] }
        signals: { type: array, items: { type: string, enum: [logs, traces, metrics] } }
        from: { type: [string, "null"] }
        to: { type: [string, "null"] }
        requested_by: { type: string }
        size_bytes: { type: integer, format: int64 }
        telemetry_rows: { type: integer, format: int64 }
        truncated: { type: boolean, description: A size or row limit stopped the telemetry part (see the archive's manifest.json) }
        error: { type: string }
        created_at: { type: string }
        started_at: { type: [string, "null"] }
        completed_at: { type: [string, "null"] }
        expires_at: { type: [string, "null"] }
        download_available: { type: boolean }
    DataExportEnvelope:
      type: object
      required: [export]
      properties:
        export: { $ref: "#/components/schemas/DataExport" }
    DataExportList:
      type: object
      required: [exports]
      properties:
        exports: { type: array, items: { $ref: "#/components/schemas/DataExport" } }
    OrgExportRequest:
      type: object
      properties:
        from: { type: string, description: RFC3339 or unix ms; required with signals }
        to: { type: string, description: RFC3339 or unix ms; required with signals }
        signals: { type: array, items: { type: string, enum: [logs, traces, metrics] }, description: Empty = PostgreSQL data only }
    OrgDeletion:
      type: object
      required: [id, organization_id, organization_name, tenant_id, status, initiator, requested_at, purge_after, cancelled_at, started_at, completed_at, cancellable, certificate_id]
      properties:
        id: { type: string }
        organization_id: { type: [string, "null"] }
        organization_name: { type: string }
        tenant_id: { type: string }
        status: { type: string, enum: [scheduled, cancelled, deleting, completed] }
        initiator: { type: string, enum: [owner, operator] }
        reason: { type: string, description: Operator views only }
        requested_by_email: { type: string, description: Operator views only }
        requested_at: { type: string }
        purge_after: { type: string }
        cancelled_at: { type: [string, "null"] }
        started_at: { type: [string, "null"] }
        completed_at: { type: [string, "null"] }
        cancellable: { type: boolean }
        certificate_id: { type: [string, "null"] }
        last_error: { type: string, description: Operator views only }
    OrgDeletionEnvelope:
      type: object
      required: [deletion]
      properties:
        deletion: { $ref: "#/components/schemas/OrgDeletion" }
    AccountPrivacy:
      type: object
      required: [has_password, data_export_enabled, org_deletion_grace_seconds, reauth_max_age_seconds, org_deletions]
      properties:
        has_password: { type: boolean, description: false = confirm destructive operations with a recent single sign-on session }
        data_export_enabled: { type: boolean }
        org_deletion_grace_seconds: { type: integer }
        reauth_max_age_seconds: { type: integer }
        org_deletions: { type: array, items: { $ref: "#/components/schemas/OrgDeletion" } }
    DeletionCertificate:
      type: object
      required: [id, subject_type, subject_hash, initiator, requested_at, grace_ended_at, started_at, completed_at, postgres_rows, clickhouse_rows, verified]
      properties:
        id: { type: string }
        subject_type: { type: string, enum: [organization, user] }
        subject_hash: { type: string, description: Hex sha256 of the tenant id or user id }
        initiator: { type: string, enum: [owner, operator, self] }
        requested_at: { type: string }
        grace_ended_at: { type: [string, "null"] }
        started_at: { type: string }
        completed_at: { type: string }
        postgres_rows: { type: object, additionalProperties: { type: integer } }
        clickhouse_rows: { type: object, additionalProperties: { type: integer } }
        verified: { type: boolean }

    # ---- Status page (api.md "Status page", D-108) ----
    StatusValue:
      type: string
      enum: [operational, degraded, partial_outage, major_outage, maintenance, unknown]
    StatusPage:
      type: object
      required: [status, checked_at, components, incidents, maintenance, history]
      properties:
        status: { $ref: "#/components/schemas/StatusValue" }
        checked_at: { type: [string, "null"] }
        components:
          type: array
          items:
            type: object
            required: [id, status, uptime_90d, days]
            properties:
              id: { type: string, enum: [ingest, query_api, alerting, processing] }
              status: { $ref: "#/components/schemas/StatusValue" }
              uptime_90d: { type: [number, "null"] }
              days:
                type: array
                items:
                  type: object
                  required: [date, status, uptime]
                  properties:
                    date: { type: string }
                    status: { type: string, enum: [operational, degraded, outage, no_data] }
                    uptime: { type: [number, "null"] }
        incidents: { type: array, items: { $ref: "#/components/schemas/StatusIncident" } }
        maintenance: { type: array, items: { $ref: "#/components/schemas/StatusIncident" } }
        history: { type: array, items: { $ref: "#/components/schemas/StatusIncident" } }
    StatusIncident:
      type: object
      required: [id, kind, title, status, impact, components, starts_at, ends_at, created_at, updated_at, updates]
      properties:
        id: { type: string }
        kind: { type: string, enum: [incident, maintenance] }
        title: { type: string }
        status: { type: string, enum: [investigating, identified, monitoring, resolved, scheduled, in_progress, completed] }
        impact: { type: string, enum: [none, minor, major, critical] }
        components: { type: array, items: { type: string } }
        starts_at: { type: string }
        ends_at: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
        updates:
          type: array
          items:
            type: object
            required: [id, status, message, created_at]
            properties:
              id: { type: integer }
              status: { type: string }
              message: { type: string }
              created_at: { type: string }
    StatusIncidentInput:
      type: object
      properties:
        kind: { type: string, enum: [incident, maintenance], description: Create only }
        title: { type: string, maxLength: 200 }
        status: { type: string }
        impact: { type: string, enum: [none, minor, major, critical] }
        components: { type: array, items: { type: string, enum: [ingest, query_api, alerting, processing] } }
        starts_at: { type: string }
        ends_at: { type: string, description: '"" clears' }
        message: { type: string, description: First timeline entry (create only) }
    StatusIncidentEnvelope:
      type: object
      required: [incident]
      properties:
        incident: { $ref: "#/components/schemas/StatusIncident" }
