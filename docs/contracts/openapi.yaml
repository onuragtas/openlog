      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrialInput" }
      responses:
        "200":
          description: Lifecycle state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgLifecycle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
