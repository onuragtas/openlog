# openlog `single` profile: one Kafka broker (KRaft), one ClickHouse node with
# embedded Keeper (cluster `openlog`: 1 shard x 1 replica), PostgreSQL 16 (tenants,
# users, keys), a one-shot bootstrap (first organization, owner and keys from
# OPENLOG_BOOTSTRAP_*) and openlog-allinone.
#
#   cp .env.example .env && docker compose up -d --build --wait
name: openlog

# Release these files belong to (`make release-prepare` stamps it). openlog-updater compares it with the running
# version and reports older compose files (settings and volumes added later do not reach the containers).
x-openlog-compose-version: "0.1.48"

# Every other setting of docs/contracts/config.md, passed through from .env (empty = the documented default), merged
# into `openlog` and `openlog-alert`. internal/config/envcoverage_test.go fails when a variable read by the backend is
# not an environment key of `openlog`.
x-openlog-settings: &openlog-settings
  # Services
  OPENLOG_API_QUERY_TIMEOUT: ${OPENLOG_API_QUERY_TIMEOUT:-}
  OPENLOG_API_MAX_ROWS: ${OPENLOG_API_MAX_ROWS:-}
  OPENLOG_API_UI_ENABLED: ${OPENLOG_API_UI_ENABLED:-}
  OPENLOG_API_TRUSTED_PROXIES: ${OPENLOG_API_TRUSTED_PROXIES:-}
  OPENLOG_INGEST_MAX_BODY_BYTES: ${OPENLOG_INGEST_MAX_BODY_BYTES:-}
  OPENLOG_INGEST_PRODUCE_TIMEOUT: ${OPENLOG_INGEST_PRODUCE_TIMEOUT:-}
  OPENLOG_INGEST_PUBLIC_URL: ${OPENLOG_INGEST_PUBLIC_URL:-}
  OPENLOG_INGEST_PUBLIC_GRPC_URL: ${OPENLOG_INGEST_PUBLIC_GRPC_URL:-}
  OPENLOG_KAFKA_TOPIC_PREFIX: ${OPENLOG_KAFKA_TOPIC_PREFIX:-}
  OPENLOG_POSTGRES_MAX_CONNS: ${OPENLOG_POSTGRES_MAX_CONNS:-}
  OPENLOG_PROCESSOR_GROUP: ${OPENLOG_PROCESSOR_GROUP:-}
  OPENLOG_PROCESSOR_BATCH_ROWS: ${OPENLOG_PROCESSOR_BATCH_ROWS:-}
  OPENLOG_PROCESSOR_BATCH_BYTES: ${OPENLOG_PROCESSOR_BATCH_BYTES:-}
  OPENLOG_PROCESSOR_FLUSH_INTERVAL: ${OPENLOG_PROCESSOR_FLUSH_INTERVAL:-}
  OPENLOG_PROCESSOR_INSERT_TIMEOUT: ${OPENLOG_PROCESSOR_INSERT_TIMEOUT:-}
  OPENLOG_PROCESSOR_MAX_BUFFERED_BYTES: ${OPENLOG_PROCESSOR_MAX_BUFFERED_BYTES:-}
  OPENLOG_PROCESSOR_INSERT_CONCURRENCY: ${OPENLOG_PROCESSOR_INSERT_CONCURRENCY:-}
  OPENLOG_PROCESSOR_INSERT_MODE: ${OPENLOG_PROCESSOR_INSERT_MODE:-}
  OPENLOG_PROCESSOR_TOPOLOGY_REFRESH: ${OPENLOG_PROCESSOR_TOPOLOGY_REFRESH:-}
  OPENLOG_PROCESSOR_INSERT_QUORUM: ${OPENLOG_PROCESSOR_INSERT_QUORUM:-}
  # Per-tenant query limits (D-047; organization settings: docs/contracts/usage.md §4.5)
  OPENLOG_QUERY_MAX_MEMORY_USAGE: ${OPENLOG_QUERY_MAX_MEMORY_USAGE:-}
  OPENLOG_QUERY_MAX_ROWS_TO_READ: ${OPENLOG_QUERY_MAX_ROWS_TO_READ:-}
  OPENLOG_QUERY_MAX_BYTES_TO_READ: ${OPENLOG_QUERY_MAX_BYTES_TO_READ:-}
  OPENLOG_QUERY_TENANT_LIMITS: ${OPENLOG_QUERY_TENANT_LIMITS:-}
  # Sessions, sign-up, stored key hashing
  OPENLOG_SESSION_TTL: ${OPENLOG_SESSION_TTL:-}
  OPENLOG_SESSION_IDLE_TIMEOUT: ${OPENLOG_SESSION_IDLE_TIMEOUT:-}
  OPENLOG_COOKIE_DOMAIN: ${OPENLOG_COOKIE_DOMAIN:-}
  OPENLOG_LOGIN_MAX_FAILURES: ${OPENLOG_LOGIN_MAX_FAILURES:-}
  OPENLOG_LOGIN_WINDOW: ${OPENLOG_LOGIN_WINDOW:-}
  OPENLOG_INVITATION_TTL: ${OPENLOG_INVITATION_TTL:-}
  OPENLOG_AUTH_NEGATIVE_CACHE_TTL: ${OPENLOG_AUTH_NEGATIVE_CACHE_TTL:-}
  OPENLOG_AUTH_CACHE_MAX_STALE: ${OPENLOG_AUTH_CACHE_MAX_STALE:-}
  OPENLOG_KEY_HASH_SECRET: ${OPENLOG_KEY_HASH_SECRET:-}
  OPENLOG_KEY_HASH_SECRET_PREVIOUS: ${OPENLOG_KEY_HASH_SECRET_PREVIOUS:-}
  OPENLOG_SIGNUP_REQUIRE_VERIFICATION: ${OPENLOG_SIGNUP_REQUIRE_VERIFICATION:-}
  OPENLOG_EMAIL_VERIFICATION_TTL: ${OPENLOG_EMAIL_VERIFICATION_TTL:-}
  OPENLOG_SIGNUP_MAX_PER_IP: ${OPENLOG_SIGNUP_MAX_PER_IP:-}
  OPENLOG_SIGNUP_MAX_PER_EMAIL: ${OPENLOG_SIGNUP_MAX_PER_EMAIL:-}
  OPENLOG_SIGNUP_RATE_WINDOW: ${OPENLOG_SIGNUP_RATE_WINDOW:-}
  OPENLOG_SIGNUP_BLOCKED_EMAIL_DOMAINS: ${OPENLOG_SIGNUP_BLOCKED_EMAIL_DOMAINS:-}
  OPENLOG_SIGNUP_BLOCKED_EMAIL_DOMAINS_FILE: ${OPENLOG_SIGNUP_BLOCKED_EMAIL_DOMAINS_FILE:-}
  OPENLOG_SIGNUP_CAPTCHA_PROVIDER: ${OPENLOG_SIGNUP_CAPTCHA_PROVIDER:-}
  OPENLOG_SIGNUP_CAPTCHA_SECRET: ${OPENLOG_SIGNUP_CAPTCHA_SECRET:-}
  OPENLOG_SIGNUP_CAPTCHA_SITE_KEY: ${OPENLOG_SIGNUP_CAPTCHA_SITE_KEY:-}
  # Single sign-on and SCIM
  OPENLOG_SSO_ENABLED: ${OPENLOG_SSO_ENABLED:-}
  OPENLOG_SSO_SECRET_KEY: ${OPENLOG_SSO_SECRET_KEY:-}
  OPENLOG_SSO_SECRET_KEY_PREVIOUS: ${OPENLOG_SSO_SECRET_KEY_PREVIOUS:-}
  OPENLOG_SSO_ALLOW_PRIVATE_NETWORKS: ${OPENLOG_SSO_ALLOW_PRIVATE_NETWORKS:-}
  OPENLOG_SSO_LOGIN_TTL: ${OPENLOG_SSO_LOGIN_TTL:-}
  OPENLOG_SSO_CLOCK_SKEW: ${OPENLOG_SSO_CLOCK_SKEW:-}
  OPENLOG_SSO_HTTP_TIMEOUT: ${OPENLOG_SSO_HTTP_TIMEOUT:-}
  OPENLOG_SCIM_ENABLED: ${OPENLOG_SCIM_ENABLED:-}
  # APM
  OPENLOG_APM_DEFAULT_APDEX_T: ${OPENLOG_APM_DEFAULT_APDEX_T:-}
  OPENLOG_APM_LINK_ENABLED: ${OPENLOG_APM_LINK_ENABLED:-}
  OPENLOG_APM_LINK_INTERVAL: ${OPENLOG_APM_LINK_INTERVAL:-}
  OPENLOG_APM_LINK_LOOKBACK: ${OPENLOG_APM_LINK_LOOKBACK:-}
  OPENLOG_APM_LINK_DELAY: ${OPENLOG_APM_LINK_DELAY:-}
  OPENLOG_APM_LINK_CATCHUP_ENABLED: ${OPENLOG_APM_LINK_CATCHUP_ENABLED:-}
  OPENLOG_APM_LINK_CATCHUP_AT: ${OPENLOG_APM_LINK_CATCHUP_AT:-}
  OPENLOG_APM_LINK_CATCHUP_BATCH: ${OPENLOG_APM_LINK_CATCHUP_BATCH:-}
  OPENLOG_APM_RELINK_ENABLED: ${OPENLOG_APM_RELINK_ENABLED:-}
  OPENLOG_APM_RELINK_AFTER: ${OPENLOG_APM_RELINK_AFTER:-}
  OPENLOG_APM_RELINK_MAX_AGE: ${OPENLOG_APM_RELINK_MAX_AGE:-}
  OPENLOG_APM_RELINK_INTERVAL: ${OPENLOG_APM_RELINK_INTERVAL:-}
  OPENLOG_APM_RELINK_MAX_MINUTES: ${OPENLOG_APM_RELINK_MAX_MINUTES:-}
  OPENLOG_APM_RETENTION_DAYS: ${OPENLOG_APM_RETENTION_DAYS:-}
  # Alerting tuning
  OPENLOG_ALERT_LEASE_TTL: ${OPENLOG_ALERT_LEASE_TTL:-}
  OPENLOG_ALERT_LEASE_RENEW_INTERVAL: ${OPENLOG_ALERT_LEASE_RENEW_INTERVAL:-}
  OPENLOG_ALERT_MAX_CONCURRENT_EVALUATIONS: ${OPENLOG_ALERT_MAX_CONCURRENT_EVALUATIONS:-}
  OPENLOG_ALERT_TENANT_MAX_CONCURRENT: ${OPENLOG_ALERT_TENANT_MAX_CONCURRENT:-}
  OPENLOG_ALERT_TENANT_EVALUATIONS_PER_MINUTE: ${OPENLOG_ALERT_TENANT_EVALUATIONS_PER_MINUTE:-}
  OPENLOG_ALERT_MAX_SERIES_PER_RULE: ${OPENLOG_ALERT_MAX_SERIES_PER_RULE:-}
  OPENLOG_ALERT_QUERY_TIMEOUT: ${OPENLOG_ALERT_QUERY_TIMEOUT:-}
  OPENLOG_ALERT_MAX_RULES_PER_ORG: ${OPENLOG_ALERT_MAX_RULES_PER_ORG:-}
  OPENLOG_ALERT_EVALUATION_HISTORY: ${OPENLOG_ALERT_EVALUATION_HISTORY:-}
  OPENLOG_ALERT_DISPATCH_WORKERS: ${OPENLOG_ALERT_DISPATCH_WORKERS:-}
  OPENLOG_ALERT_DELIVERY_TIMEOUT: ${OPENLOG_ALERT_DELIVERY_TIMEOUT:-}
  OPENLOG_ALERT_DELIVERY_MAX_ATTEMPTS: ${OPENLOG_ALERT_DELIVERY_MAX_ATTEMPTS:-}
  # Agent fleet
  OPENLOG_FLEET_ROLLOUT_SYNC_INTERVAL: ${OPENLOG_FLEET_ROLLOUT_SYNC_INTERVAL:-}
  OPENLOG_FLEET_POLICY_CACHE_TTL: ${OPENLOG_FLEET_POLICY_CACHE_TTL:-}
  OPENLOG_FLEET_HOST_STALE_AFTER: ${OPENLOG_FLEET_HOST_STALE_AFTER:-}
  OPENLOG_FLEET_REPORT_QUEUE_SIZE: ${OPENLOG_FLEET_REPORT_QUEUE_SIZE:-}
  # Tail sampling (in-process sampler)
  OPENLOG_TAILSAMPLING_GROUP: ${OPENLOG_TAILSAMPLING_GROUP:-}
  OPENLOG_TAILSAMPLING_MAX_TRACES: ${OPENLOG_TAILSAMPLING_MAX_TRACES:-}
  OPENLOG_TAILSAMPLING_MAX_SPANS_PER_TRACE: ${OPENLOG_TAILSAMPLING_MAX_SPANS_PER_TRACE:-}
  OPENLOG_TAILSAMPLING_DECISION_CACHE_TTL: ${OPENLOG_TAILSAMPLING_DECISION_CACHE_TTL:-}
  OPENLOG_TAILSAMPLING_DECISION_CACHE_SIZE: ${OPENLOG_TAILSAMPLING_DECISION_CACHE_SIZE:-}
  OPENLOG_TAILSAMPLING_POLICY_REFRESH: ${OPENLOG_TAILSAMPLING_POLICY_REFRESH:-}
  OPENLOG_TAILSAMPLING_PRODUCE_TIMEOUT: ${OPENLOG_TAILSAMPLING_PRODUCE_TIMEOUT:-}
  # Tiered storage
  OPENLOG_STORAGE_POLICY: ${OPENLOG_STORAGE_POLICY:-}
  # Usage, plans, quotas and billing (docs/operations/saas.md)
  OPENLOG_SAAS_MODE: ${OPENLOG_SAAS_MODE:-}
  OPENLOG_PLANS: ${OPENLOG_PLANS:-}
  OPENLOG_PLANS_FILE: ${OPENLOG_PLANS_FILE:-}
  OPENLOG_DEFAULT_PLAN: ${OPENLOG_DEFAULT_PLAN:-}
  OPENLOG_SUPERADMIN_EMAILS: ${OPENLOG_SUPERADMIN_EMAILS:-}
  OPENLOG_USAGE_EVALUATION_INTERVAL: ${OPENLOG_USAGE_EVALUATION_INTERVAL:-}
  OPENLOG_USAGE_QUERY_COLLECTION_ENABLED: ${OPENLOG_USAGE_QUERY_COLLECTION_ENABLED:-}
  OPENLOG_USAGE_NOTIFY_THRESHOLDS: ${OPENLOG_USAGE_NOTIFY_THRESHOLDS:-}
  OPENLOG_QUOTA_REFRESH_INTERVAL: ${OPENLOG_QUOTA_REFRESH_INTERVAL:-}
  OPENLOG_QUOTA_INGEST_PODS: ${OPENLOG_QUOTA_INGEST_PODS:-}
  OPENLOG_QUOTA_BLOCKED_RETRY_AFTER: ${OPENLOG_QUOTA_BLOCKED_RETRY_AFTER:-}
  OPENLOG_QUOTA_RETENTION_ENABLED: ${OPENLOG_QUOTA_RETENTION_ENABLED:-}
  OPENLOG_QUOTA_RETENTION_MAX_MUTATIONS: ${OPENLOG_QUOTA_RETENTION_MAX_MUTATIONS:-}
  OPENLOG_BILLING_PROVIDER: ${OPENLOG_BILLING_PROVIDER:-}
  OPENLOG_BILLING_PUSH_AT: ${OPENLOG_BILLING_PUSH_AT:-}
  # SaaS operations: operator console, trials, hard limits, abuse detection (docs/operations/saas.md §8-§11)
  OPENLOG_SAAS_HOST_SYNC_INTERVAL: ${OPENLOG_SAAS_HOST_SYNC_INTERVAL:-}
  OPENLOG_SAAS_SIGNUP_TRIAL_PLAN: ${OPENLOG_SAAS_SIGNUP_TRIAL_PLAN:-}
  OPENLOG_SAAS_TRIAL_NOTIFY_DAYS: ${OPENLOG_SAAS_TRIAL_NOTIFY_DAYS:-}
  OPENLOG_SAAS_LIFECYCLE_INTERVAL: ${OPENLOG_SAAS_LIFECYCLE_INTERVAL:-}
  OPENLOG_SAAS_SUPPORT_SESSION_TTL: ${OPENLOG_SAAS_SUPPORT_SESSION_TTL:-}
  OPENLOG_SAAS_AUTO_SUSPEND: ${OPENLOG_SAAS_AUTO_SUSPEND:-}
  OPENLOG_SAAS_ABUSE_INTERVAL: ${OPENLOG_SAAS_ABUSE_INTERVAL:-}
  OPENLOG_SAAS_ABUSE_INGEST_MULTIPLIER: ${OPENLOG_SAAS_ABUSE_INGEST_MULTIPLIER:-}
  OPENLOG_SAAS_ABUSE_NEW_ORG_DAYS: ${OPENLOG_SAAS_ABUSE_NEW_ORG_DAYS:-}
  OPENLOG_SAAS_ABUSE_NEW_ORG_HOSTS: ${OPENLOG_SAAS_ABUSE_NEW_ORG_HOSTS:-}
  OPENLOG_SAAS_ABUSE_SOURCE_IPS: ${OPENLOG_SAAS_ABUSE_SOURCE_IPS:-}
  # Data subject requests and the public status page (docs/operations/saas.md §12-§13). Local archives are kept in the
  # volume `data-exports` of `openlog` (mounted at /var/lib/openlog/exports).
  OPENLOG_ORG_DELETION_GRACE: ${OPENLOG_ORG_DELETION_GRACE:-}
  OPENLOG_DATA_EXPORT_ENABLED: ${OPENLOG_DATA_EXPORT_ENABLED:-}
  OPENLOG_DATA_EXPORT_STORAGE: ${OPENLOG_DATA_EXPORT_STORAGE:-}
  OPENLOG_DATA_EXPORT_LOCAL_PATH: ${OPENLOG_DATA_EXPORT_LOCAL_PATH:-/var/lib/openlog/exports}
  OPENLOG_DATA_EXPORT_S3_URL: ${OPENLOG_DATA_EXPORT_S3_URL:-}
  OPENLOG_DATA_EXPORT_S3_REGION: ${OPENLOG_DATA_EXPORT_S3_REGION:-}
  OPENLOG_DATA_EXPORT_S3_ACCESS_KEY_ID: ${OPENLOG_DATA_EXPORT_S3_ACCESS_KEY_ID:-}
  OPENLOG_DATA_EXPORT_S3_SECRET_ACCESS_KEY: ${OPENLOG_DATA_EXPORT_S3_SECRET_ACCESS_KEY:-}
  OPENLOG_DATA_EXPORT_S3_CREDENTIALS: ${OPENLOG_DATA_EXPORT_S3_CREDENTIALS:-}
  OPENLOG_DATA_EXPORT_TTL: ${OPENLOG_DATA_EXPORT_TTL:-}
  OPENLOG_DATA_EXPORT_MAX_BYTES: ${OPENLOG_DATA_EXPORT_MAX_BYTES:-}
  OPENLOG_DATA_EXPORT_MAX_ROWS: ${OPENLOG_DATA_EXPORT_MAX_ROWS:-}
  OPENLOG_DATA_EXPORT_MAX_RANGE: ${OPENLOG_DATA_EXPORT_MAX_RANGE:-}
  OPENLOG_DATA_EXPORT_ROWS_PER_SECOND: ${OPENLOG_DATA_EXPORT_ROWS_PER_SECOND:-}
  OPENLOG_STATUS_PAGE_ENABLED: ${OPENLOG_STATUS_PAGE_ENABLED:-}
  # Scheduled outside-in checks (docs/contracts/api.md "Synthetic monitoring", D-132); run by the api leader
  OPENLOG_SYNTHETICS_ENABLED: ${OPENLOG_SYNTHETICS_ENABLED:-}
  OPENLOG_SYNTHETICS_ALLOW_PRIVATE_NETWORKS: ${OPENLOG_SYNTHETICS_ALLOW_PRIVATE_NETWORKS:-}
  OPENLOG_SYNTHETICS_MAX_CONCURRENT: ${OPENLOG_SYNTHETICS_MAX_CONCURRENT:-}
  OPENLOG_SYNTHETICS_TENANT_MAX_CONCURRENT: ${OPENLOG_SYNTHETICS_TENANT_MAX_CONCURRENT:-}
  OPENLOG_SYNTHETICS_MAX_RESPONSE_BYTES: ${OPENLOG_SYNTHETICS_MAX_RESPONSE_BYTES:-}
  OPENLOG_SYNTHETICS_MAX_REDIRECTS: ${OPENLOG_SYNTHETICS_MAX_REDIRECTS:-}
  # Infrastructure cost estimates (docs/contracts/cost.md, D-134); a static price table, not billing data
  OPENLOG_COST_ENABLED: ${OPENLOG_COST_ENABLED:-}
  OPENLOG_COST_PRICES_FILE: ${OPENLOG_COST_PRICES_FILE:-}
  # PNG widget images in scheduled report e-mails (docs/operations/reports.md, D-097; profile `renderer` below)
  OPENLOG_RENDERER_URL: ${OPENLOG_RENDERER_URL:-}
  OPENLOG_RENDERER_TOKEN: ${OPENLOG_RENDERER_TOKEN:-}
  OPENLOG_RENDERER_TIMEOUT: ${OPENLOG_RENDERER_TIMEOUT:-}
  OPENLOG_RENDERER_TLS_CERT_FILE: ${OPENLOG_RENDERER_TLS_CERT_FILE:-}
  OPENLOG_RENDERER_TLS_KEY_FILE: ${OPENLOG_RENDERER_TLS_KEY_FILE:-}
  OPENLOG_RENDERER_TLS_CA_FILE: ${OPENLOG_RENDERER_TLS_CA_FILE:-}

services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    environment:
      POSTGRES_USER: openlog
      POSTGRES_PASSWORD: ${OPENLOG_POSTGRES_PASSWORD:-openlog}
      POSTGRES_DB: openlog
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlog -d openlog"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Applies the PostgreSQL migrations and idempotently ensures the organization, owner and
  # keys from OPENLOG_BOOTSTRAP_* (development defaults; change them for anything shared).
  bootstrap:
    image: ${OPENLOG_IMAGE:-openlog:dev}
    entrypoint: ["/usr/local/bin/openlog-admin", "bootstrap"]
    environment:
      OPENLOG_LOG_LEVEL: ${OPENLOG_LOG_LEVEL:-info}
      OPENLOG_POSTGRES_DSN: postgres://openlog@postgres:5432/openlog?sslmode=disable
      OPENLOG_POSTGRES_PASSWORD: ${OPENLOG_POSTGRES_PASSWORD:-openlog}
      OPENLOG_BOOTSTRAP_TENANT_ID: ${OPENLOG_BOOTSTRAP_TENANT_ID:-default}
      OPENLOG_BOOTSTRAP_ORG_NAME: ${OPENLOG_BOOTSTRAP_ORG_NAME:-Default}
      OPENLOG_BOOTSTRAP_OWNER_EMAIL: ${OPENLOG_BOOTSTRAP_OWNER_EMAIL:-admin@openlog.local}
      OPENLOG_BOOTSTRAP_OWNER_PASSWORD: ${OPENLOG_BOOTSTRAP_OWNER_PASSWORD:-openlog-dev-password}
      OPENLOG_BOOTSTRAP_OWNER_NAME: ${OPENLOG_BOOTSTRAP_OWNER_NAME:-}
      OPENLOG_BOOTSTRAP_LICENSE_KEY: ${OPENLOG_BOOTSTRAP_LICENSE_KEY:-dev-license-key}
      OPENLOG_BOOTSTRAP_API_KEY: ${OPENLOG_BOOTSTRAP_API_KEY:-}
      # Keys are stored with the same hashing as in `openlog` (D-044).
      OPENLOG_KEY_HASH_SECRET: ${OPENLOG_KEY_HASH_SECRET:-}
      OPENLOG_KEY_HASH_SECRET_PREVIOUS: ${OPENLOG_KEY_HASH_SECRET_PREVIOUS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    # Kafka resolves its own hostname at startup (InetAddress.getLocalHost()). Docker Engine 29+ no longer writes the
    # container hostname into /etc/hosts and its embedded DNS does not answer for it, so the broker would die with
    # "UnknownHostException: kafka". Other containers keep resolving `kafka` to the container IP through Docker DNS.
    extra_hosts:
      - "kafka:127.0.0.1"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: 12582912
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    hostname: clickhouse
    environment:
      CLICKHOUSE_USER: ${OPENLOG_CLICKHOUSE_USER:-openlog}
      CLICKHOUSE_PASSWORD: ${OPENLOG_CLICKHOUSE_PASSWORD:-openlog}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
      # Read-only user `openlog_reader` of api/alert queries (clickhouse/openlog-reader.xml, D-047).
      OPENLOG_CLICKHOUSE_READ_PASSWORD: ${OPENLOG_CLICKHOUSE_READ_PASSWORD:-openlog-read}
      # Tiered storage (docs/operations/tiered-storage.md, D-066), read by clickhouse/storage-tiered.xml once
      # OPENLOG_CLICKHOUSE_STORAGE_CONFIG points at it. Defaults = the local MinIO of profile `tiered`.
      OPENLOG_S3_ENDPOINT: ${OPENLOG_S3_ENDPOINT:-http://minio:9000/openlog-cold/ch-1/}
      OPENLOG_S3_REGION: ${OPENLOG_S3_REGION:-}
      # Empty keys + OPENLOG_S3_USE_ENVIRONMENT_CREDENTIALS=true: IAM role / instance profile / AWS_* variables.
      OPENLOG_S3_ACCESS_KEY_ID: ${OPENLOG_S3_ACCESS_KEY_ID-openlog-minio}
      OPENLOG_S3_SECRET_ACCESS_KEY: ${OPENLOG_S3_SECRET_ACCESS_KEY-openlog-minio-secret}
      OPENLOG_S3_USE_ENVIRONMENT_CREDENTIALS: ${OPENLOG_S3_USE_ENVIRONMENT_CREDENTIALS:-false}
      OPENLOG_S3_CACHE_MAX_SIZE: ${OPENLOG_S3_CACHE_MAX_SIZE:-10Gi}
      OPENLOG_S3_CACHE_PATH: /var/lib/clickhouse/openlog_s3_cache/
      OPENLOG_WARM_PATH: /var/lib/clickhouse-warm/
    volumes:
      - ./clickhouse/openlog-cluster.xml:/etc/clickhouse-server/config.d/openlog-cluster.xml:ro
      - ./clickhouse/openlog-reader.xml:/etc/clickhouse-server/users.d/openlog-reader.xml:ro
      - clickhouse-data:/var/lib/clickhouse
      # Storage policy `openlog_tiered` (./clickhouse/storage-tiered.xml), optional warm volume
      # (./clickhouse/storage-tiered-warm.xml) and S3 credentials file; placeholders while tiering is off.
      - ${OPENLOG_CLICKHOUSE_STORAGE_CONFIG:-./clickhouse/storage-none.xml}:/etc/clickhouse-server/config.d/openlog-storage.xml:ro
      - ${OPENLOG_CLICKHOUSE_STORAGE_WARM_CONFIG:-./clickhouse/storage-none.xml}:/etc/clickhouse-server/config.d/openlog-storage-warm.xml:ro
      - ${OPENLOG_CLICKHOUSE_S3_CREDENTIALS_FILE:-./clickhouse/storage-none.xml}:/etc/clickhouse-server/config.d/zz-openlog-s3-credentials.xml:ro
      - clickhouse-warm:/var/lib/clickhouse-warm
    depends_on:
      # Only with COMPOSE_PROFILES=tiered (local MinIO).
      minio-init:
        condition: service_completed_successfully
        required: false
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_HOST_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  openlog:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${OPENLOG_IMAGE:-openlog:dev}
    # `renderer`: internal network shared only with openlog-renderer (profile renderer, D-097).
    networks: [default, renderer]
    environment:
      <<: *openlog-settings
      OPENLOG_LOG_LEVEL: ${OPENLOG_LOG_LEVEL:-info}
      OPENLOG_KAFKA_BROKERS: kafka:19092
      OPENLOG_CLICKHOUSE_ADDR: clickhouse:9000
      OPENLOG_CLICKHOUSE_USER: ${OPENLOG_CLICKHOUSE_USER:-openlog}
      OPENLOG_CLICKHOUSE_PASSWORD: ${OPENLOG_CLICKHOUSE_PASSWORD:-openlog}
      # api/alert tenant queries run as the read-only user (clickhouse/openlog-reader.xml, D-047).
      OPENLOG_CLICKHOUSE_READ_USER: openlog_reader
      OPENLOG_CLICKHOUSE_READ_PASSWORD: ${OPENLOG_CLICKHOUSE_READ_PASSWORD:-openlog-read}
      OPENLOG_CLICKHOUSE_CLUSTER: openlog
      # Tiered storage moves applied by the migrations on start (docs/operations/tiered-storage.md). Requires the
      # ClickHouse storage policy above (OPENLOG_CLICKHOUSE_STORAGE_CONFIG). Days: 0 = no move for that class.
      OPENLOG_STORAGE_TIERING_ENABLED: ${OPENLOG_STORAGE_TIERING_ENABLED:-false}
      OPENLOG_STORAGE_COLD_AFTER_DAYS_METRICS: ${OPENLOG_STORAGE_COLD_AFTER_DAYS_METRICS:-7}
      OPENLOG_STORAGE_COLD_AFTER_DAYS_METRICS_1M: ${OPENLOG_STORAGE_COLD_AFTER_DAYS_METRICS_1M:-30}
      OPENLOG_STORAGE_COLD_AFTER_DAYS_LOGS: ${OPENLOG_STORAGE_COLD_AFTER_DAYS_LOGS:-3}
      OPENLOG_STORAGE_COLD_AFTER_DAYS_TRACES: ${OPENLOG_STORAGE_COLD_AFTER_DAYS_TRACES:-3}
      OPENLOG_STORAGE_COLD_AFTER_DAYS_APM: ${OPENLOG_STORAGE_COLD_AFTER_DAYS_APM:-7}
      OPENLOG_STORAGE_COLD_AFTER_DAYS_ALERTS: ${OPENLOG_STORAGE_COLD_AFTER_DAYS_ALERTS:-7}
      OPENLOG_STORAGE_WARM_AFTER_DAYS_METRICS: ${OPENLOG_STORAGE_WARM_AFTER_DAYS_METRICS:-0}
      OPENLOG_STORAGE_WARM_AFTER_DAYS_METRICS_1M: ${OPENLOG_STORAGE_WARM_AFTER_DAYS_METRICS_1M:-0}
      OPENLOG_STORAGE_WARM_AFTER_DAYS_LOGS: ${OPENLOG_STORAGE_WARM_AFTER_DAYS_LOGS:-0}
      OPENLOG_STORAGE_WARM_AFTER_DAYS_TRACES: ${OPENLOG_STORAGE_WARM_AFTER_DAYS_TRACES:-0}
      OPENLOG_STORAGE_WARM_AFTER_DAYS_APM: ${OPENLOG_STORAGE_WARM_AFTER_DAYS_APM:-0}
      OPENLOG_STORAGE_WARM_AFTER_DAYS_ALERTS: ${OPENLOG_STORAGE_WARM_AFTER_DAYS_ALERTS:-0}
      OPENLOG_AUTH_MODE: ${OPENLOG_AUTH_MODE:-postgres}
      OPENLOG_POSTGRES_DSN: postgres://openlog@postgres:5432/openlog?sslmode=disable
      OPENLOG_POSTGRES_PASSWORD: ${OPENLOG_POSTGRES_PASSWORD:-openlog}
      # Plain HTTP on localhost: the session cookie cannot be Secure. Use true behind TLS.
      OPENLOG_COOKIE_SECURE: ${OPENLOG_COOKIE_SECURE:-false}
      OPENLOG_SIGNUP_ENABLED: ${OPENLOG_SIGNUP_ENABLED:-false}
      OPENLOG_AUTH_CACHE_TTL: ${OPENLOG_AUTH_CACHE_TTL:-60s}
      # Only used with OPENLOG_AUTH_MODE=static.
      OPENLOG_LICENSE_KEYS: ${OPENLOG_LICENSE_KEYS:-dev-license-key=default}
      OPENLOG_MIGRATE_ON_START: "true"
      OPENLOG_KAFKA_PARTITIONS: ${OPENLOG_KAFKA_PARTITIONS:-6}
      OPENLOG_KAFKA_REPLICATION_FACTOR: "1"
      OPENLOG_KAFKA_MIN_INSYNC_REPLICAS: ${OPENLOG_KAFKA_MIN_INSYNC_REPLICAS:-1}
      OPENLOG_KAFKA_RETENTION_MS: ${OPENLOG_KAFKA_RETENTION_MS:-86400000}
      OPENLOG_KAFKA_MAX_MESSAGE_BYTES: ${OPENLOG_KAFKA_MAX_MESSAGE_BYTES:-12582912}
      # Release check (UI banner) and agent fleet updates (docs/contracts/config.md).
      OPENLOG_UPDATE_CHECK: ${OPENLOG_UPDATE_CHECK:-enabled}
      OPENLOG_UPDATE_CHECK_INTERVAL: ${OPENLOG_UPDATE_CHECK_INTERVAL:-24h}
      OPENLOG_UPDATE_CHANNEL: ${OPENLOG_UPDATE_CHANNEL:-stable}
      OPENLOG_RELEASE_INDEX_URL: ${OPENLOG_RELEASE_INDEX_URL:-https://github.com/onuragtas/openlog/releases/latest/download/index.json}
      OPENLOG_RELEASE_TRUSTED_KEYS_FILE: ${OPENLOG_RELEASE_TRUSTED_KEYS_FILE:-}
      # Local release mirror (air-gapped): set to /releases, the mount below.
      OPENLOG_RELEASE_MIRROR_DIR: ${OPENLOG_RELEASE_MIRROR_DIR:-}
      OPENLOG_RELEASE_SERVE_MIRROR: ${OPENLOG_RELEASE_SERVE_MIRROR:-false}
      OPENLOG_RELEASE_MIRROR_BASE_URL: ${OPENLOG_RELEASE_MIRROR_BASE_URL:-}
      OPENLOG_RELEASE_CATALOG_REFRESH: ${OPENLOG_RELEASE_CATALOG_REFRESH:-15m}
      OPENLOG_FLEET_SYNC_INTERVAL: ${OPENLOG_FLEET_SYNC_INTERVAL:-300s}
      OPENLOG_FLEET_CONTROLLER_INTERVAL: ${OPENLOG_FLEET_CONTROLLER_INTERVAL:-30s}
      # CORS for browser OTLP senders on :4318, e.g. https://app.example.com,https://*.example.com (empty = off).
      OPENLOG_INGEST_CORS_ALLOWED_ORIGINS: ${OPENLOG_INGEST_CORS_ALLOWED_ORIGINS:-}
      # Tail-based sampling (docs/operations/tail-sampling.md, D-075): runs in this process when true. Policies per
      # organization in Settings -> APM sampling; the default policy (JSON) applies to organizations without one.
      OPENLOG_TAILSAMPLING_ENABLED: ${OPENLOG_TAILSAMPLING_ENABLED:-false}
      OPENLOG_TAILSAMPLING_DECISION_WAIT: ${OPENLOG_TAILSAMPLING_DECISION_WAIT:-30s}
      OPENLOG_TAILSAMPLING_MAX_BUFFERED_BYTES: ${OPENLOG_TAILSAMPLING_MAX_BUFFERED_BYTES:-268435456}
      OPENLOG_TAILSAMPLING_DEFAULT_POLICY: ${OPENLOG_TAILSAMPLING_DEFAULT_POLICY:-}
      # Alerting (docs/contracts/alerting.md, config.md "openlog-alert"). The evaluator and dispatcher run in this
      # process unless OPENLOG_ALERT_ENABLED=false (then run the `openlog-alert` service below).
      # Notification channels need OPENLOG_SECRETS_KEY (openssl rand -base64 32); keep it with your backups.
      OPENLOG_ALERT_ENABLED: ${OPENLOG_ALERT_ENABLED:-true}
      OPENLOG_SECRETS_KEY: ${OPENLOG_SECRETS_KEY:-}
      OPENLOG_SECRETS_KEY_PREVIOUS: ${OPENLOG_SECRETS_KEY_PREVIOUS:-}
      OPENLOG_PUBLIC_URL: ${OPENLOG_PUBLIC_URL:-http://localhost:8080}
      OPENLOG_ALERT_EVALUATION_DELAY: ${OPENLOG_ALERT_EVALUATION_DELAY:-15s}
      OPENLOG_ALERT_BLOCK_PRIVATE_DESTINATIONS: ${OPENLOG_ALERT_BLOCK_PRIVATE_DESTINATIONS:-false}
      OPENLOG_SMTP_HOST: ${OPENLOG_SMTP_HOST:-}
      OPENLOG_SMTP_PORT: ${OPENLOG_SMTP_PORT:-587}
      OPENLOG_SMTP_USERNAME: ${OPENLOG_SMTP_USERNAME:-}
      OPENLOG_SMTP_PASSWORD: ${OPENLOG_SMTP_PASSWORD:-}
      OPENLOG_SMTP_FROM: ${OPENLOG_SMTP_FROM:-}
      OPENLOG_SMTP_TLS: ${OPENLOG_SMTP_TLS:-starttls}
      OPENLOG_SMTP_INSECURE_SKIP_VERIFY: ${OPENLOG_SMTP_INSECURE_SKIP_VERIFY:-false}
    volumes:
      # Release mirror and trusted keys files (read-only). Empty unless you put releases there.
      - ${OPENLOG_RELEASE_HOST_DIR:-./releases}:/releases:ro
      # Data export archives (OPENLOG_DATA_EXPORT_LOCAL_PATH); kept across container recreation.
      - data-exports:/var/lib/openlog/exports
    ports:
      - "${OPENLOG_OTLP_GRPC_PORT:-4317}:4317"
      - "${OPENLOG_OTLP_HTTP_PORT:-4318}:4318"
      - "${OPENLOG_API_PORT:-8080}:8080"
      - "${OPENLOG_ADMIN_PORT:-9464}:9464"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9464/readyz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    stop_grace_period: 40s
    restart: unless-stopped

  # Optional synthetic load: docker compose --profile loadgen up -d loadgen
  loadgen:
    profiles: ["loadgen"]
    image: ${OPENLOG_IMAGE:-openlog:dev}
    entrypoint: ["/usr/local/bin/openlog-loadgen"]
    command: ["-endpoint", "http://openlog:4318", "-license-key", "${OPENLOG_LOADGEN_KEY:-dev-license-key}", "-hosts", "10"]
    depends_on:
      openlog:
        condition: service_healthy

  # Optional dedicated alert evaluators (docs/contracts/alerting.md §4: rules are shared through PostgreSQL leases):
  #   OPENLOG_ALERT_ENABLED=false docker compose --profile alert up -d --scale openlog-alert=3
  openlog-alert:
    profiles: ["alert"]
    image: ${OPENLOG_IMAGE:-openlog:dev}
    entrypoint: ["/usr/local/bin/openlog-alert"]
    environment:
      <<: *openlog-settings
      OPENLOG_LOG_LEVEL: ${OPENLOG_LOG_LEVEL:-info}
      OPENLOG_CLICKHOUSE_ADDR: clickhouse:9000
      OPENLOG_CLICKHOUSE_USER: ${OPENLOG_CLICKHOUSE_USER:-openlog}
      OPENLOG_CLICKHOUSE_PASSWORD: ${OPENLOG_CLICKHOUSE_PASSWORD:-openlog}
      # api/alert tenant queries run as the read-only user (clickhouse/openlog-reader.xml, D-047).
      OPENLOG_CLICKHOUSE_READ_USER: openlog_reader
      OPENLOG_CLICKHOUSE_READ_PASSWORD: ${OPENLOG_CLICKHOUSE_READ_PASSWORD:-openlog-read}
      OPENLOG_CLICKHOUSE_CLUSTER: openlog
      OPENLOG_AUTH_MODE: postgres
      OPENLOG_POSTGRES_DSN: postgres://openlog@postgres:5432/openlog?sslmode=disable
      OPENLOG_POSTGRES_PASSWORD: ${OPENLOG_POSTGRES_PASSWORD:-openlog}
      OPENLOG_SECRETS_KEY: ${OPENLOG_SECRETS_KEY:-}
      OPENLOG_SECRETS_KEY_PREVIOUS: ${OPENLOG_SECRETS_KEY_PREVIOUS:-}
      OPENLOG_PUBLIC_URL: ${OPENLOG_PUBLIC_URL:-http://localhost:8080}
      OPENLOG_ALERT_EVALUATION_DELAY: ${OPENLOG_ALERT_EVALUATION_DELAY:-15s}
      OPENLOG_ALERT_BLOCK_PRIVATE_DESTINATIONS: ${OPENLOG_ALERT_BLOCK_PRIVATE_DESTINATIONS:-false}
      OPENLOG_SMTP_HOST: ${OPENLOG_SMTP_HOST:-}
      OPENLOG_SMTP_PORT: ${OPENLOG_SMTP_PORT:-587}
      OPENLOG_SMTP_USERNAME: ${OPENLOG_SMTP_USERNAME:-}
      OPENLOG_SMTP_PASSWORD: ${OPENLOG_SMTP_PASSWORD:-}
      OPENLOG_SMTP_FROM: ${OPENLOG_SMTP_FROM:-}
      OPENLOG_SMTP_TLS: ${OPENLOG_SMTP_TLS:-starttls}
      OPENLOG_SMTP_INSECURE_SKIP_VERIFY: ${OPENLOG_SMTP_INSECURE_SKIP_VERIFY:-false}
    depends_on:
      # `openlog` applies the migrations on start.
      openlog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9464/readyz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    # Running evaluations (query timeout) and deliveries (delivery timeout) finish before leases are released.
    stop_grace_period: 40s
    restart: unless-stopped

  # Optional automatic updates (docs/operations/upgrading.md):
  #   docker compose --profile updater up -d openlog-updater
  # notify (default): report new releases in the UI and GET /api/v1/version.
  # auto: pg_dump backup -> pull the signed image digest -> openlog-migrate -> recreate `openlog`
  #       -> health check -> automatic rollback to the previous container on failure.
  # It controls Docker through the socket (root-equivalent) and runs as root for that reason.
  openlog-updater:
    profiles: ["updater"]
    image: ${OPENLOG_UPDATER_IMAGE:-${OPENLOG_IMAGE:-openlog:dev}}
    entrypoint: ["/usr/local/bin/openlog-updater"]
    user: "0:0"
    environment:
      OPENLOG_LOG_LEVEL: ${OPENLOG_LOG_LEVEL:-info}
      OPENLOG_UPDATER_MODE: ${OPENLOG_UPDATER_MODE:-notify}
      OPENLOG_UPDATE_CHANNEL: ${OPENLOG_UPDATE_CHANNEL:-stable}
      OPENLOG_RELEASE_INDEX_URL: ${OPENLOG_RELEASE_INDEX_URL:-https://github.com/onuragtas/openlog/releases/latest/download/index.json}
      OPENLOG_RELEASE_TRUSTED_KEYS_FILE: ${OPENLOG_RELEASE_TRUSTED_KEYS_FILE:-}
      OPENLOG_UPDATER_INTERVAL: ${OPENLOG_UPDATER_INTERVAL:-1h}
      # "Check now" / "Update now" in the UI: how often update_requests in PostgreSQL are polled.
      OPENLOG_UPDATER_REQUEST_POLL: ${OPENLOG_UPDATER_REQUEST_POLL:-10s}
      OPENLOG_UPDATER_MAINTENANCE_WINDOW: ${OPENLOG_UPDATER_MAINTENANCE_WINDOW:-}
      OPENLOG_UPDATER_HEALTH_TIMEOUT: ${OPENLOG_UPDATER_HEALTH_TIMEOUT:-5m}
      OPENLOG_UPDATER_BACKUP_KEEP: ${OPENLOG_UPDATER_BACKUP_KEEP:-5}
      OPENLOG_UPDATER_ENV_FILE: /compose/.env
      # auto: an install-server.sh installation (.bundle-version) gets the verified compose files of the installed
      # version; off: the compose files are never changed. Other installations are never changed (a notice reports
      # compose files older than the running version).
      OPENLOG_UPDATER_COMPOSE_SYNC: ${OPENLOG_UPDATER_COMPOSE_SYNC:-auto}
      # After a successful update the updater replaces its own container with the installed image (verified handover,
      # the previous updater stays until the new one took over; docs/operations/upgrading.md "Updater self-update").
      # auto: install-server.sh installations (.bundle-version) only; on: every Compose installation; off: only the
      # notice updater_outdated.
      OPENLOG_UPDATER_SELF_UPDATE: ${OPENLOG_UPDATER_SELF_UPDATE:-auto}
      OPENLOG_POSTGRES_DSN: postgres://openlog@postgres:5432/openlog?sslmode=disable
      OPENLOG_POSTGRES_PASSWORD: ${OPENLOG_POSTGRES_PASSWORD:-openlog}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENLOG_UPDATER_BACKUP_DIR:-./backups}:/backups
      # The project directory: OPENLOG_IMAGE in .env follows the running version, the recreated containers get the
      # settings of .env, and install-server.sh installations get the compose files of the running version.
      - ./:/compose
      # Same path as in `openlog`, so OPENLOG_RELEASE_TRUSTED_KEYS_FILE=/releases/... works for both.
      - ${OPENLOG_RELEASE_HOST_DIR:-./releases}:/releases:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional local S3 for tiered storage (docs/operations/tiered-storage.md): COMPOSE_PROFILES=tiered together with
  # OPENLOG_CLICKHOUSE_STORAGE_CONFIG=./clickhouse/storage-tiered.xml and OPENLOG_STORAGE_TIERING_ENABLED=true.
  # For testing only; production uses a real bucket (OPENLOG_S3_ENDPOINT) without this profile.
  minio:
    profiles: ["tiered"]
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    hostname: minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${OPENLOG_S3_ACCESS_KEY_ID:-openlog-minio}
      MINIO_ROOT_PASSWORD: ${OPENLOG_S3_SECRET_ACCESS_KEY:-openlog-minio-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio-init:
    profiles: ["tiered"]
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb -p local/openlog-cold
    environment:
      MINIO_ROOT_USER: ${OPENLOG_S3_ACCESS_KEY_ID:-openlog-minio}
      MINIO_ROOT_PASSWORD: ${OPENLOG_S3_SECRET_ACCESS_KEY:-openlog-minio-secret}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Optional PNG widget images in scheduled report e-mails (docs/operations/reports.md, D-097):
  #   docker compose --profile renderer up -d --build openlog-renderer
  # then set OPENLOG_RENDERER_URL=http://openlog-renderer:8090 and OPENLOG_RENDERER_TOKEN in .env and recreate
  # `openlog` (render tokens are signed with OPENLOG_KEY_HASH_SECRET or OPENLOG_SECRETS_KEY). Headless Chromium runs
  # without its namespace sandbox, so the container is locked down: non-root, read-only, no capabilities, no new
  # privileges, memory/pids limits, and only the internal `renderer` network (no route to the internet or other
  # services; it reaches `openlog` only).
  openlog-renderer:
    profiles: ["renderer"]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: renderer
    image: ${OPENLOG_RENDERER_IMAGE:-openlog-renderer:dev}
    networks: [renderer]
    environment:
      OPENLOG_LOG_LEVEL: ${OPENLOG_LOG_LEVEL:-info}
      OPENLOG_RENDERER_ADDR: ":8090"
      OPENLOG_RENDERER_UI_ORIGIN: http://openlog:8080
      OPENLOG_RENDERER_TOKEN: ${OPENLOG_RENDERER_TOKEN:-}
      OPENLOG_RENDERER_MAX_CONCURRENCY: ${OPENLOG_RENDERER_MAX_CONCURRENCY:-2}
      OPENLOG_RENDERER_RENDER_TIMEOUT: ${OPENLOG_RENDERER_RENDER_TIMEOUT:-60s}
      OPENLOG_RENDERER_QUEUE_TIMEOUT: ${OPENLOG_RENDERER_QUEUE_TIMEOUT:-30s}
      OPENLOG_RENDERER_MAX_IMAGE_BYTES: ${OPENLOG_RENDERER_MAX_IMAGE_BYTES:-1048576}
      OPENLOG_RENDERER_CHROMIUM_PATH: ${OPENLOG_RENDERER_CHROMIUM_PATH:-}
      OPENLOG_RENDERER_CHROMIUM_NO_SANDBOX: ${OPENLOG_RENDERER_CHROMIUM_NO_SANDBOX:-true}
      OPENLOG_RENDERER_TLS_CERT_FILE: ${OPENLOG_RENDERER_TLS_CERT_FILE:-}
      OPENLOG_RENDERER_TLS_KEY_FILE: ${OPENLOG_RENDERER_TLS_KEY_FILE:-}
      OPENLOG_RENDERER_TLS_CA_FILE: ${OPENLOG_RENDERER_TLS_CA_FILE:-}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9464/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 70s
    restart: unless-stopped

networks:
  default:
  # No external connectivity: openlog <-> openlog-renderer only.
  renderer:
    internal: true

volumes:
  kafka-data:
  clickhouse-data:
  clickhouse-warm:
  postgres-data:
  minio-data:
  data-exports:
