# =============================================================================
# openlog Helm chart - `cluster` deployment profile
#
# Contracts this chart implements:
#   docs/contracts/config.md  (environment variables, ports, admin endpoints)
#   docs/contracts/kafka.md   (topics, partitions, RF, min ISR, retention)
#   schema/clickhouse/*.sql   ({cluster}/{shard}/{replica} macros, Distributed tables)
#
# Services are stateless; all state lives in Kafka and ClickHouse. Scale any
# service by adding replicas (processor replicas are bounded by Kafka partitions).
# =============================================================================

nameOverride: ""
# Keep short: operator-generated pods append suffixes (e.g. chi-<name>-openlog-0-0-0).
fullnameOverride: ""
# Extra labels added to every chart-managed resource.
commonLabels: {}

# One image contains every binary: /usr/local/bin/openlog-{ingest,processor,api,migrate,allinone}.
image:
  repository: ghcr.io/onuragtas/openlog
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# OPENLOG_LOG_LEVEL for all services (debug | info | warn | error). Components may override.
logLevel: info

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Applied to every openlog pod (ingest, processor, api, migrate, envoy uses its own below).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

# Extra env vars appended to every openlog container (list of EnvVar).
extraEnv: []

# Settings (docs/contracts/config.md) rendered as env into every openlog component: ingest, processor, api, alert,
# sampler and migrate. A component's own `config` wins for the same name; "" keeps the documented default. Secrets
# never go here (see auth.*, alert.* and bootstrap.* for Secret-backed values). internal/config/envcoverage_test.go
# fails when a configuration variable is not settable through this chart.
config:
  # Usage, plans and quotas (docs/contracts/usage.md, docs/operations/saas.md). SaaS mode must match on ingest, api
  # and migrate.
  OPENLOG_SAAS_MODE: "false"
  # Plan catalog JSON, or a file mounted through extraVolumes/extraEnv.
  OPENLOG_PLANS: ""
  OPENLOG_PLANS_FILE: ""
  OPENLOG_DEFAULT_PLAN: ""
  # "" = OPENLOG_SAAS_MODE.
  OPENLOG_QUOTA_RETENTION_ENABLED: ""
  # Agent fleet release catalog (ingest and api).
  OPENLOG_RELEASE_CATALOG_REFRESH: "15m"
  OPENLOG_RELEASE_MIRROR_DIR: ""
  OPENLOG_RELEASE_SERVE_MIRROR: "false"
  OPENLOG_RELEASE_MIRROR_BASE_URL: ""
  # Late-span APM re-link (processor enqueues, api re-links; apm.md §6). "" after = OPENLOG_APM_LINK_LOOKBACK.
  OPENLOG_APM_RELINK_ENABLED: "true"
  OPENLOG_APM_RELINK_AFTER: ""
  OPENLOG_APM_RELINK_MAX_AGE: "168h"
  # Real user monitoring (rum.md, D-136): POST /v1/rum on ingest and the /api/v1/rum/* reads. Read by both
  # ingest and api, so it lives here rather than in one component's config.
  OPENLOG_RUM_ENABLED: "true"

# Default scheduling policy for ingest / processor / api / envoy pods.
scheduling:
  # soft | hard | none. Ignored for a component that sets its own `affinity`.
  podAntiAffinity: soft
  topologySpread:
    enabled: true
    maxSkew: 1
    # ScheduleAnyway keeps small (k3d) clusters schedulable; use DoNotSchedule in prod if desired.
    whenUnsatisfiable: ScheduleAnyway
    # Also spread across topology.kubernetes.io/zone.
    zones: false

metrics:
  # Adds prometheus.io/scrape|port|path annotations (admin server :9464 /metrics).
  podAnnotations: true
  # Prometheus Operator ServiceMonitor (requires monitoring.coreos.com CRDs).
  serviceMonitor:
    enabled: false
    namespace: ""
    labels: {}
    interval: 30s
    scrapeTimeout: 10s

# -----------------------------------------------------------------------------
# Credentials
# -----------------------------------------------------------------------------
auth:
  # OPENLOG_AUTH_MODE.
  #   postgres - organizations (tenants), users, sessions, ingest license keys and API keys
  #              in PostgreSQL (see `postgres`). Manage keys and members in the web UI.
  #   static   - development/tests only: ingest and api accept auth.licenseKeys, no users,
  #              no UI sign-in, no PostgreSQL.
  mode: postgres
  # Use an existing Secret instead of the chart-generated one. It must contain the
  # keys below that apply. In `operators` mode the ClickHouseInstallation also reads the
  # password from this Secret.
  existingSecret: ""
  clickhousePasswordKey: clickhouse-password
  # With existingSecret: key holding the password of clickhouse.readUser (empty = the read user is not
  # used and api/alert query as clickhouse.user). The chart-generated Secret uses clickhouse-read-password.
  clickhouseReadPasswordKey: ""
  licenseKeysKey: license-keys
  # postgres.mode=external: key holding OPENLOG_POSTGRES_DSN.
  postgresDsnKey: postgres-dsn
  # auth.mode=static only: OPENLOG_LICENSE_KEYS, "key1=tenant1,key2=tenant2". Ignored with existingSecret.
  licenseKeys: ""
  # openlog-api user sessions (server-side in PostgreSQL; HttpOnly SameSite=Strict cookie).
  session:
    ttl: 168h
    idleTimeout: 24h
    # Keep true behind TLS. false only for plain-HTTP development clusters.
    cookieSecure: true
    cookieDomain: ""
  # Self-service sign-up (POST /api/v1/auth/signup), for SaaS.
  signupEnabled: false
  # Failed password checks per (email, client IP) within the window before 429.
  login:
    maxFailures: 10
    window: 15m
  invitationTTL: 168h
  # CIDRs of ingress controllers / proxies whose X-Forwarded-For is trusted (client IP for
  # rate limiting and the audit log). Empty = TCP peer address.
  trustedProxies: []
  # openlog-ingest license key cache. A revoked key keeps working for up to `ttl`;
  # cached keys keep working for `maxStale` while PostgreSQL is unreachable.
  cache:
    ttl: 60s
    negativeTTL: 10s
    maxStale: 15m
  # OPENLOG_KEY_HASH_SECRET(_PREVIOUS) of ingest, api and the bootstrap Job (D-044; >= 32 bytes, `openssl rand -base64
  # 48`, same value everywhere, keep it with your backups). Stored in the chart Secret, or read from auth.existingSecret
  # under the *Key names.
  keyHashSecret: ""
  keyHashSecretKey: key-hash-secret
  keyHashSecretPrevious: ""
  keyHashSecretPreviousKey: key-hash-secret-previous
  # OPENLOG_SSO_SECRET_KEY(_PREVIOUS) of the api (>= 32 bytes; empty = derived from keyHashSecret).
  ssoSecretKey: ""
  ssoSecretKeyKey: sso-secret-key
  ssoSecretKeyPrevious: ""
  ssoSecretKeyPreviousKey: sso-secret-key-previous
  # OPENLOG_SIGNUP_CAPTCHA_SECRET of the api (provider and site key: api.config).
  captchaSecret: ""
  captchaSecretKey: signup-captcha-secret
  # OPENLOG_DATA_EXPORT_S3_SECRET_ACCESS_KEY of data export archives (api.config OPENLOG_DATA_EXPORT_*; D-107).
  dataExportS3SecretAccessKey: ""
  dataExportS3SecretAccessKeyKey: data-export-s3-secret-access-key

# -----------------------------------------------------------------------------
# PostgreSQL (auth.mode=postgres; docs/contracts/postgres.md)
# -----------------------------------------------------------------------------
postgres:
  # external - you provide PostgreSQL >= 16 (postgres.external.dsn, or auth.existingSecret
  #            with auth.postgresDsnKey).
  # operator - the chart renders a CloudNativePG `Cluster`; the CloudNativePG operator must
  #            already be installed. The DSN comes from the Secret <name>-app that CNPG creates.
  mode: external
  # OPENLOG_POSTGRES_MAX_CONNS per ingest/api pod.
  maxConns: 10
  external:
    # Stored in the chart Secret. REPLACE this placeholder. The password may be omitted here
    # and given through passwordSecret instead.
    dsn: "postgres://openlog@postgres.postgres.svc:5432/openlog?sslmode=require"
    # Optional Secret with the password only (OPENLOG_POSTGRES_PASSWORD overrides the DSN's).
    passwordSecret:
      name: ""
      key: password
  # Server verification / client certificates (OPENLOG_POSTGRES_TLS_*). sslmode stays in the DSN:
  # production = sslmode=verify-full with caSecret. Applies to both postgres modes (CNPG: its
  # <name>-ca Secret, key ca.crt, signs the server certificate).
  tls:
    caSecret:
      name: ""
      key: ca.crt
    clientSecret:
      name: ""
      certKey: tls.crt
      keyKey: tls.key
  operator:
    # Cluster name; defaults to <fullname>-pg. Services: <name>-rw (primary), <name>-ro.
    name: ""
    # 1 for development, 3 for production (synchronous failover needs >= 2).
    instances: 3
    imageName: ghcr.io/cloudnative-pg/postgresql:16
    database: openlog
    owner: openlog
    storage:
      size: 20Gi
      storageClass: ""
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 1Gi}
    # spec.smartShutdownTimeout: seconds a stopping instance waits for clients before a fast shutdown. openlog pods keep
    # pooled connections, so the CNPG default (180) delayed the failover after deleting/draining the primary by ~3 min.
    smartShutdownTimeout: 15
    # spec.postgresql.parameters, e.g. {max_connections: "300"}
    parameters: {}
    # spec.affinity (default: soft anti-affinity on kubernetes.io/hostname).
    affinity: {}
    # spec.backup (barmanObjectStore ...). Strongly recommended in production.
    backup: {}

# -----------------------------------------------------------------------------
# Dependencies
# -----------------------------------------------------------------------------
dependencies:
  # external  - you provide Kafka brokers and ClickHouse addresses (kafka.external,
  #             clickhouse.external). openlog-migrate creates the Kafka topics.
  # operators - the chart renders Strimzi (Kafka, KafkaNodePool, KafkaTopic) and
  #             Altinity (ClickHouseInstallation, ClickHouseKeeperInstallation)
  #             custom resources. The operators must already be installed
  #             (see README). OPENLOG_MIGRATE_SKIP_KAFKA=true is set automatically.
  mode: external

kafka:
  # OPENLOG_KAFKA_TOPIC_PREFIX. Topics: <prefix>.otlp.{metrics,logs,traces}.v1
  topicPrefix: openlog
  topics:
    # external mode: openlog-migrate creates missing topics with all settings below
    #   (OPENLOG_KAFKA_PARTITIONS / _REPLICATION_FACTOR / _MIN_INSYNC_REPLICAS / _RETENTION_MS /
    #   _MAX_MESSAGE_BYTES). Existing topics are left unchanged.
    # operators mode: KafkaTopic CRs are rendered. false = you manage topics.
    create: true
    # kafka.md cluster profile: 48. Processor replicas (and HPA maxReplicas) must be <= this.
    # Partitions can be increased later but never decreased (see docs/operations/scaling.md).
    partitions: 48
    replicationFactor: 3
    minInsyncReplicas: 2
    retentionMs: 86400000
    maxMessageBytes: 12582912
    # Additional topic-level config for KafkaTopic CRs (operators mode).
    extraConfig: {}

  external:
    # Bootstrap brokers. Required in external mode - REPLACE this placeholder.
    # Use the port of an SSL / SASL_SSL listener together with kafka.tls / kafka.sasl.
    brokers:
      - kafka-bootstrap.kafka.svc:9092

  # TLS to the brokers (OPENLOG_KAFKA_TLS_*). Enabled automatically with
  # kafka.strimzi.listener.tls in operators mode (CA = Secret <name>-cluster-ca-cert).
  tls:
    enabled: false
    # Secret holding the CA bundle that signs the broker certificates (empty = system roots).
    caSecret:
      name: ""
      key: ca.crt
    # Secret with a client certificate for mutual TLS (e.g. a cert-manager Certificate).
    clientSecret:
      name: ""
      certKey: tls.crt
      keyKey: tls.key
    # Name verified in broker certificates; empty = each broker's host.
    serverName: ""
    # Testing only.
    insecureSkipVerify: false
  # SASL (OPENLOG_KAFKA_SASL_*); set automatically for kafka.strimzi.listener.authentication=scram-sha-512.
  sasl:
    # "" | PLAIN | SCRAM-SHA-256 | SCRAM-SHA-512. Combine with kafka.tls (SASL_SSL); PLAIN without TLS sends the password in clear.
    mechanism: ""
    username: ""
    passwordSecret:
      name: ""
      key: password

  # Used only when dependencies.mode=operators. Tested against Strimzi 1.2.0 (KRaft only).
  strimzi:
    # Strimzi >= 1.0 serves only kafka.strimzi.io/v1 (v1beta2 CRs are rejected).
    # Set kafka.strimzi.io/v1beta2 for Strimzi 0.46 - 0.48.
    apiVersion: kafka.strimzi.io/v1
    # Kafka CR name; defaults to the release fullname. Bootstrap: <name>-kafka-bootstrap:<listenerPort>
    name: ""
    # Kafka version; empty = the operator's default.
    version: ""
    metadataVersion: ""
    # Use 9093 (Strimzi's conventional TLS port) together with listener.tls=true.
    listenerPort: 9092
    # The internal listener used by openlog services.
    listener:
      # true: TLS listener (cluster CA); openlog gets OPENLOG_KAFKA_TLS_* with the CA Secret mounted.
      tls: false
      # "" (none) | scram-sha-512 (SASL; with tls=true that is SASL_SSL) | tls (mutual TLS, requires tls=true).
      # Renders a KafkaUser and enables the User Operator; openlog reads the credentials from its Secret.
      authentication: ""
      # KafkaUser name; default <kafka name>-openlog.
      user: ""
    # Broker config. Defaults match docs/contracts/kafka.md (cluster profile).
    config:
      auto.create.topics.enable: false
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      message.max.bytes: 12582912
      replica.fetch.max.bytes: 12582912
    # KRaft node pools. At least one pool needs the controller role; the sum of
    # broker-role replicas must be >= kafka.topics.replicationFactor.
    nodePools:
      - name: dual
        replicas: 3
        roles: [controller, broker]
        storage:
          size: 50Gi
          storageClass: ""
          deleteClaim: false
        resources:
          requests: {cpu: "1", memory: 4Gi}
          limits: {memory: 4Gi}
        jvmOptions: {}
        # Strimzi PodTemplate fields.
        affinity: {}
        tolerations: []
        topologySpreadConstraints: []
    entityOperator:
      topicOperator:
        resources: {}
    # Consumer-lag exporter (kafka_consumergroup_lag) - recommended for scaling processor.
    kafkaExporter:
      enabled: false
    # Needed for KafkaRebalance after adding brokers.
    cruiseControl:
      enabled: false

clickhouse:
  # The database is always `openlog` (OPENLOG_CLICKHOUSE_DATABASE is fixed by contract, D-015)
  # and is not configurable. Native TLS: see clickhouse.tls.
  # OPENLOG_CLICKHOUSE_CLUSTER and (operators mode) the CHI cluster name; the schema uses
  # the {cluster} macro which the Altinity operator sets to this name.
  cluster: openlog
  # Empty = "openlog" in operators mode (user created by the CHI), "default" in external mode.
  user: ""
  # Empty in operators mode = random, preserved across upgrades via lookup. Ignored with existingSecret.
  password: ""
  # Read-only user of api and alert tenant queries (OPENLOG_CLICKHOUSE_READ_*, D-047): settings profile
  # readonly=2 and SELECT on openlog.* only; migrate, processor, APM edge linking and alert evaluation
  # history keep clickhouse.user.
  #   operators mode: created in the CHI; password random (preserved) unless readUser.password is set.
  #   external mode: create the user yourself (docs/contracts/config.md) and set readUser.password or
  #                  auth.existingSecret + auth.clickhouseReadPasswordKey; otherwise pods query as clickhouse.user.
  readUser:
    enabled: true
    name: openlog_reader
    password: ""
  # Per-tenant limits of every api/alert query (OPENLOG_QUERY_*; 0 = the ClickHouse profile's value).
  # Exceeding them answers 422 resource_exhausted.
  queryLimits:
    maxMemoryUsage: 2147483648
    maxRowsToRead: 2000000000
    maxBytesToRead: 0
    # Overrides: "tenant:max_memory_usage=8589934592;max_rows_to_read=0,tenant2:max_bytes_to_read=0".
    tenantLimits: ""

  # Tiered storage (D-066, docs/operations/tiered-storage.md): parts older than the class's age move from the local
  # data disk (volume `default`) to an optional warm disk and to S3 (volume `cold`); retention is unchanged.
  # openlog-migrate switches the tables to `policy` and adds the TTL moves (OPENLOG_STORAGE_*).
  #   operators mode: the chart adds the storage policy, S3 disk, cache and warm volume to the CHI (s3/warm below).
  #   external mode:  configure storage_configuration on every ClickHouse server yourself (see the doc), then enable.
  tieredStorage:
    enabled: false
    policy: openlog_tiered
    # Days after which parts move to S3; 0 = never. Must be below the retention (metrics 30, metrics_1m 395, logs 14,
    # traces 7, apm OPENLOG_APM_RETENTION_DAYS, alerts 30, rum 30), otherwise the move is left out.
    coldAfterDays:
      metrics: 7
      metrics_1m: 30
      logs: 3
      traces: 3
      apm: 7
      alerts: 7
      rum: 7
    # Days after which parts move to the warm volume (requires warm.enabled), e.g. {logs: 1}.
    warmAfterDays: {}
    s3:
      # Operators mode, required: bucket URL with a trailing prefix per replica, e.g.
      # https://my-bucket.s3.eu-central-1.amazonaws.com/openlog/{shard}/{replica}/ (macros expanded by ClickHouse).
      endpoint: ""
      region: ""
      # Secret with static credentials (keys below). Empty = no static keys: set useEnvironmentCredentials and
      # serviceAccountName (IRSA / EKS Pod Identity) or rely on the node's instance profile.
      credentialsSecret:
        name: ""
        accessKeyIdKey: access-key-id
        secretAccessKeyKey: secret-access-key
      useEnvironmentCredentials: false
      # Service account of the ClickHouse pods (IRSA role annotation lives on it; create it yourself).
      serviceAccountName: ""
      # Local read cache of cold parts on the data volume (leave room for it in clickhouse.altinity.storage.size).
      cacheMaxSize: 20Gi
      # Extra settings of the S3 disk, e.g. {server_side_encryption_kms_key_id: "arn:aws:kms:...",
      # server_side_encryption_kms_bucket_key_enabled: "true"} (storage-tiered-sse.xml.example).
      diskSettings: {}
    # Operators mode: a second PersistentVolumeClaim per replica as the warm volume.
    warm:
      enabled: false
      size: 500Gi
      storageClass: ""

  external:
    # Native-protocol addresses. Required in external mode - REPLACE this placeholder.
    # The server must define a cluster named `clickhouse.cluster` and the {cluster},
    # {shard}, {replica} macros, plus Keeper/ZooKeeper for Replicated tables and ON CLUSTER DDL.
    addrs:
      - clickhouse.clickhouse.svc:9000

  # Native protocol over TLS (OPENLOG_CLICKHOUSE_TLS_*), including the processor's direct
  # shard connections. External mode: point clickhouse.external.addrs at the secure port
  # and list <secure>1</secure> + that port in remote_servers. Operators mode: set
  # tls.server.secretName and the chart configures the servers (below); without it the chart
  # only switches the address to securePort and you configure the CHI yourself.
  # Certificate files are re-read by openlog on change (no restart, D-048).
  tls:
    enabled: false
    securePort: 9440
    caSecret:
      name: ""
      key: ca.crt
    # Client certificate (server verificationMode strict).
    clientSecret:
      name: ""
      certKey: tls.crt
      keyKey: tls.key
    # Empty = verify each dialed host (every replica certificate must carry its host_name).
    serverName: ""
    # Testing only.
    insecureSkipVerify: false
    # Operators mode only: ClickHouse server TLS. A Secret with the server certificate, key and CA
    # (cert-manager: tls.crt, tls.key, ca.crt). The chart sets tcp_port_secure (securePort) and
    # https_port, the openSSL server/client config (also used between shards), cluster secure: "yes"
    # (remote_servers on the secure port) and the service ports. The certificate must be valid for
    # the pod hosts in system.clusters (chi-<name>-<cluster>-<shard>-<replica>) and the service host,
    # e.g. *.<namespace>.svc.cluster.local, and carry the clientAuth usage (Distributed queries).
    # Without caSecret.name, the openlog pods trust caKey of this Secret.
    server:
      secretName: ""
      certKey: tls.crt
      keyKey: tls.key
      caKey: ca.crt
      httpsPort: 8443
      # none | relaxed | strict (strict requires client certificates: set clientSecret).
      verificationMode: relaxed
      # Remove the plaintext native and HTTP ports (cluster insecure: "no"). The operator itself uses
      # HTTP 8123: configure its access (scheme https, port 8443) in the operator config first.
      disableInsecure: false
      # Keeper TLS (D-093): ClickHouse -> Keeper on securePort (<secure>1</secure>) and Raft between Keeper nodes over
      # TLS, with the same Secret; the certificate must also carry keeper-<chk name>.<namespace>.svc and the Raft hosts
      # chk-<chk name>-keeper-0-<n>. With disableInsecure the plaintext Keeper client port 2181 is removed.
      keeper:
        enabled: true
        securePort: 9281
      # Replication (part fetches between replicas) over HTTPS on this port instead of HTTP 9009 (D-093).
      # ClickHouse accepts only one of the two ports; the certificate must carry the interserver host
      # chi-<chi name>-<cluster>-<shard>-<replica>.
      interserverHTTPS:
        enabled: true
        port: 9010

  # Used only when dependencies.mode=operators (Altinity clickhouse-operator >= 0.24).
  altinity:
    # ClickHouseInstallation name; defaults to the release fullname.
    # Service: clickhouse-<name>; pods: chi-<name>-<cluster>-<shard>-<replica>-0
    name: ""
    # Override the ClickHouse service host used for OPENLOG_CLICKHOUSE_ADDR.
    host: ""
    image: clickhouse/clickhouse-server:25.8
    # Shards = write capacity; replicas = read capacity + durability.
    # {cluster}, {shard}, {replica} macros are generated by the operator from this layout.
    shards: 2
    replicas: 2
    resources:
      requests: {cpu: "2", memory: 8Gi}
      limits: {memory: 8Gi}
    storage:
      size: 100Gi
      storageClass: ""
      # Retain keeps PVs if the CHI is deleted.
      reclaimPolicy: Retain
    # Operator pod distribution rules; ReplicaAntiAffinity keeps replicas of one shard apart.
    podDistribution:
      - type: ReplicaAntiAffinity
    # Extra spec.configuration.settings / profiles (Altinity key syntax).
    settings: {}
    profiles: {}
    keeper:
      name: ""
      # Keeper client host override. Operator >= 0.24 creates service keeper-<name>.
      host: ""
      port: 2181
      image: clickhouse/clickhouse-keeper:25.8
      # Must be odd; 3 tolerates one failure.
      replicas: 3
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {memory: 1Gi}
      storage:
        size: 10Gi
        storageClass: ""
      affinity: {}

# -----------------------------------------------------------------------------
# openlog-ingest: OTLP gRPC :4317 / HTTP :4318 -> Kafka
# -----------------------------------------------------------------------------
ingest:
  enabled: true
  # Ignored when autoscaling.enabled.
  replicaCount: 2
  logLevel: ""
  # Service-specific env (config.md). Values are passed as strings.
  config:
    OPENLOG_INGEST_HTTP_ADDR: ":4318"
    OPENLOG_INGEST_GRPC_ADDR: ":4317"
    OPENLOG_INGEST_MAX_BODY_BYTES: "10485760"
    OPENLOG_INGEST_PRODUCE_TIMEOUT: "10s"
    # CORS for browser OTLP senders, e.g. "https://app.example.com,https://*.example.com" ("" = off).
    OPENLOG_INGEST_CORS_ALLOWED_ORIGINS: ""
    # Agent fleet sync (releases-updates.md §3-4).
    OPENLOG_FLEET_SYNC_INTERVAL: "300s"
    OPENLOG_FLEET_ROLLOUT_SYNC_INTERVAL: "60s"
    OPENLOG_FLEET_POLICY_CACHE_TTL: "15s"
    OPENLOG_FLEET_REPORT_QUEUE_SIZE: "10000"
    # SaaS mode quota enforcement (usage.md §4.4).
    OPENLOG_QUOTA_REFRESH_INTERVAL: "30s"
    OPENLOG_QUOTA_INGEST_PODS: "0"
    OPENLOG_QUOTA_BLOCKED_RETRY_AFTER: "5m"
  extraEnv: []
  resources:
    requests: {cpu: "1", memory: 1Gi}
    limits: {memory: 2Gi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    behavior: {}
  pdb:
    enabled: true
    maxUnavailable: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 25%, maxUnavailable: 0}
  # Produce timeout (10s) + in-flight requests draining.
  terminationGracePeriodSeconds: 30
  # Time for endpoints/Envoy to stop routing before SIGTERM. 0 disables.
  # Must exceed Envoy's detection time (health check 5s x unhealthy_threshold 2, DNS refresh 5s):
  # with 5s, deleting an ingest pod under load produced ~250 client-visible 503s (Envoy
  # upstream connect failures to the closed listener).
  preStopSleepSeconds: 15
  probes:
    startup: {periodSeconds: 2, failureThreshold: 60, timeoutSeconds: 2}
    liveness: {periodSeconds: 10, failureThreshold: 6, timeoutSeconds: 2}
    readiness: {periodSeconds: 5, failureThreshold: 3, timeoutSeconds: 2}
  service:
    type: ClusterIP
    annotations: {}
    grpcPort: 4317
    httpPort: 4318
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  # Optional Ingress for ingest. OTLP/gRPC needs an HTTP/2-aware (L7) controller;
  # an L4 LoadBalancer pins long-lived gRPC connections to single pods.
  ingress:
    enabled: false
    className: ""
    grpc:
      host: ""
      # e.g. ingress-nginx: nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
      annotations: {}
      tls: []
    http:
      host: ""
      annotations: {}
      tls: []

# -----------------------------------------------------------------------------
# openlog-processor: Kafka consumer group -> ClickHouse
# -----------------------------------------------------------------------------
processor:
  enabled: true
  # Must be <= kafka.topics.partitions (extra consumers sit idle).
  replicaCount: 3
  logLevel: ""
  config:
    OPENLOG_PROCESSOR_GROUP: openlog-processor
    OPENLOG_PROCESSOR_BATCH_ROWS: "50000"
    OPENLOG_PROCESSOR_FLUSH_INTERVAL: "2s"
    OPENLOG_PROCESSOR_INSERT_TIMEOUT: "30s"
    OPENLOG_PROCESSOR_BATCH_BYTES: "8388608"
    # Memory ~ this + INSERT_CONCURRENCY x BATCH_BYTES x 10 + Kafka fetch buffer; keep resources.limits in line.
    OPENLOG_PROCESSOR_MAX_BUFFERED_BYTES: "134217728"
    OPENLOG_PROCESSOR_INSERT_CONCURRENCY: "4"
    # direct (shard *_local tables, D-018) | distributed
    OPENLOG_PROCESSOR_INSERT_MODE: direct
    OPENLOG_PROCESSOR_TOPOLOGY_REFRESH: "1m"
    OPENLOG_PROCESSOR_INSERT_QUORUM: "0"
  extraEnv: []
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {memory: 4Gi}
  autoscaling:
    enabled: true
    minReplicas: 3
    # MUST be <= kafka.topics.partitions (enforced at render time).
    maxReplicas: 24
    targetCPUUtilizationPercentage: 70
    # Every scale event triggers a consumer-group rebalance; scale down slowly.
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies: [{type: Pods, value: 4, periodSeconds: 60}]
      scaleDown:
        stabilizationWindowSeconds: 600
        policies: [{type: Pods, value: 1, periodSeconds: 120}]
  pdb:
    enabled: true
    maxUnavailable: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  # Must cover flush interval + insert timeout (+ retries) + offset commit, so a
  # stopping processor flushes its batches instead of leaving them to be re-read.
  # Default: 2s flush + 30s insert timeout x2 attempts + margin.
  terminationGracePeriodSeconds: 90
  preStopSleepSeconds: 0
  probes:
    startup: {periodSeconds: 2, failureThreshold: 60, timeoutSeconds: 2}
    liveness: {periodSeconds: 10, failureThreshold: 6, timeoutSeconds: 2}
    readiness: {periodSeconds: 5, failureThreshold: 3, timeoutSeconds: 2}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

# -----------------------------------------------------------------------------
# Tail-based sampling (docs/operations/tail-sampling.md, D-075). Off = no behavior change.
# enabled sets OPENLOG_TAILSAMPLING_ENABLED on ingest, processor and api and deploys openlog-sampler.
# -----------------------------------------------------------------------------
tailSampling:
  enabled: false
  decisionWait: "30s"
  maxTraces: 100000
  maxSpansPerTrace: 2000
  # Keep the sampler memory limit >= 1.5x this.
  maxBufferedBytes: 536870912
  decisionCacheTTL: "10m"
  decisionCacheSize: 500000
  policyRefresh: "30s"
  group: openlog-sampler
  produceTimeout: "10s"
  # JSON policy for organizations without a saved one (empty: keep everything), e.g.
  # '{"enabled":true,"baseline_ratio":0.1,"max_spans_per_second":0,"rules":[{"name":"errors","type":"error"}]}'
  defaultPolicy: ""

# openlog-sampler (rendered only with tailSampling.enabled)
sampler:
  # Must be <= kafka.topics.partitions (extra consumers sit idle).
  replicaCount: 2
  logLevel: ""
  extraEnv: []
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 1536Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    # MUST be <= kafka.topics.partitions (enforced at render time).
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    # Scale on consumer lag of the raw traces topic as well: needs an external metrics adapter (e.g.
    # prometheus-adapter) exposing openlog_tailsampling_consumer_lag_records summed per pod.
    lag:
      enabled: false
      metricName: openlog_tailsampling_consumer_lag_records
      # Target average lag (records) per pod.
      averageValue: "5000"
    # Every scale event rebalances the group and decides in-flight traces early; scale down slowly.
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies: [{type: Pods, value: 2, periodSeconds: 60}]
      scaleDown:
        stabilizationWindowSeconds: 900
        policies: [{type: Pods, value: 1, periodSeconds: 300}]
  pdb:
    enabled: true
    maxUnavailable: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  # Covers the final decide + produce + commit (25s) on SIGTERM.
  terminationGracePeriodSeconds: 45
  preStopSleepSeconds: 0
  probes:
    startup: {periodSeconds: 2, failureThreshold: 60, timeoutSeconds: 2}
    liveness: {periodSeconds: 10, failureThreshold: 6, timeoutSeconds: 2}
    readiness: {periodSeconds: 5, failureThreshold: 3, timeoutSeconds: 2}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

# -----------------------------------------------------------------------------
# openlog-api: query API :8080
# -----------------------------------------------------------------------------
api:
  enabled: true
  replicaCount: 2
  logLevel: ""
  config:
    OPENLOG_API_HTTP_ADDR: ":8080"
    OPENLOG_API_QUERY_TIMEOUT: "30s"
    OPENLOG_API_MAX_ROWS: "10000"
    OPENLOG_API_UI_ENABLED: "true"
    # Release check (GET /api/v1/version) and fleet rollout controller (api leader).
    OPENLOG_UPDATE_CHECK: enabled
    OPENLOG_UPDATE_CHECK_INTERVAL: "24h"
    OPENLOG_FLEET_CONTROLLER_INTERVAL: "30s"
    OPENLOG_FLEET_HOST_STALE_AFTER: "24h"
    # "Add data" install commands; "" = derived from the request.
    OPENLOG_INGEST_PUBLIC_URL: ""
    OPENLOG_INGEST_PUBLIC_GRPC_URL: ""
    # APM edge linking (apm.md §4, §6).
    OPENLOG_APM_DEFAULT_APDEX_T: "500ms"
    OPENLOG_APM_LINK_ENABLED: "true"
    OPENLOG_APM_LINK_INTERVAL: "1m"
    OPENLOG_APM_LINK_LOOKBACK: "10m"
    OPENLOG_APM_LINK_DELAY: "1m"
    OPENLOG_APM_LINK_CATCHUP_ENABLED: "true"
    OPENLOG_APM_LINK_CATCHUP_AT: "03:00"
    OPENLOG_APM_LINK_CATCHUP_BATCH: "1h"
    OPENLOG_APM_RELINK_INTERVAL: "5m"
    OPENLOG_APM_RELINK_MAX_MINUTES: "120"
    OPENLOG_ALERT_MAX_RULES_PER_ORG: "1000"
    # Sign-up protection (auth.signupEnabled); CAPTCHA secret: auth.captchaSecret. "" verification = automatic.
    OPENLOG_SIGNUP_REQUIRE_VERIFICATION: ""
    OPENLOG_EMAIL_VERIFICATION_TTL: "48h"
    OPENLOG_SIGNUP_MAX_PER_IP: "10"
    OPENLOG_SIGNUP_MAX_PER_EMAIL: "5"
    OPENLOG_SIGNUP_RATE_WINDOW: "1h"
    OPENLOG_SIGNUP_BLOCKED_EMAIL_DOMAINS: ""
    OPENLOG_SIGNUP_BLOCKED_EMAIL_DOMAINS_FILE: ""
    # turnstile | hcaptcha
    OPENLOG_SIGNUP_CAPTCHA_PROVIDER: ""
    OPENLOG_SIGNUP_CAPTCHA_SITE_KEY: ""
    # Single sign-on and SCIM (D-077, D-078); secret key: auth.ssoSecretKey. "" private networks = automatic.
    OPENLOG_SSO_ENABLED: "true"
    OPENLOG_SSO_ALLOW_PRIVATE_NETWORKS: ""
    OPENLOG_SSO_LOGIN_TTL: "10m"
    OPENLOG_SSO_CLOCK_SKEW: "2m"
    OPENLOG_SSO_HTTP_TIMEOUT: "10s"
    OPENLOG_SCIM_ENABLED: "true"
    # Usage, quotas and billing (api leader; usage.md). Shared plan settings: top-level config.
    OPENLOG_SUPERADMIN_EMAILS: ""
    OPENLOG_USAGE_EVALUATION_INTERVAL: "1m"
    OPENLOG_USAGE_QUERY_COLLECTION_ENABLED: "true"
    OPENLOG_USAGE_NOTIFY_THRESHOLDS: "80,100"
    OPENLOG_QUOTA_RETENTION_MAX_MUTATIONS: "20"
    # none | noop
    OPENLOG_BILLING_PROVIDER: none
    OPENLOG_BILLING_PUSH_AT: "02:00"
    # SaaS operations (docs/operations/saas.md §8-§11; enforcement and jobs only with OPENLOG_SAAS_MODE=true).
    OPENLOG_SAAS_HOST_SYNC_INTERVAL: "1m"
    # Plan with trial_days whose trial new sign-ups get ("" = none).
    OPENLOG_SAAS_SIGNUP_TRIAL_PLAN: ""
    OPENLOG_SAAS_TRIAL_NOTIFY_DAYS: "7,3,1"
    OPENLOG_SAAS_LIFECYCLE_INTERVAL: "5m"
    OPENLOG_SAAS_SUPPORT_SESSION_TTL: "2h"
    OPENLOG_SAAS_AUTO_SUSPEND: "false"
    OPENLOG_SAAS_ABUSE_INTERVAL: "10m"
    OPENLOG_SAAS_ABUSE_INGEST_MULTIPLIER: "10"
    OPENLOG_SAAS_ABUSE_NEW_ORG_DAYS: "7"
    OPENLOG_SAAS_ABUSE_NEW_ORG_HOSTS: "50"
    OPENLOG_SAAS_ABUSE_SOURCE_IPS: "200"
    # Data subject requests (docs/operations/saas.md §12, D-107). Use S3 with more than one api replica: the leader
    # writes the archive and any pod serves the download. Secret key: auth.dataExportS3SecretAccessKey.
    OPENLOG_ORG_DELETION_GRACE: "168h"
    OPENLOG_DATA_EXPORT_ENABLED: "true"
    # auto | local | s3
    OPENLOG_DATA_EXPORT_STORAGE: auto
    # On the api pod's /tmp emptyDir: local archives do not survive a pod restart and are not shared between replicas
    # (a ReadWriteOnce PVC could not be shared either). Keep local only for a single replica; otherwise use S3.
    OPENLOG_DATA_EXPORT_LOCAL_PATH: /tmp/openlog-exports
    OPENLOG_DATA_EXPORT_S3_URL: ""
    OPENLOG_DATA_EXPORT_S3_REGION: ""
    OPENLOG_DATA_EXPORT_S3_ACCESS_KEY_ID: ""
    # static | auto; "" = static when keys are set, else auto (D-116). auto on EKS: annotate the service account
    # (serviceAccount.annotations eks.amazonaws.com/role-arn: <role>) for IRSA, or use EKS Pod Identity / the node's
    # instance profile.
    OPENLOG_DATA_EXPORT_S3_CREDENTIALS: ""
    OPENLOG_DATA_EXPORT_TTL: "168h"
    OPENLOG_DATA_EXPORT_MAX_BYTES: "4294967296"
    OPENLOG_DATA_EXPORT_MAX_ROWS: "50000000"
    OPENLOG_DATA_EXPORT_MAX_RANGE: "744h"
    OPENLOG_DATA_EXPORT_ROWS_PER_SECOND: "200000"
    # Public status page (/status; saas.md §13, D-108). "" = OPENLOG_SAAS_MODE.
    OPENLOG_STATUS_PAGE_ENABLED: ""
    # Scheduled outside-in checks (api.md "Synthetic monitoring", D-132). The api leader runs the due checks,
    # so these limits bound one pod, not the cluster.
    OPENLOG_SYNTHETICS_ENABLED: "true"
    # "" = true unless signup.enabled (SSRF protection: only public addresses may be reached).
    OPENLOG_SYNTHETICS_ALLOW_PRIVATE_NETWORKS: ""
    OPENLOG_SYNTHETICS_MAX_CONCURRENT: "20"
    OPENLOG_SYNTHETICS_TENANT_MAX_CONCURRENT: "5"
    OPENLOG_SYNTHETICS_MAX_RESPONSE_BYTES: "1048576"
    OPENLOG_SYNTHETICS_MAX_REDIRECTS: "5"
    # Managed cloud service metrics (api.md "Cloud connections", D-135). Connections are per organization
    # and their credentials are encrypted with OPENLOG_SECRETS_KEY, which must be set to save them. The api
    # leader polls, so these limits bound one pod; the provider APIs are billed per request, so each
    # connection also carries its own per-poll metric and request caps.
    OPENLOG_CLOUD_ENABLED: "true"
    OPENLOG_CLOUD_MAX_CONCURRENT: "10"
    OPENLOG_CLOUD_TENANT_MAX_CONCURRENT: "4"
    OPENLOG_CLOUD_CONNECTION_MAX_CONCURRENT: "2"
    OPENLOG_CLOUD_REQUEST_TIMEOUT: "30s"
    # Infrastructure cost estimates (cost.md, D-134). A static price table in the image prices each
    # host from its cloud instance facts; the numbers are estimates, not billing data.
    OPENLOG_COST_ENABLED: "true"
    # JSON file merged over the built-in table, to correct a price without a release. Mount it with
    # extraVolumes/extraVolumeMounts (e.g. from a ConfigMap) and point this at the mounted path.
    OPENLOG_COST_PRICES_FILE: ""
  extraEnv: []
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {memory: 1Gi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    behavior: {}
  pdb:
    enabled: true
    maxUnavailable: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 25%, maxUnavailable: 0}
  # Query timeout (30s) + margin.
  terminationGracePeriodSeconds: 45
  preStopSleepSeconds: 5
  probes:
    startup: {periodSeconds: 2, failureThreshold: 60, timeoutSeconds: 2}
    liveness: {periodSeconds: 10, failureThreshold: 6, timeoutSeconds: 2}
    readiness: {periodSeconds: 5, failureThreshold: 3, timeoutSeconds: 2}
  service:
    type: ClusterIP
    annotations: {}
    port: 8080
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []

# -----------------------------------------------------------------------------
# openlog-alert: alert rule evaluation + notification delivery (docs/contracts/alerting.md).
# Stateless: rules are shared across replicas with PostgreSQL leases, the outbox with SKIP LOCKED,
# so any replica count (and HPA) works. Requires auth.mode=postgres.
# -----------------------------------------------------------------------------
alert:
  enabled: true
  replicaCount: 2
  logLevel: ""
  # OPENLOG_SECRETS_KEY: base64 of 32 random bytes (`openssl rand -base64 32`) encrypting notification
  # channel secrets (AES-256-GCM). Given to api and alert pods from the chart Secret (key secrets-key), or
  # from auth.existingSecret under secretsKeyKey. Without it channels cannot be created or delivered.
  # Back it up: channels cannot be decrypted without it.
  secretsKey: ""
  secretsKeyKey: secrets-key
  # Rotation: the old key(s), comma-separated, then run `openlog-alert rotate-secrets` once.
  secretsKeyPrevious: ""
  secretsKeyPreviousKey: secrets-key-previous
  # Web UI base URL used in notification links (OPENLOG_PUBLIC_URL).
  publicURL: ""
  # Refuse webhook/Slack/Teams/SMTP destinations on private, loopback and link-local addresses. true for SaaS.
  blockPrivateDestinations: false
  # Global SMTP server for e-mail channels (OPENLOG_SMTP_*). STARTTLS required unless tls: tls|none.
  smtp:
    host: ""
    port: 587
    username: ""
    from: ""
    tls: starttls
    insecureSkipVerify: false
    # OPENLOG_SMTP_PASSWORD: from passwordSecret when its name is set, else `password` stored in the chart Secret (or
    # auth.existingSecret under passwordKey).
    password: ""
    passwordKey: smtp-password
    passwordSecret:
      name: ""
      key: password
  config:
    OPENLOG_ALERT_LEASE_TTL: "30s"
    OPENLOG_ALERT_LEASE_RENEW_INTERVAL: "10s"
    OPENLOG_ALERT_EVALUATION_DELAY: "15s"
    OPENLOG_ALERT_MAX_CONCURRENT_EVALUATIONS: "16"
    OPENLOG_ALERT_TENANT_MAX_CONCURRENT: "4"
    OPENLOG_ALERT_TENANT_EVALUATIONS_PER_MINUTE: "600"
    OPENLOG_ALERT_QUERY_TIMEOUT: "20s"
    OPENLOG_ALERT_DISPATCH_WORKERS: "4"
    OPENLOG_ALERT_DELIVERY_TIMEOUT: "10s"
    OPENLOG_ALERT_DELIVERY_MAX_ATTEMPTS: "10"
    OPENLOG_ALERT_MAX_SERIES_PER_RULE: "1000"
    OPENLOG_ALERT_EVALUATION_HISTORY: "true"
  extraEnv: []
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {memory: 512Mi}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    behavior: {}
  pdb:
    enabled: true
    maxUnavailable: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  # Running evaluations (query timeout 20s) and deliveries (10s) finish before the pod releases its leases.
  terminationGracePeriodSeconds: 45
  preStopSleepSeconds: 0
  probes:
    startup: {periodSeconds: 2, failureThreshold: 60, timeoutSeconds: 2}
    liveness: {periodSeconds: 10, failureThreshold: 6, timeoutSeconds: 2}
    readiness: {periodSeconds: 5, failureThreshold: 3, timeoutSeconds: 2}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

# -----------------------------------------------------------------------------
# openlog-migrate: Helm hook Job applying the ClickHouse schema (+ Kafka topics in external mode)
# -----------------------------------------------------------------------------
migrate:
  enabled: true
  # Empty = "pre-install,pre-upgrade" (external) or "post-install,pre-upgrade" (operators:
  # ClickHouse does not exist before the release is installed).
  hookEvents: ""
  hookDeletePolicy: before-hook-creation,hook-succeeded
  # Retries with exponential backoff (10s, 20s, 40s ... capped at 6m) while dependencies come up.
  backoffLimit: 10
  activeDeadlineSeconds: 1800
  logLevel: ""
  config:
    # TTL of the APM tables (apm.md §8), applied by the migrations.
    OPENLOG_APM_RETENTION_DAYS: "30"
  extraEnv: []
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# openlog-admin bootstrap: post-install/post-upgrade hook Job (auth.mode=postgres) that
# idempotently creates the first organization and owner (and optionally an ingest key).
# Alternative: kubectl -n <ns> exec deploy/<fullname>-api -- openlog-admin create-owner --email ... --org ...
# -----------------------------------------------------------------------------
bootstrap:
  enabled: false
  tenantId: default
  orgName: Default
  ownerEmail: ""
  # Required only when the owner does not exist yet (>= 12 characters). Stored in the chart
  # Secret, or read from auth.existingSecret key `ownerPasswordKey`.
  ownerPassword: ""
  ownerPasswordKey: bootstrap-owner-password
  # Optional plaintext ingest license key to ensure (development). Prefer creating keys in the UI.
  licenseKey: ""
  licenseKeyKey: bootstrap-license-key
  ownerName: ""
  # Optional plaintext read-only API key to ensure (chart Secret key bootstrap-api-key, or apiKeyKey of existingSecret).
  apiKey: ""
  apiKeyKey: bootstrap-api-key
  hookDeletePolicy: before-hook-creation,hook-succeeded
  backoffLimit: 10
  activeDeadlineSeconds: 1800
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
  nodeSelector: {}
  tolerations: []

# -----------------------------------------------------------------------------
# Gateway API routes for ingest (alternative to Ingress). Requires Gateway API CRDs
# (GRPCRoute v1, Gateway API >= 1.1) and a Gateway that terminates HTTP/2.
# -----------------------------------------------------------------------------
gateway:
  enabled: false
  parentRefs: []
  #  - name: public-gateway
  #    namespace: gateway-system
  grpc:
    hostnames: []
  http:
    hostnames: []
  api:
    enabled: false
    hostnames: []

# -----------------------------------------------------------------------------
# Envoy L7 load balancer in front of ingest.
# OTLP/gRPC clients hold long-lived HTTP/2 connections; a kube-proxy (L4) Service
# balances connections, not requests, so new ingest replicas get no traffic from
# existing clients. Envoy balances per request/stream across all ingest pods
# (discovered through a headless Service). Leave disabled if your ingress controller
# or Gateway already does HTTP/2-aware balancing to ingest.
# -----------------------------------------------------------------------------
envoy:
  enabled: false
  image: envoyproxy/envoy:v1.35.3
  replicaCount: 2
  resources:
    requests: {cpu: 500m, memory: 256Mi}
    limits: {memory: 512Mi}
  # Clients are asked to reconnect after this long, so load re-balances across Envoy
  # replicas behind an L4 LoadBalancer.
  maxConnectionDuration: 300s
  routeTimeout: 30s
  dnsRefreshRate: 5s
  logLevel: info
  pdb:
    enabled: true
    maxUnavailable: 1
  terminationGracePeriodSeconds: 30
  service:
    # LoadBalancer to expose OTLP outside the cluster.
    type: ClusterIP
    annotations: {}
    grpcPort: 4317
    httpPort: 4318
    externalTrafficPolicy: ""
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

# -----------------------------------------------------------------------------
# openlog-updater (optional): CronJob that keeps the Deployments on the newest signed
# release of `channel` (docs/operations/upgrading.md). Recommended instead: GitOps
# (Argo CD / Flux) pinning the chart version. Note that `helm upgrade` resets the
# images to image.tag, so set image.tag to the running version before upgrading.
# RBAC: get/patch on this release's ingest/processor/api Deployments, create/get Jobs,
# get/list pods and pods/log in the release namespace.
# "Update now" in the UI (update_requests in PostgreSQL) is handled at the next scheduled run;
# to run it right away: kubectl -n <namespace> create job --from=cronjob/<fullname>-updater <name>.
# -----------------------------------------------------------------------------
updater:
  enabled: false
  # off | notify (only report in the UI / GET /api/v1/version) | auto
  mode: notify
  schedule: "17 3 * * *"
  timeZone: "Etc/UTC"
  channel: stable
  indexURL: https://github.com/onuragtas/openlog/releases/latest/download/index.json
  # Extra trusted release public keys (base64), e.g. for self-built releases. Release images
  # already contain the official keys.
  trustedKeys: []
  # UTC windows, e.g. "sat,sun 02:00-05:00" (empty = whenever the CronJob runs).
  maintenanceWindow: ""
  # Pull from a mirror: the repository replaces the manifest's, the digest is kept.
  imageRepository: ""
  healthTimeout: 5m
  rolloutTimeout: 15m
  migrateTimeout: 30m
  activeDeadlineSeconds: 5400
  logLevel: ""
  config: {}
  extraEnv: []
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

# -----------------------------------------------------------------------------
# openlog-renderer (optional, D-097): PNG widget images in scheduled report e-mails
# (docs/operations/reports.md). Headless Chromium in its own image; reachable only from api pods
# (ClusterIP + NetworkPolicy) and allowed to connect only to the api Service (and DNS).
# Render tokens are signed with the key hash secret or alert.secretsKey (one must be set).
# Sets on api pods: OPENLOG_RENDERER_URL, OPENLOG_RENDERER_TOKEN, OPENLOG_RENDERER_TIMEOUT and, with
# tls.secretName, OPENLOG_RENDERER_TLS_CERT_FILE / OPENLOG_RENDERER_TLS_KEY_FILE / OPENLOG_RENDERER_TLS_CA_FILE.
# -----------------------------------------------------------------------------
renderer:
  enabled: false
  image:
    repository: ghcr.io/onuragtas/openlog-renderer
    # Defaults to the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  logLevel: ""
  # OPENLOG_RENDERER_TOKEN (>= 32 characters, `openssl rand -hex 32`), stored in the Secret <fullname>-renderer;
  # or existingSecret.name/key.
  token: ""
  existingSecret:
    name: ""
    key: token
  port: 8090
  # api side: bound for rendering one report (OPENLOG_RENDERER_TIMEOUT).
  timeout: 2m
  # OPENLOG_RENDERER_MAX_CONCURRENCY (Chromium processes per pod), OPENLOG_RENDERER_RENDER_TIMEOUT,
  # OPENLOG_RENDERER_QUEUE_TIMEOUT, OPENLOG_RENDERER_MAX_IMAGE_BYTES.
  maxConcurrency: 2
  renderTimeout: 60s
  queueTimeout: 30s
  maxImageBytes: 1048576
  # OPENLOG_RENDERER_CHROMIUM_PATH ("" = the image's /usr/bin/chromium).
  chromiumPath: ""
  # OPENLOG_RENDERER_CHROMIUM_NO_SANDBOX: Chromium's namespace sandbox needs unprivileged user namespaces, which
  # RuntimeDefault seccomp profiles usually refuse. The pod is locked down instead (non-root, read-only root
  # filesystem, all capabilities dropped, no service account token, NetworkPolicy egress to the api only). Set
  # false on nodes/profiles that allow the sandbox (e.g. a seccomp profile permitting clone/unshare of user namespaces).
  chromiumNoSandbox: true
  # OPENLOG_RENDERER_UI_ORIGIN: the origin the browser loads; "" = http://<api Service>:<api.service.port>.
  uiOrigin: ""
  # Optional mTLS: a kubernetes.io/tls Secret with tls.crt, tls.key and ca.crt, mounted into renderer and api pods
  # (the certificate must be valid for the renderer Service name and usable as client certificate).
  tls:
    secretName: ""
  networkPolicy:
    enabled: true
    # Extra ingress peers for the metrics port 9464 (e.g. the Prometheus namespace); empty = any pod.
    metricsFrom: []
    # Extra egress rules (list of NetworkPolicyEgressRule).
    extraEgress: []
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1536Mi}
  # /dev/shm for Chromium (memory-backed emptyDir) and /tmp (profiles).
  shmSizeLimit: 256Mi
  tmpSizeLimit: 512Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
