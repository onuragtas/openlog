{{- range $component := list "ingest" "processor" "api" "alert" "sampler" }}
{{- $v := index $.Values $component }}
{{- $ctx := dict "root" $ "component" $component "values" $v }}
{{- $on := or (and (eq $component "sampler") $.Values.tailSampling.enabled) (and (ne $component "sampler") $v.enabled (or (ne $component "alert") (include "openlog.postgres.enabled" $))) }}
{{- if and $on $v.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "openlog.componentName" $ctx }}
  labels:
    {{- include "openlog.componentLabels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "openlog.componentName" $ctx }}
  minReplicas: {{ $v.autoscaling.minReplicas }}
  maxReplicas: {{ $v.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $v.autoscaling.targetCPUUtilizationPercentage }}
    {{- if and (eq $component "sampler") $v.autoscaling.lag.enabled }}
    # Consumer lag of the raw traces topic (external metrics adapter required).
    - type: External
      external:
        metric:
          name: {{ $v.autoscaling.lag.metricName }}
          selector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name | quote }}
        target:
          type: AverageValue
          averageValue: {{ $v.autoscaling.lag.averageValue | quote }}
    {{- end }}
  {{- with $v.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and $on $v.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "openlog.componentName" $ctx }}
  labels:
    {{- include "openlog.componentLabels" $ctx | nindent 4 }}
spec:
  {{- if hasKey $v.pdb "minAvailable" }}
  minAvailable: {{ $v.pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ $v.pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openlog.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
