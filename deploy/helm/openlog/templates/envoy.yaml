{{- if and .Values.envoy.enabled .Values.ingest.enabled }}
{{- $v := .Values.envoy }}
{{- $ctx := dict "root" . "component" "envoy" "values" $v }}
{{- $upstream := printf "%s-headless.%s.svc.cluster.local" (include "openlog.componentName" (dict "root" . "component" "ingest")) .Release.Namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openlog.componentName" $ctx }}
  labels:
    {{- include "openlog.componentLabels" $ctx | nindent 4 }}
data:
  envoy.yaml: |
    # L7 load balancing for OTLP. Downstream HTTP/2 (gRPC) and HTTP/1.1 are balanced
    # per request/stream across every ready ingest pod resolved from the headless Service.
    admin:
      address:
        socket_address: {address: 127.0.0.1, port_value: 9901}
    static_resources:
      listeners:
      {{- range $l := list (dict "name" "otlp_grpc" "port" 4317 "cluster" "ingest_grpc") (dict "name" "otlp_http" "port" 4318 "cluster" "ingest_http") }}
      - name: {{ $l.name }}
        address:
          socket_address: {address: 0.0.0.0, port_value: {{ $l.port }}}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: {{ $l.name }}
              codec_type: AUTO
              common_http_protocol_options:
                max_connection_duration: {{ $v.maxConnectionDuration }}
                idle_timeout: 600s
              http2_protocol_options:
                max_concurrent_streams: 1000
              route_config:
                name: {{ $l.name }}
                virtual_hosts:
                - name: ingest
                  domains: ["*"]
                  routes:
                  - match: {prefix: "/"}
                    route:
                      cluster: {{ $l.cluster }}
                      timeout: {{ $v.routeTimeout }}
                      # Retry only failures where the request never reached ingest (so nothing
                      # can be produced twice), on another endpoint: covers an ingest pod that
                      # closed its listener before health checks removed it.
                      retry_policy:
                        retry_on: connect-failure,refused-stream,reset-before-request
                        num_retries: 2
                        retry_host_predicate:
                          - name: envoy.retry_host_predicates.previous_hosts
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate
                        host_selection_retry_max_attempts: 3
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      {{- end }}
      # Exposes only /ready and /stats/prometheus from the admin interface.
      - name: envoy_metrics
        address:
          socket_address: {address: 0.0.0.0, port_value: 9902}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: envoy_metrics
              route_config:
                name: envoy_metrics
                virtual_hosts:
                - name: admin
                  domains: ["*"]
                  routes:
                  - match: {path: "/ready"}
                    route: {cluster: envoy_admin}
                  - match: {path: "/stats/prometheus"}
                    route: {cluster: envoy_admin}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      {{- range $c := list (dict "name" "ingest_grpc" "port" 4317 "h2" true) (dict "name" "ingest_http" "port" 4318 "h2" false) }}
      - name: {{ $c.name }}
        type: STRICT_DNS
        dns_lookup_family: V4_PREFERRED
        dns_refresh_rate: {{ $v.dnsRefreshRate }}
        respect_dns_ttl: false
        lb_policy: LEAST_REQUEST
        connect_timeout: 2s
        {{- if $c.h2 }}
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options:
                max_concurrent_streams: 1000
        {{- end }}
        circuit_breakers:
          thresholds:
          - priority: DEFAULT
            max_connections: 100000
            max_pending_requests: 100000
            max_requests: 100000
            # A fixed max_retries (was 3) rejected almost every retry during an ingest rollout
            # (retry_overflow 376 of 378 client 503s); scale the retry allowance with traffic.
            retry_budget:
              budget_percent: {value: 25.0}
              min_retry_concurrency: 10
        # Take pods out of rotation as soon as /readyz fails (e.g. Kafka unavailable).
        health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          no_traffic_interval: 5s
          http_health_check:
            path: /readyz
            codec_client_type: HTTP1
        outlier_detection:
          # Eject an endpoint after 2 connection failures instead of waiting for health checks:
          # cluster DNS can keep returning a removed pod's IP (CoreDNS cache, often 30 s).
          split_external_local_origin_errors: true
          consecutive_local_origin_failure: 2
          enforcing_consecutive_local_origin_failure: 100
          consecutive_5xx: 5
          consecutive_gateway_failure: 3
          interval: 10s
          base_ejection_time: 30s
          max_ejection_percent: 50
        load_assignment:
          cluster_name: {{ $c.name }}
          endpoints:
          - lb_endpoints:
            - endpoint:
                health_check_config: {port_value: 9464}
                address:
                  socket_address: {address: {{ $upstream }}, port_value: {{ $c.port }}}
      {{- end }}
      - name: envoy_admin
        type: STATIC
        connect_timeout: 1s
        load_assignment:
          cluster_name: envoy_admin
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: {address: 127.0.0.1, port_value: 9901}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openlog.componentName" $ctx }}
  labels:
    {{- include "openlog.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 25%, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "openlog.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openlog.selectorLabels" $ctx | nindent 8 }}
        app.kubernetes.io/part-of: openlog
      annotations:
        checksum/config: {{ printf "%s|%s" (toJson $v) $upstream | sha256sum }}
        {{- if .Values.metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9902"
        prometheus.io/path: /stats/prometheus
        {{- end }}
        {{- with $v.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $v.securityContext | nindent 8 }}
      {{- include "openlog.scheduling" $ctx | nindent 6 }}
      terminationGracePeriodSeconds: {{ $v.terminationGracePeriodSeconds }}
      containers:
        - name: envoy
          image: {{ $v.image }}
          command: ["envoy"]
          args:
            - --config-path
            - /etc/envoy/envoy.yaml
            - --log-level
            - {{ $v.logLevel }}
            - --drain-time-s
            - "15"
          ports:
            - {name: grpc-otlp, containerPort: 4317, protocol: TCP}
            - {name: http-otlp, containerPort: 4318, protocol: TCP}
            - {name: envoy-metrics, containerPort: 9902, protocol: TCP}
          readinessProbe:
            httpGet: {path: /ready, port: envoy-metrics}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /ready, port: envoy-metrics}
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/envoy, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ include "openlog.componentName" $ctx }}
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openlog.componentName" $ctx }}
  labels:
    {{- include "openlog.componentLabels" $ctx | nindent 4 }}
    openlog.io/metrics: "true"
  {{- with $v.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $v.service.type }}
  {{- if and $v.service.externalTrafficPolicy (ne $v.service.type "ClusterIP") }}
  externalTrafficPolicy: {{ $v.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "openlog.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: grpc-otlp
      port: {{ $v.service.grpcPort }}
      targetPort: grpc-otlp
      appProtocol: grpc
    - name: http-otlp
      port: {{ $v.service.httpPort }}
      targetPort: http-otlp
      appProtocol: http
    - name: envoy-metrics
      port: 9902
      targetPort: envoy-metrics
      appProtocol: http
{{- if $v.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "openlog.componentName" $ctx }}
  labels:
    {{- include "openlog.componentLabels" $ctx | nindent 4 }}
spec:
  maxUnavailable: {{ $v.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "openlog.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
