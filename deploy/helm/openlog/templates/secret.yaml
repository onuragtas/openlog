{{- if not .Values.auth.existingSecret }}
{{- $name := include "openlog.secretName" . }}
{{- $password := .Values.clickhouse.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "clickhouse-password") }}
{{- $password = index $existing.data "clickhouse-password" | b64dec }}
{{- else if include "openlog.operators" . }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
# Created as a hook so it exists before the pre-install migrate Job. Kept on
# uninstall (resource-policy) so a reinstall against retained ClickHouse PVCs keeps
# working; delete it manually when tearing everything down.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "openlog.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
data:
  clickhouse-password: {{ $password | b64enc | quote }}
  license-keys: {{ .Values.auth.licenseKeys | b64enc | quote }}
  {{- if and (include "openlog.postgres.enabled" .) (not (include "openlog.postgres.operator" .)) }}
  postgres-dsn: {{ .Values.postgres.external.dsn | b64enc | quote }}
  {{- end }}
  {{- with .Values.bootstrap.ownerPassword }}
  bootstrap-owner-password: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.bootstrap.licenseKey }}
  bootstrap-license-key: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
