{{- if not .Values.auth.existingSecret }}
{{- $name := include "openlog.secretName" . }}
{{- $password := .Values.clickhouse.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "clickhouse-password") }}
{{- $password = index $existing.data "clickhouse-password" | b64dec }}
{{- else if include "openlog.operators" . }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- /* Read-only ClickHouse user (D-047): random in operators mode, preserved across upgrades. */}}
{{- $readPassword := .Values.clickhouse.readUser.password }}
{{- if and (not $readPassword) (include "openlog.clickhouse.readUser" .) }}
{{- $existingRead := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existingRead $existingRead.data (hasKey $existingRead.data "clickhouse-read-password") }}
{{- $readPassword = index $existingRead.data "clickhouse-read-password" | b64dec }}
{{- else }}
{{- $readPassword = randAlphaNum 32 }}
{{- end }}
{{- end }}
# Created as a hook so it exists before the pre-install migrate Job. Kept on
# uninstall (resource-policy) so a reinstall against retained ClickHouse PVCs keeps
# working; delete it manually when tearing everything down.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "openlog.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
data:
  clickhouse-password: {{ $password | b64enc | quote }}
  {{- with $readPassword }}
  clickhouse-read-password: {{ . | b64enc | quote }}
  {{- end }}
  license-keys: {{ .Values.auth.licenseKeys | b64enc | quote }}
  {{- if and (include "openlog.postgres.enabled" .) (not (include "openlog.postgres.operator" .)) }}
  postgres-dsn: {{ .Values.postgres.external.dsn | b64enc | quote }}
  {{- end }}
  {{- with .Values.bootstrap.ownerPassword }}
  bootstrap-owner-password: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.bootstrap.licenseKey }}
  bootstrap-license-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.alert.secretsKey }}
  secrets-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.alert.secretsKeyPrevious }}
  secrets-key-previous: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.alert.smtp.password }}
  smtp-password: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.keyHashSecret }}
  key-hash-secret: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.keyHashSecretPrevious }}
  key-hash-secret-previous: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.ssoSecretKey }}
  sso-secret-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.ssoSecretKeyPrevious }}
  sso-secret-key-previous: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.captchaSecret }}
  signup-captcha-secret: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.dataExportS3SecretAccessKey }}
  data-export-s3-secret-access-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.bootstrap.apiKey }}
  bootstrap-api-key: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
