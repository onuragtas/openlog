{{- if .Values.cluster.enabled }}
{{- $fullname := include "openlog-agent.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-cluster" $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openlog-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster
spec:
  replicas: {{ .Values.cluster.replicas }}
  selector:
    matchLabels:
      {{- include "openlog-agent.selector" (dict "root" . "component" "cluster") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openlog-agent.selector" (dict "root" . "component" "cluster") | nindent 8 }}
        {{- with .Values.cluster.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.cluster.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ printf "%s-cluster" $fullname }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 65534
      {{- with .Values.cluster.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "openlog-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/openlog-infra-agent", "-config", "/etc/openlog-agent/config.yaml"]
          env:
            {{- include "openlog-agent.env" . | nindent 12 }}
          securityContext:
            {{- include "openlog-agent.restrictedSecurityContext" . | nindent 12 }}
          {{- with .Values.cluster.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/openlog-agent
              readOnly: true
            - name: state
              mountPath: /var/lib/openlog-infra-agent
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-cluster" $fullname }}
        - name: state
          emptyDir:
            sizeLimit: 512Mi
      {{- with .Values.cluster.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.cluster.affinity }}
      affinity:
        {{- toYaml .Values.cluster.affinity | nindent 8 }}
      {{- else if gt (int .Values.cluster.replicas) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "openlog-agent.selector" (dict "root" . "component" "cluster") | nindent 20 }}
      {{- end }}
      {{- with .Values.cluster.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
