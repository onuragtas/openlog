# Throwaway dependencies of the usage/quota integration tests (project openlog-m4-usage):
#
#   docker compose -p openlog-m4-usage -f internal/usage/testdata/docker-compose.yml up -d --wait
#   OPENLOG_TEST_CLICKHOUSE_ADDR=127.0.0.1:19010 OPENLOG_TEST_POSTGRES_DSN=postgres://openlog:openlog@127.0.0.1:27441/openlog?sslmode=disable \
#     go test -tags integration -count=1 ./internal/usage ./internal/quota
#   docker compose -p openlog-m4-usage -f internal/usage/testdata/docker-compose.yml down -v
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    hostname: clickhouse
    environment:
      CLICKHOUSE_USER: openlog
      CLICKHOUSE_PASSWORD: openlog
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - ../../../deploy/compose/clickhouse/openlog-cluster.xml:/etc/clickhouse-server/config.d/openlog-cluster.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "127.0.0.1:18130:8123"
      - "127.0.0.1:19010:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openlog
      POSTGRES_PASSWORD: openlog
      POSTGRES_DB: openlog
    ports:
      - "127.0.0.1:27441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlog"]
      interval: 2s
      timeout: 5s
      retries: 60
