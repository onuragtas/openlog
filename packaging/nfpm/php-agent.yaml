# nfpm configuration of the openlog-php-agent .deb, .rpm and .apk (docs/contracts/php-agent.md §7).
# Rendered by agents/php/packaging/build-artifacts.sh (sed replaces these placeholders):
#   VERSION  SemVer product version (no leading v)   ARCH  amd64 | arm64
#   STAGE    staged tarball directory (modules/, bin/openlog-php-install, LICENSE, README.md, VERSION, modules.txt)
#   SCRIPTS  directory of the rendered maintainer scripts (agents/php/packaging/scripts with @VERSION@ replaced)
#
# Layout: /opt/openlog/php-agent/versions/<v>/ (root-owned); postinstall points /opt/openlog/php-agent/current at it
# and runs `openlog-php-install install`, which enables openlog.so for every PHP runtime found (ini files load the
# module through `current`, so an upgrade needs no ini change; PHP-FPM picks it up on its next reload).
name: openlog-php-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: "1"
section: web
priority: optional
maintainer: openlog maintainers <https://github.com/onuragtas/openlog>
vendor: openlog
homepage: https://github.com/onuragtas/openlog
license: Apache-2.0
description: |-
  openlog PHP APM agent (openlog.so).
  Traces PHP 7.1-8.4 applications (PHP-FPM, Apache mod_php, CGI, CLI; NTS and ZTS) and sends them to the local
  openlog infrastructure agent. Enables the extension for every PHP runtime found on the host.

contents:
  - dst: /opt/openlog
    type: dir
    file_info: {mode: 0755}
  - dst: /opt/openlog/php-agent
    type: dir
    file_info: {mode: 0755, owner: root, group: root}
  - dst: /opt/openlog/php-agent/versions
    type: dir
    file_info: {mode: 0755, owner: root, group: root}
  - dst: /opt/openlog/php-agent/versions/${VERSION}
    type: dir
    file_info: {mode: 0755, owner: root, group: root}
  # One entry per staged file, generated by build-artifacts.sh (apk needs per-file checksums, which `type: tree` omits).
  # @STAGE_CONTENTS@
  - src: /opt/openlog/php-agent/current/bin/openlog-php-install
    dst: /usr/bin/openlog-php-install
    type: symlink

scripts:
  postinstall: ${SCRIPTS}/postinstall.sh
  preremove: ${SCRIPTS}/preremove.sh
  postremove: ${SCRIPTS}/postremove.sh

apk:
  scripts:
    postupgrade: ${SCRIPTS}/postinstall.sh
