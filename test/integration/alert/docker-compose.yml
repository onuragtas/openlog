# PostgreSQL for the alert store integration tests (go test -tags integration ./internal/alert).
# The test starts and removes this project itself unless OPENLOG_TEST_POSTGRES_DSN is set.
name: openlog-alerttest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openlog
      POSTGRES_PASSWORD: openlog
      POSTGRES_DB: openlog
    ports:
      - "127.0.0.1:${ALERTTEST_PORT:-55462}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlog -d openlog"]
      interval: 2s
      timeout: 3s
      retries: 30
