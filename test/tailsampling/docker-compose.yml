# Kafka + ClickHouse for the tail sampling integration test (test/tailsampling). openlog itself runs in the test
# process, built from the tree. Project name openlog-m4-tail; host ports do not collide with the shared stack.
name: openlog-m4-tail

services:
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    # Docker Engine 29+ does not put the container hostname in /etc/hosts; Kafka resolves its own name at startup.
    extra_hosts:
      - "kafka:127.0.0.1"
    environment:
      CLUSTER_ID: TUtUYWlsU2FtcGxpbmdUZXN0
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:19392,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:19392
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: 12582912
    ports:
      - "127.0.0.1:19392:19392"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    hostname: clickhouse
    environment:
      CLICKHOUSE_USER: openlog
      CLICKHOUSE_PASSWORD: openlog
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
      OPENLOG_CLICKHOUSE_READ_PASSWORD: openlog-read
    volumes:
      - ../../deploy/compose/clickhouse/openlog-cluster.xml:/etc/clickhouse-server/config.d/openlog-cluster.xml:ro
      - ../../deploy/compose/clickhouse/openlog-reader.xml:/etc/clickhouse-server/users.d/openlog-reader.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "127.0.0.1:19323:8123"
      - "127.0.0.1:19300:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
