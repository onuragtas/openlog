# Local agents and demo apps that send data to the ONE shared local openlog stack
# (deploy/compose, compose project `openlog`). This project never runs an openlog backend.
#
#   # 1. shared backend (once)
#   docker compose -p openlog -f deploy/compose/docker-compose.yml up -d --wait
#   # 2. agents + demo apps
#   docker compose -p openlog-agents -f test/localagents/docker-compose.yml up -d --build
#   # remove only the agents
#   docker compose -p openlog-agents -f test/localagents/docker-compose.yml down -v
#
# Everything joins the shared stack's network (`openlog_default`), so the ingest is http://openlog:4318.
# The license key must be the shared stack's OPENLOG_BOOTSTRAP_LICENSE_KEY (deploy/compose/.env).
#
#   apm-host      Debian 12 + openlog-infra-agent; machine-id = host.id of the demo services
#   web-host      Debian 12 + nginx, redis, postgresql + openlog-infra-agent (logs, integrations)
#   frontend      Node.js (openlog Node.js agent openlog-node built from agents/node)    http://localhost:${LOCALAGENTS_FRONTEND_PORT:-33000}
#                 (build/update only this one: docker compose -p openlog-agents -f test/localagents/docker-compose.yml up -d --build --no-deps frontend loadgen)
#   orders        Go (OTel) -> orders-db
#   catalog       PHP 8.3 (OTel) -> redis
#   loadgen       ~8 req/s against frontend
#   docker-host   openlog-infra-agent watching the Docker engine itself (every container of this Docker host:
#                 metrics, status, logs; compose project/service; APM services linked by container.id)
#                 (build/update only this one: docker compose -p openlog-agents -f test/localagents/docker-compose.yml up -d --build --no-deps docker-host)
#   php-host      Debian 12 + PHP 8.3-FPM + nginx + openlog PHP extension + openlog-infra-agent (php_forwarder)
#                 http://localhost:${LOCALAGENTS_PHP_PORT:-33080}; service php-shop, host.id a0de…0003
#                 (build/update only this one: docker compose -p openlog-agents -f test/localagents/docker-compose.yml up -d --build --no-deps php-host)
#   python-shop   Python 3.13 FastAPI/uvicorn (openlog Python agent: wheel built from agents/python, openlog-instrument)
#                 -> catalog, orders; http://localhost:${LOCALAGENTS_PYTHON_PORT:-33800}; python-shop-loadgen ~4 req/s
#                 (build/update only these: docker compose -p openlog-agents -f test/localagents/docker-compose.yml up -d --build --no-deps python-shop python-shop-loadgen)

name: openlog-agents

x-otel: &otel
  OPENLOG_LICENSE_KEY: ${LOCALAGENTS_LICENSE_KEY:-dev-license-key}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://openlog:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_HEADERS: openlog-license-key=${LOCALAGENTS_LICENSE_KEY:-dev-license-key}
  OTEL_TRACES_SAMPLER: parentbased_always_on
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_METRICS_EXPORTER: none

x-apm-resource: &apm-resource "service.namespace=shop,service.version=1.0.0,deployment.environment=local,deployment.environment.name=local,host.id=a0de0000000000000000000000000001,host.name=apm-host"

# Adds container.id (OTel semantic convention) to OTEL_RESOURCE_ATTRIBUTES, then runs the image command. Docker's
# private cgroup namespace hides the id from /proc/self/cgroup; /proc/self/mountinfo shows the container directory
# (the same fallback as agents/go and the OTel container resource detectors). The demo SDKs read the variable.
x-container-id: &container-id
  - /bin/sh
  - -c
  - |
    cid=$$(sed -n 's#.*/containers/\([0-9a-f]\{64\}\)/.*#\1#p' /proc/self/mountinfo | head -n 1)
    if [ -n "$$cid" ]; then export OTEL_RESOURCE_ATTRIBUTES="$${OTEL_RESOURCE_ATTRIBUTES:+$$OTEL_RESOURCE_ATTRIBUTES,}container.id=$$cid"; fi
    exec "$$@"
  - container-id

services:
  frontend:
    # The agent detects container.id (mountinfo) itself, so no container-id entrypoint wrapper.
    build:
      context: node-frontend
      additional_contexts: {app: ../apmdemo/frontend, nodeagent: ../../agents/node}
    image: openlog-localagents/node-frontend:1
    hostname: frontend
    environment:
      OPENLOG_LICENSE_KEY: ${LOCALAGENTS_LICENSE_KEY:-dev-license-key}
      OPENLOG_ENDPOINT: http://openlog:4318
      OPENLOG_SERVICE_NAME: frontend
      OTEL_RESOURCE_ATTRIBUTES: *apm-resource
      OPENLOG_HTTP_IGNORE_PATHS: /healthz
      OPENLOG_LOGS_CONSOLE: "true"
      OPENLOG_METRIC_EXPORT_INTERVAL: 30s
      CATALOG_URL: http://catalog:8080
      ORDERS_URL: http://orders:8080
    ports: ["${LOCALAGENTS_FRONTEND_PORT:-33000}:3000"]
    depends_on: [orders, catalog]
    restart: unless-stopped

  orders:
    build: {context: ../apmdemo/orders}
    image: openlog-apmdemo/orders:1
    hostname: orders
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: orders
      OTEL_RESOURCE_ATTRIBUTES: *apm-resource
      OTEL_LOGS_EXPORTER: otlp
      DATABASE_URL: postgres://orders:orders@orders-db:5432/orders?sslmode=disable
      DB_HOST: orders-db
      DB_PORT: "5432"
    entrypoint: *container-id
    command: ["/usr/local/bin/orders"]
    depends_on:
      orders-db: {condition: service_healthy}
    restart: unless-stopped

  catalog:
    build: {context: ../apmdemo/catalog}
    image: openlog-apmdemo/catalog:1
    hostname: catalog
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: catalog
      OTEL_RESOURCE_ATTRIBUTES: *apm-resource
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    entrypoint: *container-id
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    hostname: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped

  orders-db:
    image: postgres:16-alpine
    hostname: orders-db
    environment: {POSTGRES_DB: orders, POSTGRES_USER: orders, POSTGRES_PASSWORD: orders}
    volumes: ["orders-db:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U orders -d orders"], interval: 5s, timeout: 5s, retries: 30}
    restart: unless-stopped

  loadgen:
    image: openlog-localagents/node-frontend:1
    command: ["node", "loadgen.js"]
    environment:
      LOADGEN_TARGET: http://frontend:3000
      LOADGEN_RPS: ${LOCALAGENTS_LOADGEN_RPS:-8}
    depends_on: [frontend]
    restart: unless-stopped

  java-inventory:
    # Java (openlog Java agent openlog-javaagent.jar built from agents/java, Spring Boot WebFlux sample); calls itself
    # at DEMO_LOAD_RPS. Build/update only this one:
    #   docker compose -p openlog-agents -f test/localagents/docker-compose.yml up -d --build --no-deps java-inventory
    build:
      context: java-inventory
      additional_contexts: {javaagent: ../../agents/java}
    image: openlog-localagents/java-inventory:1
    hostname: java-inventory
    environment:
      OPENLOG_LICENSE_KEY: ${LOCALAGENTS_LICENSE_KEY:-dev-license-key}
      OPENLOG_ENDPOINT: http://openlog:4318
      OPENLOG_SERVICE_NAME: java-inventory
      OTEL_RESOURCE_ATTRIBUTES: *apm-resource
      OPENLOG_HTTP_IGNORE_PATHS: /health
      OPENLOG_METRIC_EXPORT_INTERVAL: 30s
      DEMO_LOAD_RPS: ${LOCALAGENTS_JAVA_RPS:-4}
    ports: ["${LOCALAGENTS_JAVA_PORT:-33081}:8080"]
    restart: unless-stopped

  apm-host:
    build:
      context: ../e2e/target
      target: plain
      additional_contexts: {agent: ../../agents/infra, release: ../../libs/release}
      args: {AGENT_VERSION: 0.9.1-local}
    image: openlog-e2e-target:plain
    hostname: apm-host
    init: true
    cap_add: [SYS_PTRACE, DAC_READ_SEARCH]
    environment:
      E2E_ROLE: plain
      E2E_MACHINE_ID: a0de0000000000000000000000000001
      E2E_INVENTORY_INTERVAL: 5m
      OPENLOG_LICENSE_KEY: ${LOCALAGENTS_LICENSE_KEY:-dev-license-key}
      OPENLOG_ENDPOINT: http://openlog:4318
    restart: unless-stopped

  web-host:
    build:
      context: ../e2e/target
      target: services
      additional_contexts: {agent: ../../agents/infra, release: ../../libs/release}
      args: {AGENT_VERSION: 0.9.1-local}
    image: openlog-e2e-target:services
    hostname: web-host
    init: true
    cap_add: [SYS_PTRACE, DAC_READ_SEARCH]
    environment:
      E2E_ROLE: target
      E2E_SERVICES: "1"
      E2E_DOCKER: "0"
      E2E_MACHINE_ID: a0de0000000000000000000000000002
      E2E_INVENTORY_INTERVAL: 5m
      OPENLOG_LICENSE_KEY: ${LOCALAGENTS_LICENSE_KEY:-dev-license-key}
      OPENLOG_ENDPOINT: http://openlog:4318
    volumes: ["web-host-state:/var/lib/openlog-infra-agent"]
    restart: unless-stopped

  docker-host:
    image: openlog-e2e-target:plain
    depends_on: [apm-host] # builds the image
    hostname: docker-host
    init: true
    # The Docker host's processes, cgroups, socket and json-file logs under host.root_path /host. Runs as root: the Docker
    # Desktop socket is root-owned, and the agent reads the container log files (on a real host the systemd unit runs it as
    # openlog-agent with CAP_DAC_READ_SEARCH plus docker group membership).
    pid: host
    cgroup: host
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /host/etc && cat >/etc/openlog-infra-agent/config.yaml <<EOF
        interval: 10s
        inventory_interval: 5m
        host:
          root_path: /host
          extra_attributes: {env: local}
        buffer: {dir: /var/lib/openlog-infra-agent/buffer}
        discovery: {enabled: false}
        process_metrics: {enabled: false}
        logs:
          start_at: end
          containers:
            exclude: [{compose_service: loadgen}]
        EOF
        exec /usr/bin/openlog-infra-agent -config /etc/openlog-infra-agent/config.yaml
    environment:
      OPENLOG_LICENSE_KEY: ${LOCALAGENTS_LICENSE_KEY:-dev-license-key}
      OPENLOG_ENDPOINT: http://openlog:4318
    volumes:
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /var/lib/docker/containers:/host/var/lib/docker/containers:ro
      - docker-host-state:/var/lib/openlog-infra-agent
    restart: unless-stopped

  php-host:
    build:
      context: php-host
      # phpext: the v1 extension (patch-v1.pl is skipped for v1 sources).
      additional_contexts: {agent: ../../agents/infra, release: ../../libs/release, phpext: ../../agents/php/ext}
      args: {AGENT_VERSION: 0.9.1-local}
    image: openlog-localagents/php-host:1
    hostname: php-host
    init: true
    # NET_ADMIN only for outage drills (iptables -A OUTPUT -p tcp --dport 4318 -j REJECT inside the container).
    cap_add: [SYS_PTRACE, DAC_READ_SEARCH, NET_ADMIN]
    environment:
      PHP_HOST_MACHINE_ID: a0de0000000000000000000000000003
      PHP_HOST_LOADGEN_RPS: ${LOCALAGENTS_PHP_LOADGEN_RPS:-2}
      OPENLOG_LICENSE_KEY: ${LOCALAGENTS_LICENSE_KEY:-dev-license-key}
      OPENLOG_ENDPOINT: http://openlog:4318
    ports: ["${LOCALAGENTS_PHP_PORT:-33080}:80"]
    volumes: ["php-host-state:/var/lib/openlog-infra-agent"]
    restart: unless-stopped

  python-shop:
    # The agent detects container.id (mountinfo) itself, so no container-id entrypoint wrapper.
    build:
      context: python-shop
      additional_contexts: {pyagent: ../../agents/python}
    image: openlog-localagents/python-shop:1
    hostname: python-shop
    environment:
      OPENLOG_LICENSE_KEY: ${LOCALAGENTS_LICENSE_KEY:-dev-license-key}
      OPENLOG_ENDPOINT: http://openlog:4318
      OPENLOG_SERVICE_NAME: python-shop
      OTEL_RESOURCE_ATTRIBUTES: *apm-resource
      OPENLOG_HTTP_IGNORE_PATHS: /healthz
      OPENLOG_METRIC_EXPORT_INTERVAL: 30s
      CATALOG_URL: http://catalog:8080
      ORDERS_URL: http://orders:8080
    ports: ["${LOCALAGENTS_PYTHON_PORT:-33800}:8000"]
    depends_on: [orders, catalog]
    restart: unless-stopped

  python-shop-loadgen:
    image: openlog-localagents/python-shop:1
    command: ["python", "loadgen.py"]
    environment:
      LOADGEN_TARGET: http://python-shop:8000
      LOADGEN_RPS: ${LOCALAGENTS_PYTHON_LOADGEN_RPS:-4}
    depends_on: [python-shop]
    restart: unless-stopped

  dotnet-shop:
    # .NET (OpenLog.Agent, agents/dotnet/samples/OpenLog.SampleApp on ASP.NET Core 8) -> orders-db, redis;
    # http://localhost:${LOCALAGENTS_DOTNET_PORT:-33900}. Build/update only these:
    #   docker compose -p openlog-agents -f test/localagents/docker-compose.yml up -d --build --no-deps dotnet-shop dotnet-shop-loadgen
    build:
      context: dotnet-shop
      additional_contexts: {dotnetagent: ../../agents/dotnet}
    image: openlog-localagents/dotnet-shop:1
    hostname: dotnet-shop
    environment:
      OPENLOG_LICENSE_KEY: ${LOCALAGENTS_LICENSE_KEY:-dev-license-key}
      OPENLOG_ENDPOINT: http://openlog:4318
      OPENLOG_SERVICE_NAME: dotnet-shop
      OTEL_RESOURCE_ATTRIBUTES: *apm-resource
      OPENLOG_METRIC_EXPORT_INTERVAL: 30s
      PG_CONNECTION: Host=orders-db;Username=orders;Password=orders;Database=orders
      REDIS_CONNECTION: redis:6379
    ports: ["${LOCALAGENTS_DOTNET_PORT:-33900}:9080"]
    depends_on:
      orders-db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  dotnet-shop-loadgen:
    image: curlimages/curl:8.16.0
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          for p in /users/$$((RANDOM % 50 + 1)) /db/pg /db/redis /db/ef /error; do
            curl -s -o /dev/null http://dotnet-shop:9080$$p
          done
          sleep 1
        done
    depends_on: [dotnet-shop]
    restart: unless-stopped

networks:
  default:
    name: openlog_default
    external: true

volumes:
  docker-host-state:
  orders-db:
  web-host-state:
  php-host-state:
