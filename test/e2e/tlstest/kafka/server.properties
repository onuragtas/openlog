# Single KRaft node for the TLS integration test (test/e2e/tlstest). Every client listener is TLS:
#   SSL_INT  / SSL_EXT  : TLS with required client certificates (mutual TLS)
#   SASL_INT / SASL_EXT : SASL_SSL with PLAIN, SCRAM-SHA-256 and SCRAM-SHA-512
# *_INT is advertised inside the compose network, *_EXT on localhost for the host-side client checks.
# The controller listener is plaintext on the container's loopback only (quorum of one).
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093
controller.listener.names=CONTROLLER
listeners=CONTROLLER://localhost:9093,SSL_INT://:19093,SASL_INT://:19094,SSL_EXT://:26093,SASL_EXT://:26094
advertised.listeners=SSL_INT://kafka:19093,SASL_INT://kafka:19094,SSL_EXT://localhost:26093,SASL_EXT://localhost:26094
listener.security.protocol.map=CONTROLLER:PLAINTEXT,SSL_INT:SSL,SASL_INT:SASL_SSL,SSL_EXT:SSL,SASL_EXT:SASL_SSL
inter.broker.listener.name=SSL_INT

# PEM key store (unencrypted PKCS#8 key + chain) and trust store generated at test time.
ssl.keystore.type=PEM
ssl.keystore.location=/certs/server.pem
ssl.truststore.type=PEM
ssl.truststore.location=/certs/ca.crt
ssl.endpoint.identification.algorithm=https
listener.name.ssl_int.ssl.client.auth=required
listener.name.ssl_ext.ssl.client.auth=required

sasl.enabled.mechanisms=PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
listener.name.sasl_int.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required user_openlog="openlog-plain-pw";
listener.name.sasl_ext.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required user_openlog="openlog-plain-pw";
listener.name.sasl_int.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.sasl_int.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.sasl_ext.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.sasl_ext.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;

log.dirs=/tmp/kraft-combined-logs
num.partitions=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=false
message.max.bytes=12582912
