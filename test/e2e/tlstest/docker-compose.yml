# TLS integration test stack (test/e2e/tlstest, `make tlstest`; docs/operations/e2e.md).
# Certificates are generated by the Go test into $TLSTEST_CERTS (never committed).
#
#   PostgreSQL 16  ssl=on, openlog uses sslmode=verify-full + OPENLOG_POSTGRES_TLS_CA_FILE
#   Kafka 4.1      SSL (mTLS) + SASL_SSL (PLAIN/SCRAM) listeners only; openlog uses SASL_SSL SCRAM-SHA-512
#   ClickHouse     2 shards (ch1, ch2), native protocol only on 9440 with client certificates; openlog
#                  (incl. the processor's direct shard connections) uses TLS with a client certificate
#   openlog        allinone + bootstrap + loadgen; profile `badca`: the same binaries with an unrelated CA
#
# Host ports are distinct from the default and e2e stacks.
name: openlog-tlstest

x-certs: &certs "${TLSTEST_CERTS:?TLSTEST_CERTS must point at the generated certificates}:/certs:ro"

x-openlog-env: &openlog-env
  OPENLOG_LOG_LEVEL: info
  OPENLOG_AUTH_MODE: postgres
  OPENLOG_POSTGRES_DSN: postgres://openlog@postgres:5432/openlog?sslmode=verify-full
  OPENLOG_POSTGRES_PASSWORD: openlog
  OPENLOG_POSTGRES_TLS_CA_FILE: /certs/ca.crt
  OPENLOG_KAFKA_BROKERS: kafka:19094
  OPENLOG_KAFKA_TLS_ENABLED: "true"
  OPENLOG_KAFKA_TLS_CA_FILE: /certs/ca.crt
  OPENLOG_KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  OPENLOG_KAFKA_SASL_USERNAME: openlog
  OPENLOG_KAFKA_SASL_PASSWORD: openlog-scram-pw
  OPENLOG_KAFKA_PARTITIONS: "3"
  OPENLOG_KAFKA_REPLICATION_FACTOR: "1"
  OPENLOG_CLICKHOUSE_ADDR: ch1:9440
  OPENLOG_CLICKHOUSE_USER: openlog
  OPENLOG_CLICKHOUSE_PASSWORD: openlog
  OPENLOG_CLICKHOUSE_CLUSTER: openlog
  OPENLOG_CLICKHOUSE_TLS_ENABLED: "true"
  OPENLOG_CLICKHOUSE_TLS_CA_FILE: /certs/ca.crt
  OPENLOG_CLICKHOUSE_TLS_CERT_FILE: /certs/client.crt
  OPENLOG_CLICKHOUSE_TLS_KEY_FILE: /certs/client.key
  OPENLOG_COOKIE_SECURE: "false"

x-clickhouse: &clickhouse
  image: clickhouse/clickhouse-server:25.8
  ulimits:
    nofile: {soft: 262144, hard: 262144}
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null || exit 1"]
    interval: 3s
    timeout: 5s
    retries: 60

services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    environment:
      POSTGRES_USER: openlog
      POSTGRES_PASSWORD: openlog
      POSTGRES_DB: openlog
    # The server key must belong to the postgres user with mode 0600: copy it out of the read-only mount.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        install -o postgres -g postgres -m 0600 /certs/server.key /var/lib/postgresql/server.key &&
        install -o postgres -g postgres -m 0644 /certs/server.crt /var/lib/postgresql/server.crt &&
        exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key -c ssl_ca_file=/certs/ca.crt
    volumes:
      - *certs
    ports:
      - "127.0.0.1:26432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlog -d openlog"]
      interval: 3s
      timeout: 5s
      retries: 40

  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    # Format KRaft storage with the SCRAM credentials (no plaintext listener is needed to create users).
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-storage.sh format --ignore-formatted -t MkU3OEVBNTcwNTJENDM2Qk -c /config/server.properties
        --add-scram 'SCRAM-SHA-256=[name=openlog,password=openlog-scram-pw]'
        --add-scram 'SCRAM-SHA-512=[name=openlog,password=openlog-scram-pw]' &&
        exec /opt/kafka/bin/kafka-server-start.sh /config/server.properties
    volumes:
      - *certs
      - ./kafka:/config:ro
    ports:
      - "127.0.0.1:26093:26093"
      - "127.0.0.1:26094:26094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19093 --command-config /config/client-ssl.properties >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 18
      start_period: 15s

  ch1:
    <<: *clickhouse
    hostname: ch1
    environment:
      CLICKHOUSE_USER: openlog
      CLICKHOUSE_PASSWORD: openlog
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
      CH_SHARD: "01"
      CH_REPLICA: ch1
    volumes:
      - *certs
      - ./clickhouse/tls.xml:/etc/clickhouse-server/config.d/openlog-tls.xml:ro
      - ./clickhouse/keeper.xml:/etc/clickhouse-server/config.d/openlog-keeper.xml:ro
    ports:
      - "127.0.0.1:26123:8123"
      - "127.0.0.1:26440:9440"

  ch2:
    <<: *clickhouse
    hostname: ch2
    environment:
      CLICKHOUSE_USER: openlog
      CLICKHOUSE_PASSWORD: openlog
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
      CH_SHARD: "02"
      CH_REPLICA: ch2
    volumes:
      - *certs
      - ./clickhouse/tls.xml:/etc/clickhouse-server/config.d/openlog-tls.xml:ro
    ports:
      - "127.0.0.1:26124:8123"
      - "127.0.0.1:26441:9440"
    depends_on:
      ch1:
        condition: service_healthy

  bootstrap:
    image: ${TLSTEST_IMAGE:-openlog:tlstest}
    entrypoint: ["/usr/local/bin/openlog-admin", "bootstrap"]
    environment:
      <<: *openlog-env
      OPENLOG_BOOTSTRAP_TENANT_ID: tls-tenant
      OPENLOG_BOOTSTRAP_ORG_NAME: tls
      OPENLOG_BOOTSTRAP_OWNER_EMAIL: owner@tls.test
      OPENLOG_BOOTSTRAP_OWNER_PASSWORD: tls-owner-password
      OPENLOG_BOOTSTRAP_LICENSE_KEY: tls-license-key
      OPENLOG_BOOTSTRAP_API_KEY: ola_tls-api-key
    volumes:
      - *certs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  openlog:
    build:
      context: ../../..
      dockerfile: Dockerfile
    image: ${TLSTEST_IMAGE:-openlog:tlstest}
    environment:
      <<: *openlog-env
      OPENLOG_MIGRATE_ON_START: "true"
    volumes:
      - *certs
    ports:
      - "127.0.0.1:26318:4318"
      - "127.0.0.1:26080:8080"
      - "127.0.0.1:26464:9464"
    depends_on:
      kafka:
        condition: service_healthy
      ch1:
        condition: service_healthy
      ch2:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9464/readyz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  loadgen:
    image: ${TLSTEST_IMAGE:-openlog:tlstest}
    entrypoint: ["/usr/local/bin/openlog-loadgen"]
    command: ["-endpoint", "http://openlog:4318", "-license-key", "tls-license-key", "-hosts", "6", "-host-prefix", "tlsgen",
      "-interval", "5s", "-logs-per-sec", "50", "-spans-per-sec", "20", "-inventory-interval", "1m"]
    depends_on:
      openlog:
        condition: service_healthy

  # Wrong CA: every dependency presents a certificate the configured (unrelated) CA did not sign.
  badca-postgres:
    profiles: ["badca"]
    image: ${TLSTEST_IMAGE:-openlog:tlstest}
    entrypoint: ["/usr/local/bin/openlog-api"]
    environment:
      <<: *openlog-env
      OPENLOG_POSTGRES_TLS_CA_FILE: /certs/wrong-ca.crt
    volumes:
      - *certs
  badca-clickhouse:
    profiles: ["badca"]
    image: ${TLSTEST_IMAGE:-openlog:tlstest}
    entrypoint: ["/usr/local/bin/openlog-processor"]
    environment:
      <<: *openlog-env
      OPENLOG_CLICKHOUSE_TLS_CA_FILE: /certs/wrong-ca.crt
    volumes:
      - *certs
  badca-kafka:
    profiles: ["badca"]
    image: ${TLSTEST_IMAGE:-openlog:tlstest}
    entrypoint: ["/usr/local/bin/openlog-ingest"]
    environment:
      <<: *openlog-env
      OPENLOG_AUTH_MODE: static
      OPENLOG_LICENSE_KEYS: tls-license-key=tls-tenant
      OPENLOG_KAFKA_TLS_CA_FILE: /certs/wrong-ca.crt
    volumes:
      - *certs
    ports:
      - "127.0.0.1:26466:9464"
